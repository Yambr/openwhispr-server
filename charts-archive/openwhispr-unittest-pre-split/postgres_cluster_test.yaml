suite: postgres-cluster — CNPG Cluster CR + backup Secret (A2 + A4)
templates:
  - postgres-cluster.yaml
  - postgres-backup-secret.yaml
  - postgres-owner-secret.yaml
tests:
  # Finding 09.1-F13 — explicit pg-owner Secret prevents CNPG from
  # auto-generating a random password that silently drifts from
  # POSTGRES_OWNER_PASSWORD. Only rendered in helm-values mode; the eso
  # path requires the operator to manage the secret out-of-band.
  - it: pg-owner + pg-app Secrets rendered with kubernetes.io/basic-auth (helm-values mode)
    template: postgres-owner-secret.yaml
    set:
      secrets:
        mode: helm-values
        postgresOwnerPassword: example-owner-pass
        postgresAppPassword: example-app-pass
    asserts:
      - hasDocuments:
          count: 2
      # Doc 0 — owner
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-pg-owner
        documentIndex: 0
      - equal:
          path: stringData.username
          value: openwhispr_owner
        documentIndex: 0
      - equal:
          path: stringData.password
          value: example-owner-pass
        documentIndex: 0
      # Doc 1 — app (Finding 09.1-F16)
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-pg-app
        documentIndex: 1
      - equal:
          path: stringData.username
          value: openwhispr_app
        documentIndex: 1
      - equal:
          path: stringData.password
          value: example-app-pass
        documentIndex: 1

  - it: pg-owner Secret skipped in eso mode (operator manages out-of-band)
    template: postgres-owner-secret.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Cluster CR with PG 17 imageName, partman extension, 3 replicas
    template: postgres-cluster.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      postgres:
        imageName: ghcr.io/yambr/openwhispr-cnpg-postgres-17-pgpartman:17.6-1.0.1
        replicas: 3
        storageSize: 20Gi
        backup:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Cluster
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1
      - matchRegex:
          path: spec.imageName
          pattern: "^.+:17\\.[0-9]+.*$"
      - equal:
          path: spec.instances
          value: 3
      # Finding 09.1-F4 — CNPG ≥1.22 admission webhook rejects
      # `shared_preload_libraries` inside `postgresql.parameters` as a
      # fixed parameter. Must live as `spec.postgresql.shared_preload_libraries`
      # (list, not string). The pg_partman_bgw entry is mandatory for the
      # monthly RANGE partition maintenance Job in migration 0011.
      - equal:
          path: spec.postgresql.shared_preload_libraries[0]
          value: pg_partman_bgw
      - notExists:
          path: spec.postgresql.parameters.shared_preload_libraries
      - equal:
          path: spec.bootstrap.initdb.database
          value: openwhispr
      - equal:
          path: spec.bootstrap.initdb.owner
          value: openwhispr_owner
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: RELEASE-NAME-openwhispr-pg-owner
      - contains:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          content: CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
      # Finding 09.1-F14: postInitSQL runs as superuser in `postgres` DB
      # BEFORE the app DB exists. Grants CREATEDB to openwhispr_owner
      # and pre-creates the litellm database so migrate.ts (which uses
      # the owner role, not a superuser) succeeds.
      - contains:
          path: spec.bootstrap.initdb.postInitSQL
          content: ALTER ROLE openwhispr_owner CREATEDB;
      - contains:
          path: spec.bootstrap.initdb.postInitSQL
          content: CREATE DATABASE litellm OWNER openwhispr_owner;
      # Finding 09.1-F15: parity with compose `init/00-roles.sql.tpl`
      # which declares `WITH LOGIN BYPASSRLS` on the owner role so
      # Drizzle migrations with RLS-backfill INSERTs succeed.
      - contains:
          path: spec.bootstrap.initdb.postInitSQL
          content: ALTER ROLE openwhispr_owner BYPASSRLS;
      # Finding 09.1-F20: pg_partman's create_parent() needs CREATE on
      # the schema (DDL for child partitions), not just EXECUTE. Make
      # the application owner the schema OWNER.
      - contains:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          content: ALTER SCHEMA partman OWNER TO openwhispr_owner;
      - equal:
          path: spec.storage.size
          value: 20Gi
      - equal:
          path: spec.primaryUpdateStrategy
          value: unsupervised

  - it: omits barmanObjectStore when backup.enabled=false
    template: postgres-cluster.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      postgres:
        backup:
          enabled: false
    asserts:
      - notExists:
          path: spec.backup

  - it: renders barmanObjectStore + retention when backup.enabled=true
    template: postgres-cluster.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      postgres:
        backup:
          enabled: true
          bucket: ow-cnpg-wal
          s3Endpoint: https://s3.us-east-1.amazonaws.com
    asserts:
      - equal:
          path: spec.backup.barmanObjectStore.destinationPath
          value: s3://ow-cnpg-wal/cnpg
      - equal:
          path: spec.backup.barmanObjectStore.endpointURL
          value: https://s3.us-east-1.amazonaws.com
      - equal:
          path: spec.backup.barmanObjectStore.s3Credentials.accessKeyId.name
          value: RELEASE-NAME-openwhispr-pg-backup
      - equal:
          path: spec.backup.barmanObjectStore.wal.compression
          value: gzip
      - equal:
          path: spec.backup.retentionPolicy
          value: 30d

  - it: fails render when backup.enabled=true and bucket is empty
    template: postgres-cluster.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      postgres:
        backup:
          enabled: true
          bucket: ""
    asserts:
      - failedTemplate:
          errorMessage: "postgres.backup.bucket is required when postgres.backup.enabled=true"

  - it: backup Secret renders only when backup.enabled=true AND secrets.mode=helm-values
    template: postgres-backup-secret.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
      postgres:
        backup:
          enabled: true
          bucket: ow-cnpg-wal
          accessKeyId: AKIATEST
          secretAccessKey: secret-value-1234567890
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.ACCESS_KEY_ID
          value: AKIATEST
      - equal:
          path: stringData.SECRET_ACCESS_KEY
          value: secret-value-1234567890
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: backup Secret is omitted when backup.enabled=false
    template: postgres-backup-secret.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
      postgres:
        backup:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: backup Secret is omitted when secrets.mode=eso even with backup.enabled=true
    template: postgres-backup-secret.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      postgres:
        backup:
          enabled: true
          bucket: ow-cnpg-wal
    asserts:
      - hasDocuments:
          count: 0

  - it: backup Secret fails when helm-values mode + enabled but accessKeyId empty
    template: postgres-backup-secret.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
      postgres:
        backup:
          enabled: true
          bucket: ow-cnpg-wal
          accessKeyId: ""
          secretAccessKey: "something"
    asserts:
      - failedTemplate:
          errorMessage: "values.postgres.backup.accessKeyId is required when postgres.backup.enabled=true and secrets.mode=helm-values"
