suite: skeleton — chart metadata + ServiceAccount
templates:
  - serviceaccount.yaml
tests:
  - it: renders a ServiceAccount with fullname
    set:
      secrets:
        mode: eso
        external:
          storeRef: dummy-store
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/name"]
          pattern: "^openwhispr$"
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          pattern: "^Helm$"

  - it: omits ServiceAccount when serviceAccount.create=false
    set:
      serviceAccount:
        create: false
      secrets:
        mode: eso
        external:
          storeRef: dummy-store
    asserts:
      - hasDocuments:
          count: 0

  - it: honors serviceAccount.annotations
    set:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::1234:role/x
      secrets:
        mode: eso
        external:
          storeRef: dummy-store
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::1234:role/x
