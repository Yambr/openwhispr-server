suite: subcharts — Bitnami Valkey + MinIO dependency render (A5)
# Reach into the sub-chart's specific template path to assert on the rendered
# StatefulSet/Deployment. Bitnami's Valkey 5.6.5 chart materializes the primary
# StatefulSet at `charts/valkey/templates/primary/application.yaml`, and MinIO
# 17.0.21 at `charts/minio/templates/application.yaml` (ternaries between
# Deployment in standalone mode and StatefulSet in distributed mode).
#
# helm-unittest's per-template `template:` selector reliably scopes evaluation
# to a single sub-chart file, sidestepping the chart-load-time `condition:`
# limitation (set: { x.enabled: false } cannot un-render sub-chart docs at
# test time; that path is covered by the compose-chart parity lint instead).
release:
  name: ow
  namespace: default
tests:
  - it: Valkey primary application renders a 1-replica StatefulSet in standalone mode
    template: charts/valkey/templates/primary/application.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      valkey:
        enabled: true
        architecture: standalone
        auth:
          enabled: false
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: ow-valkey-primary
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: ow-valkey-headless

  - it: Valkey replicas application renders a 2-replica StatefulSet in replication mode
    template: charts/valkey/templates/replicas/application.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      valkey:
        enabled: true
        architecture: replication
        auth:
          enabled: true
        replica:
          replicaCount: 2
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: ow-valkey-replicas
      - equal:
          path: spec.replicas
          value: 2

  # Plan 14-06 — Chart.yaml condition flipped from minio.enabled -> storage.enabled.
  - it: MinIO application renders a Deployment in standalone mode (storage.enabled=true)
    template: charts/minio/templates/application.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      storage:
        enabled: true
      minio:
        enabled: true
        mode: standalone
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: ow-minio
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: minio

  - it: MinIO application switches to StatefulSet in distributed mode (storage.enabled=true)
    template: charts/minio/templates/application.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      storage:
        enabled: true
      minio:
        enabled: true
        mode: distributed
        statefulset:
          replicaCount: 4
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 4

  # Phase 17 / Plan 03 — bundled cert-manager sub-chart matrix.
  # The Chart.yaml `condition: certManager.bundled` is a chart-LOAD-time
  # gate (helm-unittest's `set:` cannot un-render sub-chart docs once the
  # tarball is on disk) — same pattern as the Valkey + MinIO rows above:
  # `template:` selector scopes to the sub-chart template, and the
  # presence of a rendered doc proves the sub-chart is wired correctly.
  # The parity-with-compose `condition: certManager.bundled=false` default
  # is exercised end-to-end in the Phase 17 Gherkin feature
  # `tests/e2e-cjm/features/phase17-tls.feature` (scenario 3).
  - it: cert-manager controller Deployment renders when bundled=true (validates sub-chart wiring)
    template: charts/cert-manager/templates/deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      certManager:
        bundled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: cert-manager
