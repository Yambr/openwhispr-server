suite: api — Deployment + Service + HPA + PDB + ServiceMonitor + ConfigMap
templates:
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - api-servicemonitor.yaml
  - configmap-api.yaml
tests:
  - it: renders api Deployment with container name api, port 3000, envFrom secrets
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].name
          value: api
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-openwhispr-secrets

  - it: api Deployment wires DATABASE_URL through the Pooler RW service
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].value
          pattern: "RELEASE-NAME-openwhispr-pg-pooler:5432"

  - it: api Deployment wires REDIS_URL at the valkey primary service
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="REDIS_URL")].value
          pattern: "RELEASE-NAME-valkey-primary:6379"

  - it: api Deployment wires LITELLM_BASE_URL via embedded LiteLLM service
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="LITELLM_BASE_URL")].value
          pattern: "RELEASE-NAME-openwhispr-litellm:4000"

  - it: api Deployment uses values.litellm.externalBaseUrl when embedded=false
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      litellm:
        embedded: false
        externalBaseUrl: https://corp-litellm.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="LITELLM_BASE_URL")].value
          value: https://corp-litellm.example.com

  - it: api Deployment has readiness and liveness probes on /api/health + /api/live
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/live

  - it: api Deployment carries wait-for-migrate (Finding 09.1-F3) then secret-presence-probe (pitfall #5)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      # Finding 09.1-F3 — wait-for-migrate is initContainer[0] so the
      # api container only starts after migrate Job is Complete.
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-migrate
      # Finding 09.1-F19: registry.k8s.io/kubectl is distroless (no /bin/sh)
      # so the wait-for-migrate `sh -c` poll loop fails to exec. alpine/kubectl
      # ships busybox + kubectl with semver-pinned tags.
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: "^alpine/kubectl:[0-9]+\\.[0-9]+"
      # Finding 09.1-F10 — query is now by label selector (not name), so
      # the wait-for-migrate init picks the latest revision's Job.
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "kubectl get jobs"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "app\\.kubernetes\\.io/component=migrate"
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - matchRegex:
          path: spec.template.spec.initContainers[1].image
          pattern: "^busybox:"
      - equal:
          path: spec.template.spec.initContainers[1].envFrom[0].secretRef.name
          value: RELEASE-NAME-openwhispr-secrets

  - it: api Service renders ClusterIP port 3000
    template: api-service.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.ports[0].targetPort
          value: 3000
      - equal:
          path: spec.ports[0].name
          value: http

  - it: api HPA renders with CPU 70% targeting api Deployment
    template: api-hpa.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      api:
        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 20
          targetCPUUtilizationPercentage: 70
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-openwhispr-api
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 20
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70

  - it: api HPA omits render when autoscaling.enabled=false
    template: api-hpa.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      api:
        autoscaling:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: api PDB renders minAvailable 1 when minReplicas >= 2
    template: api-pdb.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      api:
        autoscaling:
          enabled: true
          minReplicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: spec.minAvailable
          value: 1

  - it: api PDB skips render when minReplicas == 1 (OSS single-node)
    template: api-pdb.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      api:
        autoscaling:
          enabled: true
          minReplicas: 1
    asserts:
      - hasDocuments:
          count: 0

  # Plan 14-06 — observability.enabled umbrella AND-gates the sub-toggle.
  - it: api ServiceMonitor renders only when observability umbrella + serviceMonitor are both on
    template: api-servicemonitor.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      observability:
        enabled: true
        serviceMonitor:
          enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: apiVersion
          value: monitoring.coreos.com/v1
      - equal:
          path: spec.endpoints[0].path
          value: /api/metrics
      - equal:
          path: spec.endpoints[0].port
          value: http

  - it: api ServiceMonitor omits render when observability.serviceMonitor.enabled=false
    template: api-servicemonitor.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      observability:
        serviceMonitor:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Finding 09.1-F3 — initContainers ordering: [wait-for-migrate,
  # secret-presence-probe, traefik-preflight]. Was [secret-presence-probe,
  # traefik-preflight] before wait-for-migrate landed.
  - it: api Deployment carries traefik-preflight initContainer by default (Plan 09-09 pitfall #4)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: traefik-preflight
      - matchRegex:
          path: spec.template.spec.initContainers[2].image
          pattern: "^curlimages/curl:"
      # Finding 09.1-F2: name shortened to ≤15 chars; default value
      # `wsrealtime`. Override via .Values.ingress.realtimeEntrypointName.
      - matchRegex:
          path: spec.template.spec.initContainers[2].command[2]
          pattern: '"name":"wsrealtime"'
      - matchRegex:
          path: spec.template.spec.initContainers[2].command[2]
          pattern: "/api/entrypoints"

  - it: api Deployment omits traefik-preflight when ingress.preflightCheck=false (still keeps wait-for-migrate + secret-presence)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      ingress:
        preflightCheck: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-migrate
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe

  - it: api Deployment traefik-preflight uses configurable admin URL
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      ingress:
        preflightTraefikAdminUrl: http://my-traefik.custom-ns.svc.cluster.local:9000
    asserts:
      # Finding 09.1-F3 — preflight is now initContainers[2] (wait-for-migrate
      # at [0], secret-presence-probe at [1]).
      - matchRegex:
          path: spec.template.spec.initContainers[2].command[2]
          pattern: "my-traefik\\.custom-ns\\.svc\\.cluster\\.local:9000"

  # Plan 11-01 — secret-presence-probe initContainer must source its env-name
  # list from the openwhispr.requiredSecretKeys helper. When bundledAi.enabled
  # is false (Variant A default) the probe MUST NOT mention HF_TOKEN; when
  # enabled=true (Variant C) it MUST mention HF_TOKEN. RED until Task 3
  # refactors api-deployment.yaml to consume the helper.
  - it: api secret-presence-probe omits HF_TOKEN when bundledAi.enabled=false (Variant A)
    template: api-deployment.yaml
    set:
      bundledAi:
        enabled: false
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - notMatchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "HF_TOKEN"

  - it: api secret-presence-probe includes HF_TOKEN when bundledAi.enabled=true (Variant C)
    template: api-deployment.yaml
    set:
      bundledAi:
        enabled: true
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "HF_TOKEN"

  - it: configmap-api renders NODE_ENV + LOG_LEVEL non-secret env
    template: configmap-api.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.NODE_ENV
          value: production

  # SR-20.3 — api Deployment must declare a startupProbe with a 300s
  # boot budget (failureThreshold 30 × periodSeconds 10) targeting the
  # same /api/health endpoint as readinessProbe. Closes audit B1.
  - it: api Deployment declares startupProbe failureThreshold 30 + period 10s on /api/health (SR-20.3)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  # SR-20.4 — api Deployment must declare topologySpreadConstraints on
  # kubernetes.io/hostname with maxSkew 1 and whenUnsatisfiable
  # ScheduleAnyway (single-node kind clusters must still schedule).
  # Closes audit B2.
  - it: api Deployment declares topologySpread maxSkew 1 on hostname (SR-20.4)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: api

  # SR-20.5 — api pod runs as non-root uid 1000 with fsGroup 1000 + RuntimeDefault
  # seccomp; closes audit B3 (full hardening). Container drops all caps,
  # disallows privilege escalation, runs on a read-only rootfs, and uses
  # an emptyDir at /tmp (the only writable path the api needs).
  - it: api Deployment pod-level securityContext is full-hardening (SR-20.5)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: api Deployment container-level securityContext is full-hardening (SR-20.5)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: api Deployment mounts emptyDir at /tmp (SR-20.5 readOnlyRootFilesystem prerequisite)
    template: api-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 64Mi
