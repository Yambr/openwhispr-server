suite: migrate — pre-install/pre-upgrade Helm hook Job
templates:
  - migrate-job.yaml
  - migrate-serviceaccount.yaml
tests:
  # Finding 09.1-F10: Helm hook annotations are exclusive — a hook
  # annotated `pre-upgrade` is invisible to `helm install` and the Job
  # never renders. Resolution: no hook at all. Job is a regular release
  # resource with `.Release.Revision` suffix in metadata.name (avoids
  # k8s immutable Job spec on upgrade) + ttlSecondsAfterFinished for GC.
  # wait-for-migrate initContainers query by LABEL not name.
  - it: migrate Job is a regular release resource (no Helm hook, revision-suffixed name, TTL'd)
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: metadata.name
          # `-migrate-<revision>` — revision is always a positive int.
          pattern: "-migrate-[0-9]+$"
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate
      - matchRegex:
          path: metadata.labels["openwhispr.dev/migrate-revision"]
          pattern: "^[0-9]+$"
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 3600

  - it: migrate Job has backoffLimit 0 (one-shot) + activeDeadlineSeconds 900 (bootstrap budget)
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      # Finding 09.1-F3: bumped from 300s → 900s so the regular-Job install
      # path can absorb a slow CNPG bootstrap (90-180s) + wait-for-postgres
      # (up to 600s polling loop) + the actual migration (~30s).
      - equal:
          path: spec.activeDeadlineSeconds
          value: 900

  - it: migrate Job initContainer waits on pg_isready against -pg-rw
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-postgres
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: "^postgres:17"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "pg_isready.*-pg-rw"
      # Finding 09.1-F3: wait loop must tolerate slow CNPG bootstrap. The
      # original 30-iteration cap (60s wall-time) failed against a real kind
      # CNPG install where the Cluster takes 90-180s to expose the -rw
      # Service. Raised to 300 iterations × 2s sleep = 600s.
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "i -gt 300"

  - it: migrate Job container image pin uses Chart.AppVersion default (NOT latest)
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ":latest$"
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ":$"

  - it: migrate Job command runs node migrate.cjs (compose parity)
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: node
      - matchRegex:
          path: spec.template.spec.containers[0].command[1]
          pattern: "migrate\\.cjs$"

  # Finding 09.1-F12: migrate.ts requires DATABASE_URL_OWNER, not
  # DATABASE_URL. The owner has full DDL grants; DATABASE_URL is for the
  # runtime app user (limited grants — would refuse the migration).
  - it: migrate Job DATABASE_URL_OWNER points at -pg-rw (NOT pooler — transaction-mode breaks DDL)
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL_OWNER")].value
          pattern: "RELEASE-NAME-openwhispr-pg-rw:5432"
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL_OWNER")].value
          pattern: "pg-pooler"

  - it: migrate Job envFrom secret reference for DATABASE password
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-openwhispr-secrets

  - it: migrate ServiceAccount + Role + RoleBinding render (3 docs)
    template: migrate-serviceaccount.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      # Doc 0 — ServiceAccount.
      - hasDocuments:
          count: 3
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-migrate
        documentIndex: 0
      # Doc 1 — Role granting api/web/worker SA the ability to poll the
      # migrate Job's status (Finding 09.1-F3 wait-for-migrate init).
      - isKind:
          of: Role
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-migrate-reader
        documentIndex: 1
      - equal:
          path: rules[0].resources[0]
          value: jobs
        documentIndex: 1
      - equal:
          path: rules[0].verbs
          value: ["get", "watch", "list"]
        documentIndex: 1
      # Doc 2 — RoleBinding wiring the app SA to the Role.
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 2
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-openwhispr
        documentIndex: 2

  - it: migrate Job uses dedicated ServiceAccount
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-openwhispr-migrate

  - it: migrate Job restartPolicy Never (one-shot semantics)
    template: migrate-job.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
