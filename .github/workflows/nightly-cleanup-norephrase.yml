# #17 (B) — nightly + tag-triggered LIVE cleanup no-rephrase e2e against the
# REAL OpenRouter instruct checkpoint.
#
# WHY:
#   The cleanup path (POST /api/reason, text-only shape) must keep cleaning
#   transcripts VERBATIM — remove fillers/dups, add punctuation, preserve
#   meaning + order — WITHOUT paraphrasing. The per-PR guarantee is hermetic
#   (the contract test asserting the route returns model output byte-for-byte
#   + the no-rephrase resolver unit tests). This nightly adds the empirical
#   axis: does the REAL provider behind `qwen3.6-cleanup` still behave?
#   Catches MODEL/PROVIDER drift ("instruct checkpoint started paraphrasing",
#   "OpenRouter swapped behavior under the same id"). The complementary axis —
#   regression of the operator's in-cluster stage litellm config — is a
#   future variant ("A") needing a scoped kubeconfig.
#
# COST / SECURITY DISCIPLINE:
#   Consumes the OPENROUTER_API_KEY repository secret for ONE short chat
#   completion (~40-token transcript) per run — a fraction of a cent. The
#   job-level `if:` guard hard-restricts execution to:
#     * scheduled cron (06:20 UTC daily — offset from the 06:00 realtime soak)
#     * tag pushes (releases — `v*`)
#     * manual operator-initiated workflow_dispatch
#   PRs (including from forks) CANNOT trigger this workflow — `on:` does not
#   list pull_request, and workflow_dispatch requires write access. Forks
#   therefore cannot read the secret.
#
# WHY NOT REQUIRED FOR MAIN-BRANCH PROTECTION:
#   Empirical + provider-dependent: a transient OpenRouter hiccup must never
#   gate main. NOT in scripts/branch-protection.json. The per-PR gate is the
#   hermetic cleanup contract test + the no-rephrase resolver unit tests.
#
# OVERLAY:
#   Uses compose/live-soak/docker-compose.live-cleanup.yml (real OpenRouter),
#   NOT the hermetic mock overlay. A grep for a hermetic-echo service name in
#   this workflow MUST return zero matches.

name: nightly-cleanup-norephrase

on:
  schedule:
    - cron: '20 6 * * *'   # 06:20 UTC daily (offset from realtime soak)
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-norephrase:
    name: live cleanup no-rephrase (real OpenRouter)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Belt-and-suspenders: even though `on:` omits pull_request, gate the job
    # to scheduled / tag / manual so a future on: extension cannot start
    # consuming OpenRouter credit (or exposing the secret) on every PR.
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      # SHA-pinning per project security policy (mirrors nightly-realtime-soak.yml).
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }

      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Bring up the full production stack with the live-cleanup overlay,
      # repointing the qwen3.6-cleanup alias at the real OpenRouter instruct
      # checkpoint (consumes OPENROUTER_API_KEY from the workflow env).
      - name: docker compose up (live-cleanup overlay)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/live-soak/docker-compose.live-cleanup.yml \
            up -d

      - name: Wait for api /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -sk --fail https://api.localhost/api/health >/dev/null 2>&1; then
              echo "api healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become healthy within 120s" >&2
          docker compose logs --no-color api traefik litellm | tail -200 >&2
          exit 1

      - name: Seed conformance fixture user
        run: |
          docker compose --profile contract-test run --rm seed || true

      # Drive the live cleanup no-rephrase e2e. E2E + OPENROUTER_API_KEY
      # sentinels activate the describe.skipIf gate in the test.
      - name: Live cleanup no-rephrase e2e
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          E2E: '1'
          OPENWHISPR_E2E: '1'
        run: |
          pnpm exec vitest run \
            --config tests/e2e/vitest.e2e.config.ts \
            tests/e2e/cleanup-norephrase-live.test.ts

      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/live-soak/docker-compose.live-cleanup.yml \
            logs --no-color api litellm | tail -300
