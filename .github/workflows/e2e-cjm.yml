# SPDX-License-Identifier: FSL-1.1-ALv2
# Phase 13 / Plan 01 / Task 13-01-08 — CJM ships-first gate in CI.
#
# Runs the @cjm-1.1 + @cjm-1.2 scenarios against a fresh `e2e-cjm` compose
# project booted from the base file + embedded-litellm overlay. The runner
# never has a pre-existing `openwhispr` project, so the Makefile target's
# stop/restart dance is a no-op here. Retry-on-flake is BANNED (D-12).
#
# After the run, the workflow asserts that no testcontainers
# (label=org.testcontainers=true) survived — a regression-canary for the
# vitest leak that `tools/global-vitest-teardown.ts` closes.
name: e2e-cjm
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: e2e-cjm-${{ github.ref }}
  cancel-in-progress: true
# CodeQL #36 (actions/missing-workflow-permissions) — least-privilege
# GITHUB_TOKEN. This lane only checks out the repo and runs an e2e
# compose stack; it never writes to the repo, posts comments, or
# publishes artifacts, so read-only `contents` is sufficient.
permissions:
  contents: read
jobs:
  e2e-cjm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint customer-journeys.md and feature cross-refs
        run: pnpm tsx tools/lint-cjm-doc.ts --features tests/e2e-cjm/features --check-expected-red
      - run: pnpm exec playwright install --with-deps chromium
      - name: Add localhost hostname aliases
        run: |
          sudo sh -c 'echo "127.0.0.1 app.localhost api.localhost auth.localhost mailpit.localhost" >> /etc/hosts'
      - name: Bootstrap fixture .env
        # tools/bootstrap.sh fills missing/placeholder values with
        # CI-safe randoms so docker compose does not boot with blank
        # POSTGRES_*/VALKEY_*/MINIO_*/GRAFANA_*/LITELLM_MASTER_KEY values.
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
          # Overlay-required + deny-list-gated secrets that live OUTSIDE
          # the slim contract (the slim template ships them COMMENTED
          # OUT for the 5-key operator contract; bootstrap.sh only iterates
          # over keys present in the template, so commented-out lines are
          # invisible to it and must be appended here).
          #
          # PGBOUNCER_ADMIN_PASSWORD + TRAEFIK_ADMIN_PASSWORD — required
          # by check-default-secrets.ts gate in migrate / api containers.
          # Without them migrate refuses to start ("refusing to start:
          # PGBOUNCER_ADMIN_PASSWORD is unset or matches deny-list") and
          # api never boots, surfacing as "dependency failed to start".
          # Confirmed root cause via Wave 2 #3 compose-logs artifact.
          #
          # MINIO_ROOT_PASSWORD + GRAFANA_ADMIN_PASSWORD — minio + grafana
          # refuse blank-password boots; embedded-litellm + storage
          # overlays both ship them as sidecars.
          {
            echo "PGBOUNCER_ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
            echo "TRAEFIK_ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          } >> .env
          # migrate container refuses to run without DATABASE_URL_OWNER
          # ("migrate: DATABASE_URL_OWNER not set — refusing to run as owner").
          # The slim template only ships the app DSN (DATABASE_URL);
          # synthesize the owner DSN as a composite that interpolates
          # the bootstrap-generated POSTGRES_OWNER_PASSWORD at compose
          # time. Mirrors the slim-core smoke job in ci.yml.
          echo 'DATABASE_URL_OWNER=postgres://openwhispr_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/openwhispr?sslmode=disable' >> .env
          # api refuses to boot under NODE_ENV=production without an
          # HTTPS origin ("FATAL ingress-boot: NODE_ENV=production requires
          # an HTTPS origin"). The Traefik ingress overlay terminates TLS
          # at https://api.localhost; pin every origin/auth URL to that
          # endpoint. Mirrors ci.yml smoke job lines 798-807.
          sed -i \
            -e 's|^INGRESS_BASE_URL=.*|INGRESS_BASE_URL=https://api.localhost|' \
            -e 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=https://api.localhost|' \
            -e 's|^AUTH_URL=.*|AUTH_URL=https://api.localhost|' \
            -e 's|^OPENWHISPR_API_URL=.*|OPENWHISPR_API_URL=https://api.localhost|' \
            .env
          # https://… INGRESS_BASE_URL requires INGRESS_TLS_CERT_PATH so
          # the BYOK ingress row passes. Point at the Traefik cert
          # bootstrap.sh generated above.
          echo "INGRESS_TLS_CERT_PATH=/etc/traefik/certs/local.crt" >> .env
      - name: docker compose build
        run: docker compose -f docker-compose.yml -f compose/docker-compose.embedded-litellm.yml build api worker web
      - name: Patch e2e-cjm overrides with CI api-healthcheck swap
        # The Makefile e2e-cjm target layers tests/e2e-cjm/compose-overrides.yml
        # LAST in its `-f` chain (last overlay wins). Appending the
        # healthcheck override to that file is the cleanest way to swap
        # api's docker healthcheck from /api/ready (cloud-plane readiness)
        # to /api/health (liveness) WITHOUT mutating the Makefile target.
        #
        # Why this is needed: /api/ready gates the container's healthy
        # state on LiteLLM client construction + upstream reachability.
        # In a hermetic compose project, that probe races litellm's
        # ~4-min cold-start + the SSRF dispatcher integration. When the
        # probe returns 503 the container is `unhealthy`, depends_on
        # waiters tear the stack down, and the e2e suite never actually
        # drives any request — see Wave 2 #12 (this commit) summary in
        # .planning/audit-v2.4/CI-STABILIZATION-WAVE2.md.
        # CI-only modification; never committed back to the repo.
        run: |
          {
            echo ""
            echo "  # CI-only healthcheck swap — see workflow step."
            echo "  api:"
            echo "    healthcheck:"
            echo '      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]'
            echo "      interval: 10s"
            echo "      timeout: 3s"
            echo "      retries: 5"
            echo "      start_period: 60s"
          } >> tests/e2e-cjm/compose-overrides.yml
      - name: make e2e-cjm
        env:
          E2E_CJM: "1"
          CI: "true"
        run: make e2e-cjm
      - name: Dump compose logs on failure
        # Diagnostics-only: when migrate / api / web exit non-zero during
        # boot the playwright trace is empty because no test ran. This
        # captures per-service docker logs so the real cause is visible
        # in the artifact instead of requiring a re-run with ssh.
        if: failure()
        run: |
          mkdir -p compose-logs
          docker ps -a > compose-logs/_docker-ps.txt 2>&1 || true
          # `make e2e-cjm` boots the stack under project name `e2e-cjm`.
          # Use the same -f / -p shape so we hit the right project.
          for svc in migrate postgres valkey litellm api worker web minio traefik mailpit pgbouncer otel-collector loki tempo prometheus grafana speaches; do
            docker compose -p e2e-cjm \
              -f docker-compose.yml \
              -f compose/docker-compose.embedded-litellm.yml \
              logs --no-color --tail=500 "$svc" \
              > "compose-logs/${svc}.log" 2>&1 || true
          done
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs/
          retention-days: 7
      - name: Assert no testcontainers leaked
        if: always()
        run: |
          leaked=$(docker ps --filter label=org.testcontainers=true --format '{{.Names}}')
          if [ -n "$leaked" ]; then
            echo "FAIL: testcontainers survived after e2e-cjm run:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: no containers with label=org.testcontainers=true remain."
      - name: Upload playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: tests/e2e-cjm/test-results/
          retention-days: 7
