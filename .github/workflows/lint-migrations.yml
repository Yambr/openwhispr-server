name: lint-migrations

on:
  pull_request:
    paths:
      - "drizzle/**/*.sql"
      - "tools/lint-migrations.ts"
      - "tools/lint-migrations.test.ts"
      - "tools/fixtures/migrations/**"
      - ".github/workflows/lint-migrations.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/**/*.sql"
      - "tools/lint-migrations.ts"
      - ".github/workflows/lint-migrations.yml"

permissions:
  contents: read

concurrency:
  group: lint-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  squawk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 needed so the diff against origin/${{ github.base_ref }}
          # has a common ancestor available (squawk driver enumerates new SQL).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pre-warm the pinned squawk-cli binary into the npx cache BEFORE any
      # step shells `npx --yes squawk-cli@<ver>`. On a cold runner the first
      # invocation pays the download cost; when that happens inside a vitest
      # `main()` integration test (120s timeout, but the spawn returns empty
      # stdout if the fetch hasn't resolved), the bad-* fixtures emit no
      # diagnostics → exit 0 where the test expects 1 → false-red. Warming it
      # once, serially, up front makes every later spawn hit the warm cache.
      # The version is read from the tool's single source of truth
      # (SQUAWK_VERSION in tools/lint-migrations.ts) so the two never drift.
      - name: Pre-warm squawk-cli binary (cold-fetch flake fix)
        run: |
          SQUAWK_VERSION="$(grep -oE 'SQUAWK_VERSION = "[^"]+"' tools/lint-migrations.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$SQUAWK_VERSION" ]; then
            echo "::error::could not parse SQUAWK_VERSION from tools/lint-migrations.ts"
            exit 1
          fi
          echo "Warming squawk-cli@${SQUAWK_VERSION} into the npx cache…"
          npx --yes "squawk-cli@${SQUAWK_VERSION}" --version

      - name: Squawk lint (new migrations vs PR base)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec tsx tools/lint-migrations.ts \
            --since "origin/${{ github.base_ref }}"

      - name: Squawk lint (push to main — no diff target, no-op)
        if: github.event_name == 'push'
        run: |
          # On push events, base ref is implicit; the gate is purely
          # a PR-time check. Re-running on main keeps the workflow green
          # via the no-op "No new migrations to lint." path.
          pnpm exec tsx tools/lint-migrations.ts --since "HEAD~1"

      - name: Vitest — squawk driver coverage gate (>=90/90/90/90)
        run: pnpm test:lint-migrations
