# Phase 04 / Plan 10 / Task 2 — nightly + tag-triggered live 65-min soak
# against the REAL OpenAI Realtime API.
#
# COST DISCIPLINE (T-04-COST):
#   This workflow consumes the OPENAI_API_KEY repository secret and
#   drives ~$15-25 of OpenAI Realtime audio billing per execution. The
#   job-level `if:` guard hard-restricts execution to:
#     * scheduled cron (06:00 UTC daily)
#     * tag pushes (releases — `v*` ref pattern)
#     * manual operator-initiated workflow_dispatch
#   PRs (including from forks) CANNOT trigger this workflow — `on:` does
#   not list `pull_request`, and even `workflow_dispatch` requires write
#   access to the repo. Forks therefore cannot read the secret nor spend
#   the operator's OpenAI budget.
#
# WHY NOT REQUIRED FOR MAIN-BRANCH PROTECTION:
#   This workflow's value is empirical (does the production ingress
#   chain actually survive 65 min against real OpenAI?). It is allowed
#   to flake on transient OpenAI-side issues (1006 disconnects are
#   logged but not failing) so it is intentionally NOT in
#   scripts/branch-protection.json's required_status_checks list. The
#   per-PR gate is the 5-min hermetic soak (Plan 09;
#   tests/e2e/realtime-soak-hermetic.test.ts).
#
# OVERLAY (Plan 10 Task 1):
#   Uses compose/live-soak/docker-compose.live.yml (real OpenAI), NOT
#   compose/e2e/docker-compose.e2e.yml (the hermetic mock overlay).
#   A grep for the hermetic-echo service name in this workflow MUST
#   return zero matches.

name: nightly-realtime-soak

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: 65-min live OpenAI Realtime soak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Belt-and-suspenders: even though `on:` does not list pull_request,
    # explicitly gate the job to scheduled / tag / manual dispatch so a
    # future on: extension cannot accidentally start consuming OpenAI
    # credit on every PR (CRIT cost-prevention).
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      # SHA-pinning per project security policy (Trivy 2026-03-19 incident
      # response; mirrors .github/workflows/ci.yml + nightly.yml).
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }

      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Bring up the full production stack with the live-soak overlay.
      # The overlay overlay-binds compose/live-soak/litellm_config.live-realtime.yaml
      # onto the LiteLLM container so the realtime model entry resolves
      # to wss://api.openai.com/v1/realtime (NOT a hermetic upstream).
      - name: docker compose up (live-soak overlay)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/live-soak/docker-compose.live.yml \
            up -d

      # Poll api health (mirrors the Plan 09 Makefile e2e-test pattern;
      # avoids `--wait` flaking on grafana cold-cache start).
      - name: Wait for api /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -sk --fail https://api.localhost/api/health >/dev/null 2>&1; then
              echo "api healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become healthy within 120s" >&2
          docker compose logs --no-color api traefik litellm | tail -200 >&2
          exit 1

      - name: Seed conformance fixture user
        run: |
          docker compose --profile contract-test run --rm seed || true

      # Drive the 65-min soak. OPENWHISPR_E2E + E2E sentinels mirror the
      # hermetic e2e harness so vitest's E2E include glob activates.
      - name: Live 65-min realtime soak
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E: '1'
          OPENWHISPR_E2E: '1'
        run: |
          pnpm exec vitest run \
            --config tests/e2e/vitest.e2e.config.ts \
            tests/e2e/realtime-soak-live.test.ts

      # Always upload the close-frame log — the artifact is the
      # load-bearing post-mortem signal when a real-provider run
      # regresses (T-04-02 mitigation).
      - name: Upload close-frame log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: realtime-soak-log
          path: tests/e2e/realtime-soak.log
          if-no-files-found: warn

      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/live-soak/docker-compose.live.yml \
            logs --no-color > compose-logs.txt || true

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: realtime-soak-compose-logs
          path: compose-logs.txt
          if-no-files-found: warn

      - name: docker compose down
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/live-soak/docker-compose.live.yml \
            down -v --remove-orphans || true
