name: helm-upgrade-matrix

# DEPLOY-04 gate. Installs the previous (N-1) chart version on a kind cluster
# with CNPG + Traefik + cert-manager, seeds deterministic data, upgrades to
# the HEAD chart, then runs `helm test` (DEPLOY-05 SLO probe) and the
# integrity-check.js script to confirm seeded rows survived the upgrade.
#
# Pitfall mitigations:
#   - T-09-05: concurrency.cancel-in-progress prevents kind-cluster pileup
#   - T-09-05: `if: always()` kind delete step prevents leaked clusters
#   - chicken-and-egg seed: the very first run exercises a CONTRIVED
#     0.9.0-rc1 → 0.9.0 transition. The chart-released helm-release.yml
#     workflow updates .chart-versions/previous after each tag push, so
#     subsequent runs exercise real N-1 → N pairs.

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-upgrade-matrix.yml"
      - "tools/test-probe/**"
      - "tools/seed-test-data.js"
      - "tools/integrity-check.js"
      - ".chart-versions/previous"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-upgrade-matrix.yml"
      - "tools/test-probe/**"
      - "tools/seed-test-data.js"
      - "tools/integrity-check.js"

permissions:
  contents: read

concurrency:
  group: helm-upgrade-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read previous chart version
        id: prev
        run: |
          if [ ! -f .chart-versions/previous ]; then
            echo "FATAL: .chart-versions/previous missing" >&2
            exit 1
          fi
          PREV=$(tr -d '[:space:]' < .chart-versions/previous)
          if [ -z "${PREV}" ]; then
            echo "FATAL: .chart-versions/previous is empty" >&2
            exit 1
          fi
          echo "version=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous chart version: ${PREV}"

      - name: Setup kind
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: openwhispr-upgrade
          wait: 120s

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.1

      - name: Install CNPG operator
        run: bash charts/openwhispr/examples/cnpg-install.sh

      - name: Install Traefik
        # CI-only override: service.type=ClusterIP. The reference values file
        # (charts/openwhispr/examples/traefik-values.yaml) intentionally keeps
        # the chart default service.type=LoadBalancer because that IS correct
        # for real-operator cloud K8s deployments (EKS/GKE/AKS provision an
        # actual LB). kind, however, ships no LoadBalancer controller (no
        # MetalLB, no cloud-provider-kind), so a LoadBalancer Service stays
        # EXTERNAL-IP=<pending> forever and `helm --wait` blocks until the
        # 5-minute deadline — even though the Traefik pod itself reaches
        # Ready in ~2s. Root cause confirmed via the multi-namespace failure
        # dump on run 26342214899 / job 77546104692:
        #   pod/traefik-... 1/1 Running   0   5m
        #   service/traefik LoadBalancer 10.96.248.221 <pending>  ...
        # Overriding to ClusterIP here unblocks --wait without weakening the
        # operator-facing reference values, which still ship LoadBalancer.
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update traefik
          helm upgrade --install traefik traefik/traefik \
            --namespace traefik --create-namespace \
            --version 32.1.1 \
            -f charts/openwhispr/examples/traefik-values.yaml \
            --set service.type=ClusterIP \
            --wait --timeout 5m

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.16.1 \
            --set crds.enabled=true \
            --wait --timeout 5m

      - name: Generate ephemeral CI secrets
        id: secrets
        run: |
          for k in litellmMasterKey openrouterApiKey openaiApiKey pyannoteApiKey hfToken postgresOwnerPassword postgresAppPassword pgbouncerAdminPassword betterAuthSecret valkeyPassword minioRootPassword traefikAdminPassword grafanaAdminPassword masterKek backupAgeIdentity; do
            v=$(openssl rand -base64 32 | tr -d '\n=' | cut -c1-40)
            echo "${k}=${v}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout N-1 chart from previous tag
        run: |
          PREV="${{ steps.prev.outputs.version }}"
          git fetch --tags --depth=1 || true
          if git rev-parse --verify "v${PREV}" >/dev/null 2>&1; then
            REF="v${PREV}"
          elif git rev-parse --verify "${PREV}" >/dev/null 2>&1; then
            REF="${PREV}"
          else
            echo "WARNING: tag v${PREV} not found; using HEAD as N-1 (first-run contrived transition)"
            REF=HEAD
          fi
          mkdir -p /tmp/charts-prev
          git archive "${REF}" charts/openwhispr | tar -x -C /tmp/charts-prev/
          ls /tmp/charts-prev/charts/openwhispr/

      - name: Helm install N-1
        run: |
          helm dependency build /tmp/charts-prev/charts/openwhispr || true
          helm install ow /tmp/charts-prev/charts/openwhispr \
            -f .github/ci/values-ci.yaml \
            --namespace openwhispr --create-namespace \
            --set-string secrets.litellmMasterKey=${{ steps.secrets.outputs.litellmMasterKey }} \
            --set-string secrets.openrouterApiKey=${{ steps.secrets.outputs.openrouterApiKey }} \
            --set-string secrets.openaiApiKey=${{ steps.secrets.outputs.openaiApiKey }} \
            --set-string secrets.pyannoteApiKey=${{ steps.secrets.outputs.pyannoteApiKey }} \
            --set-string secrets.hfToken=${{ steps.secrets.outputs.hfToken }} \
            --set-string secrets.postgresOwnerPassword=${{ steps.secrets.outputs.postgresOwnerPassword }} \
            --set-string secrets.postgresAppPassword=${{ steps.secrets.outputs.postgresAppPassword }} \
            --set-string secrets.pgbouncerAdminPassword=${{ steps.secrets.outputs.pgbouncerAdminPassword }} \
            --set-string secrets.betterAuthSecret=${{ steps.secrets.outputs.betterAuthSecret }} \
            --set-string secrets.valkeyPassword=${{ steps.secrets.outputs.valkeyPassword }} \
            --set-string secrets.minioRootPassword=${{ steps.secrets.outputs.minioRootPassword }} \
            --set-string secrets.traefikAdminPassword=${{ steps.secrets.outputs.traefikAdminPassword }} \
            --set-string secrets.grafanaAdminPassword=${{ steps.secrets.outputs.grafanaAdminPassword }} \
            --set-string secrets.masterKek=${{ steps.secrets.outputs.masterKek }} \
            --set-string secrets.backupAgeIdentity=${{ steps.secrets.outputs.backupAgeIdentity }} \
            --wait --timeout 10m

      - name: Seed deterministic test data into N-1 cluster
        run: |
          kubectl -n openwhispr wait --for=condition=available deployment/ow-openwhispr-api --timeout=5m
          kubectl -n openwhispr exec deploy/ow-openwhispr-api -- node /app/tools/seed-test-data.js

      - name: Helm upgrade to HEAD chart
        run: |
          helm dependency build charts/openwhispr || true
          helm upgrade ow charts/openwhispr \
            -f .github/ci/values-ci.yaml \
            --namespace openwhispr \
            --set-string secrets.litellmMasterKey=${{ steps.secrets.outputs.litellmMasterKey }} \
            --set-string secrets.openrouterApiKey=${{ steps.secrets.outputs.openrouterApiKey }} \
            --set-string secrets.openaiApiKey=${{ steps.secrets.outputs.openaiApiKey }} \
            --set-string secrets.pyannoteApiKey=${{ steps.secrets.outputs.pyannoteApiKey }} \
            --set-string secrets.hfToken=${{ steps.secrets.outputs.hfToken }} \
            --set-string secrets.postgresOwnerPassword=${{ steps.secrets.outputs.postgresOwnerPassword }} \
            --set-string secrets.postgresAppPassword=${{ steps.secrets.outputs.postgresAppPassword }} \
            --set-string secrets.pgbouncerAdminPassword=${{ steps.secrets.outputs.pgbouncerAdminPassword }} \
            --set-string secrets.betterAuthSecret=${{ steps.secrets.outputs.betterAuthSecret }} \
            --set-string secrets.valkeyPassword=${{ steps.secrets.outputs.valkeyPassword }} \
            --set-string secrets.minioRootPassword=${{ steps.secrets.outputs.minioRootPassword }} \
            --set-string secrets.traefikAdminPassword=${{ steps.secrets.outputs.traefikAdminPassword }} \
            --set-string secrets.grafanaAdminPassword=${{ steps.secrets.outputs.grafanaAdminPassword }} \
            --set-string secrets.masterKek=${{ steps.secrets.outputs.masterKek }} \
            --set-string secrets.backupAgeIdentity=${{ steps.secrets.outputs.backupAgeIdentity }} \
            --wait --timeout 10m

      - name: helm test (DEPLOY-05 SLO probe)
        run: helm test ow --namespace openwhispr --timeout 5m

      - name: Integrity check (post-upgrade seeded-row validation)
        run: |
          kubectl -n openwhispr exec deploy/ow-openwhispr-api -- node /app/tools/integrity-check.js

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          # Multi-namespace dump — the helm install steps target traefik,
          # cert-manager, cnpg-system, AND openwhispr; restricting kubectl
          # to `-n openwhispr` blinded every pre-openwhispr failure (e.g.
          # the "helm upgrade --install traefik ... context deadline
          # exceeded" failure on run 26331965866 produced 0 lines of
          # kubectl evidence because traefik lives in namespace `traefik`,
          # not `openwhispr`). Iterate every namespace this job touches.
          for ns in openwhispr traefik cert-manager cnpg-system; do
            echo "===== namespace: $ns ====="
            kubectl get ns "$ns" >/dev/null 2>&1 || { echo "  (namespace not created — skipping)"; continue; }
            kubectl -n "$ns" get all || true
            echo "----- describe pods -----"
            kubectl -n "$ns" describe pods || true
            echo "----- events -----"
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -50 || true
            echo "----- pod logs (last 200 lines, all containers) -----"
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "··· $pod ···"
              kubectl -n "$ns" logs "$pod" --all-containers --tail=200 --prefix=true || true
            done
          done

      - name: Tear down kind cluster
        if: always()
        run: |
          kind delete cluster --name openwhispr-upgrade || true
