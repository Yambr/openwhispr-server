name: helm-release

# Chart release on tag push (v*). Packages charts/openwhispr/, pushes the
# OCI artifact to ghcr.io/<owner>/charts/openwhispr, then opens a follow-up
# PR that bumps .chart-versions/previous to the just-released tag — so the
# next helm-upgrade-matrix.yml run exercises the real N-1 → N transition.
#
# The follow-up PR pattern decouples the release tag from the version-pin
# commit, keeping the released ref clean.

on:
  push:
    tags:
      - "v*"
      # 3-chart-split publish path — `openwhispr-server-<version>`
      # triggers ONLY the server chart's publish job, decoupled from the
      # monolith chart's `v*` tag space. Tag the server chart by pushing
      # e.g. `openwhispr-server-1.0.0`.
      - "openwhispr-server-*"

permissions:
  contents: write       # release commit + PR create
  packages: write       # GHCR OCI push
  pull-requests: write  # peter-evans/create-pull-request

concurrency:
  group: helm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Monolith `openwhispr` chart publish path — `v*` tags only.
    # 3-chart-split `openwhispr-server-*` tags are handled by the
    # `release-server` job below.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve chart tag (strip leading v)
        id: tag
        run: |
          ref="${GITHUB_REF_NAME#v}"
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Helm dependency build
        run: |
          # charts/openwhispr/Chart.yaml declares jetstack/cert-manager as
          # an HTTPS sub-chart (alongside the OCI valkey/minio refs); helm
          # dependency build refuses with "no repository definition for
          # https://charts.jetstack.io. Please add the missing repos via
          # 'helm repo add'" until the repo is registered. Same fix that
          # ci.yml's test job + helm-lint.yml both apply.
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm dependency build charts/openwhispr

      - name: Helm package
        run: |
          mkdir -p .cr-release-packages
          helm package charts/openwhispr \
            --version "${{ steps.tag.outputs.value }}" \
            --app-version "${{ steps.tag.outputs.value }}" \
            --destination .cr-release-packages

      - name: Push chart to GHCR OCI
        run: |
          # GHCR rejects uppercase in repository names — `github.repository_owner`
          # echoes the org slug verbatim (e.g. `Yambr`). Lowercase via shell
          # parameter expansion. Same fix that release.yml applies for image
          # tag computation.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push \
            ".cr-release-packages/openwhispr-${{ steps.tag.outputs.value }}.tgz" \
            "oci://ghcr.io/${owner}/charts"

      # chart-releaser-action does an internal `git commit` against the
      # gh-pages worktree (to add the packaged chart + regenerated
      # index.yaml). Without a configured git identity the runner errors
      # with `fatal: empty ident name not allowed` and the action exits
      # 128 before any artifact lands in gh-pages. Set the canonical
      # github-actions[bot] identity here — same identity used by every
      # GitHub-native auto-PR / auto-commit step.
      - name: Configure git identity for chart-releaser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser (GitHub Pages index)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update .chart-versions/previous on default branch
        run: |
          echo "${{ steps.tag.outputs.value }}" > .chart-versions/previous

      - name: Open follow-up PR bumping .chart-versions/previous
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-chart-versions-previous-${{ steps.tag.outputs.value }}
          base: main
          commit-message: |
            chore: bump .chart-versions/previous to ${{ steps.tag.outputs.value }} post-release
          title: |
            chore: bump .chart-versions/previous to ${{ steps.tag.outputs.value }} post-release
          body: |
            Released chart version `${{ steps.tag.outputs.value }}` to GHCR OCI registry.

            This PR updates `.chart-versions/previous` so that the next
            `helm-upgrade-matrix.yml` run exercises the real
            N-1 → HEAD transition starting from this tag.

            Auto-opened by `.github/workflows/helm-release.yml`.
          add-paths: |
            .chart-versions/previous

  release-server:
    # 3-chart-split publish path — fires ONLY on `openwhispr-server-*`
    # tags. Pushes the server chart to its own OCI namespace,
    # decoupled from the monolith `v*` tag space.
    if: startsWith(github.ref, 'refs/tags/openwhispr-server-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve server chart tag (strip openwhispr-server- prefix)
        id: tag
        run: |
          ref="${GITHUB_REF_NAME#openwhispr-server-}"
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Helm lint server chart
        run: |
          helm lint charts/openwhispr-server

      - name: Helm package server chart
        run: |
          mkdir -p .cr-release-packages
          helm package charts/openwhispr-server \
            --version "${{ steps.tag.outputs.value }}" \
            --app-version "${{ steps.tag.outputs.value }}" \
            --destination .cr-release-packages

      - name: Push server chart to GHCR OCI
        run: |
          # GHCR rejects uppercase in repository names — lowercase the
          # owner slug. Server chart lives at its own OCI path
          # (`charts/openwhispr-server`), decoupled from the monolith.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push \
            ".cr-release-packages/openwhispr-server-${{ steps.tag.outputs.value }}.tgz" \
            "oci://ghcr.io/${owner}/charts"

      - name: Configure git identity for chart-releaser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser (GitHub Pages index)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build enriched chart Release body
        id: body
        env:
          CHART_VERSION: ${{ steps.tag.outputs.value }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Owner-lowercase per GHCR rules (same parameter-expansion
          # pattern used by the OCI push step above).
          owner=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          # Read appVersion from Chart.yaml at checkout time — this is
          # the image tag the chart pins by default. yq is preinstalled
          # on ubuntu-24.04 runners.
          app_version=$(yq '.appVersion' charts/openwhispr-server/Chart.yaml)
          cat > body.md <<EOF
          # OpenWhispr Server Chart ${REF_NAME}

          Helm chart for the OpenWhispr Server backend. Ships api/web/worker Deployments, migrate Job, ConfigMap, ServiceAccount. BYOK-first — Postgres / Valkey / S3 / SMTP / LiteLLM / OAuth provided as externally-managed Kubernetes Secrets.

          ## Pinned image version

          This chart pins image **\`v${app_version}\`** as its default \`appVersion\`. See the matching [image release v${app_version}](https://github.com/Yambr/openwhispr-server/releases/tag/v${app_version}) for the GHCR pull commands of all 6 images.

          ## Pull the chart

          \`\`\`bash
          helm pull oci://ghcr.io/${owner}/charts/openwhispr-server --version ${CHART_VERSION}
          \`\`\`

          ## Install (BYOK example)

          \`\`\`bash
          helm install openwhispr \\
            oci://ghcr.io/${owner}/charts/openwhispr-server \\
            --version ${CHART_VERSION} \\
            --namespace openwhispr --create-namespace \\
            --values your-values.yaml
          \`\`\`

          See [docs/operations.md](https://github.com/Yambr/openwhispr-server/blob/main/docs/operations.md) for the full operator runbook (Secret prerequisites, ingress wiring, cert-manager, observability, corporate-LiteLLM override).

          ## Chart contents

          This Release page exposes the packaged chart as \`openwhispr-server-${CHART_VERSION}.tgz\` (asset below). The same artifact lives in **GHCR OCI** at \`oci://ghcr.io/${owner}/charts/openwhispr-server:${CHART_VERSION}\` — prefer \`helm pull\` over the .tgz attachment for production use.
          EOF
          echo "wrote body.md ($(wc -l < body.md) lines)"

      - name: Publish enriched body to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.tag.outputs.value }}
        run: |
          # Create-if-not-exists guard (R3 mitigation): chart-releaser-action
          # normally creates the Release with the .tgz attached, but
          # `skip_existing: true` can no-op on edge cases. If the Release
          # is missing we create it ourselves AND attach the .tgz. If it
          # exists we just overwrite the body via `gh release edit`.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file body.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "OpenWhispr Server Chart ${GITHUB_REF_NAME}" \
              --notes-file body.md \
              ".cr-release-packages/openwhispr-server-${CHART_VERSION}.tgz"
          fi
