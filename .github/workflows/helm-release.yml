name: helm-release

# Chart release on tag push (v*). Packages charts/openwhispr/, pushes the
# OCI artifact to ghcr.io/<owner>/charts/openwhispr, then opens a follow-up
# PR that bumps .chart-versions/previous to the just-released tag — so the
# next helm-upgrade-matrix.yml run exercises the real N-1 → N transition.
#
# The follow-up PR pattern decouples the release tag from the version-pin
# commit, keeping the released ref clean.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # release commit + PR create
  packages: write       # GHCR OCI push
  pull-requests: write  # peter-evans/create-pull-request

concurrency:
  group: helm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve chart tag (strip leading v)
        id: tag
        run: |
          ref="${GITHUB_REF_NAME#v}"
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Helm dependency build
        run: |
          # charts/openwhispr/Chart.yaml declares jetstack/cert-manager as
          # an HTTPS sub-chart (alongside the OCI valkey/minio refs); helm
          # dependency build refuses with "no repository definition for
          # https://charts.jetstack.io. Please add the missing repos via
          # 'helm repo add'" until the repo is registered. Same fix that
          # ci.yml's test job + helm-lint.yml both apply.
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm dependency build charts/openwhispr

      - name: Helm package
        run: |
          mkdir -p .cr-release-packages
          helm package charts/openwhispr \
            --version "${{ steps.tag.outputs.value }}" \
            --app-version "${{ steps.tag.outputs.value }}" \
            --destination .cr-release-packages

      - name: Push chart to GHCR OCI
        run: |
          # GHCR rejects uppercase in repository names — `github.repository_owner`
          # echoes the org slug verbatim (e.g. `Yambr`). Lowercase via shell
          # parameter expansion. Same fix that release.yml applies for image
          # tag computation.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push \
            ".cr-release-packages/openwhispr-${{ steps.tag.outputs.value }}.tgz" \
            "oci://ghcr.io/${owner}/charts"

      # chart-releaser-action does an internal `git commit` against the
      # gh-pages worktree (to add the packaged chart + regenerated
      # index.yaml). Without a configured git identity the runner errors
      # with `fatal: empty ident name not allowed` and the action exits
      # 128 before any artifact lands in gh-pages. Set the canonical
      # github-actions[bot] identity here — same identity used by every
      # GitHub-native auto-PR / auto-commit step.
      - name: Configure git identity for chart-releaser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser (GitHub Pages index)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update .chart-versions/previous on default branch
        run: |
          echo "${{ steps.tag.outputs.value }}" > .chart-versions/previous

      - name: Open follow-up PR bumping .chart-versions/previous
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-chart-versions-previous-${{ steps.tag.outputs.value }}
          base: main
          commit-message: |
            chore: bump .chart-versions/previous to ${{ steps.tag.outputs.value }} post-release
          title: |
            chore: bump .chart-versions/previous to ${{ steps.tag.outputs.value }} post-release
          body: |
            Released chart version `${{ steps.tag.outputs.value }}` to GHCR OCI registry.

            This PR updates `.chart-versions/previous` so that the next
            `helm-upgrade-matrix.yml` run exercises the real
            N-1 → HEAD transition starting from this tag.

            Auto-opened by `.github/workflows/helm-release.yml`.
          add-paths: |
            .chart-versions/previous
