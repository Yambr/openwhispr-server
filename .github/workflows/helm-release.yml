name: helm-release

# Server-chart publish on tag push (`openwhispr-server-*`). Packages
# charts/openwhispr-server/, pushes the OCI artifact to
# ghcr.io/<owner>/charts/openwhispr-server, regenerates the gh-pages
# chart-releaser index, and publishes an enriched GitHub Release body.
#
# A pre-package gate waits for the three application images the chart
# pins (openwhispr-{api,web,worker} at the chart's appVersion) to exist
# on GHCR before publishing, so the server chart is never released while
# it pins images the slow release.yml build has not yet produced.
#
# This workflow no longer publishes the monolith `charts/openwhispr`
# chart — that lives in the separate `.github/workflows/chart-release.yml`
# (`chart-v*`) lane. release.yml (a separate file) keeps its own `v*`
# trigger for the application image builds.

on:
  push:
    tags:
      # 3-chart-split publish path — `openwhispr-server-<version>`
      # triggers ONLY the server chart's publish job, decoupled from the
      # monolith chart's `v*` tag space. Tag the server chart by pushing
      # e.g. `openwhispr-server-1.0.0`.
      - "openwhispr-server-*"

permissions:
  contents: write       # release commit + chart-releaser gh-pages push
  packages: write       # GHCR OCI push

concurrency:
  group: helm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-server:
    # 3-chart-split publish path — fires ONLY on `openwhispr-server-*`
    # tags. Pushes the server chart to its own OCI namespace,
    # decoupled from the monolith `v*` tag space.
    if: startsWith(github.ref, 'refs/tags/openwhispr-server-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve server chart tag (strip openwhispr-server- prefix)
        id: tag
        run: |
          ref="${GITHUB_REF_NAME#openwhispr-server-}"
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Wait for pinned images on GHCR
        env:
          # Secrets / owner flow via env bindings only — never inlined into
          # the shell logic below, so they cannot leak into a logged command.
          REPO_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `set -x` is deliberately OFF: tracing would echo the docker-login
          # pipeline (token via stdin) and the manifest-inspect refs. We keep
          # -euo pipefail for fail-fast without leaking the credential.
          set -euo pipefail

          # GHCR rejects uppercase in repository names — lowercase the owner
          # slug (same parameter-expansion pattern used elsewhere in this file).
          owner=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')

          # The chart pins api/web/worker images at its appVersion by default.
          # Poll for exactly that tag. yq is preinstalled on ubuntu-24.04.
          app_version=$(yq '.appVersion' charts/openwhispr-server/Chart.yaml)
          if [ -z "${app_version}" ] || [ "${app_version}" = "null" ]; then
            echo "ERROR: could not read appVersion from charts/openwhispr-server/Chart.yaml" >&2
            exit 1
          fi

          # Authenticate for manifest reads. Token via stdin so it is never on
          # the command line or in the job log (docker masks the stdin secret).
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          services="api web worker"
          deadline=$(( $(date +%s) + 1500 ))   # ~25 min budget (image build ~20 min)
          interval=30

          echo "Waiting for pinned images at tag '${app_version}' (api/web/worker) on ghcr.io/${owner} ..."
          while true; do
            missing=""
            for svc in ${services}; do
              ref="ghcr.io/${owner}/openwhispr-${svc}:${app_version}"
              # `docker manifest inspect` exits 0 iff the manifest / OCI image
              # index exists and is readable (works for multi-arch indices).
              # Output redirected to /dev/null — it is noisy, not secret.
              if ! docker manifest inspect "${ref}" >/dev/null 2>&1; then
                missing="${missing} openwhispr-${svc}"
              fi
            done

            if [ -z "${missing}" ]; then
              echo "All pinned images present at tag '${app_version}':"
              for svc in ${services}; do
                echo "  - ghcr.io/${owner}/openwhispr-${svc}:${app_version}"
              done
              exit 0
            fi

            now=$(date +%s)
            if [ "${now}" -ge "${deadline}" ]; then
              echo "ERROR: timed out after ~25m waiting for image(s) at tag '${app_version}':${missing}" >&2
              echo "Refusing to publish the server chart while it pins missing image(s)." >&2
              echo "Verify the release.yml image build for v${app_version} succeeded, then re-run." >&2
              exit 1
            fi

            echo "Still missing at tag '${app_version}':${missing} — retrying in ${interval}s ..."
            sleep "${interval}"
          done

      - name: Helm lint server chart
        run: |
          helm lint charts/openwhispr-server

      - name: Helm package server chart
        run: |
          mkdir -p .cr-release-packages
          helm package charts/openwhispr-server \
            --version "${{ steps.tag.outputs.value }}" \
            --app-version "${{ steps.tag.outputs.value }}" \
            --destination .cr-release-packages

      - name: Push server chart to GHCR OCI
        run: |
          # GHCR rejects uppercase in repository names — lowercase the
          # owner slug. Server chart lives at its own OCI path
          # (`charts/openwhispr-server`), decoupled from the monolith.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push \
            ".cr-release-packages/openwhispr-server-${{ steps.tag.outputs.value }}.tgz" \
            "oci://ghcr.io/${owner}/charts"

      - name: Configure git identity for chart-releaser
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser (GitHub Pages index)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build enriched chart Release body
        id: body
        env:
          CHART_VERSION: ${{ steps.tag.outputs.value }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Owner-lowercase per GHCR rules (same parameter-expansion
          # pattern used by the OCI push step above).
          owner=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          # Read appVersion from Chart.yaml at checkout time — this is
          # the image tag the chart pins by default. yq is preinstalled
          # on ubuntu-24.04 runners.
          app_version=$(yq '.appVersion' charts/openwhispr-server/Chart.yaml)
          cat > body.md <<EOF
          # OpenWhispr Server Chart ${REF_NAME}

          Helm chart for the OpenWhispr Server backend. Ships api/web/worker Deployments, migrate Job, ConfigMap, ServiceAccount. BYOK-first — Postgres / Valkey / S3 / SMTP / LiteLLM / OAuth provided as externally-managed Kubernetes Secrets.

          ## Pinned image version

          This chart pins image **\`v${app_version}\`** as its default \`appVersion\`. See the matching [image release v${app_version}](https://github.com/Yambr/openwhispr-server/releases/tag/v${app_version}) for the GHCR pull commands of all 6 images.

          ## Pull the chart

          \`\`\`bash
          helm pull oci://ghcr.io/${owner}/charts/openwhispr-server --version ${CHART_VERSION}
          \`\`\`

          ## Install (BYOK example)

          \`\`\`bash
          helm install openwhispr \\
            oci://ghcr.io/${owner}/charts/openwhispr-server \\
            --version ${CHART_VERSION} \\
            --namespace openwhispr --create-namespace \\
            --values your-values.yaml
          \`\`\`

          See [docs/operations.md](https://github.com/Yambr/openwhispr-server/blob/main/docs/operations.md) for the full operator runbook (Secret prerequisites, ingress wiring, cert-manager, observability, corporate-LiteLLM override).

          ## Chart contents

          This Release page exposes the packaged chart as \`openwhispr-server-${CHART_VERSION}.tgz\` (asset below). The same artifact lives in **GHCR OCI** at \`oci://ghcr.io/${owner}/charts/openwhispr-server:${CHART_VERSION}\` — prefer \`helm pull\` over the .tgz attachment for production use.
          EOF
          echo "wrote body.md ($(wc -l < body.md) lines)"

      - name: Publish enriched body to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.tag.outputs.value }}
        run: |
          # Create-if-not-exists guard (R3 mitigation): chart-releaser-action
          # normally creates the Release with the .tgz attached, but
          # `skip_existing: true` can no-op on edge cases. If the Release
          # is missing we create it ourselves AND attach the .tgz. If it
          # exists we just overwrite the body via `gh release edit`.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file body.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "OpenWhispr Server Chart ${GITHUB_REF_NAME}" \
              --notes-file body.md \
              ".cr-release-packages/openwhispr-server-${CHART_VERSION}.tgz"
          fi
