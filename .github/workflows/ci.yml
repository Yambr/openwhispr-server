name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  lint-english:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 — needed by Phase 31 / Plan 07 LOCKER-09's
      # allowlist-diff CI step (below) so `git show origin/<base>:<path>`
      # resolves against the PR base branch.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:english
      - run: pnpm lint:colocated-tests
      - run: pnpm lint:phase-tag-comments
      - run: pnpm lint:dockerfile-tls
      # Phase 31 / Plan 07 / LOCKER-08 — aggregate lockers gate.
      # `make lint:lockers` fans out to all six locker binaries via the
      # `lint:lockers` aggregate package.json script. LOCKER-04/05/06
      # ship --warn-only on landing (Phase 31); they flip to BLOCKING in
      # 31-08 / 37 / 36.a final commits.
      - run: make lint:lockers
      # Phase 31 / Plan 07 / LOCKER-09 — allowlist-diff CI gate.
      # Refuses net additions to any of the six locker allowlist files
      # unless the commit body or PR body carries
      # `Allowlist-grow-approved: issue-NNNN`. Pulls the base ref via
      # GITHUB_BASE_REF (set by actions/checkout for PRs); the env
      # passthrough below makes the commit message + PR body available
      # to the diff tool. fetch-depth: 0 is required so `git show
      # origin/<base>:<path>` resolves.
      - run: pnpm lint:lockers-allowlist-diff
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_BODY: ${{ github.event.pull_request.body }}

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Phase 10 / Plan 10-01d — i18n key-completeness gate.
  # Fails CI if ANY typed-error class thrown in apps/api/src/**/*.ts is
  # missing a translation under errors.<code> in BOTH en.json AND ru.json,
  # OR if the en/ru key sets diverge, OR if a ru translation is silently
  # left as Latin script. Scanner: apps/api/src/i18n/__tests__/i18n-completeness.test.ts.
  i18n-completeness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:i18n-completeness

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    # Phase 18.1.2 / Plan 05 / Task 05-04 — align Ryuk + post-step sweep
    # with `e2e-phase6-quick`. Cluster #2 integration tests now share a
    # single Postgres testcontainer via `getSharedRoutePool()`. Ryuk
    # cannot reliably reap the shared container under GHA's job-level
    # network namespace (see RESEARCH §2: ryuk-reaper-failure-modes),
    # so we disable Ryuk and instead sweep orphaned testcontainers +
    # prune volumes in an `if: always()` post-step.
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - name: Docker daemon preflight
        run: |
          docker version
          docker info
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c  # v2.11.2
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/ }
      - name: Sweep orphaned testcontainers and prune volumes
        if: always()
        run: |
          docker ps -a --filter "label=org.testcontainers=true" --format '{{.ID}}' \
            | xargs -r docker rm -f || true
          docker volume prune -f || true

  mutation-quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('pnpm-lock.yaml','vitest.config.ts','stryker.config.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation:incremental --since origin/${{ github.base_ref }}

  pr-checklist:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: mheap/require-checklist-action@9c8100a52aa9726d4648e61aa92415f6c843c990  # v2.6.1
        with: { requireChecklist: true }

  lint-tdd:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true   # advisory in v1 (Plan 03 / D-21)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tdd

  # === Phase 6 / Plan 06-09 / D-W4 layer 1 — tenant-context static lint.
  # Walks apps/worker/src/jobs/**/*.ts via the TypeScript Compiler API and
  # fails the build if any production handler is not wrapped in
  # withTenantContext or withSystemContext. Combined with Plan 06-07
  # layer-2 (runtime pg-pool guard) + layer-3 (RLS property test) this is
  # the 3-layer defense against cross-tenant job drift. Required check
  # (scripts/branch-protection.json).
  lint-tenant-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tenant-context

  # === Plan 05: harness-self-check job appended below ===
  harness-self-check:
    runs-on: ubuntu-24.04
    needs: []
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run constitutional self-tests
        run: pnpm vitest run tests/self-tests/
      - name: Tooling version sanity check
        run: |
          pnpm exec biome --version
          pnpm exec vitest --version
          pnpm exec stryker --version
          pnpm exec commitlint --version
          pnpm exec lefthook version

  # === Plan 05: RLS-introspection lint against a migrated Postgres. ===
  # Connects directly to the postgres service on 5432 (NOT through PgBouncer
  # — RESEARCH-TOOLING Pitfall 3); PgBouncer is intentionally absent from
  # this job. The lint asserts that every tenant-scoped table has FORCE
  # RLS plus a tenant_id-referencing policy.
  lint-rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres_super
          POSTGRES_PASSWORD: super-pw
          POSTGRES_DB: openwhispr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_super -d openwhispr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_OWNER_PASSWORD: owner-pw
      POSTGRES_APP_PASSWORD: app-pw
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap roles (mirror init/00-roles.sql)
        env:
          PGPASSWORD: super-pw
        run: |
          psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE openwhispr_owner WITH LOGIN BYPASSRLS PASSWORD '${POSTGRES_OWNER_PASSWORD}';
          CREATE ROLE openwhispr_app   WITH LOGIN          PASSWORD '${POSTGRES_APP_PASSWORD}';
          ALTER DATABASE openwhispr OWNER TO openwhispr_owner;
          ALTER SCHEMA public OWNER TO openwhispr_owner;
          DO \$\$
          BEGIN
            IF (SELECT rolbypassrls FROM pg_roles WHERE rolname = 'openwhispr_app') THEN
              RAISE EXCEPTION 'openwhispr_app must NOT have BYPASSRLS';
            END IF;
          END \$\$;
          SQL
      - name: Apply migrations as owner
        env:
          DATABASE_URL_OWNER: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr
        run: pnpm migrate
      - name: Run RLS-introspection lint
        env:
          DATABASE_URL: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr
        run: pnpm lint:rls

  # === Plan 05: forward-apply + drop + forward-apply schema diff. ===
  # Migrations need session-level features (advisory locks, CREATE EXTENSION),
  # so this job connects directly to Postgres on 5432 without PgBouncer
  # (RESEARCH-TOOLING anti-pattern: never run migrations through transaction
  # pooling). The schema-only pg_dump on each forward apply must match
  # byte-for-byte (after preamble normalization) — proving migration idempotency
  # and de-facto rollback equivalence.
  test-migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres_super
          POSTGRES_PASSWORD: super-pw
          POSTGRES_DB: openwhispr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_super -d openwhispr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_OWNER_PASSWORD: owner-pw
      POSTGRES_APP_PASSWORD: app-pw
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap roles (mirror init/00-roles.sql)
        env:
          PGPASSWORD: super-pw
        run: |
          psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE openwhispr_owner WITH LOGIN BYPASSRLS PASSWORD '${POSTGRES_OWNER_PASSWORD}';
          CREATE ROLE openwhispr_app   WITH LOGIN          PASSWORD '${POSTGRES_APP_PASSWORD}';
          ALTER DATABASE openwhispr OWNER TO openwhispr_owner;
          ALTER SCHEMA public OWNER TO openwhispr_owner;
          SQL
      - name: Forward apply (round 1)
        env:
          DATABASE_URL_OWNER: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr
        run: pnpm migrate
      - name: pg_dump schema-only (pre)
        env:
          PGPASSWORD: ${{ env.POSTGRES_OWNER_PASSWORD }}
        run: |
          pg_dump --schema-only --no-owner --no-privileges \
            -h 127.0.0.1 -U openwhispr_owner -d openwhispr > /tmp/schema-pre.sql
      - name: Drop public + _meta and forward apply (round 2)
        env:
          PGPASSWORD: ${{ env.POSTGRES_OWNER_PASSWORD }}
          DATABASE_URL_OWNER: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr
        run: |
          psql -h 127.0.0.1 -U openwhispr_owner -d openwhispr -v ON_ERROR_STOP=1 <<SQL
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;
          ALTER SCHEMA public OWNER TO openwhispr_owner;
          DROP SCHEMA IF EXISTS _meta CASCADE;
          SQL
          pnpm migrate
      - name: pg_dump schema-only (post)
        env:
          PGPASSWORD: ${{ env.POSTGRES_OWNER_PASSWORD }}
        run: |
          pg_dump --schema-only --no-owner --no-privileges \
            -h 127.0.0.1 -U openwhispr_owner -d openwhispr > /tmp/schema-post.sql
      - name: Diff schema dumps (must be empty after preamble normalization)
        run: |
          # pg_dump preamble lines (timestamps + per-dump \restrict tokens) are
          # nondeterministic and must be filtered before comparison. The structural
          # body of the schema is what we assert is byte-stable.
          normalize() {
            grep -Ev '^-- (Dumped|Started on|Completed on)' "$1" \
              | grep -Ev '^\\(restrict|unrestrict) '
          }
          diff -u <(normalize /tmp/schema-pre.sql) <(normalize /tmp/schema-post.sql)

  # === Plan 06: CONTRACT-01 conformance suite, runs against the docker-compose
  # stack. Brings up `default` + `contract-test` profiles (api, postgres,
  # pgbouncer, valkey, traefik, migrate one-shot, fixture-idp), seeds the
  # conformance fixture users, runs the suite against http://api.localhost,
  # captures compose logs on failure, always tears down. Required check
  # (scripts/branch-protection.json).
  #
  # All third-party action references SHA-pinned per Trivy 2026-03-19
  # incident response.
  contract-test:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 20
    env:
      OPENWHISPR_PROTOCOL: mycorp-whispr
      AUTH_URL: http://api.localhost
      OPENWHISPR_API_URL: http://api.localhost
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Build api + migrate images
        run: docker compose build api migrate
      - name: Bring up stack (default + contract-test profiles)
        run: docker compose --profile default --profile contract-test up -d --wait
      - name: Seed conformance fixtures
        env:
          SMTP_HOST: ""
          AUTH_URL: http://api.localhost
          DATABASE_URL_OWNER: postgres://openwhispr_owner:owner-pw@127.0.0.1:5432/openwhispr
        run: pnpm -F @openwhispr/data run seed:conformance
      - name: Run conformance suite
        env:
          BACKEND_URL: http://api.localhost
          AUTH_URL: http://auth.localhost
          OPENWHISPR_PROTOCOL: mycorp-whispr
        run: pnpm -F @openwhispr/contract-tests test --run
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v

  # === DISCIPLINE rule 3 / Phase 03 e2e back-fill ===
  # Host-side e2e suite. Boots the full docker-compose stack with the
  # hermetic mock-LiteLLM contract config, then dials https://api.localhost
  # through Traefik (TLS) round-tripping POST /api/transcribe, /api/reason,
  # /v1/audio/diarization, and the WSS /v1/realtime auth gate. Requires NO
  # provider keys — every chat-completions / transcription call short-
  # circuits inside LiteLLM via mock_response. The wire-shape e2e matrix
  # MUST always run on every PR per DISCIPLINE rule 6.
  e2e-hermetic:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Add /etc/hosts entries for *.localhost
        run: |
          # Linux glibc DOES NOT auto-resolve *.localhost (RFC 6761
          # implementations vary). macOS + musl do; ubuntu-24.04's
          # nss-files/nss-dns chain stops at "localhost" itself. Pin
          # api.localhost to 127.0.0.1 explicitly so the host-side test
          # process reaches Traefik on the runner's loopback.
          echo "127.0.0.1 api.localhost auth.localhost" | sudo tee -a /etc/hosts
      - name: Build api + migrate images
        run: docker compose build api migrate
      - name: Run host-side e2e suite (boots compose + tears down)
        run: make e2e-hermetic
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-e2e.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs-e2e
          path: compose-logs-e2e.txt
      - name: Tear down (defensive — setup.ts already does this)
        if: always()
        run: docker compose down -v --remove-orphans || true

  # === Phase 6 / Plan 06-12d — Phase 6 e2e PR-gate (quick subset). ===
  # Runs the 3 fastest Phase 6 e2e tests on every PR:
  #   * probes-dependency.test.ts (OBS-05) — ~110s
  #   * audit-log-write.test.ts    (DATA-04) — ~120s
  #   * rate-limit-layered.test.ts (SCALE-04) — ~165s
  # The full 8-test suite (incl. horizontal-scale + ssrf-block + the 3
  # LGTM-trio tests) runs nightly via .github/workflows/nightly.yml's
  # e2e-phase6 job. This PR-gate keeps the must-have observability /
  # audit / rate-limit invariants green on every PR without burning a
  # 45-min budget per merge.
  #
  # Each test owns its docker-compose lifecycle via testcontainers
  # DockerComposeEnvironment (see tests/e2e/helpers/phase6-compose.ts).
  # No real provider keys required — LITELLM_CONFIG_FILE=
  # litellm_config.contract.yaml + MOCK_DIARIZATION=true keeps the
  # stack hermetic.
  e2e-phase6-quick:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Add /etc/hosts entries for *.localhost
        run: |
          echo "127.0.0.1 api.localhost auth.localhost" | sudo tee -a /etc/hosts
      - name: Build api + migrate + worker images
        run: docker compose build api migrate worker
      - name: Run Phase 6 e2e quick subset (3 tests)
        run: |
          E2E=1 \
          LITELLM_CONFIG_FILE=litellm_config.contract.yaml \
          OPENWHISPR_TEST_ROUTES=true \
          MOCK_DIARIZATION=true \
          NODE_TLS_REJECT_UNAUTHORIZED=0 \
          TESTCONTAINERS_RYUK_DISABLED=true \
          pnpm exec vitest run --config tests/e2e/vitest.e2e.config.ts \
            tests/e2e/probes-dependency.test.ts \
            tests/e2e/audit-log-write.test.ts \
            tests/e2e/rate-limit-layered.test.ts \
            --reporter=default --reporter=junit --outputFile=reports/junit-phase6-quick.xml
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-phase6-quick.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs-phase6-quick
          path: compose-logs-phase6-quick.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: phase6-quick-junit
          path: reports/junit-phase6-quick.xml
      - name: Tear down (defensive)
        if: always()
        run: docker compose down -v --remove-orphans || true


  # ────────────────────────────────────────────────────────────────
  # Phase 21 — anti-shortcut locker jobs (SR-21.1 .. SR-21.5).
  # Each runs the linter on the full tree on every PR. Required.
  # ────────────────────────────────────────────────────────────────

  lint-gherkin-tags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:gherkin-tags
      - run: pnpm test:lint-gherkin-tags

  lint-playwright-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:playwright-config
      - run: pnpm test:lint-playwright-config

  lint-steps-have-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:steps-have-unit-tests
      - run: pnpm test:lint-steps-have-unit-tests

  # SR-21.4 — Hard Rule §1 enforcement. PR-only job; reads title + body
  # + changed-files list from GitHub API via `gh`.
  prod-edit-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Capture PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "${PR_NUMBER}" --json title -q '.title' > /tmp/title.txt
          gh pr view "${PR_NUMBER}" --json body -q '.body' > /tmp/body.txt
          gh pr diff "${PR_NUMBER}" --name-only > /tmp/changed.txt
      - run: |
          pnpm tsx tools/lint-no-prod-edit-with-test-only-pr.ts \
            --title "$(cat /tmp/title.txt)" \
            --body  "$(cat /tmp/body.txt)" \
            --files /tmp/changed.txt
      - run: pnpm test:lint-prod-edit-guard

  # SR-21.5 — strict 90/90/90/90 per-file gate against the PR diff.
  # Reads coverage/coverage-summary.json (produced by the `test` job).
  coverage-floor:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - name: Capture changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "${PR_NUMBER}" --name-only > /tmp/changed.txt
      - run: |
          pnpm tsx tools/lint-coverage-floor-per-phase.ts \
            --summary coverage/coverage-summary.json \
            --changed /tmp/changed.txt
      - run: pnpm test:lint-coverage-floor

  # Phase 22 / Plan 22-01 / SR-22.1 — smoke layer between `up --wait` and
  # full e2e. Boots the slim-core compose stack, runs 5 HTTP probes
  # (health, transcribe-415, realtime auth-gate, web root, traefik
  # host-split) in under 5 s total, and on failure dumps
  # `docker compose logs --tail=200` per memory feedback_check_loki_after_tests.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Boot slim-core stack
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            up -d --wait
      - name: Run smoke probes
        run: pnpm smoke
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 --no-color > smoke-logs.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: smoke-logs
          path: smoke-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ────────────────────────────────────────────────────────────────
  # Phase 20 / Plan 20-03 / SR-20.6 — compose-config gate.
  # Validates compose YAML + env interpolation across 8 profile
  # combinations on every PR touching docker-compose*.yml,
  # compose/**/*.yml, or tools/lint-compose-resources.ts. Each
  # matrix cell runs `docker compose ... config > /dev/null` (no
  # image pull, sub-second per cell). Final step invokes
  # `make lint-compose-resources` (Phase 20-01 static lint enforcing
  # deploy.resources.{limits,reservations} parity + restart policy).
  #
  # Closes audit finding C1 — bugs caught only in e2e before.
  # Parallel to helm-lint (.github/workflows/helm-lint.yml). The
  # compose-equivalent of that job.
  #
  # Divergence-by-design (SR-20.7 narrow exception, acknowledged in
  # 20-PLAN-CHECK loop 2): single-file CI YAML cannot express
  # constitutional TDD RED→GREEN as a git-commit pair. The invariant
  # is preserved via CI-URL pair documented in 20-03-SUMMARY.md:
  # deliberate-break PR → job red; restore → job green.
  compose-lint:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: default
            files: "-f docker-compose.yml"
            profiles: "--profile default"
          - cell: contract-test
            files: "-f docker-compose.yml -f compose/docker-compose.contract-test.yml"
            profiles: "--profile default --profile contract-test"
          - cell: observability
            files: "-f docker-compose.yml -f compose/docker-compose.observability.yml"
            profiles: "--profile default"
          - cell: pgbouncer
            files: "-f docker-compose.yml -f compose/docker-compose.pgbouncer.yml"
            profiles: "--profile default"
          - cell: storage
            files: "-f docker-compose.yml -f compose/docker-compose.storage.yml"
            profiles: "--profile default"
          - cell: load-test-mock
            files: "-f docker-compose.yml -f compose/docker-compose.load-test.yml"
            profiles: "--profile load-test-mock"
          - cell: load-test-realistic
            files: "-f docker-compose.yml -f compose/docker-compose.load-test.yml -f compose/docker-compose.load-test.realistic.yml"
            profiles: "--profile load-test-realistic"
          - cell: e2e
            files: "-f docker-compose.yml -f compose/e2e/docker-compose.e2e.yml"
            profiles: "--profile default --profile e2e"
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env (env interpolation source)
        run: |
          # Use the canonical slim-OSS template (90-key reference);
          # tools/bootstrap.sh fills missing/placeholder values with
          # random strings so docker compose's env interpolation
          # resolves without spurious "variable is not set" warnings.
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Validate compose config (${{ matrix.cell }})
        run: |
          docker compose ${{ matrix.files }} ${{ matrix.profiles }} config > /dev/null

  # Aggregate static-lint pass (runs once, not per matrix cell).
  # Phase 20-01's tools/lint-compose-resources.ts enforces
  # deploy.resources.{limits,reservations} + restart policy across
  # the entire compose tree.
  compose-lint-resources:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Static resource-limits + restart-policy lint
        run: make lint-compose-resources
