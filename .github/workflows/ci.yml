name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  lint-english:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 — needed by Phase 31 / Plan 07 LOCKER-09's
      # allowlist-diff CI step (below) so `git show origin/<base>:<path>`
      # resolves against the PR base branch.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:english
      - run: pnpm lint:colocated-tests
      - run: pnpm lint:phase-tag-comments
      - run: pnpm lint:dockerfile-tls
      - run: pnpm lint:no-dockerhub-pg-image
      # Phase 31 / Plan 07 / LOCKER-08 — aggregate lockers gate.
      # `make lint:lockers` fans out to all six locker binaries via the
      # `lint:lockers` aggregate package.json script. LOCKER-04/05/06
      # ship --warn-only on landing (Phase 31); they flip to BLOCKING in
      # 31-08 / 37 / 36.a final commits.
      - run: make lint:lockers
      # Phase 31 / Plan 07 / LOCKER-09 — allowlist-diff CI gate.
      # Refuses net additions to any of the six locker allowlist files
      # unless the commit body or PR body carries
      # `Allowlist-grow-approved: issue-NNNN`. Pulls the base ref via
      # GITHUB_BASE_REF (set by actions/checkout for PRs); the env
      # passthrough below makes the commit message + PR body available
      # to the diff tool. fetch-depth: 0 is required so `git show
      # origin/<base>:<path>` resolves.
      - run: pnpm lint:lockers-allowlist-diff
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_BODY: ${{ github.event.pull_request.body }}

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Strict (`commitlint.config.cjs`) for human authors; relaxed
      # (`commitlint.config.dependabot.cjs`) only for `dependabot[bot]`.
      # The DOCS-09 Cyrillic ban (level 2) survives in BOTH configs;
      # only `body-max-line-length` and `subject-case` are relaxed for
      # dependency bumps. See `commitlint.config.dependabot.cjs`.
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1
        with:
          configFile: ${{ github.actor == 'dependabot[bot]' && 'commitlint.config.dependabot.cjs' || 'commitlint.config.cjs' }}

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Phase 10 / Plan 10-01d — i18n key-completeness gate.
  # Fails CI if ANY typed-error class thrown in apps/api/src/**/*.ts is
  # missing a translation under errors.<code> in BOTH en.json AND ru.json,
  # OR if the en/ru key sets diverge, OR if a ru translation is silently
  # left as Latin script. Scanner: apps/api/src/i18n/__tests__/i18n-completeness.test.ts.
  i18n-completeness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:i18n-completeness

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    # Phase 18.1.2 / Plan 05 / Task 05-04 — align Ryuk + post-step sweep
    # with `e2e-phase6-quick`. Cluster #2 integration tests now share a
    # single Postgres testcontainer via `getSharedRoutePool()`. Ryuk
    # cannot reliably reap the shared container under GHA's job-level
    # network namespace (see RESEARCH §2: ryuk-reaper-failure-modes),
    # so we disable Ryuk and instead sweep orphaned testcontainers +
    # prune volumes in an `if: always()` post-step.
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - name: Docker daemon preflight
        run: |
          docker version
          docker info
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        # Several integration tests run `docker compose config` against
        # docker-compose.yml / compose/*.yml, which declare
        # `env_file: .env` on api/worker/contract-test-runner blocks.
        # Docker Compose v2 errors when an explicitly-named env_file is
        # absent ("env file ... not found"), causing every overlay-merge
        # assertion in compose-overlays / oidc-env-wiring /
        # traefik-network-alias / contract-test-runner-compose /
        # observability-stack-up to fail before it reaches its own
        # logic. Mirror the contract-test / e2e jobs which do the same
        # bootstrap step.
        run: cp .env.slim.example .env
      - name: Setup Helm + resolve chart deps
        # tests/integration/lint-compose-chart-parity.test.ts runs
        # `helm template charts/openwhispr ...` which requires the OCI
        # + HTTPS sub-chart deps (valkey, minio, cert-manager) to be
        # resolved on disk. On a fresh CI checkout charts/openwhispr/
        # charts/ is empty; this step performs the same `helm repo add
        # jetstack + helm dependency build` recipe as helm-lint.yml so
        # the chart-related vitest cases don't fail with "missing in
        # charts/ directory: valkey, minio, cert-manager".
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: helm dependency build
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm dependency build charts/openwhispr
      - run: pnpm test
      - uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b  # v2.12.0
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/ }
      - name: Sweep orphaned testcontainers and prune volumes
        if: always()
        run: |
          docker ps -a --filter "label=org.testcontainers=true" --format '{{.ID}}' \
            | xargs -r docker rm -f || true
          docker volume prune -f || true

  mutation-quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # ROOT-CAUSE backstop (260530-rqk follow-up): even diff-scoped, a job should
    # never run for hours. The full run previously ran 68+ min with NO job
    # timeout (so it crept toward GitHub's 6h cap). With diff-scoping a real
    # PR finishes in minutes; this ceiling fails fast if that ever regresses.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('pnpm-lock.yaml','vitest.config.ts','stryker.config.json') }}
      - run: pnpm install --frozen-lockfile
        # ROOT CAUSE (260530-rqk follow-up): `stryker run --incremental` with the
        # config's full `mutate` globs mutates all four packages' src/ on a cold
        # incremental cache — which every PR hits first, because the cache key is
        # the hash of pnpm-lock/vitest.config/stryker.config (and config edits
        # invalidate it). That is a FULL mutation run (thousands of mutants,
        # 68+ min), not "quick". Stryker has no `--since` flag, so the real fix
        # is to mutate ONLY the source files the PR changed:
        # tools/stryker-diff-scope.ts diffs the merge base and emits the
        # mutate-eligible *.ts subset (empty for docs/CI-only PRs → Stryker is
        # skipped entirely, 0 mutants, seconds).
      - name: Compute diff-scoped mutate set
        id: scope
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1 || git fetch origin "$GITHUB_BASE_REF"
          scope=$(pnpm -s exec tsx tools/stryker-diff-scope.ts "origin/$GITHUB_BASE_REF")
          if [ -z "$scope" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "No mutate-eligible source files changed — skipping Stryker (0 mutants)."
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$scope" > .stryker-scope.txt
            echo "Mutating only the PR's changed source files:"
            cat .stryker-scope.txt
          fi
      - name: Run Stryker on the diff scope
        if: steps.scope.outputs.empty == 'false'
        run: |
          mapfile -t files < .stryker-scope.txt
          args=()
          for f in "${files[@]}"; do args+=(--mutate "$f"); done
          pnpm exec stryker run --incremental "${args[@]}"

  pr-checklist:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: mheap/require-checklist-action@9c8100a52aa9726d4648e61aa92415f6c843c990  # v2.6.1
        # skipComments: true — only the PR *body* checklist is evaluated. With
        # the default (false) the action also scans PR comments and treats
        # bot-injected comment checkboxes (CodeRabbit / Copilot "Create stacked
        # PR", "Commit on current branch", …) as incomplete items, failing the
        # gate on every PR regardless of the body checklist (fix 260530-rqk).
        with: { requireChecklist: true, skipComments: true }

  lint-tdd:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true   # advisory in v1 (Plan 03 / D-21)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tdd

  # === Phase 6 / Plan 06-09 / D-W4 layer 1 — tenant-context static lint.
  # Walks apps/worker/src/jobs/**/*.ts via the TypeScript Compiler API and
  # fails the build if any production handler is not wrapped in
  # withTenantContext or withSystemContext. Combined with Plan 06-07
  # layer-2 (runtime pg-pool guard) + layer-3 (RLS property test) this is
  # the 3-layer defense against cross-tenant job drift. Required check
  # (scripts/branch-protection.json).
  lint-tenant-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:tenant-context

  # === Plan 05: harness-self-check job appended below ===
  harness-self-check:
    runs-on: ubuntu-24.04
    needs: []
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run constitutional self-tests
        # vitest 4 workspace projects route file resolution per-project
        # root, so the positional path `tests/self-tests/` no longer
        # selects any files (each project's root is its own subtree). The
        # Plan 44-01 `tests-self-tests` project entry in vitest.config.ts
        # is the canonical selector — invoke it directly. Without this,
        # the job exited 1 with "No test files found", silently bypassing
        # every constitutional invariant since the v3->v4 vitest migration.
        run: pnpm exec vitest run --project tests-self-tests --reporter=verbose
      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          docker compose -p openwhispr ps -a || true
          docker compose -p openwhispr logs --tail 200 || true
      - name: Tooling version sanity check
        run: |
          pnpm exec biome --version
          pnpm exec vitest --version
          pnpm exec stryker --version
          pnpm exec commitlint --version
          pnpm exec lefthook version

  # === Plan 05: RLS-introspection lint against a migrated Postgres. ===
  # Connects directly to the postgres service on 5432 (NOT through PgBouncer
  # — RESEARCH-TOOLING Pitfall 3); PgBouncer is intentionally absent from
  # this job. The lint asserts that every tenant-scoped table has FORCE
  # RLS plus a tenant_id-referencing policy.
  lint-rls:
    runs-on: ubuntu-24.04
    # NOTE: postgres is NOT declared under `services:` — we need the
    # custom openwhispr/postgres image (pg_partman 5.2.4 baked in) because
    # migration 0014 partitions audit_log via pg_partman. `services:`
    # can only reference pulled images, so we build + `docker run` below.
    env:
      POSTGRES_OWNER_PASSWORD: owner-pw
      POSTGRES_APP_PASSWORD: app-pw
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build + start custom postgres (pg_partman 5.2.4)
        run: |
          docker build -t openwhispr/postgres:ci ./compose/postgres
          docker run -d --name pg-ci \
            -e POSTGRES_USER=postgres_super \
            -e POSTGRES_PASSWORD=super-pw \
            -e POSTGRES_DB=openwhispr \
            -p 5432:5432 \
            openwhispr/postgres:ci
          # Postgres official entrypoint: initdb → start (local trust) →
          # run /docker-entrypoint-initdb.d → SIGTERM → final restart that
          # binds the network listener. The host-side TCP socket can
          # answer transiently during the trust-start phase. Require N
          # consecutive successful host-side SELECTs to confirm the final
          # restart has bound.
          ok=0
          for i in $(seq 1 120); do
            if PGPASSWORD=super-pw psql -h 127.0.0.1 -U postgres_super -d openwhispr -c 'SELECT 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              if [ "$ok" -ge 5 ]; then
                echo "postgres steadily ready after ${i}s (5 consecutive connects)"
                break
              fi
            else
              ok=0
            fi
            if [ "$i" = "120" ]; then
              echo "postgres did not become steadily ready in 120s — container logs:"
              docker logs pg-ci || true
              exit 1
            fi
            sleep 1
          done
      - name: Bootstrap roles (mirror init/00-roles.sql)
        env:
          PGPASSWORD: super-pw
        run: |
          psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 <<SQL
          -- SUPERUSER mirrors the privileges the postgres image's
          -- init/00-roles.sh grants in the production stack — required for
          -- migration 0024's ALTER ROLE openwhispr_app SET app.tenant_id
          -- (custom GUCs need superuser to register).
          CREATE ROLE openwhispr_owner WITH LOGIN BYPASSRLS CREATEROLE SUPERUSER PASSWORD '${POSTGRES_OWNER_PASSWORD}';
          CREATE ROLE openwhispr_app   WITH LOGIN          PASSWORD '${POSTGRES_APP_PASSWORD}';
          ALTER DATABASE openwhispr OWNER TO openwhispr_owner;
          ALTER SCHEMA public OWNER TO openwhispr_owner;
          DO \$\$
          BEGIN
            IF (SELECT rolbypassrls FROM pg_roles WHERE rolname = 'openwhispr_app') THEN
              RAISE EXCEPTION 'openwhispr_app must NOT have BYPASSRLS';
            END IF;
          END \$\$;
          SQL
      - name: Provision pg_partman extension (mirror init/02-pg-partman.sql)
        env:
          PGPASSWORD: super-pw
        run: psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 -f packages/data/migrations/init/02-pg-partman.sql
      - name: Apply migrations as owner
        env:
          # GHA `services: postgres` does not support TLS; opt out so
          # buildPoolConfig() returns ssl=false (sslmode=disable is the
          # canonical libpq escape hatch — see packages/data/src/client.ts).
          DATABASE_URL_OWNER: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr?sslmode=disable
          # RLS-introspection only needs the app schema on `openwhispr`. The
          # bootstrap role lacks CREATEDB (canonical 00-roles.sql.tpl shape),
          # so opt out of ensureLitellmDatabase().
          SKIP_LITELLM_DB_AUTOCREATE: '1'
        run: pnpm migrate
      - name: Run RLS-introspection lint
        env:
          DATABASE_URL: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr
        run: pnpm lint:rls

  # === Plan 05: forward-apply + drop + forward-apply schema diff. ===
  # Migrations need session-level features (advisory locks, CREATE EXTENSION),
  # so this job connects directly to Postgres on 5432 without PgBouncer
  # (RESEARCH-TOOLING anti-pattern: never run migrations through transaction
  # pooling). The schema-only pg_dump on each forward apply must match
  # byte-for-byte (after preamble normalization) — proving migration idempotency
  # and de-facto rollback equivalence.
  test-migration:
    runs-on: ubuntu-24.04
    # NOTE: postgres is NOT declared under `services:` — we need the
    # custom openwhispr/postgres image (pg_partman 5.2.4 baked in) because
    # migration 0014 partitions audit_log via pg_partman. `services:`
    # can only reference pulled images, so we build + `docker run` below.
    env:
      POSTGRES_OWNER_PASSWORD: owner-pw
      POSTGRES_APP_PASSWORD: app-pw
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Build + start custom postgres (pg_partman 5.2.4)
        run: |
          docker build -t openwhispr/postgres:ci ./compose/postgres
          docker run -d --name pg-ci \
            -e POSTGRES_USER=postgres_super \
            -e POSTGRES_PASSWORD=super-pw \
            -e POSTGRES_DB=openwhispr \
            -p 5432:5432 \
            openwhispr/postgres:ci
          # See lint-rls comment: require 5 consecutive host-side connects
          # because the postgres entrypoint runs initdb → trust-start →
          # SIGTERM → final restart, and a single connect can land in the
          # transient trust-start window.
          ok=0
          for i in $(seq 1 120); do
            if PGPASSWORD=super-pw psql -h 127.0.0.1 -U postgres_super -d openwhispr -c 'SELECT 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              if [ "$ok" -ge 5 ]; then
                echo "postgres steadily ready after ${i}s (5 consecutive connects)"
                break
              fi
            else
              ok=0
            fi
            if [ "$i" = "120" ]; then
              echo "postgres did not become steadily ready in 120s — container logs:"
              docker logs pg-ci || true
              exit 1
            fi
            sleep 1
          done
      - name: Bootstrap roles (mirror init/00-roles.sql)
        env:
          PGPASSWORD: super-pw
        run: |
          psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 <<SQL
          -- SUPERUSER mirrors the privileges the postgres image's
          -- init/00-roles.sh grants in the production stack — required for
          -- migration 0024's ALTER ROLE openwhispr_app SET app.tenant_id
          -- (custom GUCs need superuser to register).
          CREATE ROLE openwhispr_owner WITH LOGIN BYPASSRLS CREATEROLE SUPERUSER PASSWORD '${POSTGRES_OWNER_PASSWORD}';
          CREATE ROLE openwhispr_app   WITH LOGIN          PASSWORD '${POSTGRES_APP_PASSWORD}';
          ALTER DATABASE openwhispr OWNER TO openwhispr_owner;
          ALTER SCHEMA public OWNER TO openwhispr_owner;
          -- Normalize the schema comment so round 1 and round 2 produce
          -- byte-stable pg_dump output (initdb's default differs across
          -- pg minor versions; force the empty-string form here).
          COMMENT ON SCHEMA public IS '';
          SQL
      - name: Provision pg_partman extension (mirror init/02-pg-partman.sql)
        env:
          PGPASSWORD: super-pw
        run: psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 -f packages/data/migrations/init/02-pg-partman.sql
      - name: Forward apply (round 1)
        env:
          # GHA `services: postgres` does not support TLS; opt out so
          # buildPoolConfig() returns ssl=false (sslmode=disable is the
          # canonical libpq escape hatch — see packages/data/src/client.ts).
          DATABASE_URL_OWNER: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr?sslmode=disable
          # Schema-stability test runs against `openwhispr` only. Owner role
          # lacks CREATEDB (canonical 00-roles.sql.tpl) → opt out of
          # ensureLitellmDatabase().
          SKIP_LITELLM_DB_AUTOCREATE: '1'
        run: pnpm migrate
      - name: pg_dump schema-only (pre)
        env:
          PGPASSWORD: ${{ env.POSTGRES_OWNER_PASSWORD }}
        run: |
          # Use the container's pg_dump (matches server version exactly);
          # the runner's host pg_dump is pinned at an older major and
          # aborts with "server version mismatch" against postgres 17.5.
          docker exec -e PGPASSWORD="$PGPASSWORD" pg-ci \
            pg_dump --schema-only --no-owner --no-privileges \
            -h 127.0.0.1 -U openwhispr_owner -d openwhispr > /tmp/schema-pre.sql
      - name: Drop public + _meta and forward apply (round 2)
        env:
          PGPASSWORD: ${{ env.POSTGRES_OWNER_PASSWORD }}
          DATABASE_URL_OWNER: postgres://openwhispr_owner:${{ env.POSTGRES_OWNER_PASSWORD }}@127.0.0.1:5432/openwhispr?sslmode=disable
          SKIP_LITELLM_DB_AUTOCREATE: '1'
        run: |
          psql -h 127.0.0.1 -U openwhispr_owner -d openwhispr -v ON_ERROR_STOP=1 <<SQL
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public;
          ALTER SCHEMA public OWNER TO openwhispr_owner;
          -- Restore the canonical empty comment so the round-2 pg_dump
          -- matches round-1 byte-for-byte (vanilla postgres ships
          -- `COMMENT ON SCHEMA public IS ''` from initdb).
          COMMENT ON SCHEMA public IS '';
          DROP SCHEMA IF EXISTS _meta CASCADE;
          -- Drop + recreate partman so round 2's create_parent('public.audit_log')
          -- doesn't collide on part_config_parent_table_pkey.
          DROP SCHEMA IF EXISTS partman CASCADE;
          SQL
          PGPASSWORD=super-pw psql -h 127.0.0.1 -U postgres_super -d openwhispr -v ON_ERROR_STOP=1 -f packages/data/migrations/init/02-pg-partman.sql
          pnpm migrate
      - name: pg_dump schema-only (post)
        env:
          PGPASSWORD: ${{ env.POSTGRES_OWNER_PASSWORD }}
        run: |
          docker exec -e PGPASSWORD="$PGPASSWORD" pg-ci \
            pg_dump --schema-only --no-owner --no-privileges \
            -h 127.0.0.1 -U openwhispr_owner -d openwhispr > /tmp/schema-post.sql
      - name: Diff schema dumps (must be empty after preamble normalization)
        run: |
          # pg_dump preamble lines (timestamps + per-dump \restrict tokens) are
          # nondeterministic and must be filtered before comparison. The structural
          # body of the schema is what we assert is byte-stable.
          normalize() {
            grep -Ev '^-- (Dumped|Started on|Completed on)' "$1" \
              | grep -Ev '^\\(restrict|unrestrict) '
          }
          diff -u <(normalize /tmp/schema-pre.sql) <(normalize /tmp/schema-post.sql)

  # === Plan 06: CONTRACT-01 conformance suite, runs against the docker-compose
  # stack. Brings up `default` + `contract-test` profiles (api, postgres,
  # pgbouncer, valkey, traefik, migrate one-shot, fixture-idp), seeds the
  # conformance fixture users, runs the suite against http://api.localhost,
  # captures compose logs on failure, always tears down. Required check
  # (scripts/branch-protection.json).
  #
  # All third-party action references SHA-pinned per Trivy 2026-03-19
  # incident response.
  contract-test:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 20
    env:
      OPENWHISPR_PROTOCOL: mycorp-whispr
      AUTH_URL: http://api.localhost
      OPENWHISPR_API_URL: http://api.localhost
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          # LITELLM_CONFIG_FILE selects the hermetic contract config so the
          # litellm container's /health/liveliness passes without provider keys
          # (mirrors e2e-hermetic). docker compose reads .env before the host
          # env block, so it must live in the file. OPENWHISPR_TEST_ROUTES=true
          # enables the conformance-only test routes the suite exercises.
          echo "LITELLM_CONFIG_FILE=litellm_config.contract.yaml" >> .env
          echo "OPENWHISPR_TEST_ROUTES=true" >> .env
          # The api container runs with NODE_ENV=production (docker-compose.yml
          # default) and its ingress-boot guard REFUSES a plaintext-HTTP origin
          # ("FATAL ingress-boot: NODE_ENV=production requires an HTTPS origin").
          # The contract-test compose profile is authored to run WITH the
          # ingress overlay (Traefik terminates TLS at https://api.localhost) —
          # its own header comment says "the runner targets https://api.localhost
          # via Traefik ... the ingress overlay in CI". Mirror the e2e-hermetic
          # recipe: pin every origin/auth URL to the TLS endpoint + point the
          # BYOK ingress row at the Traefik cert (260530-rqk follow-up — the
          # 042db624 storage-overlay fix cleared the BYOK-storage guard but left
          # this next-in-line HTTPS guard tripping).
          sed -i \
            -e 's|^INGRESS_BASE_URL=.*|INGRESS_BASE_URL=https://api.localhost|' \
            -e 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=https://api.localhost|' \
            -e 's|^AUTH_URL=.*|AUTH_URL=https://api.localhost|' \
            -e 's|^OPENWHISPR_API_URL=.*|OPENWHISPR_API_URL=https://api.localhost|' \
            .env
          echo "INGRESS_TLS_CERT_PATH=/etc/traefik/certs/local.crt" >> .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
          # Guard: bootstrap MUST have replaced the MASTER_KEK placeholder. A
          # masked bootstrap failure (the `|| true` above) would leave the
          # placeholder and make `migrate` exit 1 with no visible cause — the
          # pre-existing contract-test red. Fail loudly here instead
          # (fix 260530-rqk; see .planning/debug/contract-test-migrate-exit1).
          if grep -q '^MASTER_KEK=PLACEHOLDER_BOOTSTRAP_WILL_REPLACE' .env; then
            echo "::error::bootstrap did not replace MASTER_KEK placeholder — migrate would fail" >&2
            exit 1
          fi
      - name: Build api + migrate images
        run: docker compose build api migrate
      - name: Bring up stack (default + contract-test profiles)
        # storage.yml — the api BYOK guard refuses to boot with
        # BYOK_STORAGE_REQUIRED unless S3_ENDPOINT is set OR the storage overlay
        # (bundled MinIO + S3_* defaults) is enabled. embedded-litellm.yml ships
        # the minio/grafana/traefik default-profile services. ingress.yml —
        # Traefik terminates TLS at https://api.localhost so the api's
        # NODE_ENV=production HTTPS-origin guard passes (the contract-test
        # profile is authored for this overlay). Mirrors the e2e-hermetic boot.
        #
        # Name the long-running services explicitly (api pulls migrate/postgres/
        # litellm/traefik/minio/etc. transitively via depends_on; fixture-idp is
        # standalone and the runner needs it). This EXCLUDES the one-shot
        # `seed` + `contract-test-runner` services — they have no healthcheck and
        # run their default CMD on `up`, which would make `--wait` either hang or
        # run the suite prematurely. They are invoked deliberately below via
        # `run --rm`, matching `make contract-test`.
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            -f compose/docker-compose.contract-test.yml \
            --profile default --profile contract-test \
            up -d --wait --wait-timeout 600 api fixture-idp
      - name: Capture migrate + api logs on boot failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            -f compose/docker-compose.contract-test.yml \
            --profile default --profile contract-test \
            logs --no-color migrate api postgres traefik fixture-idp | tail -300
      - name: Seed conformance fixtures (in-network seed container)
        # Canonical flow (Makefile `make contract-test`): run the one-shot
        # `seed` service via `compose run --rm`. It posts directly to api:3000
        # on the internal docker network (its env_file/.env + SMTP_HOST="" no-op
        # email are baked into the service def), so it has the same DNS view as
        # the api. Host-side `pnpm seed:conformance` could not resolve the
        # docker-internal `api`/`fixture-idp` hostnames the OAuth hop needs.
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            -f compose/docker-compose.contract-test.yml \
            --profile default --profile contract-test \
            run --rm seed
      - name: Run conformance suite (in-network runner container)
        # The `contract-test-runner` service (compose/docker-compose.contract-test.yml)
        # drives the suite from INSIDE the docker network, dialing
        # https://api.localhost through Traefik (BACKEND_URL/AUTH_URL baked into
        # the service, root CA trusted via NODE_EXTRA_CA_CERTS). This exercises
        # the full Traefik + TLS + cert-SAN path and resolves docker-internal
        # DNS — neither possible from a host-side `pnpm` runner. Matches
        # `make contract-test`.
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            -f compose/docker-compose.contract-test.yml \
            --profile default --profile contract-test \
            run --rm contract-test-runner
      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            -f compose/docker-compose.contract-test.yml \
            --profile default --profile contract-test \
            logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            -f compose/docker-compose.contract-test.yml \
            --profile default --profile contract-test \
            down -v --remove-orphans

  # === DISCIPLINE rule 3 / Phase 03 e2e back-fill ===
  # Host-side e2e suite. Boots the full docker-compose stack with the
  # hermetic mock-LiteLLM contract config, then dials https://api.localhost
  # through Traefik (TLS) round-tripping POST /api/transcribe, /api/reason,
  # /v1/audio/diarization, and the WSS /v1/realtime auth gate. Requires NO
  # provider keys — every chat-completions / transcription call short-
  # circuits inside LiteLLM via mock_response. The wire-shape e2e matrix
  # MUST always run on every PR per DISCIPLINE rule 6.
  e2e-hermetic:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Add /etc/hosts entries for *.localhost
        run: |
          # Linux glibc DOES NOT auto-resolve *.localhost (RFC 6761
          # implementations vary). macOS + musl do; ubuntu-24.04's
          # nss-files/nss-dns chain stops at "localhost" itself. Pin
          # api.localhost to 127.0.0.1 explicitly so the host-side test
          # process reaches Traefik on the runner's loopback.
          echo "127.0.0.1 api.localhost auth.localhost" | sudo tee -a /etc/hosts
      - name: Build api + migrate images
        run: docker compose build api migrate
      - name: Run host-side e2e suite (boots compose + tears down)
        run: make e2e-hermetic
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-e2e.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs-e2e
          path: compose-logs-e2e.txt
      - name: Tear down (defensive — setup.ts already does this)
        if: always()
        run: docker compose down -v --remove-orphans || true

  # === Phase 6 / Plan 06-12d — Phase 6 e2e PR-gate (quick subset). ===
  # Runs the 3 fastest Phase 6 e2e tests on every PR:
  #   * probes-dependency.test.ts (OBS-05) — ~110s
  #   * audit-log-write.test.ts    (DATA-04) — ~120s
  #   * rate-limit-layered.test.ts (SCALE-04) — ~165s
  # The full 8-test suite (incl. horizontal-scale + ssrf-block + the 3
  # LGTM-trio tests) runs nightly via .github/workflows/nightly.yml's
  # e2e-phase6 job. This PR-gate keeps the must-have observability /
  # audit / rate-limit invariants green on every PR without burning a
  # 45-min budget per merge.
  #
  # Each test owns its docker-compose lifecycle via testcontainers
  # DockerComposeEnvironment (see tests/e2e/helpers/phase6-compose.ts).
  # No real provider keys required — LITELLM_CONFIG_FILE=
  # litellm_config.contract.yaml + MOCK_DIARIZATION=true keeps the
  # stack hermetic.
  e2e-phase6-quick:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Add /etc/hosts entries for *.localhost
        run: |
          echo "127.0.0.1 api.localhost auth.localhost" | sudo tee -a /etc/hosts
      - name: Build api + migrate + worker images
        run: docker compose build api migrate worker
      - name: Run Phase 6 e2e quick subset (3 tests)
        run: |
          E2E=1 \
          LITELLM_CONFIG_FILE=litellm_config.contract.yaml \
          OPENWHISPR_TEST_ROUTES=true \
          MOCK_DIARIZATION=true \
          NODE_TLS_REJECT_UNAUTHORIZED=0 \
          TESTCONTAINERS_RYUK_DISABLED=true \
          pnpm exec vitest run --config tests/e2e/vitest.e2e.config.ts \
            tests/e2e/probes-dependency.test.ts \
            tests/e2e/audit-log-write.test.ts \
            tests/e2e/rate-limit-layered.test.ts \
            --reporter=default --reporter=junit --outputFile=reports/junit-phase6-quick.xml
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-phase6-quick.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs-phase6-quick
          path: compose-logs-phase6-quick.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: phase6-quick-junit
          path: reports/junit-phase6-quick.xml
      - name: Tear down (defensive)
        if: always()
        run: docker compose down -v --remove-orphans || true


  # ────────────────────────────────────────────────────────────────
  # Phase 21 — anti-shortcut locker jobs (SR-21.1 .. SR-21.5).
  # Each runs the linter on the full tree on every PR. Required.
  # ────────────────────────────────────────────────────────────────

  lint-gherkin-tags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:gherkin-tags
      - run: pnpm test:lint-gherkin-tags

  lint-playwright-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:playwright-config
      - run: pnpm test:lint-playwright-config

  lint-steps-have-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:steps-have-unit-tests
      - run: pnpm test:lint-steps-have-unit-tests

  # SR-21.4 — Hard Rule §1 enforcement. PR-only job; reads title + body
  # + changed-files list from GitHub API via `gh`.
  prod-edit-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Capture PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "${PR_NUMBER}" --json title -q '.title' > /tmp/title.txt
          gh pr view "${PR_NUMBER}" --json body -q '.body' > /tmp/body.txt
          gh pr diff "${PR_NUMBER}" --name-only > /tmp/changed.txt
      - run: |
          pnpm tsx tools/lint-no-prod-edit-with-test-only-pr.ts \
            --title "$(cat /tmp/title.txt)" \
            --body  "$(cat /tmp/body.txt)" \
            --files /tmp/changed.txt
      - run: pnpm test:lint-prod-edit-guard

  # SR-21.5 — strict 90/90/90/90 per-file gate against the PR diff.
  # Reads coverage/coverage-summary.json (produced by the `test` job).
  coverage-floor:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
        # Consume the coverage report the `test` job already produced (it uploads
        # the `coverage/` artifact) instead of RE-RUNNING the full suite here.
        # Re-running `pnpm test` in this job re-ran the docker-compose- and
        # helm-touching integration/tools tests WITHOUT this job's missing
        # docker/helm setup, so they failed on `docker compose … config` /
        # `helm dependency build` — unrelated to coverage. The `test` job (which
        # HAS that setup) is the single source of the coverage summary
        # (fix 260530-rqk).
      - name: Download coverage report from the test job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: coverage, path: coverage }
      - name: Capture changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "${PR_NUMBER}" --name-only > /tmp/changed.txt
      - run: |
          pnpm tsx tools/lint-coverage-floor-per-phase.ts \
            --summary coverage/coverage-summary.json \
            --changed /tmp/changed.txt
      - run: pnpm test:lint-coverage-floor

  # Phase 22 / Plan 22-01 / SR-22.1 — smoke layer between `up --wait` and
  # full e2e. Boots the slim-core compose stack, runs 5 HTTP probes
  # (health, transcribe-415, realtime auth-gate, web root, traefik
  # host-split) in under 5 s total, and on failure dumps
  # `docker compose logs --tail=200` per memory feedback_check_loki_after_tests.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Select the hermetic mock LiteLLM config — no real provider keys,
      # no outbound egress. The production config (litellm_config.yaml)
      # probes OpenRouter / Groq / OpenAI at boot and fails its
      # /health/liveliness check without real keys, causing `up --wait`
      # to time out with "dependency failed to start: litellm unhealthy".
      LITELLM_CONFIG_FILE: litellm_config.contract.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          # .env.slim.example now ships the full check-default-secrets
          # REQUIRED_KEYS set ACTIVE (PGBOUNCER/TRAEFIK/MINIO/GRAFANA secrets +
          # DATABASE_URL_OWNER) — bootstrap fills/derives every slot. The
          # former uncomment + grep||echo workaround block was removed as dead
          # (260530-rqk); guarded by tools/lint-env-required-secrets.test.ts.
          cp .env.slim.example .env.ci.template
          # LITELLM_CONFIG_FILE selects the hermetic contract config so the
          # litellm container's /health/liveliness check passes without
          # outbound provider keys. docker compose reads .env BEFORE the
          # host env block, so we have to write it into the template.
          echo "LITELLM_CONFIG_FILE=litellm_config.contract.yaml" >> .env.ci.template
          # The api container runs with NODE_ENV=production and refuses
          # plaintext-HTTP origins. The ingress overlay terminates TLS at
          # https://api.localhost, so pin every URL key to that origin.
          sed -i \
            -e 's|^INGRESS_BASE_URL=.*|INGRESS_BASE_URL=https://api.localhost|' \
            -e 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=https://api.localhost|' \
            -e 's|^AUTH_URL=.*|AUTH_URL=https://api.localhost|' \
            -e 's|^OPENWHISPR_API_URL=.*|OPENWHISPR_API_URL=https://api.localhost|' \
            .env.ci.template
          # https://… INGRESS_BASE_URL requires INGRESS_TLS_CERT_PATH so the
          # BYOK ingress row passes. Point at the Traefik cert shipped in
          # compose/traefik/certs (bootstrap.sh generates it on first run).
          echo "INGRESS_TLS_CERT_PATH=/etc/traefik/certs/local.crt" >> .env.ci.template
          cp .env.ci.template .env
          if [ -x tools/bootstrap.sh ]; then
            BOOTSTRAP_ENV_TEMPLATE="$(pwd)/.env.ci.template" tools/bootstrap.sh --ci || true
          fi
      - name: Boot slim-core stack
        run: |
          # --profile default — every service in compose/docker-compose.embedded-litellm.yml
          # declares an explicit profile, so without this flag compose selects
          # zero services and reports "no service selected".
          # storage.yml — api refuses to boot with BYOK_STORAGE_REQUIRED
          # unless either S3_ENDPOINT is set OR the storage overlay is
          # enabled (which ships a MinIO sidecar fulfilling the contract).
          # --wait-timeout 600 — litellm runs prisma migrate deploy at first
          # boot (~118 migrations against the bundled co-tenant DB); on a
          # cold GH runner this takes 4-5 minutes. Default `up --wait`
          # ceiling of 5 min trips just before /health/liveliness comes up.
          docker compose -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            -f compose/docker-compose.storage.yml \
            --profile default \
            up -d --wait --wait-timeout 600
      - name: Run smoke probes
        run: pnpm smoke
      - name: Dump container logs on failure
        # Per-service dump (was a single concatenated file). The api
        # healthcheck targets /api/ready (R25 cloud-plane readiness),
        # which 503s on missing SSRF marker / no LiteLLM client /
        # unreachable LiteLLM upstream — root-causing requires reading
        # the api log specifically, not 200 mixed lines from 15 services.
        if: failure()
        run: |
          mkdir -p compose-logs
          docker ps -a > compose-logs/_docker-ps.txt 2>&1 || true
          for svc in migrate postgres valkey litellm api worker web minio traefik mailpit pgbouncer otel-collector loki tempo prometheus grafana; do
            docker compose -f docker-compose.yml \
              -f compose/docker-compose.embedded-litellm.yml \
              -f compose/docker-compose.ingress.yml \
              -f compose/docker-compose.storage.yml \
              --profile default \
              logs --no-color --tail=500 "$svc" \
              > "compose-logs/${svc}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: smoke-logs
          path: compose-logs/
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  # Phase 60 — embedded-litellm stack smoke test (OSS publish SC-2).
  # Boots the Traefik-fronted embedded-litellm compose stack with a
  # hermetic mock LiteLLM (LITELLM_CONFIG_FILE=litellm_config.contract.yaml
  # — every chat / transcription call short-circuits to a canned
  # mock_response), then round-trips sign-up + transcribe against
  # https://api.localhost. Needs NO provider secrets. On failure it
  # uploads `docker compose logs` as an artifact, mirroring contract-test.
  embedded-smoke:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test]
    timeout-minutes: 25
    env:
      # Select the hermetic mock LiteLLM config — no real provider keys,
      # no outbound egress (mirrors the contract-test profile).
      LITELLM_CONFIG_FILE: litellm_config.contract.yaml
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Add /etc/hosts entries for *.localhost
        run: |
          # Linux glibc DOES NOT auto-resolve *.localhost; pin api.localhost
          # to 127.0.0.1 so the host-side smoke probe reaches Traefik.
          echo "127.0.0.1 api.localhost auth.localhost" | sudo tee -a /etc/hosts
      - name: Build api + web + worker images
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            build api web worker migrate
      - name: Bring up embedded-litellm stack (--wait)
        run: |
          # --wait-timeout 600 mirrors the slim-core smoke job rationale:
          # litellm runs prisma migrate deploy at first boot (~118 migrations
          # against the bundled co-tenant DB); on a cold GH runner this
          # takes 4-5 minutes. The docker compose default `up --wait`
          # ceiling is 5 min, tripping just before /health/liveliness
          # becomes ready.
          docker compose \
            -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            up -d --wait --wait-timeout 600
      - name: Run sign-up + transcribe smoke probe
        env:
          SMOKE_BASE_URL: https://api.localhost
        run: pnpm smoke -- tests/smoke/signup-transcribe.smoke.test.ts
      - name: Capture compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            logs --no-color > compose-logs-embedded-smoke.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: compose-logs-embedded-smoke
          path: compose-logs-embedded-smoke.txt
      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f compose/docker-compose.embedded-litellm.yml \
            -f compose/docker-compose.ingress.yml \
            down -v --remove-orphans || true

  # Phase 44 / Plan 44-01 / L3 — PR-time k6 mock load smoke.
  # Per memory feedback_loadtest_cost_discipline: PROFILE=mock ONLY.
  # OPENWHISPR_LOADTEST_ALLOW_PAID MUST be unset on PR; the Makefile
  # target hard-refuses if it is set.
  load-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env (env interpolation source)
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run mock load smoke (≤ 2 min)
        env:
          BASELINE_VUS: "5"
          BASELINE_DURATION_SUSTAIN: "60s"
          # A ≤2-min mock smoke (5 VU) is not a 1000-VU plateau; the ~16 GiB
          # hosted runner is plenty. Lower the preflight RAM floor for THIS
          # scope only — real `make load-test` keeps the 24 GiB default
          # (fix 260530-rqk).
          PREFLIGHT_MIN_RAM_GIB: "12"
        run: make load-smoke
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --tail=200 --no-color > load-smoke-logs.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: load-smoke-logs
          path: load-smoke-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ────────────────────────────────────────────────────────────────
  # Phase 20 / Plan 20-03 / SR-20.6 — compose-config gate.
  # Validates compose YAML + env interpolation across 8 profile
  # combinations on every PR touching docker-compose*.yml,
  # compose/**/*.yml, or tools/lint-compose-resources.ts. Each
  # matrix cell runs `docker compose ... config > /dev/null` (no
  # image pull, sub-second per cell). Final step invokes
  # `make lint-compose-resources` (Phase 20-01 static lint enforcing
  # deploy.resources.{limits,reservations} parity + restart policy).
  #
  # Closes audit finding C1 — bugs caught only in e2e before.
  # Parallel to helm-lint (.github/workflows/helm-lint.yml). The
  # compose-equivalent of that job.
  #
  # Divergence-by-design (SR-20.7 narrow exception, acknowledged in
  # 20-PLAN-CHECK loop 2): single-file CI YAML cannot express
  # constitutional TDD RED→GREEN as a git-commit pair. The invariant
  # is preserved via CI-URL pair documented in 20-03-SUMMARY.md:
  # deliberate-break PR → job red; restore → job green.
  compose-lint:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: default
            files: "-f docker-compose.yml"
            profiles: "--profile default"
          - cell: contract-test
            files: "-f docker-compose.yml -f compose/docker-compose.contract-test.yml"
            profiles: "--profile default --profile contract-test"
          - cell: observability
            files: "-f docker-compose.yml -f compose/docker-compose.observability.yml"
            profiles: "--profile default"
          - cell: pgbouncer
            files: "-f docker-compose.yml -f compose/docker-compose.pgbouncer.yml"
            profiles: "--profile default"
          - cell: storage
            files: "-f docker-compose.yml -f compose/docker-compose.storage.yml"
            profiles: "--profile default"
          - cell: load-test-mock
            # Match tools/load-test/scripts/run.sh:73-80: observability +
            # storage + ingress overlays MUST be layered before load-test
            # so the load-test overlay's mimir/grafana profile-extension
            # stubs (compose/docker-compose.load-test.yml lines 332-361)
            # resolve to real service definitions. Phase 14 slim-core split
            # extracted those services out of docker-compose.yml; the
            # load-test overlay only patches profiles, never re-declares
            # images. CI lint was the only caller missing this layering.
            files: "-f docker-compose.yml -f compose/docker-compose.observability.yml -f compose/docker-compose.storage.yml -f compose/docker-compose.ingress.yml -f compose/docker-compose.load-test.yml"
            profiles: "--profile load-test-mock"
          - cell: load-test-realistic
            files: "-f docker-compose.yml -f compose/docker-compose.observability.yml -f compose/docker-compose.storage.yml -f compose/docker-compose.ingress.yml -f compose/docker-compose.load-test.yml -f compose/docker-compose.load-test.realistic.yml"
            profiles: "--profile load-test-realistic"
          - cell: e2e
            files: "-f docker-compose.yml -f compose/e2e/docker-compose.e2e.yml"
            profiles: "--profile default --profile e2e"
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Bootstrap fixture .env (env interpolation source)
        run: |
          # Use the canonical slim-OSS template (90-key reference);
          # tools/bootstrap.sh fills missing/placeholder values with
          # random strings so docker compose's env interpolation
          # resolves without spurious "variable is not set" warnings.
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Validate compose config (${{ matrix.cell }})
        run: |
          docker compose ${{ matrix.files }} ${{ matrix.profiles }} config > /dev/null

  # Aggregate static-lint pass (runs once, not per matrix cell).
  # Phase 20-01's tools/lint-compose-resources.ts enforces
  # deploy.resources.{limits,reservations} + restart policy across
  # the entire compose tree.
  compose-lint-resources:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Static resource-limits + restart-policy lint
        run: make lint-compose-resources
