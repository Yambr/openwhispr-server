name: Nightly
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation

  # Phase 31 / Plan 07 / LOCKER-08 — nightly BLOCKING locker sweep.
  #
  # The pre-commit + per-PR ci.yml lockers job invokes the package.json
  # `lint:lockers` aggregate which preserves each binary's --warn-only
  # flag where set (LOCKER-04/05/06 ship WARN-only on landing during
  # Phase 31; flip to BLOCKING in 31-08 / 37 / 36.a final commits).
  # Nightly is the early-warning channel: invoke each binary WITHOUT
  # --warn-only so findings against the WARN-only-on-land lockers
  # surface as a nightly failure even before their phase-X flip lands.
  #
  # When this job fails, the developer-on-call inspects the stderr log
  # and (a) lands the fix into the appropriate phase-X bulk-fix queue
  # (31-08 for LOCKER-04, Phase 37 for LOCKER-05, Phase 36.a for
  # LOCKER-06) or (b) adds the offending file:line to the per-locker
  # allowlist with an `# issue-NNNN` rationale (governed by LOCKER-09's
  # allowlist-diff PR gate on the eventual commit).
  lockers-nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      # LOCKER-01/02/03 are BLOCKING from landing — invoke their
      # package.json scripts directly (no --warn-only to drop).
      - run: pnpm lint:no-env-branches
      - run: pnpm lint:no-suppressions
      - run: pnpm lint:no-hardcode
      # LOCKER-04/05/06 ship WARN-only-on-land — invoke the binary
      # directly (NOT the package.json script) so the --warn-only flag
      # set in package.json is not applied. Nightly sees the BLOCKING
      # form.
      - run: pnpm exec tsx tools/lint-prod-readiness.ts
      - run: pnpm exec tsx tools/lint-secret-shape-in-error.ts
      - run: pnpm exec tsx tools/lint-shell-credential-interpolation.ts
      # Phase 33 / Plan 33-05 / LOCKER-PLAINTEXT-COLS (LOCKER-08) —
      # BLOCKING from day one (no --warn-only flag); listed here for
      # nightly visibility alongside the other lockers.
      - run: pnpm exec tsx tools/lint-no-plaintext-secret-columns.ts

  load-test-placeholder:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "k6 load test placeholder - wired in Phase 8 (TEST-LOAD-01)"

  # Phase 03 / Plan 10 — E2E contract suite against REAL provider APIs.
  #
  # Runs `make e2e-test` which boots the full docker-compose stack with the
  # production litellm_config.yaml (NOT the mock contract-test config) and
  # hits real Groq STT (D-11) + OpenRouter chat (reason) + OpenAI Realtime
  # (D-12) endpoints with the operator-supplied keys.
  #
  # CRITICAL — `secrets` context is NOT available in job-level `if:`
  # conditions (CRIT-1). Using `if: ${{ secrets.X != '' }}` at the job
  # level fails workflow validation OR silently skips every run. We gate
  # via a probe step that reads the secret through an env var and writes
  # `have_keys=true|false` to step output; subsequent steps condition on
  # `steps.gate.outputs.have_keys == 'true'`.
  #
  # Cost discipline: nightly cron only (NOT on PR). When the secrets are
  # absent (forks, fresh repos), every step after `gate` is a no-op and
  # the job emits a `::notice::` annotation. NOT in branch-protection
  # required checks (`scripts/branch-protection.json`) — real-API tests
  # are intentionally allowed to flake.
  e2e-test:
    name: E2E (real provider APIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with: { fetch-depth: 0 }
      - name: Check provider-key secret presence
        id: gate
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_KEY" ]; then
            echo "have_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keys=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY not configured — skipping E2E."
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        if: steps.gate.outputs.have_keys == 'true'
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        if: steps.gate.outputs.have_keys == 'true'
        with: { node-version: '24', cache: 'pnpm' }
      - name: pnpm install
        if: steps.gate.outputs.have_keys == 'true'
        run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        if: steps.gate.outputs.have_keys == 'true'
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Write .env.e2e (real provider keys)
        if: steps.gate.outputs.have_keys == 'true'
        env:
          # Env-var indirection (not direct ${{ secrets.* }} expansion in
          # the script body) so GHA's secret-masking applies and avoids
          # shell-quoting pitfalls.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          : > .env.e2e
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> .env.e2e
          printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> .env.e2e
          # OPENAI_API_KEY powers Realtime E2E (D-12). When absent, the
          # realtime contract test skips at runtime; non-realtime E2E
          # paths still execute.
          printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" >> .env.e2e
      - name: Run E2E
        if: steps.gate.outputs.have_keys == 'true'
        run: make e2e-test
      - name: Capture compose logs on failure
        if: failure() && steps.gate.outputs.have_keys == 'true'
        run: docker compose logs --no-color > compose-logs.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure() && steps.gate.outputs.have_keys == 'true'
        with:
          name: e2e-compose-logs
          path: compose-logs.txt

  dep-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || true   # advisory; Dependabot is the blocking path

  backup-roundtrip:
    # Phase 1 / Plan 06: full age-encrypted pg_dump round-trip against a
    # real Postgres 17 service container. Asserts schema-equivalence
    # between the pre-drop and post-restore snapshots so client-major /
    # server-major drift in age or pg_dump is caught nightly.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openwhispr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Install age and postgresql client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-17
      - name: Setup application roles
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d openwhispr_test \
            -c "CREATE ROLE openwhispr_owner WITH LOGIN BYPASSRLS PASSWORD 'test'"
          psql -h localhost -U postgres -d openwhispr_test \
            -c "CREATE ROLE openwhispr_app WITH LOGIN PASSWORD 'test'"
          psql -h localhost -U postgres -d openwhispr_test \
            -c "ALTER DATABASE openwhispr_test OWNER TO openwhispr_owner"
      - name: Forward apply migrations
        env:
          DATABASE_URL_OWNER: postgresql://openwhispr_owner:test@localhost:5432/openwhispr_test
        run: pnpm migrate
      - name: Restore age identity from secret and derive recipient
        run: |
          mkdir -p ~/.age
          printf '%s\n' "${{ secrets.BACKUP_AGE_IDENTITY }}" > ~/.age/key.txt
          chmod 600 ~/.age/key.txt
          mkdir -p keys
          age-keygen -y ~/.age/key.txt > keys/backup.age.pub
      - name: Backup
        env:
          DATABASE_URL_OWNER: postgresql://openwhispr_owner:test@localhost:5432/openwhispr_test
        run: bash scripts/backup/make-backup.sh
      - name: Snapshot pre-drop schema
        env:
          PGPASSWORD: test
        run: pg_dump --schema-only -h localhost -U openwhispr_owner openwhispr_test > /tmp/schema-pre.sql
      - name: Drop and recreate database
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -c "DROP DATABASE openwhispr_test"
          psql -h localhost -U postgres -c "CREATE DATABASE openwhispr_test OWNER openwhispr_owner"
      - name: Restore from backup
        env:
          DATABASE_URL_OWNER: postgresql://openwhispr_owner:test@localhost:5432/openwhispr_test
          BACKUP_AGE_IDENTITY_FILE: /home/runner/.age/key.txt
        run: |
          BACKUP=$(ls -1 backups/*.dump.age | head -n 1) bash scripts/backup/make-restore.sh
      - name: Snapshot post-restore schema
        env:
          PGPASSWORD: test
        run: pg_dump --schema-only -h localhost -U openwhispr_owner openwhispr_test > /tmp/schema-post.sql
      - name: Assert schema-equivalent
        run: diff -u /tmp/schema-pre.sql /tmp/schema-post.sql

  # === Phase 6 / Plan 06-12d — Phase 6 e2e nightly full sweep. ===
  # Runs the FULL 8-test Phase 6 e2e suite via `make e2e-test-phase6`:
  #   * probes-dependency       (OBS-05)
  #   * audit-log-write          (DATA-04)
  #   * horizontal-scale         (SCALE-01)
  #   * ssrf-block               (SCALE-04, T-ssrf)
  #   * rate-limit-layered       (SCALE-04)
  #   * reconciliation-drift     (OBS-04)
  #   * log-scrub-sentinel       (OBS-03)
  #   * otel-trace-propagation   (OBS-01)
  #
  # PR-gate runs the 3 fastest tests via ci.yml's `e2e-phase6-quick`
  # job; this nightly runs all 8. Hermetic — no real provider keys
  # needed; LITELLM_CONFIG_FILE=litellm_config.contract.yaml keeps the
  # stack self-contained.
  #
  # Mirrors nightly-realtime-soak.yml structure for compose lifecycle
  # + log-on-failure artifact upload. NOT in branch-protection
  # required checks — Phase 6 stack is heavy enough that flake
  # tolerance lives on the nightly cadence; the per-PR quick subset
  # is the blocking gate.
  e2e-phase6:
    name: Phase 6 full e2e suite (8 tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap fixture .env
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
      - name: Add /etc/hosts entries for *.localhost
        run: |
          echo "127.0.0.1 api.localhost auth.localhost" | sudo tee -a /etc/hosts
      - name: Build api + migrate + worker images
        run: docker compose build api migrate worker
      - name: Run Phase 6 full e2e suite (make e2e-test-phase6)
        run: |
          mkdir -p reports
          E2E=1 make e2e-test-phase6 \
            2>&1 | tee reports/phase6-e2e.log
      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs-phase6.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: phase6-compose-logs
          path: compose-logs-phase6.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: phase6-e2e-log
          path: reports/phase6-e2e.log
          if-no-files-found: warn
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
