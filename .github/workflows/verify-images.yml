name: verify-images

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'scripts/verify-images.sh'
      - '.github/workflows/verify-images.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'scripts/verify-images.sh'
      - '.github/workflows/verify-images.yml'

permissions:
  contents: read

jobs:
  verify-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Run image-pin verifier
        run: bash scripts/verify-images.sh
