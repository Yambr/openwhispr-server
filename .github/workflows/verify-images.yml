name: verify-images

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'scripts/verify-images.sh'
      - '.github/workflows/verify-images.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'scripts/verify-images.sh'
      - '.github/workflows/verify-images.yml'

permissions:
  contents: read

jobs:
  verify-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Run image-pin verifier
        run: bash scripts/verify-images.sh
