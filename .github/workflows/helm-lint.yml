name: helm-lint

on:
  pull_request:
    paths:
      - "charts/**"
      - "tools/lint-compose-chart-parity.ts"
      - ".github/workflows/helm-lint.yml"
      - ".github/ci/values-ci.yaml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "tools/lint-compose-chart-parity.ts"
      - ".github/workflows/helm-lint.yml"

permissions:
  contents: read

concurrency:
  group: helm-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.7.2 || true

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin
          sudo mv /usr/local/bin/actionlint /usr/local/bin/actionlint || true

      - name: Generate ephemeral CI secrets
        id: secrets
        # Keys must mirror the FULL set in
        # `charts/openwhispr/templates/_helpers.tpl::openwhispr.requiredSecretKeys`.
        # The secrets.yaml fail-gate iterates that list and fails the
        # render unless every key has a non-empty, non-placeholder value.
        run: |
          for k in \
            litellmMasterKey \
            openrouterApiKey \
            openaiApiKey \
            hfToken \
            postgresOwnerPassword \
            postgresAppPassword \
            pgbouncerAdminPassword \
            betterAuthSecret \
            valkeyPassword \
            minioRootPassword \
            traefikAdminPassword \
            grafanaAdminPassword \
            masterKek \
            backupAgeIdentity; do
            v=$(openssl rand -base64 32 | tr -d '\n=' | cut -c1-40)
            echo "${k}=${v}" >> "$GITHUB_OUTPUT"
          done

      - name: helm dependency build
        # Chart.yaml declares 3 sub-chart deps:
        #   - valkey         (oci://registry-1.docker.io/bitnamicharts) — no `helm repo add` needed
        #   - minio          (oci://registry-1.docker.io/bitnamicharts) — no `helm repo add` needed
        #   - cert-manager   (https://charts.jetstack.io)               — HTTPS Helm repo, MUST be added
        # On a fresh CI checkout charts/ is empty, so dep-build must run
        # first. cert-manager's HTTPS repo requires explicit `helm repo
        # add` (OCI repos are auto-resolved by URL scheme).
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm dependency build charts/openwhispr

      - name: helm lint
        run: |
          helm lint charts/openwhispr \
            --set-string secrets.litellmMasterKey=${{ steps.secrets.outputs.litellmMasterKey }} \
            --set-string secrets.openrouterApiKey=${{ steps.secrets.outputs.openrouterApiKey }} \
            --set-string secrets.openaiApiKey=${{ steps.secrets.outputs.openaiApiKey }} \
            --set-string secrets.hfToken=${{ steps.secrets.outputs.hfToken }} \
            --set-string secrets.postgresOwnerPassword=${{ steps.secrets.outputs.postgresOwnerPassword }} \
            --set-string secrets.postgresAppPassword=${{ steps.secrets.outputs.postgresAppPassword }} \
            --set-string secrets.pgbouncerAdminPassword=${{ steps.secrets.outputs.pgbouncerAdminPassword }} \
            --set-string secrets.betterAuthSecret=${{ steps.secrets.outputs.betterAuthSecret }} \
            --set-string secrets.valkeyPassword=${{ steps.secrets.outputs.valkeyPassword }} \
            --set-string secrets.minioRootPassword=${{ steps.secrets.outputs.minioRootPassword }} \
            --set-string secrets.traefikAdminPassword=${{ steps.secrets.outputs.traefikAdminPassword }} \
            --set-string secrets.grafanaAdminPassword=${{ steps.secrets.outputs.grafanaAdminPassword }} \
            --set-string secrets.masterKek=${{ steps.secrets.outputs.masterKek }} \
            --set-string secrets.backupAgeIdentity=${{ steps.secrets.outputs.backupAgeIdentity }}

      - name: helm template (validate render with valid secrets)
        run: |
          helm template ow charts/openwhispr \
            -f .github/ci/values-ci.yaml \
            --set-string secrets.litellmMasterKey=${{ steps.secrets.outputs.litellmMasterKey }} \
            --set-string secrets.openrouterApiKey=${{ steps.secrets.outputs.openrouterApiKey }} \
            --set-string secrets.openaiApiKey=${{ steps.secrets.outputs.openaiApiKey }} \
            --set-string secrets.hfToken=${{ steps.secrets.outputs.hfToken }} \
            --set-string secrets.postgresOwnerPassword=${{ steps.secrets.outputs.postgresOwnerPassword }} \
            --set-string secrets.postgresAppPassword=${{ steps.secrets.outputs.postgresAppPassword }} \
            --set-string secrets.pgbouncerAdminPassword=${{ steps.secrets.outputs.pgbouncerAdminPassword }} \
            --set-string secrets.betterAuthSecret=${{ steps.secrets.outputs.betterAuthSecret }} \
            --set-string secrets.valkeyPassword=${{ steps.secrets.outputs.valkeyPassword }} \
            --set-string secrets.minioRootPassword=${{ steps.secrets.outputs.minioRootPassword }} \
            --set-string secrets.traefikAdminPassword=${{ steps.secrets.outputs.traefikAdminPassword }} \
            --set-string secrets.grafanaAdminPassword=${{ steps.secrets.outputs.grafanaAdminPassword }} \
            --set-string secrets.masterKek=${{ steps.secrets.outputs.masterKek }} \
            --set-string secrets.backupAgeIdentity=${{ steps.secrets.outputs.backupAgeIdentity }} \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: helm template (negative — bad secret fixture, expect failure)
        run: |
          if helm template ow charts/openwhispr \
            -f charts/openwhispr/tests/values-bad-secret.yaml > /tmp/badrender.yaml 2>/tmp/badrender.err; then
            echo "helm template should have failed on placeholder secret" >&2
            exit 1
          fi
          grep -q "values.secrets" /tmp/badrender.err

      - name: helm unittest
        run: helm unittest charts/openwhispr

      - name: shellcheck examples
        run: shellcheck charts/openwhispr/examples/*.sh

      - name: actionlint
        run: actionlint .github/workflows/helm-lint.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compose ↔ chart parity lint
        run: pnpm exec tsx tools/lint-compose-chart-parity.ts

      - name: Vitest — compose-chart parity coverage gate (>=90/90/90/90)
        run: pnpm test:lint-compose-chart-parity
