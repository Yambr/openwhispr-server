# SPDX-License-Identifier: FSL-1.1-ALv2
# Phase 12 / Plan 05b — UICONF-05 axe conformance lane.
#
# Runs the 5-route axe baseline (/sign-in, /sign-up, /verify-email, /setup,
# /admin) against a fresh `-p e2e-cjm` compose project booted from the base
# file + embedded-litellm overlay. Mirrors the e2e-cjm.yml boot recipe so a
# single trust-store + hosts-aliases setup serves both lanes.
#
# D-22 (Phase 12 carry-over of Phase 13 D-12): retry-on-flake is BANNED.
# The conformance lane runs with `retries: 0`; a flake here is a real defect.
name: conformance-axe
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/conformance/ui-spec/**"
      - "tests/e2e-cjm/support/**"
      - "apps/web/src/app/**"
      - "apps/web/src/components/**"
      - "docker-compose.yml"
      - "compose/docker-compose.embedded-litellm.yml"
      - "compose/**"
      - ".github/workflows/conformance-axe.yml"
  push:
    branches: [main]
concurrency:
  group: conformance-axe-${{ github.ref }}
  cancel-in-progress: true
# CodeQL #37 (actions/missing-workflow-permissions) — least-privilege
# GITHUB_TOKEN. This lane only checks out the repo and runs the axe
# conformance compose stack; it never writes to the repo, posts
# comments, or publishes artifacts, so read-only `contents` suffices.
permissions:
  contents: read
jobs:
  axe-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Add localhost hostname aliases
        run: |
          sudo sh -c 'echo "127.0.0.1 app.localhost api.localhost auth.localhost mailpit.localhost" >> /etc/hosts'
      - name: Bootstrap fixture .env
        # tools/bootstrap.sh fills missing/placeholder values with
        # CI-safe randoms so docker compose does not boot with blank
        # POSTGRES_*/VALKEY_*/MINIO_*/GRAFANA_*/LITELLM_MASTER_KEY values.
        run: |
          cp .env.slim.example .env
          if [ -x tools/bootstrap.sh ]; then
            tools/bootstrap.sh --ci || true
          fi
          # See .github/workflows/e2e-cjm.yml for the long-form rationale.
          # Slim template ships PGBOUNCER_ADMIN / TRAEFIK_ADMIN /
          # MINIO_ROOT / GRAFANA_ADMIN passwords COMMENTED OUT (5-key
          # operator contract); bootstrap.sh only iterates over keys
          # present in the template, so commented-out lines are invisible
          # to it and must be appended here directly.
          {
            echo "PGBOUNCER_ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
            echo "TRAEFIK_ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          } >> .env
          # Mirror e2e-cjm.yml — migrate refuses without DATABASE_URL_OWNER.
          echo 'DATABASE_URL_OWNER=postgres://openwhispr_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/openwhispr?sslmode=disable' >> .env
          # Mirror e2e-cjm.yml — api refuses NODE_ENV=production without
          # an HTTPS origin. Pin every origin/auth URL to Traefik's
          # TLS-terminating https://api.localhost.
          sed -i \
            -e 's|^INGRESS_BASE_URL=.*|INGRESS_BASE_URL=https://api.localhost|' \
            -e 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=https://api.localhost|' \
            -e 's|^AUTH_URL=.*|AUTH_URL=https://api.localhost|' \
            -e 's|^OPENWHISPR_API_URL=.*|OPENWHISPR_API_URL=https://api.localhost|' \
            .env
          echo "INGRESS_TLS_CERT_PATH=/etc/traefik/certs/local.crt" >> .env
      - name: docker compose build
        run: docker compose -f docker-compose.yml -f compose/docker-compose.embedded-litellm.yml build api worker web
      - name: Patch e2e-cjm overrides with CI healthcheck swaps
        # See .github/workflows/e2e-cjm.yml for rationale (api → /api/health,
        # web → /favicon.ico, both via yq merge to avoid duplicate `api:`
        # mapping key).
        run: |
          yq -i '
            .services.api.healthcheck = {
              "test": ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"],
              "interval": "10s",
              "timeout": "3s",
              "retries": 5,
              "start_period": "60s"
            } |
            .services.web.healthcheck = {
              "test": ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/favicon.ico"],
              "interval": "10s",
              "timeout": "3s",
              "retries": 5,
              "start_period": "60s"
            }
          ' tests/e2e-cjm/compose-overrides.yml
      - name: Run UICONF-05 axe baseline (boots stack via bootStack())
        env:
          E2E_CJM: "1"
          CI: "true"
        # `axe.spec.ts` calls bootStack()/tearStack() in beforeAll/afterAll.
        # The spec itself owns the compose lifecycle for this lane.
        run: pnpm exec playwright test --config tests/conformance/ui-spec/playwright.config.ts
      - name: Dump compose logs on failure
        # Diagnostics-only: mirrors e2e-cjm.yml. axe.spec.ts boots the
        # stack via bootStack() under the `-p e2e-cjm` project name, so
        # the same compose-project / overlay shape applies here.
        if: failure()
        run: |
          mkdir -p compose-logs
          docker ps -a > compose-logs/_docker-ps.txt 2>&1 || true
          for svc in migrate postgres valkey litellm api worker web minio traefik mailpit pgbouncer otel-collector loki tempo prometheus grafana speaches; do
            docker compose -p e2e-cjm \
              -f docker-compose.yml \
              -f compose/docker-compose.embedded-litellm.yml \
              logs --no-color --tail=500 "$svc" \
              > "compose-logs/${svc}.log" 2>&1 || true
          done
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-conformance-axe
          path: compose-logs/
          retention-days: 7
      - name: Assert no testcontainers leaked
        if: always()
        run: |
          leaked=$(docker ps --filter label=org.testcontainers=true --format '{{.Names}}')
          if [ -n "$leaked" ]; then
            echo "FAIL: testcontainers survived after conformance-axe run:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: no containers with label=org.testcontainers=true remain."
      - name: Upload playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-axe-trace
          path: tests/conformance/ui-spec/test-results/
          retention-days: 7
