name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Phase 260516-kya / Plan 01 — L3 secret-leak gate.
      # config-path explicit so CI consumes the SAME .gitleaks.toml as
      # lefthook L1 (pre-commit) + L2 (pre-push). Single source of
      # truth; allowlist drift between CI and local hooks is
      # structurally impossible.
      # gitleaks/gitleaks-action v2 license-gates personal accounts
      # even on PUBLIC repos: it calls GET /user, sees owner.type ===
      # "User" (not "Organization"), and refuses to run without
      # GITLEAKS_LICENSE. Yambr/openwhispr-server is a personal repo;
      # no paid license to buy. Replace the action with a direct CLI
      # install. Same engine, same .gitleaks.toml, no license gate.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks detect
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1

  trivy-fs:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (post-2026-03 incident recovery)
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          # Scoped, justified suppressions (specific advisory IDs only — never a
          # severity class). See .trivyignore; enforced by
          # tools/lint-trivyignore.test.ts (fix 260530-rqk).
          trivyignores: .trivyignore
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy-fs.sarif }

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Scoped config — excludes non-shipped test code from scanning so
          # code-scanning alerts stay signal-rich. No query is disabled;
          # only test trees / fixtures / the test-probe tool are ignored.
          # See .github/codeql/codeql-config.yml for the full rationale.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4

  license-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v6
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm dlx license-checker-rseidelsohn --production --excludePrivatePackages \
            --onlyAllow="MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;Unlicense;0BSD;MPL-2.0"
