name: Release

# Triggered by:
#   - manual dispatch for one-off rebuilds
#   - tag push `v*` for canonical releases (chart appVersion bump)
#
# Builds and pushes the application images to GHCR for multi-arch
# (amd64 + arm64). The matrix grew in Plan 09-11 to include api / web /
# worker / migrate / test-probe; the chart OCI push lives in
# .github/workflows/helm-release.yml. Each matrix entry needs a stable
# `name` (used in the image tag) and a Dockerfile relative to `context`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (e.g. 0.9.0-rc1). Default = ref name."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Per-arch NATIVE build (no QEMU), one INDEPENDENT job per arch ----
  # The build steps live in the reusable .github/workflows/build-images-arch.yml
  # and are called once per architecture. Keeping the arches in SEPARATE jobs
  # (rather than as cells of one matrix) is what lets `merge-manifest` depend on
  # amd64 alone: with a single matrix, `needs: [build-image]` waited for every
  # cell, so an arm64 runner shortage stalled the whole release. On v1.2.7 all
  # six amd64 builds were green in ~10min while six arm64 cells sat `queued`
  # 30+ min later — and because the manifest was never created, GHCR had NO
  # 1.2.7 tag at all despite every deployable (amd64) image being ready.
  build-image:
    uses: ./.github/workflows/build-images-arch.yml
    with:
      arch: amd64
      runner: ubuntu-24.04
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      packages: write

  # arm64 runs on its own schedule — it can queue for as long as GitHub needs
  # without holding the tag hostage. Its digest is folded in later by
  # `merge-manifest-multiarch`.
  build-image-arm64:
    uses: ./.github/workflows/build-images-arch.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm64
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
      packages: write

  # ---- Publish the tag from the amd64 digest, as soon as amd64 is done ----
  # Deliberately `needs: [build-image]` ONLY — never the arm64 build. amd64 is
  # what every deployment target here runs, so the tag must not be hostage to
  # arm64 runner availability (see build-images-arch.yml for the v1.2.7
  # incident). `merge-manifest-multiarch` below folds arm64 into the SAME tag
  # once its digest exists, so `docker pull ...:<tag>` keeps resolving per-arch
  # for everyone else — just a few minutes later.
  merge-manifest:
    needs: [build-image]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: cnpg-postgres-17-pgpartman, pg_minor: "17.6" }
          - { name: postgres-17-pgpartman, pg_minor: "17.5" }
          - { name: api, pg_minor: "" }
          - { name: web, pg_minor: "" }
          - { name: worker, pg_minor: "" }
          - { name: test-probe, pg_minor: "" }
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF_NAME#v}"
            echo "value=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests for this image
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Create + push multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}"
          tag="${{ steps.tag.outputs.value }}"
          pg="${{ matrix.image.pg_minor }}"

          # Build the `repo@sha256:<digest>` source-ref list from the
          # per-arch digest filenames (the digest hex was the touch'd name).
          refs=()
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            refs+=("${repo}@sha256:$(basename "$f")")
          done
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "ERROR: no per-arch digests found for ${{ matrix.image.name }}" >&2
            exit 1
          fi

          # Tag list: always :<tag>, plus :<pg_minor>-<tag> for postgres images.
          tags=("--tag" "${repo}:${tag}")
          if [ -n "${pg}" ]; then
            tags+=("--tag" "${repo}:${pg}-${tag}")
          fi

          echo "Merging ${#refs[@]} per-arch digest(s) into ${repo}:${tag}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Verify the published tag serves amd64
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}"
          tag="${{ steps.tag.outputs.value }}"
          # Only amd64 is asserted here — arm64 has not necessarily built yet,
          # and demanding it would re-introduce exactly the coupling this split
          # removes. `merge-manifest-multiarch` asserts BOTH arches later.
          docker buildx imagetools inspect "${repo}:${tag}"
          # Assert on the platform FIELDS. The JSON spells them as
          # {"architecture":"amd64","os":"linux"} — the literal string
          # "linux/amd64" never appears, so the old `| grep -q 'linux/amd64'`
          # could only ever return 1. It stayed invisible while arm64 kept this
          # job from running at all; the first release that reached it failed
          # all six matrix cells on a tag that was in fact correct (260829).
          docker buildx imagetools inspect "${repo}:${tag}" --format '{{json .}}' \
            | jq -e '[.manifest.manifests[]?.platform | select(. != null)
                      | "\(.os)/\(.architecture)"] | index("linux/amd64") != null' >/dev/null \
            || { echo "amd64 missing from manifest" >&2; exit 1; }
          echo "OK: ${repo}:${tag} serves linux/amd64"

  # ---- Fold arm64 into the SAME tag once its digest lands ----
  # Runs after both arches. Re-creates the tag from every per-arch digest, so
  # the published tag ends up a true multi-arch manifest list. Until this job
  # finishes the tag serves amd64 only — a deliberate trade: a deployable tag
  # minutes after amd64, instead of no tag at all while arm64 waits for a
  # runner. `if: always()` is NOT used: if arm64 genuinely fails to build we
  # want a red job, not a silently amd64-only release.
  merge-manifest-multiarch:
    needs: [build-image, build-image-arm64]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: cnpg-postgres-17-pgpartman, pg_minor: "17.6" }
          - { name: postgres-17-pgpartman, pg_minor: "17.5" }
          - { name: api, pg_minor: "" }
          - { name: web, pg_minor: "" }
          - { name: worker, pg_minor: "" }
          - { name: test-probe, pg_minor: "" }
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF_NAME#v}"
            echo "value=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests for this image (both arches)
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Re-create the tag as a multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}"
          tag="${{ steps.tag.outputs.value }}"
          pg="${{ matrix.image.pg_minor }}"

          refs=()
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            refs+=("${repo}@sha256:$(basename "$f")")
          done
          # Both arches must be present by now — one digest means an arch is
          # missing, which is a real failure rather than a slow runner.
          if [ "${#refs[@]}" -lt 2 ]; then
            echo "ERROR: expected per-arch digests for both arches, found ${#refs[@]}" >&2
            exit 1
          fi

          tags=("--tag" "${repo}:${tag}")
          if [ -n "${pg}" ]; then
            tags+=("--tag" "${repo}:${pg}-${tag}")
          fi

          echo "Re-stitching ${#refs[@]} per-arch digest(s) into ${repo}:${tag}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Verify multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}"
          tag="${{ steps.tag.outputs.value }}"
          # Confirm BOTH arches are present in the published manifest list.
          docker buildx imagetools inspect "${repo}:${tag}"
          # Structured read of the platform fields — see the amd64 verify above
          # for why grepping the raw JSON silently never matched.
          platforms=$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{json .}}' \
            | jq -r '[.manifest.manifests[]?.platform | select(. != null)
                      | "\(.os)/\(.architecture)"] | join(" ")')
          echo "manifest platforms: ${platforms}"
          case "${platforms}" in
            *linux/amd64*) ;;
            *) echo "amd64 missing from manifest" >&2; exit 1;;
          esac
          case "${platforms}" in
            *linux/arm64*) ;;
            *) echo "arm64 missing from manifest" >&2; exit 1;;
          esac
          echo "OK: ${repo}:${tag} is multi-arch (amd64 + arm64)"

  create-image-release:
    # Forward-only Release surface for `v*` image tags. Prior to this job,
    # `gh release view v1.0.<N>` returned "release not found" because
    # nothing in the workflow chain created a Release object for image
    # tags (chart tags get one via chart-releaser-action in
    # .github/workflows/helm-release.yml, image tags got nothing).
    #
    # Fires only on `tags/v*` push, NEVER on workflow_dispatch (no canonical
    # tag exists there to attach the Release to). Needs the full 6-image
    # matrix to finish green so the Release body's pull commands are not
    # hallucinations.
    #
    # Job-level `permissions: { contents: write }` keeps the workflow-level
    # `contents: read` permission narrow; only this single Release-creating
    # job widens the surface (R1 mitigation in PLAN.md).
    #
    # Cross-workflow note: helm-release.yml's monolith `release` job also
    # fires on `v*` tags (yanked chart). chart-releaser-action runs first
    # (~2 min) and may create the v* Release with a chart body; this job
    # finishes after ~25 min and softprops/action-gh-release@v2 overwrites
    # the body with the canonical image-release content (R8 mitigation).
    #
    # Depends on `merge-manifest` (not `build-image`): the per-arch jobs
    # push only digests; the final tagged multi-arch images exist only
    # after merge-manifest assembles them, so the Release body's pull
    # commands would be hallucinations if gated on build-image alone.
    needs: [merge-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # tsx is needed by the "Build Release body" step below to extract the
      # matching CHANGELOG section. This job otherwise has no JS toolchain.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve image tag
        id: tag
        run: |
          # Strip leading `v` from ref tags so the body's pull commands
          # match the image tags pushed by the matrix job above
          # (lines 75-84 establish the same pattern).
          ref="${GITHUB_REF_NAME#v}"
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build Release body
        id: body
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.value }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR lowercase rule applies to the owner slug; mirror the
          # parameter-expansion pattern from lines 99-107.
          owner=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          # Read the chart's appVersion as a sanity hint for operators
          # who want to confirm chart/image pairing. Falls through
          # silently if yq is missing (preinstalled on ubuntu-24.04).
          chart_app_version=$(yq '.appVersion' charts/openwhispr-server/Chart.yaml 2>/dev/null || echo "${VERSION}")
          # Extract the matching CHANGELOG section. NO `|| true`: when the
          # section is missing, changelog-extract.ts exits non-zero and (with
          # the step's default fail-fast) FAILS the release — a tag without a
          # CHANGELOG entry cannot ship. This is the version→changelog bind.
          changelog_section=$(pnpm exec tsx tools/changelog-extract.ts CHANGELOG.md "${VERSION}")
          cat > body.md <<EOF
          # OpenWhispr Server ${REF_NAME}

          Self-hosted OpenWhispr backend — see [README](https://github.com/Yambr/openwhispr-server#readme) and [operations runbook](https://github.com/Yambr/openwhispr-server/blob/main/docs/operations.md).

          ## What's changed

          ${changelog_section}

          ## Container images

          All 6 images are published to **GHCR** (multi-architecture: \`linux/amd64\` + \`linux/arm64\`, provenance + SBOM attached).

          \`\`\`bash
          docker pull ghcr.io/${owner}/openwhispr-api:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-web:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-worker:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-test-probe:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-postgres-17-pgpartman:${VERSION}        # also tagged :17.5-${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-cnpg-postgres-17-pgpartman:${VERSION}   # also tagged :17.6-${VERSION}
          \`\`\`

          Browse all OpenWhispr packages: <https://github.com/${REPO_OWNER}?tab=packages&q=openwhispr->

          ## Helm chart

          The matching chart release is published separately on tag \`openwhispr-server-<chart-version>\` and pulls these images by default. See [chart releases](https://github.com/Yambr/openwhispr-server/releases?q=openwhispr-server-) for the chart version that pins image \`${VERSION}\` as its \`appVersion\` (current default in this repo: chart with appVersion \`${chart_app_version}\`).

          \`\`\`bash
          helm pull oci://ghcr.io/${owner}/charts/openwhispr-server --version <chart-version>
          \`\`\`

          ## Install

          See [docs/operations.md](https://github.com/Yambr/openwhispr-server/blob/main/docs/operations.md) for the canonical installation runbook (single-VM docker-compose, Kubernetes Helm, and corporate-LiteLLM override).
          EOF
          echo "wrote body.md ($(wc -l < body.md) lines)"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenWhispr Server ${{ github.ref_name }}
          body_path: body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
