name: Release

# Triggered by:
#   - manual dispatch for one-off rebuilds
#   - tag push `v*` for canonical releases (chart appVersion bump)
#
# Builds and pushes the application images to GHCR for multi-arch
# (amd64 + arm64). The matrix grew in Plan 09-11 to include api / web /
# worker / migrate / test-probe; the chart OCI push lives in
# .github/workflows/helm-release.yml. Each matrix entry needs a stable
# `name` (used in the image tag) and a Dockerfile relative to `context`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (e.g. 0.9.0-rc1). Default = ref name."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Per-arch NATIVE build (no QEMU) ----
  # Each {image × platform} pair builds on its OWN-architecture runner —
  # amd64 on `ubuntu-24.04`, arm64 on `ubuntu-24.04-arm64` (free GA runners
  # on public repos). This REPLACES the prior single-job QEMU-emulated
  # `platforms: linux/amd64,linux/arm64` build, whose emulated arm64 leg
  # stalled the napi-heavy api/worker images (@node-rs/argon2 Rust + ~50
  # @opentelemetry/auto-instrumentations-node pkgs) for 90-140min on a cold
  # GHA cache (260531 v1.0.17 release). Native builds finish in ~5-13min per
  # arch. Each job pushes BY DIGEST (no tag); the `merge-manifest` job below
  # stitches the two per-arch digests into the final multi-arch tag. See
  # memory project_release_arm64_qemu_slow + .planning/deferred-items.md.
  build-image:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cnpg-postgres-17-pgpartman
            context: images/cnpg-postgres-17-pgpartman
            dockerfile: Dockerfile
            # Convenience tag includes PG minor so the chart's values.schema.json
            # regex (`^.+:17\.[0-9]+.*$`) is always satisfied without manual edits.
            pg_minor: "17.6"
          # Compose / testcontainer variant: alpine + pg_partman 5.2.4 built
          # from source with NO_BGW=1. Consumed by docker-compose.yml,
          # compose/docker-compose.embedded-litellm.yml, and ~22 integration
          # tests via `PostgreSqlContainer("ghcr.io/<owner>/openwhispr-postgres-17-pgpartman:...")`.
          # Distinct from the CNPG variant above (pg_partman 5.1.0 apt-package,
          # debian-trixie base, BGW preload) — see
          # .planning/quick/20260524-postgres-ghcr-publish/CONTEXT.md for the
          # keep-two-images rationale.
          - name: postgres-17-pgpartman
            context: compose/postgres
            dockerfile: Dockerfile
            pg_minor: "17.5"
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
            pg_minor: ""
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            pg_minor: ""
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
            pg_minor: ""
          - name: test-probe
            context: .
            dockerfile: tools/test-probe/Dockerfile
            pg_minor: ""
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm64
    # Native runner picked per platform — NO QEMU emulation.
    runs-on: ${{ matrix.platform.runner }}
    # Defence-in-depth: a native build that exceeds 40min is wedged, not
    # slow (cold-cache native api/worker finish in ~13min). Fail fast
    # instead of crawling toward the 6h GitHub job ceiling, which is what
    # let the emulated arm64 stall hide for 2.3h on 260531.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading `v` from ref tags so chart appVersion alignment is clean.
            ref="${GITHUB_REF_NAME#v}"
            echo "value=${ref}" >> "$GITHUB_OUTPUT"
          fi

      # No `docker/setup-qemu-action` here — the whole point of the per-arch
      # split is that each runner builds its NATIVE architecture without
      # emulation.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image repo (lowercase owner)
        id: repo
        run: |
          # GHCR rejects uppercase in repository names; `github.repository_owner`
          # echoes the org slug verbatim (e.g. `Yambr`) — lowercase it via shell
          # parameter expansion. Without this the build fails fast with
          # "invalid tag: repository name must be lowercase" and no image is
          # pushed (v0.9.0 + v0.9.1 first-attempt both crashed here).
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "value=ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest (native ${{ matrix.platform.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          # Push by DIGEST (no tag) — the merge-manifest job assembles the
          # final tag from both per-arch digests. `push-by-digest=true`
          # uploads the image and prints its digest to steps.build.outputs.
          outputs: type=image,name=${{ steps.repo.outputs.value }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          # Per-arch cache scope so amd64 and arm64 don't clobber each other.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          # Quick-task 260528-370 — build-info propagation. Only
          # apps/api/Dockerfile's runtime stage declares matching ARGs;
          # the other 5 images silently drop unused build-args without
          # warning (Docker behavior), so a single block serves all 6.
          build-args: |
            BUILD_VERSION=${{ steps.tag.outputs.value }}
            BUILD_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.tag.outputs.value }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.tag.outputs.value }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # Filename = the digest's sha256 hex (strip the "sha256:" prefix).
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          # One artifact per {image,arch} — the merge job globs them per image.
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---- Assemble the multi-arch manifest from the per-arch digests ----
  # For each image, pull the amd64 + arm64 digests built above and create
  # the final tagged multi-arch image with `docker buildx imagetools create`.
  # This is what makes `docker pull ...:<tag>` resolve to the right arch.
  merge-manifest:
    needs: [build-image]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: cnpg-postgres-17-pgpartman, pg_minor: "17.6" }
          - { name: postgres-17-pgpartman, pg_minor: "17.5" }
          - { name: api, pg_minor: "" }
          - { name: web, pg_minor: "" }
          - { name: worker, pg_minor: "" }
          - { name: test-probe, pg_minor: "" }
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF_NAME#v}"
            echo "value=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests for this image
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Create + push multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}"
          tag="${{ steps.tag.outputs.value }}"
          pg="${{ matrix.image.pg_minor }}"

          # Build the `repo@sha256:<digest>` source-ref list from the
          # per-arch digest filenames (the digest hex was the touch'd name).
          refs=()
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            refs+=("${repo}@sha256:$(basename "$f")")
          done
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "ERROR: no per-arch digests found for ${{ matrix.image.name }}" >&2
            exit 1
          fi

          # Tag list: always :<tag>, plus :<pg_minor>-<tag> for postgres images.
          tags=("--tag" "${repo}:${tag}")
          if [ -n "${pg}" ]; then
            tags+=("--tag" "${repo}:${pg}-${tag}")
          fi

          echo "Merging ${#refs[@]} per-arch digest(s) into ${repo}:${tag}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Verify multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/openwhispr-${{ matrix.image.name }}"
          tag="${{ steps.tag.outputs.value }}"
          # Confirm BOTH arches are present in the published manifest list.
          docker buildx imagetools inspect "${repo}:${tag}"
          docker buildx imagetools inspect "${repo}:${tag}" --format '{{json .}}' \
            | grep -q 'linux/amd64' || { echo "amd64 missing from manifest" >&2; exit 1; }
          docker buildx imagetools inspect "${repo}:${tag}" --format '{{json .}}' \
            | grep -q 'linux/arm64' || { echo "arm64 missing from manifest" >&2; exit 1; }
          echo "OK: ${repo}:${tag} is multi-arch (amd64 + arm64)"

  create-image-release:
    # Forward-only Release surface for `v*` image tags. Prior to this job,
    # `gh release view v1.0.<N>` returned "release not found" because
    # nothing in the workflow chain created a Release object for image
    # tags (chart tags get one via chart-releaser-action in
    # .github/workflows/helm-release.yml, image tags got nothing).
    #
    # Fires only on `tags/v*` push, NEVER on workflow_dispatch (no canonical
    # tag exists there to attach the Release to). Needs the full 6-image
    # matrix to finish green so the Release body's pull commands are not
    # hallucinations.
    #
    # Job-level `permissions: { contents: write }` keeps the workflow-level
    # `contents: read` permission narrow; only this single Release-creating
    # job widens the surface (R1 mitigation in PLAN.md).
    #
    # Cross-workflow note: helm-release.yml's monolith `release` job also
    # fires on `v*` tags (yanked chart). chart-releaser-action runs first
    # (~2 min) and may create the v* Release with a chart body; this job
    # finishes after ~25 min and softprops/action-gh-release@v2 overwrites
    # the body with the canonical image-release content (R8 mitigation).
    #
    # Depends on `merge-manifest` (not `build-image`): the per-arch jobs
    # push only digests; the final tagged multi-arch images exist only
    # after merge-manifest assembles them, so the Release body's pull
    # commands would be hallucinations if gated on build-image alone.
    needs: [merge-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # tsx is needed by the "Build Release body" step below to extract the
      # matching CHANGELOG section. This job otherwise has no JS toolchain.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve image tag
        id: tag
        run: |
          # Strip leading `v` from ref tags so the body's pull commands
          # match the image tags pushed by the matrix job above
          # (lines 75-84 establish the same pattern).
          ref="${GITHUB_REF_NAME#v}"
          echo "value=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build Release body
        id: body
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.value }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR lowercase rule applies to the owner slug; mirror the
          # parameter-expansion pattern from lines 99-107.
          owner=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          # Read the chart's appVersion as a sanity hint for operators
          # who want to confirm chart/image pairing. Falls through
          # silently if yq is missing (preinstalled on ubuntu-24.04).
          chart_app_version=$(yq '.appVersion' charts/openwhispr-server/Chart.yaml 2>/dev/null || echo "${VERSION}")
          # Extract the matching CHANGELOG section. NO `|| true`: when the
          # section is missing, changelog-extract.ts exits non-zero and (with
          # the step's default fail-fast) FAILS the release — a tag without a
          # CHANGELOG entry cannot ship. This is the version→changelog bind.
          changelog_section=$(pnpm exec tsx tools/changelog-extract.ts CHANGELOG.md "${VERSION}")
          cat > body.md <<EOF
          # OpenWhispr Server ${REF_NAME}

          Self-hosted OpenWhispr backend — see [README](https://github.com/Yambr/openwhispr-server#readme) and [operations runbook](https://github.com/Yambr/openwhispr-server/blob/main/docs/operations.md).

          ## What's changed

          ${changelog_section}

          ## Container images

          All 6 images are published to **GHCR** (multi-architecture: \`linux/amd64\` + \`linux/arm64\`, provenance + SBOM attached).

          \`\`\`bash
          docker pull ghcr.io/${owner}/openwhispr-api:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-web:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-worker:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-test-probe:${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-postgres-17-pgpartman:${VERSION}        # also tagged :17.5-${VERSION}
          docker pull ghcr.io/${owner}/openwhispr-cnpg-postgres-17-pgpartman:${VERSION}   # also tagged :17.6-${VERSION}
          \`\`\`

          Browse all OpenWhispr packages: <https://github.com/${REPO_OWNER}?tab=packages&q=openwhispr->

          ## Helm chart

          The matching chart release is published separately on tag \`openwhispr-server-<chart-version>\` and pulls these images by default. See [chart releases](https://github.com/Yambr/openwhispr-server/releases?q=openwhispr-server-) for the chart version that pins image \`${VERSION}\` as its \`appVersion\` (current default in this repo: chart with appVersion \`${chart_app_version}\`).

          \`\`\`bash
          helm pull oci://ghcr.io/${owner}/charts/openwhispr-server --version <chart-version>
          \`\`\`

          ## Install

          See [docs/operations.md](https://github.com/Yambr/openwhispr-server/blob/main/docs/operations.md) for the canonical installation runbook (single-VM docker-compose, Kubernetes Helm, and corporate-LiteLLM override).
          EOF
          echo "wrote body.md ($(wc -l < body.md) lines)"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenWhispr Server ${{ github.ref_name }}
          body_path: body.md
          draft: false
          prerelease: false
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
