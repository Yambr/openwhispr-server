name: UI-SPEC Lint

on:
  pull_request:
    paths:
      - ".planning/phases/07-frontend-ui-spec/UI-SPEC-*.md"
      - "tools/lint-ui-spec.ts"
      - "tools/lint-ui-spec.test.ts"
      - "tools/lint-ui-spec.config.ts"
      - "tools/lint-ui-spec/fixtures/**"
      - "apps/api/src/routes/**"
      - ".github/workflows/ui-spec.yml"
  push:
    branches: [main]
    paths:
      - ".planning/phases/07-frontend-ui-spec/UI-SPEC-*.md"
      - "tools/lint-ui-spec.ts"
      - "tools/lint-ui-spec.test.ts"
      - "tools/lint-ui-spec.config.ts"
      - "tools/lint-ui-spec/fixtures/**"
      - "apps/api/src/routes/**"
      - ".github/workflows/ui-spec.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-ui-spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ui-spec
      - run: pnpm test:lint-ui-spec
