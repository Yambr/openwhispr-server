# Phase 19a / SR-19a.4 — e2e-cjm BYOK-env overlay.
#
# The Makefile e2e-cjm target boots a hermetic compose project (`-p e2e-cjm`)
# without the ingress overlay (Traefik strips host ports; playwright needs
# direct localhost:4000 access). The BYOK guard introduced in Phase 14
# (assertBYOKConfig at apps/api/src/index.ts) refuses to boot the api when
# the ingress overlay is OFF AND `INGRESS_BASE_URL` env is unset (loud-fail
# `BYOK_INGRESS_REQUIRED`).
#
# Layered after embedded-litellm + storage in the e2e-cjm Makefile target,
# this override injects a hermetic `INGRESS_BASE_URL` so the BYOK guard
# accepts the configuration without requiring the real Traefik overlay.
# `http://localhost:4000` is the slim-core base host-port binding the api
# service exposes when the ingress overlay is OFF.

services:
  api:
    environment:
      INGRESS_BASE_URL: ${INGRESS_BASE_URL:-http://localhost:4000}
  worker:
    environment:
      INGRESS_BASE_URL: ${INGRESS_BASE_URL:-http://localhost:4000}
      # Phase 19a / SR-19a.4 — `compose/docker-compose.storage.yml` injects
      # S3_ENDPOINT only on the `api` service. The BYOK guard runs on both
      # api AND worker boot and refuses to start without S3_ENDPOINT when
      # the storage overlay is OFF — but the storage overlay IS layered in
      # the e2e-cjm Makefile target, just incompletely (api-only). Without
      # this worker override, the BYOK guard refuses worker boot in a
      # restart loop and password_reset jobs never get dispatched.
      # SERVER-ERRORS candidate: storage.yml should inject S3_ENDPOINT on
      # worker (mirroring api) — surfaced as a production-side gap but
      # patched here non-invasively per CLAUDE.md Hard Rule #1.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BUCKET: ${S3_BUCKET:-openwhispr}
