# Phase 08 / Plan 05 — load-test overlay.
#
# Layered ON TOP of docker-compose.yml when invoked as:
#   docker compose -f docker-compose.yml -f docker-compose.load-test.yml \
#       --profile load-test-mock     up -d   # mock-litellm flow (D-PROF-1)
#   docker compose -f docker-compose.yml -f docker-compose.load-test.yml \
#       --profile load-test-realistic up -d  # Speaches + Whisper flow (D-PROF-1)
#
# Default `docker compose up` NEVER loads this file, so the OSS quickstart
# profile is byte-identical to Phase 07.1 (D-PROF-2). The profile-lint
# integration test (tools/load-test/scripts/profile-lint.test.sh) verifies
# every must_have truth from plan 08-05.
#
# Wave 0 deliverables wired here:
#   * OPENWHISPR_DISABLE_RATE_LIMIT=1 (plan 08-01)         -> api.environment
#   * mock-litellm Fastify app (plan 08-03)                -> mock-litellm svc
#   * fd-probe.sh entrypoint shim (plan 08-04)             -> traefik image
#
# Wave 1 net-new tuning surface (this plan):
#   * 4 x PgBouncer scale-out, shared network alias `pgbouncer` (D-TUNE-1)
#   * Postgres max_connections=500 + load-test.conf overlay
#   * api/traefik ulimits.nofile soft=hard=65535 (D-TUNE-2)
#   * Mimir host port 9009 publication so k6 prometheus-rw can reach it
#   * Speaches CPU ASR/diarization (load-test-realistic only)
#
# NOTE on profile gating: docker-compose profiles are additive across files.
# Re-declaring an existing service WITHOUT a `profiles:` list inherits the
# base service's profiles unchanged. We EXTEND the profile list on services
# that need to appear under load-test profiles (api, traefik, postgres,
# mimir, valkey) by re-stating their profiles array (compose merges by
# concat). New services (mock-litellm, speaches, pgbouncer-1..4) declare
# their own profiles inline.

services:
  # ---------------------------------------------------------------------
  # Postgres: tuning overlay (max_connections=500 + load-test.conf).
  # ---------------------------------------------------------------------
  postgres:
    profiles: [default, db-only, load-test-mock, load-test-realistic]
    # Boot with the load-test conf overlay. The conf file is mounted RO
    # below; postgres `-c config_file` makes the daemon load it as the
    # active configuration (instead of the default in /var/lib/postgresql/data).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - max_connections=500
    volumes:
      - ./compose/postgres/load-test.conf:/etc/postgresql/postgresql.conf:ro

  # ---------------------------------------------------------------------
  # PgBouncer scale-out (D-TUNE-1 / RESEARCH §Pattern 3). Four identical
  # instances, each with DEFAULT_POOL_SIZE=100. All share the network alias
  # `pgbouncer` on openwhispr_internal so api/worker keep using the
  # canonical hostname; Docker DNS round-robins across the 4 container
  # IPs. Inline duplication is intentional — YAML anchor merge across
  # docker-compose versions is fragile (plan 08-05 known-pitfall A6).
  #
  # NOTE: The base `pgbouncer` service is OVERRIDDEN here (not a new
  # service) so api.depends_on.pgbouncer continues to resolve under
  # load-test profiles. We extend profiles to include both load-test
  # variants; the base service's [default, db-only] profiles are
  # preserved by compose merge concat. The other three replicas
  # (pgbouncer-2..4) are new services that share the `pgbouncer` DNS
  # alias for Docker's round-robin resolver.
  # ---------------------------------------------------------------------
  pgbouncer:
    image: openwhispr/pgbouncer:1.25.1-p0-admin
    build:
      context: ./compose/pgbouncer
      dockerfile: Dockerfile
    profiles: [default, db-only, load-test-mock, load-test-realistic]
    networks:
      openwhispr_internal:
        aliases:
          - pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_APP_USER}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_NAME: openwhispr
      # Plan 08.1-01 Task 4 — pgbouncer admin (SHOW POOLS) credentials.
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    volumes:
      - ./compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgbouncer-2:
    image: openwhispr/pgbouncer:1.25.1-p0-admin
    build:
      context: ./compose/pgbouncer
      dockerfile: Dockerfile
    profiles: [load-test-mock, load-test-realistic]
    networks:
      openwhispr_internal:
        aliases:
          - pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_APP_USER}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_NAME: openwhispr
      # Plan 08.1-01 Task 4 — pgbouncer admin (SHOW POOLS) credentials.
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    volumes:
      - ./compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgbouncer-3:
    image: openwhispr/pgbouncer:1.25.1-p0-admin
    build:
      context: ./compose/pgbouncer
      dockerfile: Dockerfile
    profiles: [load-test-mock, load-test-realistic]
    networks:
      openwhispr_internal:
        aliases:
          - pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_APP_USER}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_NAME: openwhispr
      # Plan 08.1-01 Task 4 — pgbouncer admin (SHOW POOLS) credentials.
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    volumes:
      - ./compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgbouncer-4:
    image: openwhispr/pgbouncer:1.25.1-p0-admin
    build:
      context: ./compose/pgbouncer
      dockerfile: Dockerfile
    profiles: [load-test-mock, load-test-realistic]
    networks:
      openwhispr_internal:
        aliases:
          - pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_APP_USER}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_NAME: openwhispr
      # Plan 08.1-01 Task 4 — pgbouncer admin (SHOW POOLS) credentials.
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    volumes:
      - ./compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------
  # Valkey: keep available under load-test profiles (api/worker depend on
  # it for rate-limit + idempotency caches; rate-limit is bypassed but the
  # client still pings on startup). Re-state profiles so the service
  # appears under load-test profiles.
  # ---------------------------------------------------------------------
  valkey:
    profiles: [default, load-test-mock, load-test-realistic]

  # ---------------------------------------------------------------------
  # api: D-TUNE-2 ulimits + OPENWHISPR_DISABLE_RATE_LIMIT=1 wiring.
  # ---------------------------------------------------------------------
  api:
    profiles: [default, load-test-mock, load-test-realistic]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # OPENWHISPR_DISABLE_RATE_LIMIT=1 unblocks the synthetic 1000-VU k6
      # ramp; plan 08-01 installs the bypass with explicit boot-log warning.
      # Default profile MUST NOT carry this — the load-test overlay scopes
      # it to load-test-mock + load-test-realistic only.
      OPENWHISPR_DISABLE_RATE_LIMIT: "1"
      # Phase 08-07 / D-LOAD-EV — load-test sign-up flow pre-provisions
      # 1000 users via Better Auth /api/auth/sign-up/email and reads the
      # session token directly off the response. With strict email
      # verification (production default), sign-up returns a synthetic
      # 200 with no token and provisionUsers() throws. Disable the
      # verification gate ONLY inside the load-test profile envelope —
      # production .env continues to use the production default.
      OPENWHISPR_DISABLE_EMAIL_VERIFICATION: "1"
      # Plan 08.1-01 Task 5 — SSRF allow-list for the bundled load-test
      # upstreams. The api's outbound dispatcher is default-deny; without
      # this, every /api/transcribe / /api/reason / /api/agent/stream call
      # is rejected with `Upstream blocked by SSRF policy` (502).
      # Mirrors the value documented in .env.example for normal dev usage,
      # but pinned in-compose so the load-test profile is reproducible
      # regardless of operator .env content.
      OUTBOUND_ALLOWED_HOSTS: "litellm,speaches,mailpit,openrouter.ai,api.tavily.com,search-api.aistudio.yandex.ru,api.pyannote.ai"
      # Plan 08.1-01 Task 5 — bypass the rfc1918/loopback IP block-list
      # for internal compose-DNS hostnames. Without this, the api's SSRF
      # dispatcher rejects every call to litellm/mock-litellm because
      # the bridge IP (e.g. 172.19.0.x) falls in RFC 1918 ranges.
      OUTBOUND_PRIVATE_HOST_ALLOWLIST: "litellm,speaches,mailpit,valkey,postgres,pgbouncer"

  # ---------------------------------------------------------------------
  # traefik: D-TUNE-2 ulimits + fd-probe entrypoint shim (plan 08-04).
  # Replaces `image: traefik:v3.6` with a thin Dockerfile that COPYs
  # fd-probe.sh next to the upstream `/entrypoint.sh`. The compose-level
  # entrypoint override wedges fd-probe.sh in front of `/entrypoint.sh`
  # so the container refuses to start if the soft fd limit < 65535.
  # ---------------------------------------------------------------------
  traefik:
    profiles: [default, load-test-mock, load-test-realistic]
    build:
      context: ./compose/traefik
      dockerfile: Dockerfile
    image: openwhispr-traefik-loadtest:dev
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    entrypoint: ["/usr/local/bin/fd-probe.sh", "/entrypoint.sh"]

  # ---------------------------------------------------------------------
  # mimir: publish 9009 on host so k6 `--out experimental-prometheus-rw`
  # can push run metrics. Localhost-bound to avoid accidental WAN exposure.
  # ---------------------------------------------------------------------
  mimir:
    profiles: [default, obs-only, load-test-mock, load-test-realistic]
    ports:
      - "127.0.0.1:9009:9009"

  # ---------------------------------------------------------------------
  # grafana: mount the k6 Prometheus dashboard (ID 19665) read-only into
  # /etc/grafana/dashboards/k6/, picked up by the `k6` provisioner in
  # compose/grafana/provisioning/dashboards/k6.yaml. Scoped to load-test
  # profiles so production grafana never carries it.
  # ---------------------------------------------------------------------
  grafana:
    profiles: [default, obs-only, load-test-mock, load-test-realistic]
    volumes:
      - ./compose/grafana/dashboards:/etc/grafana/dashboards/k6:ro

  # ---------------------------------------------------------------------
  # litellm OVERRIDE: under load-test profiles, the real LiteLLM service
  # is replaced with the mock-litellm Fastify app from plan 08-03
  # (compose/mock-litellm/). This isolates api+pooler+postgres latency
  # from external LLM latency (D-PROF-1).
  #
  # We extend the base `litellm` service's profiles to include both
  # load-test profiles AND swap the image/build/command/env/depends_on
  # so the same DNS name `litellm` resolves to the mock app on the
  # openwhispr_internal network. api's existing
  # LITELLM_BASE_URL=http://litellm:4000 keeps working transparently.
  #
  # Compose merge note: profiles arrays concat (overlay adds), image
  # field replaces, build field replaces, command replaces, environment
  # merges per-key, depends_on merges per-key. We set environment values
  # to empty so they no-op (LiteLLM-specific provider keys irrelevant to
  # the mock) and accept that the merged depends_on still references
  # postgres+migrate (both available under load-test profiles per the
  # extended profile arrays in docker-compose.yml).
  # ---------------------------------------------------------------------
  litellm:
    # Phase 08.5-01 Task 2: narrowed from [default, load-test-mock,
    # load-test-realistic] to [default, load-test-mock] so the realistic
    # profile's third overlay (docker-compose.load-test.realistic.yml)
    # can cleanly re-state the real LiteLLM image without colliding with
    # this mock override. Without the narrowing both overrides apply to
    # realistic and the merge order ends up mixing fields from each
    # (08.5-RESEARCH §P10).
    profiles: [default, load-test-mock]
    build:
      context: ./compose/mock-litellm
    image: openwhispr-mock-litellm:dev
    # Drop the LiteLLM upstream command/volume — mock-litellm has its own
    # node entrypoint baked into the image.
    command: []
    volumes: []
    environment:
      # Unset LiteLLM-specific env (no-op for the mock).
      LITELLM_MASTER_KEY: ""
      LITELLM_DATABASE_URL: ""
      DATABASE_URL: ""
      OPENROUTER_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health/liveliness"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # speaches: CPU-mode ASR + diarization for load-test-realistic. CPU
  # inference is slow (Whisper-large-v3 ~ 0.5 RTF on M-class CPU); the
  # 180s start_period buys time for model weights to be downloaded and
  # warmed at first boot. Pinned to a Speaches release that ships a
  # CPU-only image — the master-cuda-12.6.3 tag is GPU-only and will not
  # start on Docker Desktop without nvidia-container-runtime.
  #
  # WHISPER_MODEL is the canonical Systran/faster-whisper-large-v3 from
  # the Speaches default catalog. pyannote diarization runs in-process;
  # operators set HF_TOKEN in .env to authorise the pyannote-3.1 model
  # download (gated weights). Without HF_TOKEN, the realistic profile
  # still boots but diarization endpoints surface a 503 envelope.
  # ---------------------------------------------------------------------
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: [load-test-realistic]
    networks: [openwhispr_internal]
    environment:
      # Phase 08.5-01 Task 2: WHISPER_MODEL / WHISPER__MODEL are not
      # canonical Speaches env vars (verified against
      # github.com/speaches-ai/speaches/src/speaches/config.py per
      # 08.5-RESEARCH §G3 / §P1). The canonical mechanism is
      # PRELOAD_MODELS (comma-separated HF repo IDs) which causes
      # Speaches to download + warm the listed models AT BOOT instead
      # of lazily on the first request. Without this, the first
      # transcribe request blocks 30–120 s while Whisper loads, and the
      # smoke gate's iter-0 latency pollutes the entire run.
      PRELOAD_MODELS: "Systran/faster-whisper-large-v3,pyannote/speaker-diarization-community-1"
      HF_TOKEN: ${HF_TOKEN:-}
      ENABLE_UI: "false"
    healthcheck:
      # Phase 08.5 follow-up: latest-cpu image has curl (not wget) — use
      # curl --fail to keep semantics intact (exit non-zero on non-2xx).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Phase 08.5-01 Task 2: 600s start buffer for the first-ever boot
      # (~3 GB HF model download — Whisper-large-v3 + pyannote weights).
      # Subsequent boots find the weights cached in the named volume
      # and report healthy within the normal interval (08.5-RESEARCH §P8).
      start_period: 600s
    volumes:
      # Phase 08.5-01 Task 2: `latest-cpu` runs as the `ubuntu` user
      # (verified against the upstream compose.cpu.yaml — 08.5-RESEARCH
      # §G6 / §P2 / A5). Mounting `:/root/.cache/...` left the HF cache
      # unwritable by the in-container process, forcing a 3 GB
      # re-download on every `down + up`. The correct target is
      # `/home/ubuntu/.cache/huggingface`.
      - speaches_models:/home/ubuntu/.cache/huggingface
    restart: unless-stopped

volumes:
  speaches_models:
