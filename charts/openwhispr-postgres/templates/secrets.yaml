{{/*
Postgres-side Secrets — helm-values mode only.

In `helm-values` mode (and only when `secrets.cnpgManaged` is false):
  - Render `<fullname>-pg-owner` Secret consumed by CNPG bootstrap.initdb
    AND by the openwhispr-server migrate Job (via the server chart's
    `database.passwordSecretRef`).
  - Render `<fullname>-pg-app` Secret consumed by CNPG managed.roles AND
    by api/web/worker Deployments (via `database.passwordSecretRef`).

In `eso` mode the operator supplies both Secrets out-of-band via
External Secrets Operator — the CNPG Cluster + server chart refs still
resolve to the same names.

In `external-managed` mode the operator supplies the Secrets via
SealedSecrets / Vault / etc. — same name contract.

When `secrets.cnpgManaged` is true the chart SKIPS the inline render
even in helm-values mode; CNPG generates `<cluster>-superuser` and
`<cluster>-app` itself. The server chart must override
`database.passwordSecretRef.name` to the CNPG-emitted Secret name.
*/}}
{{- if and (eq .Values.secrets.mode "helm-values") (not .Values.secrets.cnpgManaged) -}}
{{- if not .Values.secrets.ownerPassword -}}
{{- fail "values.secrets.ownerPassword is required when secrets.mode=helm-values and secrets.cnpgManaged=false" -}}
{{- end -}}
{{- if not .Values.secrets.appPassword -}}
{{- fail "values.secrets.appPassword is required when secrets.mode=helm-values and secrets.cnpgManaged=false" -}}
{{- end -}}
{{- if or (eq .Values.secrets.ownerPassword "CHANGE_ME") (eq .Values.secrets.ownerPassword "changeme") -}}
{{- fail "values.secrets.ownerPassword is set to placeholder — refusing to install" -}}
{{- end -}}
{{- if or (eq .Values.secrets.appPassword "CHANGE_ME") (eq .Values.secrets.appPassword "changeme") -}}
{{- fail "values.secrets.appPassword is set to placeholder — refusing to install" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr-postgres.ownerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Keep the Secret across helm uninstall to prevent CNPG auth churn
    # when re-installing in the same namespace.
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.ownerRole | quote }}
  password: {{ .Values.secrets.ownerPassword | quote }}
  # Wire-compatible env name for the openwhispr-server migrate Job
  # `valueFrom: secretKeyRef:` lookup (matches the legacy monolith env
  # var POSTGRES_OWNER_PASSWORD).
  POSTGRES_OWNER_PASSWORD: {{ .Values.secrets.ownerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr-postgres.appSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.appRole | quote }}
  password: {{ .Values.secrets.appPassword | quote }}
  # Wire-compatible env name (POSTGRES_APP_PASSWORD).
  POSTGRES_APP_PASSWORD: {{ .Values.secrets.appPassword | quote }}
{{- end }}
{{- if and .Values.postgres.backup.enabled (eq .Values.secrets.mode "helm-values") }}
{{- if not .Values.postgres.backup.accessKeyId }}
{{- fail "values.postgres.backup.accessKeyId is required when backup.enabled=true and secrets.mode=helm-values" }}
{{- end }}
{{- if not .Values.postgres.backup.secretAccessKey }}
{{- fail "values.postgres.backup.secretAccessKey is required when backup.enabled=true and secrets.mode=helm-values" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr-postgres.backupSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ .Values.postgres.backup.accessKeyId | quote }}
  SECRET_ACCESS_KEY: {{ .Values.postgres.backup.secretAccessKey | quote }}
{{- end }}
