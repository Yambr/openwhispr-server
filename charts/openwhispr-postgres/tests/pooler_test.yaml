suite: openwhispr-postgres / Pooler
templates:
  - pooler.yaml
tests:
  - it: renders Pooler CR when pooler.enabled=true
    set:
      secrets.mode: external-managed
      pooler.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Pooler
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-postgres-pg-pooler
      - equal:
          path: spec.cluster.name
          value: RELEASE-NAME-openwhispr-postgres-pg
      - equal:
          path: spec.pgbouncer.poolMode
          value: transaction

  - it: skips Pooler render when pooler.enabled=false
    set:
      secrets.mode: external-managed
      pooler.enabled: false
    asserts:
      - hasDocuments:
          count: 0
