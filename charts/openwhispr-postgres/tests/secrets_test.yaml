suite: openwhispr-postgres / secrets matrix
templates:
  - secrets.yaml
tests:
  - it: renders owner + app Secret in helm-values mode
    set:
      secrets.mode: helm-values
      secrets.cnpgManaged: false
      secrets.ownerPassword: owner-test-1234567890
      secrets.appPassword: app-test-1234567890
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-postgres-pg-owner
      - documentIndex: 0
        equal:
          path: type
          value: kubernetes.io/basic-auth
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-postgres-pg-app

  - it: skips Secret render when cnpgManaged=true (helm-values mode)
    set:
      secrets.mode: helm-values
      secrets.cnpgManaged: true
    asserts:
      - hasDocuments:
          count: 0

  - it: skips Secret render in eso mode
    set:
      secrets.mode: eso
    asserts:
      - hasDocuments:
          count: 0

  - it: skips Secret render in external-managed mode
    set:
      secrets.mode: external-managed
    asserts:
      - hasDocuments:
          count: 0

  - it: schema rejects CHANGE_ME placeholder password
    set:
      secrets.mode: helm-values
      secrets.cnpgManaged: false
      secrets.ownerPassword: CHANGE_ME
      secrets.appPassword: app-test-1234567890
    asserts:
      - failedTemplate:
          errorPattern: "ownerPassword"
