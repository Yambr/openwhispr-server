apiVersion: v2
name: openwhispr-litellm
description: |
  OpenWhispr LiteLLM — bundled LiteLLM Proxy for the OpenWhispr server.
  Ships a single LiteLLM Deployment + Service + ConfigMap + master-key
  Secret. Install ONLY when the operator does not already run a LiteLLM
  Proxy (e.g. a corporate Wide-Moat / vLLM / Bedrock-fronting deployment)
  — otherwise the `openwhispr-server` chart supports BYOK LiteLLM via
  `litellm.baseUrl` / `litellm.masterKeySecretRef`. The chart wires the
  LiteLLM container to upstream LLM providers (OpenRouter / OpenAI /
  Anthropic / Bedrock / etc.) via env-injected API keys; see
  `docs/litellm-target-spec.md` for the canonical corporate-override
  contract this chart's defaults mirror.
type: application
# Version 1.0.0 marks the 3-chart-split first public release per
# .planning/quick/20260523-3chart-split/PLAN.md. NO Chart.yaml
# dependencies — this chart is a thin LiteLLM Proxy wrapper; upstream
# LLM providers are env-driven.
# WIP: 3-chart split scaffold only. Templates are NOT yet populated.
# Do NOT consume this chart yet. Stable umbrella chart remains
# charts/openwhispr/ (version 0.9.x).
version: 0.0.0-wip
appVersion: "0.0.0-wip"
kubeVersion: ">=1.28.0-0"
home: https://github.com/Yambr/openwhispr-server
sources:
  - https://github.com/Yambr/openwhispr-server
keywords:
  - openwhispr
  - litellm
  - llm
  - proxy
  - openai
  - anthropic
  - self-hosted
maintainers:
  - name: OpenWhispr Maintainers
    url: https://github.com/Yambr/openwhispr-server
annotations:
  category: AI
  licenses: FSL-1.1-ALv2
