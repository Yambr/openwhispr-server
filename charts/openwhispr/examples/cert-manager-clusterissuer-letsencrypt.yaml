# cert-manager ClusterIssuer — Let's Encrypt (HTTP-01 via Traefik).
#
# Apply BEFORE installing the openwhispr chart (or before first reconcile):
#   kubectl apply -f charts/openwhispr/examples/cert-manager-clusterissuer-letsencrypt.yaml
#
# Ships TWO ClusterIssuers in one file:
#   - letsencrypt-staging — for smoke-testing without rate-limit pain.
#   - letsencrypt-prod    — production issuer (default chart target via
#                            values.certManager.clusterIssuer).
#
# Switch the openwhispr chart between them with:
#   --set certManager.clusterIssuer=letsencrypt-staging   # smoke
#   --set certManager.clusterIssuer=letsencrypt-prod      # production
#
# HTTP-01 solver routes the ACME challenge through Traefik. Requires that
# port 80 is reachable from the public internet and the operator's
# Traefik install accepts HTTP-01 challenges (default Traefik 3 chart
# settings work out of the box).

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Operator: replace with a real address before applying.
    email: REPLACE_WITH_OPERATOR_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_OPERATOR_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
