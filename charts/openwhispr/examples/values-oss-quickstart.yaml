# DEPRECATED — Plan 11-01 promoted Variant A's canonical overlay to
# `values-embedded-litellm.yaml`. This file is preserved as a backward-
# compatible alias for operators with existing `-f values-oss-quickstart.yaml`
# install commands; new operators should reference `values-embedded-litellm.yaml`
# directly. Plan 11-04 may re-evaluate full removal after a deprecation
# window. The body below is functionally identical to the new file's
# Variant-A-only defaults (no HF_TOKEN, embedded LiteLLM, single-replica).
#
# OSS single-node quickstart overlay. Minimizes everything for a fresh kind
# / single-VM install. Pair with --set-string secrets.* on the CLI.
#
# Hard rules baked in:
#   - bundledAi.enabled=false (no GPU expected)
#   - observability.embedded=false (LGTM stack out-of-band per A3)
#   - postgres.replicas=1 (no HA quorum)
#   - valkey/minio single-replica
#   - secrets.mode=helm-values (no ESO dependency)

secrets:
  mode: helm-values

postgres:
  replicas: 1
  storageSize: 10Gi

valkey:
  architecture: standalone
  auth:
    enabled: false

minio:
  mode: standalone
  persistence:
    size: 10Gi

bundledAi:
  enabled: false

observability:
  embedded: false
  serviceMonitor:
    enabled: false
  otelCollector:
    enabled: false

api:
  replicas: 1
  autoscaling:
    enabled: false

web:
  replicas: 1

worker:
  autoscaling:
    enabled: false
