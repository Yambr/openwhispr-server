# Cloud HA overlay — defaults tuned for multi-AZ production K8s.
#
# Assumes:
#   - CNPG operator + Traefik 3 + cert-manager + LGTM stack already
#     installed at cluster scope.
#   - prometheus-adapter installed (for optional queueDepthMetric HPA).
#   - StorageClass with RWO across AZs (e.g. AWS gp3, GCP pd-balanced).
#   - GPU node pool with nvidia.com/gpu.present=true label (only if you
#     flip bundledAi.enabled=true; default is false).

secrets:
  mode: helm-values

# Plan 14-06 / BYOK-01 — flip the four slim-core toggles back to true so
# production K8s deployments keep their full HA topology. mailpit stays
# off (it's a dev-only SMTP inbox and has no Helm template anyway). The
# `observability.enabled` umbrella is set inside the consolidated
# `observability:` block below.
storage:
  enabled: true
tls:
  enabled: true
pooler:
  enabled: true
mailpit:
  enabled: false

postgres:
  replicas: 3
  storageSize: 100Gi
  backup:
    enabled: true

valkey:
  architecture: replication
  replica:
    replicaCount: 2
  auth:
    enabled: true

minio:
  mode: distributed
  replicas: 4
  persistence:
    size: 100Gi

observability:
  # Plan 14-06 / BYOK-01 — umbrella ON, AND-gating both sub-toggles.
  enabled: true
  embedded: false
  serviceMonitor:
    enabled: true
  collector:
    enabled: true
  lgtm:
    # Operators MUST point this at their cluster's OTLP/HTTP ingest endpoint
    # (Grafana Agent / OTel gateway / Tempo+Mimir+Loki front-door). The
    # placeholder satisfies values.schema.json — replace before install.
    endpoint: https://otlp.example.com

api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

web:
  replicas: 2

worker:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    queueDepthMetric: true

bundledAi:
  enabled: false

certManager:
  clusterIssuer: letsencrypt-prod
