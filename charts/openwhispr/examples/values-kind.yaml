# Phase 09.1 — local kind values overlay.
#
# Layered ON TOP of values.yaml ONLY for the kind smoke install. NOT a
# production preset — corporate operators use values-cloud-ha.yaml or
# values-corporate-litellm.yaml.
#
# Differences vs values-oss-quickstart.yaml:
#   * host.api / host.web pinned to "api.localtest.me" (resolves to
#     127.0.0.1 via the public localtest.me service — no /etc/hosts edit)
#   * certManager.clusterIssuer = "selfsigned-cluster-issuer" (matches
#     kind-bootstrap.sh; letsencrypt-prod requires public DNS + HTTP-01)
#   * postgres.imageName pinned via images we built locally + kind-loaded
#     (Plan 09.1-3 builds cnpg-postgres-17-pgpartman:dev locally first)
#   * litellm uses the mock-litellm:dev image already shipped in compose
#     so we don't need real API keys for the kind smoke
#   * secrets.* contain placeholder values that pass values.schema.json
#     `not/enum CHANGE_ME` (use the literal "kind-dev-…" prefix)

secrets:
  mode: helm-values
  litellmMasterKey: "kind-dev-litellm-master-key"
  openrouterApiKey: "kind-dev-openrouter"
  openaiApiKey: "kind-dev-openai"
  pyannoteApiKey: "kind-dev-pyannote"
  hfToken: "kind-dev-hf"
  postgresOwnerPassword: "kind-dev-postgres-owner"
  pgbouncerAdminPassword: "kind-dev-pgbouncer-admin"
  betterAuthSecret: "kind-dev-better-auth-secret-must-be-long-enough-32"

host:
  api: api.localtest.me
  web: web.localtest.me

certManager:
  enabled: true
  clusterIssuer: selfsigned-cluster-issuer

postgres:
  replicas: 1
  storageSize: 1Gi
  # Image override happens via --set on the CLI after `kind load docker-image`
  # — see Plan 09.1-3 task notes.

valkey:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi

minio:
  mode: standalone
  persistence:
    size: 1Gi
  auth:
    rootUser: "minio"
    rootPassword: "kind-dev-minio-root"

bundledAi:
  enabled: false

observability:
  embedded: false
  serviceMonitor:
    enabled: false
  otelCollector:
    enabled: false

api:
  replicas: 1
  autoscaling:
    enabled: false

web:
  replicas: 1

worker:
  autoscaling:
    enabled: false

# Use mock-litellm:dev (compose-built) for the kind smoke — no paid keys
# needed; full LiteLLM end-to-end is covered by Phase 8.5 baseline.
litellm:
  image:
    repository: openwhispr-mock-litellm
    tag: dev
    pullPolicy: IfNotPresent

testProbe:
  enabled: true
  image:
    repository: ghcr.io/openwhispr/openwhispr-test-probe
    tag: "0.9.0-rc1"
    pullPolicy: IfNotPresent
  sloDeadlineMs: 300000
