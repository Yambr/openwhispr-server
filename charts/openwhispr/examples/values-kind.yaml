# Phase 09.1 — local kind values overlay.
#
# Layered ON TOP of values.yaml ONLY for the kind smoke install. NOT a
# production preset — corporate operators use values-cloud-ha.yaml or
# values-corporate-litellm.yaml.
#
# Differences vs values-oss-quickstart.yaml:
#   * host.api / host.web pinned to "api.localtest.me" (resolves to
#     127.0.0.1 via the public localtest.me service — no /etc/hosts edit)
#   * certManager.clusterIssuer = "selfsigned-cluster-issuer" (matches
#     kind-bootstrap.sh; letsencrypt-prod requires public DNS + HTTP-01)
#   * postgres.imageName pinned via images we built locally + kind-loaded
#     (Plan 09.1-3 builds cnpg-postgres-17-pgpartman:dev locally first)
#   * litellm uses the mock-litellm:dev image already shipped in compose
#     so we don't need real API keys for the kind smoke
#   * secrets.* contain placeholder values that pass values.schema.json
#     `not/enum CHANGE_ME` (use the literal "kind-dev-…" prefix)

secrets:
  mode: helm-values
  litellmMasterKey: "kind-dev-litellm-master-key"
  openrouterApiKey: "kind-dev-openrouter"
  openaiApiKey: "kind-dev-openai"
  pyannoteApiKey: "kind-dev-pyannote"
  hfToken: "kind-dev-hf"
  postgresOwnerPassword: "kind-dev-postgres-owner"
  pgbouncerAdminPassword: "kind-dev-pgbouncer-admin"
  betterAuthSecret: "kind-dev-better-auth-secret-must-be-long-enough-32"
  # Finding 09.1-F22 — 7 extra secrets the API ENTRYPOINT validator
  # (apps/api/scripts/check-default-secrets.ts) demands.
  postgresAppPassword: "kind-dev-postgres-app"
  valkeyPassword: "kind-dev-valkey"
  minioRootPassword: "kind-dev-minio-root"
  traefikAdminPassword: "kind-dev-traefik-admin"
  grafanaAdminPassword: "kind-dev-grafana-admin"
  # base64url(32 random bytes) for MASTER_KEK (EnvKeyProvider validates length).
  # Generated once for the kind smoke profile — NOT a production secret.
  masterKek: "v5ux8tbIGXCoCeqi16dtiRVMVDvR4mRTojqRlL2lV-w"
  backupAgeIdentity: "AGE-SECRET-KEY-1KIND_DEV_PLACEHOLDER_NOT_FOR_PRODUCTION_USE"

host:
  api: api.localtest.me
  web: web.localtest.me

# kind-e2e-verify-20260523 — byok-guard storageRow ALWAYS requires
# S3_ENDPOINT (no NODE_ENV gate). Enable the MinIO sub-chart so the
# chart renders the S3_* env block in api/worker Deployments.
storage:
  enabled: true

# kind-e2e-verify-20260523 — api/worker DATABASE_URL helper hardcodes
# `<fullname>-pg-pooler` (CNPG Pooler CRD) which is a separate sub-
# resource gated on pooler.enabled. With pooler.enabled=false (slim
# default) the helper produces a hostname that DNS-fails at runtime
# (ENOTFOUND openwhispr-pg-pooler -> 500 on every sign-up/sign-in).
# Enable Pooler in kind smoke so sign-up resolves to a real Service.
# Cloud-HA / corporate overlays already set this to true.
pooler:
  enabled: true

# kind-e2e-verify-20260523 — migrate Job's image (ghcr.io/Yambr/
# openwhispr-migrate:1.0.1) is not publicly available; the kind
# bringup script never builds + loads a dedicated migrate image. The api
# image already bundles /app/packages/data/dist/migrate.cjs (used by the
# migrate-job's `command:` which fully overrides the api ENTRYPOINT
# chain). Reuse the locally-loaded openwhispr-api:kind-local image for
# the migrate Job so kind can pull-policy: IfNotPresent and skip the
# 403 from ghcr.io. Production overlays keep the dedicated migrate
# image. ALSO pin top-level image.pullPolicy to IfNotPresent so all
# kind-local images survive helm upgrade rollouts.
image:
  pullPolicy: IfNotPresent
  api:
    repository: openwhispr-api
    tag: kind-local
  worker:
    repository: openwhispr-worker
    tag: kind-local
  web:
    repository: openwhispr-web
    tag: kind-local
  migrate:
    repository: openwhispr-api
    tag: kind-local

certManager:
  enabled: true
  clusterIssuer: selfsigned-cluster-issuer

postgres:
  replicas: 1
  storageSize: 1Gi
  # kind-loaded locally-built image (see Plan 09.1-3 prep — `docker tag`
  # + `kind load docker-image`). Matches the `:17.X-*` schema-validator
  # regex enforced in postgres-cluster.yaml.
  imageName: ghcr.io/Yambr/cnpg-postgres-17-pgpartman:17.5

# Finding 09.1-F6 — Bitnami's 2024 Secure Images migration removed
# point-version tags from the canonical `bitnami/*` namespace. The
# free images now live in `bitnamilegacy/*`. We re-point all
# sub-chart images so the kind smoke install actually pulls.
valkey:
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/valkey
    tag: 8.1.3-debian-12-r3
  master:
    persistence:
      size: 1Gi

minio:
  mode: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: 2025.7.23-debian-12-r3
  console:
    image:
      registry: docker.io
      repository: bitnamilegacy/minio-object-browser
      tag: 2.0.2-debian-12-r3
  persistence:
    size: 1Gi
  auth:
    rootUser: "minio"
    rootPassword: "kind-dev-minio-root"

bundledAi:
  enabled: false

observability:
  embedded: false
  serviceMonitor:
    enabled: false
  otelCollector:
    enabled: false

worker:
  replicas: 1
  env:
    # kind-e2e-verify-20260523 — same byok-guard SMTP gate as api.
    nodeEnv: development

api:
  replicas: 1
  autoscaling:
    enabled: false
  env:
    # kind-e2e-verify-20260523 — byok-guard devToolsRow demands SMTP_HOST
    # when NODE_ENV=production (packages/byok-guard/src/index.ts:281).
    # The kind smoke profile has no mail backend wired; flip to
    # `development` so the dev-tools row short-circuits cleanly. Production
    # overlays keep the values.yaml default `production`.
    nodeEnv: development
    # Phase 09.2 F35 — helm test probe runs synthetic signup with no
    # inbox; verify-email step would otherwise block the SLO probe.
    disableEmailVerification: true
    # kind-e2e-verify-20260523 — byok-guard ingressRow requires
    # INGRESS_TLS_CERT_PATH when INGRESS_BASE_URL starts with `https://`
    # (packages/byok-guard/src/index.ts:239). In kind smoke we have
    # no real TLS chain — Traefik terminates with cert-manager
    # self-signed but the api process itself does not consume a
    # cert path. Pin INGRESS_BASE_URL to plain http:// so the ingress
    # row short-circuits cleanly. Production overlays MUST use https.
    ingressBaseUrl: "http://api.localtest.me"

# Finding 09.1-F21 — bootstrap script installs Traefik 33.2.1 without
# exposing the :9000 admin API (Traefik chart default closes it). The
# api Deployment's `traefik-preflight` init container curls
# `:9000/api/entrypoints` and times out. For the kind smoke we skip
# the preflight — production operators should install Traefik with
# `--set ports.traefik.expose.default=true --set api.insecure=true`
# and keep preflightCheck=true (default).
ingress:
  preflightCheck: false

web:
  replicas: 1

  autoscaling:
    enabled: false

# Use mock-litellm:dev (compose-built) for the kind smoke — no paid keys
# needed; full LiteLLM end-to-end is covered by Phase 8.5 baseline.
# Mock entrypoint is `node dist/server-bootstrap.js` with no CLI flags,
# so the F11-introduced .Values.litellm.args is emptied here.
litellm:
  image:
    repository: openwhispr-mock-litellm
    tag: dev
    pullPolicy: IfNotPresent
  args: []

testProbe:
  enabled: true
  image:
    repository: ghcr.io/Yambr/openwhispr-test-probe
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  sloDeadlineMs: 300000
  # Finding 09.1-F34 — probe runs inside the cluster; host.api
  # (api.localtest.me) resolves to 127.0.0.1 which is the probe Pod's
  # own loopback, not the api Service. Override to the in-cluster
  # service name. Production operators on a real cluster keep the
  # default (https://api.<host.api>) for full ingress path validation.
  target: "http://openwhispr-api:3000"
