suite: web — Deployment + Service (Next.js 15 SSR)
templates:
  - web-deployment.yaml
  - web-service.yaml
tests:
  - it: renders web Deployment with container name web, port 3001
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].name
          value: web
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3001

  - it: web Deployment env carries HOSTNAME=0.0.0.0 + PORT=3001 + INTERNAL_API_URL
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="HOSTNAME")].value
          value: 0.0.0.0
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="PORT")].value
          value: "3001"
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="INTERNAL_API_URL")].value
          pattern: "RELEASE-NAME-openwhispr-api:3000"

  - it: web Deployment NEXT_PUBLIC_API_BASE_URL uses host.api value
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      host:
        api: openwhispr.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="NEXT_PUBLIC_API_BASE_URL")].value
          value: https://openwhispr.example.com

  - it: web Deployment carries wait-for-migrate then secret-presence-probe initContainers (Finding 09.1-F3)
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-migrate
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe

  - it: web Service ClusterIP port 3001
    template: web-service.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 3001
      - equal:
          path: spec.ports[0].name
          value: http

  # Plan 11-01 — secret-presence-probe must source env-name list from helper.
  - it: web secret-presence-probe omits HF_TOKEN when bundledAi.enabled=false (Variant A)
    template: web-deployment.yaml
    set:
      bundledAi:
        enabled: false
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - notMatchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "HF_TOKEN"

  - it: web secret-presence-probe includes HF_TOKEN when bundledAi.enabled=true (Variant C)
    template: web-deployment.yaml
    set:
      bundledAi:
        enabled: true
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "HF_TOKEN"

  - it: web Deployment honors web.replicas override
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      web:
        replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  # SR-20.3 — web Deployment must declare a startupProbe with a 300s
  # boot budget on /api/health:3001 (Next.js standalone health route).
  # Closes audit B1.
  - it: web Deployment declares startupProbe failureThreshold 30 + period 10s on /api/health (SR-20.3)
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /api/health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 3001
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  # SR-20.4 — web Deployment must declare topologySpreadConstraints on
  # kubernetes.io/hostname. Closes audit B2.
  - it: web Deployment declares topologySpread maxSkew 1 on hostname (SR-20.4)
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/component"]
          value: web

  # SR-20.5 — web Deployment full-hardening. Same pod+container hardening
  # as api, plus a 256Mi emptyDir at /app/apps/web/.next/cache because the
  # Next.js standalone server writes the runtime ISR cache there (would
  # crash with EROFS on a read-only rootfs without an explicit writable mount).
  - it: web Deployment pod-level securityContext is full-hardening (SR-20.5)
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: web Deployment container-level securityContext is full-hardening (SR-20.5)
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: web Deployment mounts emptyDir at /tmp + /app/apps/web/.next/cache (SR-20.5)
    template: web-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: next-cache
            mountPath: /app/apps/web/.next/cache
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 64Mi
      - contains:
          path: spec.template.spec.volumes
          content:
            name: next-cache
            emptyDir:
              sizeLimit: 256Mi
