suite: pooler — CNPG Pooler CR (A6)
templates:
  - pooler.yaml
tests:
  # Plan 14-06 — `pooler.enabled` flipped from true→false in slim-core defaults.
  # The renders-Pooler case must now explicitly opt in by setting pooler.enabled=true.
  - it: default render — pooler renders zero docs (slim-core default; pooler.enabled=false)
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Pooler bound to {fullname}-pg with transaction mode (explicit pooler.enabled=true)
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      pooler:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Pooler
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-pg-pooler
      - equal:
          path: spec.cluster.name
          value: RELEASE-NAME-openwhispr-pg
      - equal:
          path: spec.instances
          value: 2
      - equal:
          path: spec.type
          value: rw
      - equal:
          path: spec.pgbouncer.poolMode
          value: transaction
      - equal:
          path: spec.pgbouncer.parameters.default_pool_size
          value: "100"
      - equal:
          path: spec.pgbouncer.parameters.max_client_conn
          value: "1000"
      - equal:
          path: spec.pgbouncer.parameters.reserve_pool_size
          value: "20"

  - it: enables PodMonitor when observability umbrella + serviceMonitor are both on
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      pooler:
        enabled: true
      observability:
        enabled: true
        serviceMonitor:
          enabled: true
    asserts:
      - equal:
          path: spec.monitoring.enablePodMonitor
          value: true

  - it: emits nothing when pooler.enabled=false
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      pooler:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: cloud-ha overlay bumps max_client_conn to 2000
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      pooler:
        enabled: true
        maxClientConn: "2000"
    asserts:
      - equal:
          path: spec.pgbouncer.parameters.max_client_conn
          value: "2000"
