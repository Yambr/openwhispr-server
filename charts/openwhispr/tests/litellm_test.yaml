suite: litellm — Deployment + Service + ConfigMap (embedded ⇄ external)
templates:
  - litellm-deployment.yaml
  - litellm-service.yaml
  - configmap-litellm.yaml
tests:
  - it: renders LiteLLM Deployment with image pin v1.83.14-stable when embedded=true
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].name
          value: litellm
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/berriai/litellm:main-v1.83.14-stable
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 4000

  - it: LiteLLM Deployment carries envFrom secrets (provider keys)
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-openwhispr-secrets

  - it: LiteLLM Deployment mounts configmap at /app/config.yaml
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/config.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: config.yaml

  - it: LiteLLM Deployment command points at /app/config.yaml and port 4000
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config
      - contains:
          path: spec.template.spec.containers[0].args
          content: /app/config.yaml

  - it: LiteLLM has /health/liveliness probe
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health/liveliness

  - it: LiteLLM Deployment omits render when embedded=false
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      litellm:
        embedded: false
        externalBaseUrl: https://corp.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: LiteLLM Service ClusterIP port 4000
    template: litellm-service.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 4000
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openwhispr-litellm

  - it: LiteLLM Service omits render when embedded=false
    template: litellm-service.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      litellm:
        embedded: false
        externalBaseUrl: https://corp.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: configmap-litellm renders model_list passthrough
    template: configmap-litellm.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      litellm:
        embedded: true
        config:
          model_list:
            - model_name: whisper-1
              litellm_params:
                model: openai/whisper-1
          router_settings:
            timeout: 60
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["config.yaml"]
          pattern: "whisper-1"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "timeout: 60"

  # Plan 11-01 — secret-presence-probe must source env-name list from helper.
  - it: litellm secret-presence-probe omits HF_TOKEN when bundledAi.enabled=false (Variant A)
    template: litellm-deployment.yaml
    set:
      bundledAi:
        enabled: false
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: secret-presence-probe
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "HF_TOKEN"

  - it: litellm secret-presence-probe includes HF_TOKEN when bundledAi.enabled=true (Variant C)
    template: litellm-deployment.yaml
    set:
      bundledAi:
        enabled: true
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: secret-presence-probe
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "HF_TOKEN"

  - it: configmap-litellm omits render when embedded=false
    template: configmap-litellm.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      litellm:
        embedded: false
        externalBaseUrl: https://corp.example.com
    asserts:
      - hasDocuments:
          count: 0

  # SR-20.3 — LiteLLM Deployment must declare a startupProbe with a 300s
  # boot budget on /health/liveliness:4000 (matches existing readiness
  # probe target; LiteLLM's real /health/readiness path is unavailable on
  # mock-litellm so liveliness is reused). Closes audit B1.
  - it: LiteLLM Deployment declares startupProbe failureThreshold 30 + period 10s on /health/liveliness (SR-20.3)
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health/liveliness
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 4000
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  # SR-20.4 — LiteLLM Deployment must declare topologySpreadConstraints
  # on kubernetes.io/hostname. Closes audit B2.
  - it: LiteLLM Deployment declares topologySpread maxSkew 1 on hostname (SR-20.4)
    template: litellm-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels."app.kubernetes.io/component"
          value: litellm
