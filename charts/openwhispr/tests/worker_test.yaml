suite: worker — Deployment + Service + HPA + PDB + ServiceMonitor + ConfigMap
templates:
  - worker-deployment.yaml
  - worker-service.yaml
  - worker-hpa.yaml
  - worker-pdb.yaml
  - worker-servicemonitor.yaml
  - configmap-worker.yaml
tests:
  - it: renders worker Deployment with container name worker and port 3002 health
    template: worker-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].name
          value: worker
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3002
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: RELEASE-NAME-openwhispr-secrets

  - it: worker Deployment wires DATABASE_URL through the Pooler RW
    template: worker-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].value
          pattern: "RELEASE-NAME-openwhispr-pg-pooler:5432"

  - it: worker Deployment carries wait-for-migrate then secret-presence-probe initContainers (Finding 09.1-F3)
    template: worker-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-migrate
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe

  # Plan 11-01 — secret-presence-probe must source env-name list from helper.
  - it: worker secret-presence-probe omits HF_TOKEN when bundledAi.enabled=false (Variant A)
    template: worker-deployment.yaml
    set:
      bundledAi:
        enabled: false
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - notMatchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "HF_TOKEN"

  - it: worker secret-presence-probe includes HF_TOKEN when bundledAi.enabled=true (Variant C)
    template: worker-deployment.yaml
    set:
      bundledAi:
        enabled: true
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: secret-presence-probe
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "HF_TOKEN"

  # Finding 09.1-F32 — worker is a pure BullMQ consumer with no HTTP
  # server. The original /healthz probe was fiction (connection refused).
  # Switched to exec probe that confirms the node entrypoint is alive.
  - it: worker Deployment readiness/liveness use exec probe (no HTTP server)
    template: worker-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - exists:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
      - exists:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: "pgrep.*node /app/dist/index.js"

  - it: worker Service is headless (clusterIP None) for per-pod scrape
    template: worker-service.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.ports[0].port
          value: 3002

  - it: worker HPA renders CPU 70% only when queueDepthMetric=false (default)
    template: worker-hpa.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].type
          value: Resource
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70

  - it: worker HPA appends External metric when queueDepthMetric=true
    template: worker-hpa.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      worker:
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 30
          targetCPUUtilizationPercentage: 70
          queueDepthMetric: true
          queueDepthAverageValue: "5"
          queueDepthQueue: "transcription"
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1].type
          value: External
      - equal:
          path: spec.metrics[1].external.metric.name
          value: bullmq_queue_waiting_total
      - equal:
          path: spec.metrics[1].external.metric.selector.matchLabels.queue
          value: transcription
      - equal:
          path: spec.metrics[1].external.target.averageValue
          value: "5"

  - it: worker HPA omits render when autoscaling.enabled=false
    template: worker-hpa.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      worker:
        autoscaling:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: worker PDB renders minAvailable 1 when minReplicas >= 2
    template: worker-pdb.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      worker:
        autoscaling:
          enabled: true
          minReplicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  # Plan 14-06 — observability.enabled umbrella AND-gates the sub-toggle.
  - it: worker ServiceMonitor renders only when observability umbrella + serviceMonitor are both on
    template: worker-servicemonitor.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
      observability:
        enabled: true
        serviceMonitor:
          enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].port
          value: http

  - it: configmap-worker renders OTel + NODE_ENV
    template: configmap-worker.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.NODE_ENV
          value: production
      - equal:
          path: data.OTEL_SERVICE_NAME
          value: openwhispr-worker

  # SR-20.3 — worker Deployment must declare a startupProbe with a 300s
  # boot budget; reuses the pgrep exec shape of its readiness/liveness
  # probes (no HTTP server in worker — pure BullMQ consumer). Closes B1.
  - it: worker Deployment declares startupProbe with pgrep exec + failureThreshold 30 (SR-20.3)
    template: worker-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - exists:
          path: spec.template.spec.containers[0].startupProbe.exec.command
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.httpGet
      - matchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: "pgrep.*node /app/dist/index.js"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10

  # SR-20.4 — worker Deployment must declare topologySpreadConstraints
  # on kubernetes.io/hostname. Closes audit B2.
  - it: worker Deployment declares topologySpread maxSkew 1 on hostname (SR-20.4)
    template: worker-deployment.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - lengthEqual:
          path: spec.template.spec.topologySpreadConstraints
          count: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels."app.kubernetes.io/component"
          value: worker
