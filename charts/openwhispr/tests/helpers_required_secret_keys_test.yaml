suite: helpers — openwhispr.requiredSecretKeys (Plan 11-01)
# Renders a probe ConfigMap (_probe-helpers.yaml) whose data.requiredSecretKeys
# field is the literal output of `include "openwhispr.requiredSecretKeys" .`.
# Probe template is gated behind .Values.helperProbe.enabled (default false)
# so it never renders in production installs — only this unittest flips it on.
#
# RED on first commit: the helper does not exist yet AND the probe template
# does not exist yet → helm render fails for both cases below.
templates:
  - _probe-helpers.yaml
tests:
  - it: helper output equals the 13 core keys when bundledAi.enabled=false (Variant A)
    template: _probe-helpers.yaml
    set:
      helperProbe:
        enabled: true
      bundledAi:
        enabled: false
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.requiredSecretKeys
          value: "LITELLM_MASTER_KEY OPENROUTER_API_KEY OPENAI_API_KEY POSTGRES_OWNER_PASSWORD POSTGRES_APP_PASSWORD PGBOUNCER_ADMIN_PASSWORD BETTER_AUTH_SECRET VALKEY_PASSWORD MINIO_ROOT_PASSWORD TRAEFIK_ADMIN_PASSWORD GRAFANA_ADMIN_PASSWORD MASTER_KEK BACKUP_AGE_IDENTITY"

  - it: helper output appends HF_TOKEN when bundledAi.enabled=true (Variant C)
    template: _probe-helpers.yaml
    set:
      helperProbe:
        enabled: true
      bundledAi:
        enabled: true
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data.requiredSecretKeys
          pattern: " HF_TOKEN$"
      - equal:
          path: data.requiredSecretKeys
          value: "LITELLM_MASTER_KEY OPENROUTER_API_KEY OPENAI_API_KEY POSTGRES_OWNER_PASSWORD POSTGRES_APP_PASSWORD PGBOUNCER_ADMIN_PASSWORD BETTER_AUTH_SECRET VALKEY_PASSWORD MINIO_ROOT_PASSWORD TRAEFIK_ADMIN_PASSWORD GRAFANA_ADMIN_PASSWORD MASTER_KEK BACKUP_AGE_IDENTITY HF_TOKEN"
