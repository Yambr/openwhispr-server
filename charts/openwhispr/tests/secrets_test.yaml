suite: secrets — fail gates + ESO path
templates:
  - secrets.yaml
  - externalsecret.yaml
tests:
  - it: fails when litellmMasterKey is empty (RED gate, render-time)
    template: secrets.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: ""
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
    asserts:
      - failedTemplate:
          errorMessage: "values.secrets.litellmMasterKey is required — refusing to install with default/empty secret (DEPLOY-03, T-09-01)"

  - it: rejects CHANGE_ME placeholder at schema-validation layer (defense in depth)
    template: secrets.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "CHANGE_ME"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
        postgresAppPassword: "valid-pg-app-1234567890abcdefghij1234"
        valkeyPassword: "valid-valkey-1234567890abcdefghij1234"
        minioRootPassword: "valid-minio-1234567890abcdefghij1234"
        traefikAdminPassword: "valid-traefik-1234567890abcdefghij12"
        grafanaAdminPassword: "valid-grafana-1234567890abcdefghij12"
        masterKek: "v5ux8tbIGXCoCeqi16dtiRVMVDvR4mRTojqRlL2lV-w"
        backupAgeIdentity: "AGE-SECRET-KEY-1TESTONLY1234567890abcdefghij"
    asserts:
      - failedTemplate:
          errorPattern: "openrouterApiKey"

  # Finding 09.1-F22 — secret rendering now covers 15 keys (was 8). The
  # 7 additional keys are demanded by apps/api/scripts/check-default-secrets.ts
  # — without them api/web/worker CrashLoopBackOff on every install.
  - it: renders inline Secret with all 15 env keys and keep annotation when all secrets valid
    template: secrets.yaml
    set:
      # Plan 11-01 — HF_TOKEN renders only under Variant C (bundledAi=true);
      # this legacy "15 keys" case now sets bundledAi.enabled=true so the
      # assertion below for stringData.HF_TOKEN continues to hold.
      bundledAi:
        enabled: true
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
        postgresAppPassword: "valid-pg-app-1234567890abcdefghij1234"
        valkeyPassword: "valid-valkey-1234567890abcdefghij1234"
        minioRootPassword: "valid-minio-1234567890abcdefghij1234"
        traefikAdminPassword: "valid-traefik-1234567890abcdefghij12"
        grafanaAdminPassword: "valid-grafana-1234567890abcdefghij12"
        masterKek: "v5ux8tbIGXCoCeqi16dtiRVMVDvR4mRTojqRlL2lV-w"
        backupAgeIdentity: "AGE-SECRET-KEY-1TESTONLY1234567890abcdefghij"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: stringData.LITELLM_MASTER_KEY
          value: "valid-litellm-1234567890abcdefghij12345"
      - equal:
          path: stringData.OPENROUTER_API_KEY
          value: "valid-openrouter-key-1234567890abcdefghij"
      - equal:
          path: stringData.BETTER_AUTH_SECRET
          value: "valid-better-auth-1234567890abcdefghij12"
      - exists:
          path: stringData.OPENAI_API_KEY
      - exists:
          path: stringData.PYANNOTE_API_KEY
      - exists:
          path: stringData.HF_TOKEN
      - exists:
          path: stringData.POSTGRES_OWNER_PASSWORD
      - exists:
          path: stringData.PGBOUNCER_ADMIN_PASSWORD
      # F22 7 new keys
      - exists:
          path: stringData.POSTGRES_APP_PASSWORD
      - exists:
          path: stringData.VALKEY_PASSWORD
      - exists:
          path: stringData.MINIO_ROOT_PASSWORD
      - exists:
          path: stringData.TRAEFIK_ADMIN_PASSWORD
      - exists:
          path: stringData.GRAFANA_ADMIN_PASSWORD
      - exists:
          path: stringData.MASTER_KEK
      - exists:
          path: stringData.BACKUP_AGE_IDENTITY

  - it: renders ExternalSecret in eso mode pointing at configured store
    template: externalsecret.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
          storeKind: ClusterSecretStore
          path: openwhispr
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef.name
          value: vault-clusterstore
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.target.template.metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: skips inline Secret entirely when mode=eso (no fail even with empty values)
    template: secrets.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
        litellmMasterKey: ""
        openrouterApiKey: ""
        openaiApiKey: ""
        pyannoteApiKey: ""
        hfToken: ""
        postgresOwnerPassword: ""
        pgbouncerAdminPassword: ""
        betterAuthSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: fails ESO when storeRef is unset
    template: externalsecret.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: ""
    asserts:
      - failedTemplate:
          errorMessage: "values.secrets.external.storeRef is required when secrets.mode=eso"

  # Plan 11-01 — Variant A: HF_TOKEN must be absent from the rendered Secret
  # when bundledAi.enabled=false. RED until secrets.yaml consumes the
  # openwhispr.requiredSecretKeys helper.
  - it: Variant A Secret omits HF_TOKEN when bundledAi.enabled=false
    template: secrets.yaml
    set:
      bundledAi:
        enabled: false
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        hfToken: ""
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
        postgresAppPassword: "valid-pg-app-1234567890abcdefghij1234"
        valkeyPassword: "valid-valkey-1234567890abcdefghij1234"
        minioRootPassword: "valid-minio-1234567890abcdefghij1234"
        traefikAdminPassword: "valid-traefik-1234567890abcdefghij12"
        grafanaAdminPassword: "valid-grafana-1234567890abcdefghij12"
        masterKek: "v5ux8tbIGXCoCeqi16dtiRVMVDvR4mRTojqRlL2lV-w"
        backupAgeIdentity: "AGE-SECRET-KEY-1TESTONLY1234567890abcdefghij"
    asserts:
      - isKind:
          of: Secret
      - notExists:
          path: stringData.HF_TOKEN

  - it: Variant C Secret contains HF_TOKEN when bundledAi.enabled=true
    template: secrets.yaml
    set:
      bundledAi:
        enabled: true
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        hfToken: "hf_abc1234567890abcdefghij"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
        postgresAppPassword: "valid-pg-app-1234567890abcdefghij1234"
        valkeyPassword: "valid-valkey-1234567890abcdefghij1234"
        minioRootPassword: "valid-minio-1234567890abcdefghij1234"
        traefikAdminPassword: "valid-traefik-1234567890abcdefghij12"
        grafanaAdminPassword: "valid-grafana-1234567890abcdefghij12"
        masterKek: "v5ux8tbIGXCoCeqi16dtiRVMVDvR4mRTojqRlL2lV-w"
        backupAgeIdentity: "AGE-SECRET-KEY-1TESTONLY1234567890abcdefghij"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.HF_TOKEN
          value: "hf_abc1234567890abcdefghij"
