suite: secrets — fail gates + ESO path
templates:
  - secrets.yaml
  - externalsecret.yaml
tests:
  - it: fails when litellmMasterKey is empty (RED gate, render-time)
    template: secrets.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: ""
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
    asserts:
      - failedTemplate:
          errorMessage: "values.secrets.litellmMasterKey is required — refusing to install with default/empty secret (DEPLOY-03, T-09-01)"

  - it: rejects CHANGE_ME placeholder at schema-validation layer (defense in depth)
    template: secrets.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "CHANGE_ME"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
    asserts:
      - failedTemplate:
          errorPattern: "openrouterApiKey"

  - it: renders inline Secret with all 8 env keys and keep annotation when all secrets valid
    template: secrets.yaml
    set:
      secrets:
        mode: helm-values
        litellmMasterKey: "valid-litellm-1234567890abcdefghij12345"
        openrouterApiKey: "valid-openrouter-key-1234567890abcdefghij"
        openaiApiKey: "valid-openai-key-1234567890abcdefghij1234"
        pyannoteApiKey: "valid-pyannote-key-1234567890abcdefghij"
        hfToken: "valid-hf-token-1234567890abcdefghij12345"
        postgresOwnerPassword: "valid-pg-pass-1234567890abcdefghij1234"
        pgbouncerAdminPassword: "valid-pgb-pass-1234567890abcdefghij123"
        betterAuthSecret: "valid-better-auth-1234567890abcdefghij12"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: stringData.LITELLM_MASTER_KEY
          value: "valid-litellm-1234567890abcdefghij12345"
      - equal:
          path: stringData.OPENROUTER_API_KEY
          value: "valid-openrouter-key-1234567890abcdefghij"
      - equal:
          path: stringData.BETTER_AUTH_SECRET
          value: "valid-better-auth-1234567890abcdefghij12"
      - exists:
          path: stringData.OPENAI_API_KEY
      - exists:
          path: stringData.PYANNOTE_API_KEY
      - exists:
          path: stringData.HF_TOKEN
      - exists:
          path: stringData.POSTGRES_OWNER_PASSWORD
      - exists:
          path: stringData.PGBOUNCER_ADMIN_PASSWORD

  - it: renders ExternalSecret in eso mode pointing at configured store
    template: externalsecret.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
          storeKind: ClusterSecretStore
          path: openwhispr
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef.name
          value: vault-clusterstore
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.target.template.metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: skips inline Secret entirely when mode=eso (no fail even with empty values)
    template: secrets.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: vault-clusterstore
        litellmMasterKey: ""
        openrouterApiKey: ""
        openaiApiKey: ""
        pyannoteApiKey: ""
        hfToken: ""
        postgresOwnerPassword: ""
        pgbouncerAdminPassword: ""
        betterAuthSecret: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: fails ESO when storeRef is unset
    template: externalsecret.yaml
    set:
      secrets:
        mode: eso
        external:
          storeRef: ""
    asserts:
      - failedTemplate:
          errorMessage: "values.secrets.external.storeRef is required when secrets.mode=eso"
