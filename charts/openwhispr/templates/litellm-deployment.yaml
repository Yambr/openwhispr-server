{{/*
LiteLLM Deployment — Phase 09 Plan 07.

Embedded LiteLLM Proxy sidecar — pinned to ghcr.io/berriai/litellm:main-v1.83.14-stable
(the multipart-passthrough fix from v1.83.7+ is native; v1.82.x is on the
"What NOT to Use" list per project memory).

Renders only when `litellm.embedded=true` (default). When false the api +
worker LITELLM_BASE_URL points at .Values.litellm.externalBaseUrl and NO
in-cluster LiteLLM resources are created (corporate operators run their
own LiteLLM elsewhere — Bedrock proxy, vLLM, internal gateway).

ConfigMap-mounted config.yaml lives at /app/config.yaml; container args
explicitly point at it. Per pitfall #5 + Plan 09-06, secret-presence-probe
initContainer fail-fasts at pod start if the LITELLM_MASTER_KEY or any
provider key is empty (ESO sync race).
*/}}
{{- if .Values.litellm.embedded -}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "openwhispr.litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwhispr.litellm.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod whenever config.yaml changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-litellm.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "openwhispr.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: secret-presence-probe
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # Plan 11-01 — see api-deployment.yaml for full rationale.
          command:
            - sh
            - -c
            - |
              for k in {{ include "openwhispr.requiredSecretKeys" . | trim }}; do
                eval v=\$$k
                if [ -z "$v" ]; then
                  echo "FATAL: $k empty — refusing to start (ESO not synced?)" 1>&2
                  exit 1
                fi
              done
              echo "secret-presence-probe OK"
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          args:
{{- range .Values.litellm.args }}
            - {{ . | quote }}
{{- end }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
          env:
            # LiteLLM v1.83+ requires DATABASE_URL non-empty at boot (Prisma
            # P1012). Direct -rw connection: LiteLLM owns its own pooling.
            - name: LITELLM_DATABASE_URL
              value: "postgres://openwhispr_owner:$(POSTGRES_OWNER_PASSWORD)@{{ include "openwhispr.postgresRwHost" . }}:5432/litellm"
            - name: DATABASE_URL
              value: "postgres://openwhispr_owner:$(POSTGRES_OWNER_PASSWORD)@{{ include "openwhispr.postgresRwHost" . }}:5432/litellm"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          # SR-20.3 — startupProbe gives a 300s boot budget; reuses
          # /health/liveliness because mock-litellm:dev lacks the
          # real /health/readiness endpoint (Finding 09.1-F33).
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            failureThreshold: {{ .Values.litellm.startupProbe.failureThreshold | default 30 }}
            periodSeconds: {{ .Values.litellm.startupProbe.periodSeconds | default 10 }}
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          # Finding 09.1-F33 — real LiteLLM exposes both /health/liveliness
          # and /health/readiness; mock-litellm:dev only has liveliness.
          # Use the same endpoint for both probes — production install
          # with real LiteLLM can override via values if separate readiness
          # semantics matter.
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-litellm-config
{{- end }}
