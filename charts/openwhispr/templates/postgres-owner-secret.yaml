{{/*
Finding 09.1-F13 — CNPG `bootstrap.initdb.secret.name` references this
Secret. If absent, CNPG auto-generates a random password and stores it
in the secret it creates itself, which silently drifts from
POSTGRES_OWNER_PASSWORD in the chart's main Secret. The migrate Job
(and any in-cluster operator manually connecting as openwhispr_owner)
then fails authentication.

We create this Secret explicitly with the same password the chart's
main Secret holds, so all three connection paths (CNPG bootstrap,
migrate Job, operator psql) share one source of truth.

Skipped when secrets.mode=eso — operators must manage the pg-owner
secret out-of-band via their ESO ClusterSecretStore (the eso path
already requires per-chart-secret ExternalSecret manifests).
*/}}
{{- if eq .Values.secrets.mode "helm-values" -}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-pg-owner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Match the CNPG-expected secret shape: type kubernetes.io/basic-auth.
    "helm.sh/resource-policy": keep
type: kubernetes.io/basic-auth
stringData:
  username: openwhispr_owner
  password: {{ .Values.secrets.postgresOwnerPassword | quote }}
---
# Finding 09.1-F16 — pg-app Secret consumed by CNPG `managed.roles`
# for openwhispr_app (NOBYPASSRLS runtime user).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-pg-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    "helm.sh/resource-policy": keep
type: kubernetes.io/basic-auth
stringData:
  username: openwhispr_app
  password: {{ .Values.secrets.postgresAppPassword | quote }}
{{- end }}
