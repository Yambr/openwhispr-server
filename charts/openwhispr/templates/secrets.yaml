{{/*
Secrets template — helm-values mode only.

Per pitfall #5, when secrets.mode == "eso" we skip both:
  (a) the render-time fail gates (ESO supplies values at sync time, not at
      render time, so the gates would false-fire), AND
  (b) the inline Secret resource (the ExternalSecret in externalsecret.yaml
      creates a Secret of the same name when ESO reconciles).

Plan 11-01 — the required-key list now lives in a single named template
`openwhispr.requiredSecretKeys` (charts/openwhispr/templates/_helpers.tpl).
Iterating that list keeps secrets.yaml, externalsecret.yaml, and all four
Deployment secret-presence-probe initContainers in lockstep:

  - HF_TOKEN appears in `stringData` only when .Values.bundledAi.enabled
    is true (Variant C — local Speaches with gated model weights).
*/}}
{{- if eq .Values.secrets.mode "helm-values" -}}
{{- $required := include "openwhispr.requiredSecretKeys" . | trim | splitList " " -}}
{{- range $required }}
  {{- $valuesKey := include "openwhispr.secretValuesKey" . }}
  {{- $val := index $.Values.secrets $valuesKey }}
  {{- if not $val }}
    {{- fail (printf "values.secrets.%s is required — refusing to install with default/empty secret (DEPLOY-03, T-09-01)" $valuesKey) }}
  {{- end }}
  {{- if or (eq $val "CHANGE_ME") (eq $val "changeme") }}
    {{- fail (printf "values.secrets.%s is set to placeholder %q — refusing to install (DEPLOY-03, T-09-01)" $valuesKey $val) }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
  annotations:
    # T-09-09 — keep the Secret on helm uninstall to prevent Better Auth
    # secret regression on next install (would invalidate all sessions).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $required }}
  {{- $valuesKey := include "openwhispr.secretValuesKey" . }}
  {{ . }}: {{ index $.Values.secrets $valuesKey | quote }}
  {{- end }}
{{- end }}
