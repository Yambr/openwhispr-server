{{/*
Secrets template — helm-values mode only.

Per pitfall #5, when secrets.mode == "eso" we skip both:
  (a) the render-time fail gates (ESO supplies values at sync time, not at
      render time, so the gates would false-fire), AND
  (b) the inline Secret resource (the ExternalSecret in externalsecret.yaml
      creates a Secret of the same name when ESO reconciles).

When mode == "helm-values" we enforce 8 required keys at render time:
  - empty value -> fail
  - "CHANGE_ME" / "changeme" placeholder -> fail
*/}}
{{- if eq .Values.secrets.mode "helm-values" -}}
{{- $required := list "litellmMasterKey" "openrouterApiKey" "openaiApiKey" "pyannoteApiKey" "hfToken" "postgresOwnerPassword" "pgbouncerAdminPassword" "betterAuthSecret" -}}
{{- range $required }}
  {{- $val := index $.Values.secrets . }}
  {{- if not $val }}
    {{- fail (printf "values.secrets.%s is required — refusing to install with default/empty secret (DEPLOY-03, T-09-01)" .) }}
  {{- end }}
  {{- if or (eq $val "CHANGE_ME") (eq $val "changeme") }}
    {{- fail (printf "values.secrets.%s is set to placeholder %q — refusing to install (DEPLOY-03, T-09-01)" . $val) }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
  annotations:
    # T-09-09 — keep the Secret on helm uninstall to prevent Better Auth
    # secret regression on next install (would invalidate all sessions).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.secrets.litellmMasterKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  PYANNOTE_API_KEY: {{ .Values.secrets.pyannoteApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  POSTGRES_OWNER_PASSWORD: {{ .Values.secrets.postgresOwnerPassword | quote }}
  PGBOUNCER_ADMIN_PASSWORD: {{ .Values.secrets.pgbouncerAdminPassword | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
{{- end }}
