{{/*
api Deployment — Phase 09 Plan 06.

Compose-parity for the `api` service in docker-compose.yml. Mirrors:
  - image:         .Values.image.api.repository : tag (defaults to .Chart.AppVersion)
  - ports:         3000 (Fastify HTTP)
  - envFrom:       <fullname>-secrets (LITELLM_MASTER_KEY, OPENROUTER_API_KEY,
                   OPENAI_API_KEY, PYANNOTE_API_KEY, HF_TOKEN,
                   POSTGRES_OWNER_PASSWORD, PGBOUNCER_ADMIN_PASSWORD,
                   BETTER_AUTH_SECRET)
  - DATABASE_URL:  -> CNPG Pooler RW service (transaction-mode pooling)
  - REDIS_URL:     -> Bitnami valkey-primary service
  - MINIO_*:       -> Bitnami minio service
  - LITELLM_BASE_URL: embedded or external (helper openwhispr.litellmBaseUrl)
  - readiness:     GET /api/health   port 3000  initialDelaySeconds 10
  - liveness:      GET /api/live     port 3000  periodSeconds 30
  - initContainer: secret-presence-probe (pitfall #5 — ESO sync race).
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
{{- $apiTag := default .Chart.AppVersion .Values.image.api.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "openwhispr.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwhispr.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openwhispr.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SR-20.5 (Phase 20-02b) — full pod-level hardening. Container image
      # apps/api/Dockerfile uses USER 1000 so runAsNonRoot+runAsUser are
      # satisfied; fsGroup ensures emptyDir mounts inherit the uid; seccomp
      # blocks the unsafe syscall set.
      securityContext:
        {{- toYaml .Values.api.securityContext.pod | nindent 8 }}
      {{- if .Values.api.topologySpread.enabled }}
      # SR-20.4 — spread api pods across nodes so a single-node
      # failure cannot down the whole tier. ScheduleAnyway (not
      # DoNotSchedule) keeps single-node kind clusters bootable.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpread.maxSkew | default 1 }}
          topologyKey: {{ .Values.api.topologySpread.topologyKey | default "kubernetes.io/hostname" }}
          whenUnsatisfiable: {{ .Values.api.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "openwhispr.api.selectorLabels" . | nindent 14 }}
      {{- end }}
      initContainers:
        {{- include "openwhispr.waitForMigrateInitContainer" . | nindent 8 }}
        - name: secret-presence-probe
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # Plan 11-01 — env-name list rendered from the single-source
          # helper openwhispr.requiredSecretKeys (templates/_helpers.tpl).
          # The list grows when bundledAi.enabled=true (Variant C).
          command:
            - sh
            - -c
            - |
              for k in {{ include "openwhispr.requiredSecretKeys" . | trim }}; do
                eval v=\$$k
                if [ -z "$v" ]; then
                  echo "FATAL: $k empty — refusing to start (ESO not synced?)" 1>&2
                  exit 1
                fi
              done
              echo "secret-presence-probe OK"
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
        {{- if .Values.ingress.preflightCheck }}
        - name: traefik-preflight
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          # Pitfall #4 mitigation — operator's Traefik install might omit
          # the realtime entrypoint (long WSS for /v1/realtime). Fail fast
          # here rather than serving 60-min realtime sessions to an
          # entrypoint that silently capped them at 60s. See
          # charts/openwhispr/examples/traefik-values.yaml for the correct
          # Traefik install overlay. Entrypoint name is overridable via
          # `.Values.ingress.realtimeEntrypointName` (Finding 09.1-F2).
          command:
            - sh
            - -c
            - |
              set -eu
              echo "traefik-preflight: probing {{ .Values.ingress.preflightTraefikAdminUrl }}/api/entrypoints for {{ .Values.ingress.realtimeEntrypointName }}"
              if ! curl -fsS --max-time 10 "{{ .Values.ingress.preflightTraefikAdminUrl }}/api/entrypoints" | grep -q '"name":"{{ .Values.ingress.realtimeEntrypointName }}"'; then
                echo "FATAL: Traefik missing realtime entrypoint '{{ .Values.ingress.realtimeEntrypointName }}'" 1>&2
                echo "       see charts/openwhispr/examples/traefik-values.yaml" 1>&2
                exit 1
              fi
              echo "traefik-preflight OK"
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ $apiTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SR-20.5 — container-level hardening. readOnlyRootFilesystem
          # requires the /tmp emptyDir mount below (the api writes scratch
          # files only there).
          securityContext:
            {{- toYaml .Values.api.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
            - configMapRef:
                name: {{ $fullname }}-api-config
          env:
            # Finding 09.1-F17 — runtime DATABASE_URL uses openwhispr_app
            # (NOBYPASSRLS) NOT openwhispr_owner (BYPASSRLS). Owner is
            # reserved for DDL via the migrate Job. The two-role model
            # matches compose-side init/00-roles.sql.tpl.
            - name: DATABASE_URL
              value: "postgres://openwhispr_app:$(POSTGRES_APP_PASSWORD)@{{ include "openwhispr.poolerHost" . }}:5432/openwhispr"
            - name: REDIS_URL
              value: "redis://{{ include "openwhispr.valkeyHost" . }}:6379"
            # Finding 09.1-F28 — app code reads VALKEY_URL (alias for
            # REDIS_URL but the codebase grew to use both names). Without
            # it, /v1/audio/diarization is silently disabled at boot.
            - name: VALKEY_URL
              value: "redis://{{ include "openwhispr.valkeyHost" . }}:6379"
            {{- if .Values.storage.enabled }}
            # Plan 14-06 / BYOK-01 — MINIO_ENDPOINT injection is now gated on
            # the top-level `storage.enabled` toggle. With storage disabled
            # (slim-core default) the api MUST find a `S3_ENDPOINT` value in
            # the operator-supplied Secret or hit the BYOK loud-fail boot
            # guard (plan 14-04 assertBYOKConfig).
            #
            # kind-e2e-verify-20260523 — packages/byok-guard reads
            # `S3_ENDPOINT` (the wire-schemas canonical name), NOT
            # `MINIO_ENDPOINT`. Without S3_ENDPOINT the boot guard refuses
            # to start even with storage.enabled=true and minio Running.
            # Set both: S3_ENDPOINT for byok-guard / runtime S3 client,
            # MINIO_ENDPOINT retained as legacy alias for any older code
            # paths that still reference it.
            - name: MINIO_ENDPOINT
              value: "http://{{ include "openwhispr.minioHost" . }}:9000"
            - name: S3_ENDPOINT
              value: "http://{{ include "openwhispr.minioHost" . }}:9000"
            # byok-guard partner keys — S3_ACCESS_KEY/SECRET_KEY/BUCKET
            # are required whenever S3_ENDPOINT is set. Bound to the MinIO
            # sub-chart's root credentials (rootUser literal + rootPassword
            # from the inline Secret rendered by secrets.helmValues).
            - name: S3_ACCESS_KEY
              value: {{ .Values.minio.auth.rootUser | default "minio" | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET
              value: "openwhispr"
            {{- end }}
            - name: LITELLM_BASE_URL
              value: {{ include "openwhispr.litellmBaseUrl" . | quote }}
            # Finding 09.1-F30 — OTel collector sidecar not present in
            # kind smoke profile. Disabling exporter silences
            # PeriodicExportingMetricReader connect ECONNREFUSED logspam.
            # Production operators install otel-collector DaemonSet and
            # remove this env override.
            - name: OTEL_SDK_DISABLED
              value: "true"
            # kind-e2e-verify-20260523 — byok-guard observability row
            # requires either a real OTLP endpoint OR the literal
            # `disabled` sentinel (case-insensitive, per Plan 51-16).
            # OTEL_SDK_DISABLED alone is NOT enough; the guard checks
            # for OTEL_EXPORTER_OTLP_ENDPOINT specifically. When the
            # observability sub-chart is gated off
            # (.Values.observability.embedded=false) we must set the
            # sentinel or the api refuses to boot.
            {{- if not .Values.observability.embedded }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "disabled"
            {{- end }}
            # Phase 09.2 F35 — Better Auth's trustedOrigins gate rejects
            # POST requests whose Origin (or Referer) does not match. The
            # in-cluster api Service URL must be admitted so the helm-test
            # probe (and any in-cluster synthetic traffic) gets through
            # CSRF. Plus the public host. Operators with additional
            # ingress / IdP hostnames extend via .Values.api.env.authTrustedOriginsExtra.
            - name: AUTH_TRUSTED_ORIGINS_EXTRA
              value: {{ printf "http://%s-api:3000,https://%s%s" (include "openwhispr.fullname" .) .Values.host.api (ternary (printf ",%s" .Values.api.env.authTrustedOriginsExtra) "" (ne (default "" .Values.api.env.authTrustedOriginsExtra) "")) | quote }}
            - name: AUTH_URL
              value: "https://{{ .Values.host.api }}"
            # R20+R19 (2026-05-23) — INGRESS_BASE_URL is the canonical
            # operator-facing host knob read by validateIngressBoot() +
            # Better Auth handler. AUTH_URL fallback above still works
            # (chart pre-R20 only set AUTH_URL), but surfacing the
            # preferred var lets operators tune the verification-email
            # link host without mutating AUTH_URL. Defaults to the same
            # value — overridable via .Values.api.env.ingressBaseUrl.
            - name: INGRESS_BASE_URL
              value: {{ default (printf "https://%s" .Values.host.api) .Values.api.env.ingressBaseUrl | quote }}
            # litellm-patterns A4 (2026-05-23) — retry layer for
            # chatCompletions. All three have safe in-code defaults
            # (3 attempts / 250ms base / 8000ms cap); the chart renders
            # them only when the operator overrides via
            # .Values.litellm.retry.{maxAttempts,baseMs,capMs}.
            {{- with .Values.litellm.retry }}
            {{- if .maxAttempts }}
            - name: LITELLM_RETRY_MAX_ATTEMPTS
              value: {{ .maxAttempts | quote }}
            {{- end }}
            {{- if .baseMs }}
            - name: LITELLM_RETRY_BASE_MS
              value: {{ .baseMs | quote }}
            {{- end }}
            {{- if .capMs }}
            - name: LITELLM_RETRY_CAP_MS
              value: {{ .capMs | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.api.env.disableEmailVerification }}
            # Phase 09.2 F35 — helm test probe runs synthetic signup
            # without an email inbox. values-kind.yaml sets this to true;
            # production overlays leave it false (default).
            - name: OPENWHISPR_DISABLE_EMAIL_VERIFICATION
              value: "1"
            {{- end }}
            # Phase 09.2 F37 — api SSRF dispatcher's default-deny allow-
            # list must include the in-cluster LiteLLM service hostname.
            # Without it api → LiteLLM hop returns 502 with audit row
            # security.ssrf_blocked rule=host_not_allowed. Production
            # operators extend via .Values.api.env.outboundAllowedHosts
            # for additional egress targets (Bedrock proxy, vault, etc.).
            - name: OUTBOUND_ALLOWED_HOSTS
              value: {{ printf "%s-litellm%s" (include "openwhispr.fullname" .) (ternary (printf ",%s" .Values.api.env.outboundAllowedHosts) "" (ne (default "" .Values.api.env.outboundAllowedHosts) "")) | quote }}
            # Phase 09.2 F38 — k8s Service IPs are RFC1918 (10.x.x.x).
            # The SSRF dispatcher's per-IP block-list rejects rfc1918_10
            # by default. Whitelist the litellm hostname so its private
            # IP resolution doesn't trip the second-layer DNS-rebinding
            # defense. Operators add more in-cluster hostnames here.
            - name: OUTBOUND_PRIVATE_HOST_ALLOWLIST
              value: {{ printf "%s-litellm%s" (include "openwhispr.fullname" .) (ternary (printf ",%s" .Values.api.env.outboundPrivateHostAllowlist) "" (ne (default "" .Values.api.env.outboundPrivateHostAllowlist) "")) | quote }}
          # SR-20.3 — startupProbe gives a 300s boot budget
          # (failureThreshold 30 × periodSeconds 10). Until it
          # succeeds, readiness + liveness probes are suspended,
          # protecting slow-booting Node + Better Auth + drizzle
          # init from premature kubelet kills. See plan 20-02a.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold | default 30 }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # SR-20.5 — read-only rootfs needs a writable scratch path.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
