{{/*
api Deployment — Phase 09 Plan 06.

Compose-parity for the `api` service in docker-compose.yml. Mirrors:
  - image:         .Values.image.api.repository : tag (defaults to .Chart.AppVersion)
  - ports:         3000 (Fastify HTTP)
  - envFrom:       <fullname>-secrets (LITELLM_MASTER_KEY, OPENROUTER_API_KEY,
                   OPENAI_API_KEY, PYANNOTE_API_KEY, HF_TOKEN,
                   POSTGRES_OWNER_PASSWORD, PGBOUNCER_ADMIN_PASSWORD,
                   BETTER_AUTH_SECRET)
  - DATABASE_URL:  -> CNPG Pooler RW service (transaction-mode pooling)
  - REDIS_URL:     -> Bitnami valkey-primary service
  - MINIO_*:       -> Bitnami minio service
  - LITELLM_BASE_URL: embedded or external (helper openwhispr.litellmBaseUrl)
  - readiness:     GET /api/health   port 3000  initialDelaySeconds 10
  - liveness:      GET /api/live     port 3000  periodSeconds 30
  - initContainer: secret-presence-probe (pitfall #5 — ESO sync race).
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
{{- $apiTag := default .Chart.AppVersion .Values.image.api.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "openwhispr.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwhispr.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openwhispr.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: secret-presence-probe
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for k in LITELLM_MASTER_KEY OPENROUTER_API_KEY OPENAI_API_KEY PYANNOTE_API_KEY HF_TOKEN POSTGRES_OWNER_PASSWORD PGBOUNCER_ADMIN_PASSWORD BETTER_AUTH_SECRET; do
                eval v=\$$k
                if [ -z "$v" ]; then
                  echo "FATAL: $k empty — refusing to start (ESO not synced?)" 1>&2
                  exit 1
                fi
              done
              echo "secret-presence-probe OK"
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ $apiTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
            - configMapRef:
                name: {{ $fullname }}-api-config
          env:
            - name: DATABASE_URL
              value: "postgres://openwhispr_owner:$(POSTGRES_OWNER_PASSWORD)@{{ include "openwhispr.poolerHost" . }}:5432/openwhispr"
            - name: REDIS_URL
              value: "redis://{{ include "openwhispr.valkeyHost" . }}:6379"
            - name: MINIO_ENDPOINT
              value: "http://{{ include "openwhispr.minioHost" . }}:9000"
            - name: LITELLM_BASE_URL
              value: {{ include "openwhispr.litellmBaseUrl" . | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
