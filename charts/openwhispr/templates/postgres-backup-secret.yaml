{{/*
Backup credentials Secret for CNPG barmanObjectStore. Renders only when
backup.enabled=true and secrets.mode=helm-values. In secrets.mode=eso the
operator is expected to provision a Secret of the same name via ExternalSecret
(Plan 09-06+ may add an explicit ExternalSecret template for backup creds).

The Cluster CR references:
  - ACCESS_KEY_ID
  - SECRET_ACCESS_KEY
*/}}
{{- if and .Values.postgres.backup.enabled (eq .Values.secrets.mode "helm-values") -}}
{{- if not .Values.postgres.backup.accessKeyId }}
{{- fail "values.postgres.backup.accessKeyId is required when postgres.backup.enabled=true and secrets.mode=helm-values" }}
{{- end }}
{{- if not .Values.postgres.backup.secretAccessKey }}
{{- fail "values.postgres.backup.secretAccessKey is required when postgres.backup.enabled=true and secrets.mode=helm-values" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr.fullname" . }}-pg-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
  annotations:
    # T-09-09 — keep across helm uninstall to prevent backup credential churn.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ .Values.postgres.backup.accessKeyId | quote }}
  SECRET_ACCESS_KEY: {{ .Values.postgres.backup.secretAccessKey | quote }}
{{- end }}
