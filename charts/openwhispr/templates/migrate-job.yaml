{{/*
Migration Helm hook Job — Phase 09 Plan 08.

Runs the Drizzle migrations against the CNPG primary -rw service BEFORE
the api/worker Deployments are created (pre-install) or rolled
(pre-upgrade). Closes pitfall #15: `helm install --wait` does NOT wait
on CRD-backed services like the CNPG Cluster, so this Job's initContainer
runs `pg_isready` against the CNPG `-rw` service until it responds (max
60s of pg_isready polling, bounded by Job-level activeDeadlineSeconds 300
which fails the install if the migration hangs).

Hard pins (pitfall #9 + T-09-07 mitigation):
  - image tag = .Values.image.migrate.tag default .Chart.AppVersion
    (never `latest` — snapshot test asserts).
  - DATABASE_URL points at -pg-rw (NOT the Pooler) because PgBouncer
    transaction-mode breaks Drizzle's DDL (pitfall #9). Migrations need
    a direct, session-pinned connection.
  - backoffLimit 0 + restartPolicy Never — one-shot semantics; do not
    retry a failed migration (operator must inspect logs and fix).
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
{{- $migrateTag := default .Chart.AppVersion .Values.image.migrate.tag -}}
apiVersion: batch/v1
kind: Job
metadata:
  # Finding 09.1-F10 — migrate Job is a regular release resource (NO Helm
  # hook annotation). Helm hook semantics are EXCLUSIVE: a `pre-upgrade`
  # hook (the F3 attempt) does not render on `helm install`, leaving the
  # Job absent from the install manifest and the wait-for-migrate
  # initContainers (in api/web/worker) polling a nonexistent target.
  #
  # As a regular resource:
  #   * Job applies in the same `helm install`/`upgrade` pass as the CNPG
  #     Cluster CR. wait-for-postgres init polls -pg-rw:5432 until CNPG
  #     promotes the primary (30-180s).
  #   * Name carries `.Release.Revision` to avoid Kubernetes' immutable
  #     Job spec restriction on upgrade — each release produces a NEW Job
  #     with a unique name.
  #   * wait-for-migrate initContainers query by LABEL selector
  #     (`app.kubernetes.io/component=migrate, app.kubernetes.io/instance=<release>`)
  #     + sort by creationTimestamp + slice [-1:] so they always watch
  #     the latest revision's Job.
  #   * ttlSecondsAfterFinished=3600 (k8s ≥1.23 TTL controller) GCs old
  #     per-revision Jobs after one hour to avoid namespace pollution.
  #
  # Bitnami precedent: postgresql-ha / kafka / mariadb-galera all suffix
  # upgrade-time Jobs with a release-derived identifier.
  name: {{ $fullname }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
    openwhispr.dev/migrate-revision: "{{ .Release.Revision }}"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  # Finding 09.1-F3 — bumped from 300s → 900s so the regular-Job install
  # path can absorb CNPG bootstrap (90-180s) + wait-for-postgres polling
  # (up to 600s) + the actual migration (~30s).
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "openwhispr.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-migrate
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # Finding 09.1-F3 — loop tolerates a fresh CNPG bootstrap on
              # `helm install` (no pre-existing Cluster, takes 90-180s) plus
              # any additional WAL replay on `helm upgrade` (rare but
              # bounded). 300 iterations × 2s = 600s wall-time ceiling.
              i=0
              until pg_isready -h {{ include "openwhispr.postgresRwHost" . }} -p 5432 -U openwhispr_owner -d openwhispr; do
                i=$((i+1))
                if [ $i -gt 300 ]; then
                  echo "FATAL: pg_isready timed out after 600s against {{ include "openwhispr.postgresRwHost" . }}:5432" 1>&2
                  exit 1
                fi
                echo "waiting for {{ include "openwhispr.postgresRwHost" . }}:5432 ... ($i/300)"
                sleep 2
              done
              echo "postgres ready"
      containers:
        - name: migrate
          image: "{{ .Values.image.migrate.repository }}:{{ $migrateTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - /app/packages/data/dist/migrate.cjs
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
          env:
            # NOTE: DATABASE_URL deliberately bypasses the Pooler — Drizzle's
            # DDL statements break under PgBouncer transaction-mode (pitfall #9).
            - name: DATABASE_URL
              value: "postgres://openwhispr_owner:$(POSTGRES_OWNER_PASSWORD)@{{ include "openwhispr.postgresRwHost" . }}:5432/openwhispr"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
