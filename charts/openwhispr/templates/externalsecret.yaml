{{/*
ExternalSecret template — eso mode only.

Operator must install External Secrets Operator (https://external-secrets.io/)
out-of-band and create a SecretStore / ClusterSecretStore referenced by
.Values.secrets.external.storeRef. Refresh interval defaults to 1h.

The 15 keys (8 original + 7 added by F22) are pulled from
{storeRef}/{path}/{key} where {key} matches the lower-camelCase names in
values.yaml. ESO writes them into a Secret named "<fullname>-secrets"
with the env-var-style upper-snake keys, so pod-side envFrom: secretRef
behaves identically to helm-values mode.

Finding 09.1-B1 (code review): F22 added 7 keys to secrets.yaml but
this ESO template was not updated. Any `secrets.mode=eso` install would
have reproduced the original F22 CrashLoopBackOff (7 missing env vars)
PLUS rendered DATABASE_URL=postgres://openwhispr_app:@... (empty
password from missing POSTGRES_APP_PASSWORD) → SCRAM auth fails on
every connection. The 7 new data: entries below close the gap.
*/}}
{{- if eq .Values.secrets.mode "eso" -}}
{{- if not .Values.secrets.external.storeRef -}}
{{- fail "values.secrets.external.storeRef is required when secrets.mode=eso" -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "openwhispr.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secrets.external.storeRef }}
    kind: {{ .Values.secrets.external.storeKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "openwhispr.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          # T-09-09 parity with helm-values mode.
          helm.sh/resource-policy: keep
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: {{ .Values.secrets.external.path }}/litellmMasterKey
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.secrets.external.path }}/openrouterApiKey
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.secrets.external.path }}/openaiApiKey
    {{- /* Plan 11-01 — HF_TOKEN is Variant C only. Without bundledAi.enabled
            the ESO data block omits it so corporate operators do not have
            to populate a key their installation never uses. */}}
    {{- if .Values.bundledAi.enabled }}
    - secretKey: HF_TOKEN
      remoteRef:
        key: {{ .Values.secrets.external.path }}/hfToken
    {{- end }}
    - secretKey: POSTGRES_OWNER_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/postgresOwnerPassword
    - secretKey: PGBOUNCER_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/pgbouncerAdminPassword
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: {{ .Values.secrets.external.path }}/betterAuthSecret
    # Finding 09.1-B1 — 7 keys added by F22.
    - secretKey: POSTGRES_APP_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/postgresAppPassword
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/valkeyPassword
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/minioRootPassword
    - secretKey: TRAEFIK_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/traefikAdminPassword
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.path }}/grafanaAdminPassword
    - secretKey: MASTER_KEK
      remoteRef:
        key: {{ .Values.secrets.external.path }}/masterKek
    - secretKey: BACKUP_AGE_IDENTITY
      remoteRef:
        key: {{ .Values.secrets.external.path }}/backupAgeIdentity
{{- end }}
