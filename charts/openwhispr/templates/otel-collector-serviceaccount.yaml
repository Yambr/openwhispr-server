{{/*
ServiceAccount for the OTel Collector DaemonSet.

Gated on observability.collector.enabled (default false) — when the
operator's cluster has no LGTM ingest yet, the entire collector group
(SA + ClusterRole + ClusterRoleBinding + ConfigMap + DaemonSet) is
suppressed. Pitfall #12 — the DaemonSet runs with hostNetwork=true and
needs read-only access to nodes/pods/services for kubeletstats; the
ClusterRole below grants only get/list/watch.
*/}}
{{- /* Plan 14-06 — AND-gate the new top-level observability.enabled umbrella with the existing collector.enabled sub-toggle. */ -}}
{{- if and .Values.observability.enabled .Values.observability.collector.enabled -}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
{{- end }}
