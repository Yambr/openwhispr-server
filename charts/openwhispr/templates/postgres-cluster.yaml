{{/*
CloudNativePG Cluster CR (postgresql.cnpg.io/v1). Phase 09 Plan 04 (A2 + A4).

Hard constraints baked in:
  - imageName MUST match `^.+:17\.[0-9]+.*$` (T-09-02 mitigation enforced at
    schema-validation time in values.schema.json; refuses to install on PG 18).
  - shared_preload_libraries includes `pg_partman_bgw` (pitfall #14 of
    09-RESEARCH.md; required for migration 0014 audit_log partitioning).
  - postInitApplicationSQL creates the `pg_partman` extension in schema `partman`.
  - Three instances default (HA quorum); override to 1 for OSS single-node.
  - barmanObjectStore renders only when `backup.enabled=true`; references the
    Secret produced by postgres-backup-secret.yaml.

NOTE: helm --wait does NOT wait on CRDs (pitfall #15). Plan 09-08 adds a
pg_isready initContainer to the migrate Job. Operators should run:
    helm install ... --wait --timeout 10m && helm test
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $fullname }}-pg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.replicas }}
  imageName: {{ .Values.postgres.imageName | quote }}
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
    # Finding 09.1-F4 — CNPG ≥1.22 rejects `shared_preload_libraries`
    # inside `postgresql.parameters` ("Can't set fixed configuration
    # parameter"). It must be declared as a first-class spec field which
    # CNPG operator manages outside the normal parameters dict.
    shared_preload_libraries:
      - pg_partman_bgw
    pg_hba:
      - host all all all scram-sha-256

  bootstrap:
    initdb:
      database: openwhispr
      owner: openwhispr_owner
      secret:
        name: {{ $fullname }}-pg-owner
      # Finding 09.1-F14 — `postInitSQL` runs as superuser in the
      # `postgres` database BEFORE the application database is created.
      # Used to grant CREATEDB to openwhispr_owner (needed because the
      # migrate Job creates the `litellm` database too, per Phase 3 Plan
      # 01 — HIGH-1 LiteLLM-DB auto-create) AND to pre-create the
      # litellm database so the migrate Job can run as a non-superuser.
      postInitSQL:
        # Finding 09.1-F15 — Drizzle migrations include backfills that
        # INSERT into RLS-enabled tables (e.g. tenant_settings backfill in
        # 0006_tenant_settings.sql). Without BYPASSRLS the migration runs
        # as openwhispr_owner subject to per-tenant policy → 42501. The
        # compose-side `init/00-roles.sql.tpl` declares
        # `WITH LOGIN BYPASSRLS` on the owner role; CNPG bootstrap omits
        # it. ALTER restores parity.
        - ALTER ROLE openwhispr_owner BYPASSRLS;
        - ALTER ROLE openwhispr_owner CREATEDB;
        # Finding 09.1-F25 — Postgres 17 tightened ALTER ROLE: a non-
        # superuser needs BOTH the CREATEROLE attribute AND the ADMIN
        # OPTION on the target role. F23's bare `GRANT openwhispr_app
        # TO openwhispr_owner` gave membership but not admin option →
        # 42501 "Only roles with CREATEROLE attribute and ADMIN option".
        - ALTER ROLE openwhispr_owner CREATEROLE;
        - CREATE DATABASE litellm OWNER openwhispr_owner;
        # Finding 09.1-F23 — migrations execute ALTER ROLE
        # openwhispr_app (e.g. SET app.tenant_id) under the owner
        # connection. The owner is not superuser, so ALTER ROLE
        # requires either CREATEROLE OR membership in the target role.
        # We create openwhispr_app here (raw CREATE ROLE, password set
        # by CNPG managed.roles below from the pg-app Secret on next
        # reconcile) so we can GRANT it TO openwhispr_owner immediately.
        # The DO-block is idempotent on subsequent recoveries.
        # Finding 09.1-F24 — CNPG renders postInitSQL items into a shell
        # `psql -c "..."` invocation. Bare `$$` inside the double-quoted
        # shell string is consumed as `$$` = current shell PID, leaving
        # `$` in the SQL stream → 42601 syntax error. Doubling to `$$$$`
        # so the shell collapses it back to `$$` before psql sees it.
        - |
          DO $$$$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openwhispr_app') THEN
              CREATE ROLE openwhispr_app WITH LOGIN NOBYPASSRLS;
            END IF;
          END $$$$;
        # Finding 09.1-F25 — WITH ADMIN OPTION is required in PG 17 for
        # the owner to ALTER openwhispr_app. CNPG's managed.roles.inRoles
        # below preserves the membership; the admin option is reapplied
        # idempotently here on every restart (postInitSQL only runs once
        # at initdb time, but the GRANT is idempotent).
        - GRANT openwhispr_app TO openwhispr_owner WITH ADMIN OPTION;
        # Finding 09.1-F26 — PG 17 separates ALTER ROLE attribute changes
        # from ALTER ROLE SET <parameter>. The latter requires either
        # superuser OR an explicit `GRANT SET ON PARAMETER` for non-
        # superusers (pg_parameter_acl, PG 15+). Custom GUCs (app.*)
        # also need this grant to be settable via ALTER ROLE.
        # Migrations call ALTER ROLE openwhispr_app SET app.tenant_id,
        # so grant SET on the parameter to the owner here.
        - GRANT SET ON PARAMETER "app.tenant_id" TO openwhispr_owner;
      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS partman;
        - CREATE EXTENSION IF NOT EXISTS pg_partman SCHEMA partman;
        # Finding 09.1-F18 / F20 — pg_partman's create_parent() executes
        # internal DDL (CREATE child partition tables, ALTER attach) which
        # checks CREATE-on-schema, not just EXECUTE-on-function. Naive
        # GRANT USAGE/EXECUTE/SELECT was insufficient. The pg_partman
        # canonical operator-setup is to make the application owner the
        # OWNER of the partman schema (full DDL rights inside it) and
        # grant CREATE on `public` (where parent tables live).
        - ALTER SCHEMA partman OWNER TO openwhispr_owner;
        - GRANT ALL ON SCHEMA partman TO openwhispr_owner;
        - GRANT ALL ON ALL TABLES IN SCHEMA partman TO openwhispr_owner;
        - GRANT ALL ON ALL SEQUENCES IN SCHEMA partman TO openwhispr_owner;
        - GRANT ALL ON ALL FUNCTIONS IN SCHEMA partman TO openwhispr_owner;
        - ALTER DEFAULT PRIVILEGES IN SCHEMA partman GRANT ALL ON TABLES TO openwhispr_owner;
        - ALTER DEFAULT PRIVILEGES IN SCHEMA partman GRANT ALL ON SEQUENCES TO openwhispr_owner;

  storage:
    size: {{ .Values.postgres.storageSize }}
    {{- with .Values.postgres.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  {{- if .Values.postgres.backup.enabled }}
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://{{ required "postgres.backup.bucket is required when postgres.backup.enabled=true" .Values.postgres.backup.bucket }}/cnpg
      {{- with .Values.postgres.backup.s3Endpoint }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ $fullname }}-pg-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $fullname }}-pg-backup
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
  {{- end }}

  monitoring:
    enablePodMonitor: {{ .Values.observability.serviceMonitor.enabled }}

  # Finding 09.1-F16 — compose-side two-role model: openwhispr_app is
  # the runtime user (NOBYPASSRLS) that api/web/worker connect as via
  # the Pooler. Chart was missing this role; api/web/worker fell back
  # to openwhispr_owner (BYPASSRLS) — bypassing multi-tenant RLS.
  # CNPG's managed.roles is the canonical mechanism: operator
  # reconciles ALTER ROLE on every drift, reads password from the
  # referenced Secret on each reconcile.
  managed:
    roles:
      - name: openwhispr_app
        ensure: present
        login: true
        bypassrls: false
        comment: "OpenWhispr runtime user — NO BYPASSRLS, used by api/web/worker via Pooler"
        passwordSecret:
          name: {{ $fullname }}-pg-app
        connectionLimit: 200
        # Finding 09.1-F23 advisor follow-up: CNPG's declarative reconciler
        # treats `inRoles` as authoritative; an empty list would silently
        # REVOKE the `GRANT openwhispr_app TO openwhispr_owner` set in
        # postInitSQL on next reconcile, re-breaking migrations days
        # later. Declare the membership so CNPG owns + preserves it.
        # Phase 09.2 strategic plan: drop the per-role GUC in favour of
        # SET LOCAL app.tenant_id per-transaction (eliminates this
        # cross-role privilege coupling entirely).
        inRoles:
          - openwhispr_owner
