{{/*
Dedicated ServiceAccount for the migrate Helm hook Job. No special RBAC —
the Job only talks to Postgres (egress) and reads its own Secret via
envFrom (default ServiceAccount API permissions are sufficient). The
dedicated SA exists for audit / identity (operator can attach IRSA /
workload-identity annotations here without affecting the api/worker SA).
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Hook annotations on the SA itself — must be created BEFORE the Job
    # hook runs (pre-install at weight -10 < the Job's weight -5).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
