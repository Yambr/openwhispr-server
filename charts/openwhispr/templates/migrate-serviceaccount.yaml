{{/*
Dedicated ServiceAccount for the migrate Job. The Job only talks to
Postgres (egress) and reads its own Secret via envFrom (default SA
API permissions are sufficient). The dedicated SA exists for audit /
identity (operator can attach IRSA / workload-identity annotations here
without affecting the api/worker SA).

Finding 09.1-F3: hook annotations removed. The Job is a regular resource
on `helm install` (hook only on `helm upgrade`) and the SA must persist
across releases.
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
---
{{/*
Read-only access to the migrate Job + its pod so the api/web/worker
wait-for-migrate initContainer (helper `openwhispr.waitForMigrateInitContainer`)
can poll the Job's `status.succeeded` field. Bound to the chart-wide
application ServiceAccount that api/web/worker share. No write access.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-migrate-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
rules:
  # Finding 09.1-F10 — name no longer fixed (carries .Release.Revision).
  # `list` with a label selector is the supported way to find the current
  # migration Job; resourceNames cannot be used because it requires exact
  # naming and forbids `list` by selector.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-migrate-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-migrate-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "openwhispr.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
