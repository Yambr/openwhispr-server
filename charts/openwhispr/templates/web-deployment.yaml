{{/*
web Deployment — Phase 09 Plan 06. Next.js 15 SSR pod.

Compose-parity for the `web` service. Same-origin deploy: server-side
fetches stay in-cluster via INTERNAL_API_URL; browser-side fetches hit
Traefik via NEXT_PUBLIC_API_BASE_URL (PathPrefix /api).

No HPA by default — web is largely CPU-bound by Next.js RSC rendering
and a single replica handles a 1k-user installation comfortably. Future
plan may add HPA when SSR latency budget tightens.
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
{{- $webTag := default .Chart.AppVersion .Values.image.web.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "openwhispr.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwhispr.web.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openwhispr.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SR-20.5 (Phase 20-02b) — full pod-level hardening. See api-deployment
      # for rationale; web Dockerfile uses USER 1000 + writable .next/cache.
      securityContext:
        {{- toYaml .Values.web.securityContext.pod | nindent 8 }}
      {{- if .Values.web.topologySpread.enabled }}
      # SR-20.4 — see api-deployment.yaml for rationale.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.web.topologySpread.maxSkew | default 1 }}
          topologyKey: {{ .Values.web.topologySpread.topologyKey | default "kubernetes.io/hostname" }}
          whenUnsatisfiable: {{ .Values.web.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "openwhispr.web.selectorLabels" . | nindent 14 }}
      {{- end }}
      initContainers:
        {{- include "openwhispr.waitForMigrateInitContainer" . | nindent 8 }}
        - name: secret-presence-probe
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # Plan 11-01 — see api-deployment.yaml for full rationale.
          command:
            - sh
            - -c
            - |
              for k in {{ include "openwhispr.requiredSecretKeys" . | trim }}; do
                eval v=\$$k
                if [ -z "$v" ]; then
                  echo "FATAL: $k empty — refusing to start (ESO not synced?)" 1>&2
                  exit 1
                fi
              done
              echo "secret-presence-probe OK"
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ $webTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SR-20.5 — container-level hardening. readOnlyRootFilesystem
          # needs BOTH the /tmp emptyDir AND a writable /app/apps/web/.next/cache
          # for Next.js 15 standalone ISR cache writes.
          securityContext:
            {{- toYaml .Values.web.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
          env:
            - name: NODE_ENV
              value: {{ .Values.web.env.nodeEnv | default "production" | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3001"
            - name: INTERNAL_API_URL
              value: {{ .Values.web.env.internalApiUrl | default (printf "http://%s-api:3000" $fullname) | quote }}
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://{{ .Values.host.api }}"
            # Finding 09.1-F27 — Next.js SSR calls makeAppDb() at module
            # init for server-side data fetching (Better Auth session
            # introspection, etc.). Without DATABASE_URL the bundle
            # throws at startup before the listener binds. Same role
            # (openwhispr_app) + Pooler as api/worker.
            - name: DATABASE_URL
              value: "postgres://openwhispr_app:$(POSTGRES_APP_PASSWORD)@{{ include "openwhispr.poolerHost" . }}:5432/openwhispr"
            # Finding 09.1-F28 — web's buildApp also reads VALKEY_URL.
            - name: VALKEY_URL
              value: "redis://{{ include "openwhispr.valkeyHost" . }}:6379"
            # Finding 09.1-F30 — OTel collector sidecar not present in
            # kind smoke profile. Disable exporter to silence
            # PeriodicExportingMetricReader stack-trace logspam.
            - name: OTEL_SDK_DISABLED
              value: "true"
          # Finding 09.1-F31 — Next.js root `/` returns 404 (no index
          # page; auth-gated to /login). `/api/health` is the canonical
          # health endpoint (apps/web/src/app/api/health/route.ts).
          # SR-20.3 — startupProbe gives a 300s boot budget; see
          # api-deployment.yaml for rationale.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
            failureThreshold: {{ .Values.web.startupProbe.failureThreshold | default 30 }}
            periodSeconds: {{ .Values.web.startupProbe.periodSeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # SR-20.5 — read-only rootfs requires both scratch (/tmp) and
          # the Next.js ISR cache directory to be writable.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
