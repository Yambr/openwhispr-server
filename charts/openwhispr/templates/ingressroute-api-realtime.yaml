{{/*
Traefik IngressRoute — WSS /v1/realtime on :8443.

Mirrors compose/traefik/dynamic.yml router `api-realtime`. Bound
EXCLUSIVELY to the realtime entrypoint (Phase 04 Plan 05 SCALE-05 /
T-04-02) so long-running WSS sessions cannot exhaust the :443 ingress
connection pool used by short-JSON routes. Entrypoint name defaults to
`wsrealtime` (10 chars — fits k8s ContainerPort.name 15-char ceiling,
Finding 09.1-F2); operators override via
`.Values.ingress.realtimeEntrypointName`.

ServersTransport reference: openwhispr-realtime-transport adds the
3600s idleConnTimeout demanded by BACKEND_SPEC.md L788-L791.

Cert reuse (D-21): same TLS Secret as the short-JSON IngressRoute —
both entrypoints serve the same SAN, no separate ACME issuance.
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-api-realtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  entryPoints:
    - {{ .Values.ingress.realtimeEntrypointName }}
  routes:
    - match: Host(`{{ .Values.host.api }}`) && PathPrefix(`/v1/realtime`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $fullname }}-api
          port: 3000
          serversTransport: {{ $fullname }}-realtime-transport
      middlewares:
        - name: {{ $fullname }}-forwarded-headers
          namespace: {{ .Release.Namespace }}
  tls:
    secretName: {{ .Values.tls.apiSecretName }}
