{{/*
Traefik Middleware — forwarded-headers ipAllowList.

Mirrors compose/traefik/traefik.yml `forwardedHeaders.trustedIPs`: trust
X-Forwarded-For ONLY from RFC 1918 private CIDRs. Defense-in-depth in case
the upstream Traefik install was configured permissively (Phase 02.19
trust-boundary inheritance).

Bound to both IngressRoutes (api short-JSON + api realtime + web).
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-forwarded-headers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.ingress.trustedIPs }}
      - {{ . | quote }}
      {{- end }}
