{{/*
worker Deployment — Phase 09 Plan 06.

Compose-parity for the `worker` service. BullMQ consumer; no public ports
but exposes /healthz + /metrics on 3002 for kubelet probes + Prometheus.

Notes:
  - DATABASE_URL via Pooler RW (transaction-mode is safe for the worker's
    short-lived queries — long-running consumer loops use Valkey, not PG).
  - LITELLM_READ_DATABASE_URL bypasses the pooler (compose parity) when the
    operator opts in; default left empty so the worker picks the api's
    LITELLM_BASE_URL path instead.
  - secret-presence-probe initContainer — same fail-fast as api.
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
{{- $workerTag := default .Chart.AppVersion .Values.image.worker.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "openwhispr.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwhispr.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openwhispr.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SR-20.5 (Phase 20-02b) — full pod-level hardening. See api-deployment
      # for rationale; worker Dockerfile uses USER 1000.
      securityContext:
        {{- toYaml .Values.worker.securityContext.pod | nindent 8 }}
      {{- if .Values.worker.topologySpread.enabled }}
      # SR-20.4 — see api-deployment.yaml for rationale.
      topologySpreadConstraints:
        - maxSkew: {{ .Values.worker.topologySpread.maxSkew | default 1 }}
          topologyKey: {{ .Values.worker.topologySpread.topologyKey | default "kubernetes.io/hostname" }}
          whenUnsatisfiable: {{ .Values.worker.topologySpread.whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "openwhispr.worker.selectorLabels" . | nindent 14 }}
      {{- end }}
      initContainers:
        {{- include "openwhispr.waitForMigrateInitContainer" . | nindent 8 }}
        - name: secret-presence-probe
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # Plan 11-01 — see api-deployment.yaml for full rationale.
          command:
            - sh
            - -c
            - |
              for k in {{ include "openwhispr.requiredSecretKeys" . | trim }}; do
                eval v=\$$k
                if [ -z "$v" ]; then
                  echo "FATAL: $k empty — refusing to start (ESO not synced?)" 1>&2
                  exit 1
                fi
              done
              echo "secret-presence-probe OK"
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ $workerTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SR-20.5 — container-level hardening.
          securityContext:
            {{- toYaml .Values.worker.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ $fullname }}-secrets
            - configMapRef:
                name: {{ $fullname }}-worker-config
          env:
            # Finding 09.1-F17 — same as api: app user via Pooler, not owner.
            - name: DATABASE_URL
              value: "postgres://openwhispr_app:$(POSTGRES_APP_PASSWORD)@{{ include "openwhispr.poolerHost" . }}:5432/openwhispr"
            - name: REDIS_URL
              value: "redis://{{ include "openwhispr.valkeyHost" . }}:6379"
            # Finding 09.1-F28 — worker also reads VALKEY_URL.
            - name: VALKEY_URL
              value: "redis://{{ include "openwhispr.valkeyHost" . }}:6379"
            {{- if .Values.storage.enabled }}
            # Plan 14-06 / BYOK-01 — MINIO_ENDPOINT injection gated on the
            # top-level `storage.enabled` toggle (parity with api-deployment).
            - name: MINIO_ENDPOINT
              value: "http://{{ include "openwhispr.minioHost" . }}:9000"
            {{- end }}
            - name: LITELLM_BASE_URL
              value: {{ include "openwhispr.litellmBaseUrl" . | quote }}
            # Finding 09.1-F30 — see api-deployment.yaml note.
            - name: OTEL_SDK_DISABLED
              value: "true"
          # Finding 09.1-F32 — worker is a pure BullMQ consumer; it does
          # NOT run an HTTP server (no Fastify, no /healthz route). The
          # chart's httpGet probe was fiction. Switched to an exec probe
          # that confirms the node process is alive and connected to
          # valkey (BullMQ-internal heartbeat). Production hardening
          # could add a thin probe-only Fastify hook to the worker bundle.
          # SR-20.3 — startupProbe gives a 300s boot budget; reuses the
          # same pgrep exec shape as readiness/liveness.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'node /app/dist/index.js' >/dev/null"
            failureThreshold: {{ .Values.worker.startupProbe.failureThreshold | default 30 }}
            periodSeconds: {{ .Values.worker.startupProbe.periodSeconds | default 10 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'node /app/dist/index.js' >/dev/null"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'node /app/dist/index.js' >/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # SR-20.5 — read-only rootfs needs a writable scratch path.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
