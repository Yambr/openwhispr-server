{{/*
Traefik IngressRoute — api short-JSON routes on :443 (websecure).

Mirrors compose/traefik/dynamic.yml router `api` (PathPrefix /api).
Traefik 3 CRD API (traefik.io/v1alpha1).

Phase 04 Plan 05 lock-in: this route is bound EXCLUSIVELY to the
:443 entrypoint. Long-running WSS /v1/realtime lives on the dedicated
:8443 entrypoint (templates/ingressroute-api-realtime.yaml).
Pitfall #3 — chart renders NO `kind: Ingress` resources anywhere.
*/}}
{{- /* Plan 14-06 / BYOK-01 — gate the entire Traefik IngressRoute on the new top-level tls.enabled toggle (1:1 with compose/docker-compose.ingress.yml overlay). */ -}}
{{- if .Values.tls.enabled -}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.host.api }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{ $fullname }}-api
          port: 3000
      middlewares:
        - name: {{ $fullname }}-forwarded-headers
          namespace: {{ .Release.Namespace }}
  tls:
    secretName: {{ .Values.tls.apiSecretName }}
{{- end }}
