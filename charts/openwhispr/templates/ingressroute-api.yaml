{{/*
Traefik IngressRoute — api short-JSON routes on :443 (websecure).

Mirrors compose/traefik/dynamic.yml routers `api` (PathPrefix /api) +
`api-audio` (PathPrefix /v1/audio, priority 100 — /v1/audio/diarization
mounts outside /api/* per BACKEND_SPEC.md). Traefik 3 CRD API
(traefik.io/v1alpha1).

Phase 04 Plan 05 lock-in: this route is bound EXCLUSIVELY to the
:443 entrypoint. Long-running WSS /v1/realtime lives on the dedicated
:8443 entrypoint (templates/ingressroute-api-realtime.yaml).
Pitfall #3 — chart renders NO `kind: Ingress` resources anywhere.
*/}}
{{- $fullname := include "openwhispr.fullname" . -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.host.api }}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{ $fullname }}-api
          port: 3000
      middlewares:
        - name: {{ $fullname }}-forwarded-headers
          namespace: {{ .Release.Namespace }}
    - match: Host(`{{ .Values.host.api }}`) && PathPrefix(`/v1/audio`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $fullname }}-api
          port: 3000
      middlewares:
        - name: {{ $fullname }}-forwarded-headers
          namespace: {{ .Release.Namespace }}
  tls:
    secretName: {{ .Values.tls.apiSecretName }}
