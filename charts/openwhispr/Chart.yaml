apiVersion: v2
name: openwhispr
description: |
  OpenWhispr Server — open-source, enterprise-grade, self-hosted backend for the
  OpenWhispr Electron desktop client. Wraps the 18-service compose stack
  (CNPG HA Postgres, Traefik 3, cert-manager, OTel Collector, LiteLLM, optional
  bundled-AI on GPU nodes) into a single Helm chart.
type: application
# Chart version moves together with appVersion per STACK.md convention.
# Phase 15 / Plan 03 (STRUCT-03 Option 3) — chart semver is now decoupled
# from server semver. Chart releases fire on the `chart-v*` tag namespace
# via `.github/workflows/chart-release.yml`; server releases continue on
# `v*` via `.github/workflows/helm-release.yml`. First release on the
# chart-v* lane is 1.0.0.
version: 1.0.0
appVersion: "0.9.0-rc1"
kubeVersion: ">=1.28.0-0"
home: https://github.com/Yambr/openwhispr-server
sources:
  - https://github.com/Yambr/openwhispr-server
keywords:
  - openwhispr
  - transcription
  - speech-to-text
  - litellm
  - whisper
  - self-hosted
maintainers:
  - name: OpenWhispr Maintainers
    url: https://github.com/Yambr/openwhispr-server
annotations:
  # Renders only Cluster-prereq-friendly resources by default. Wave 0 chart
  # ships skeleton only (ServiceAccount + Secrets path). Subsequent waves
  # add Deployments, CNPG Cluster CR, IngressRoutes, etc.
  category: Application
  licenses: FSL-1.1-ALv2
# Sub-chart dependencies. Phase 09 Plan 05 (A5 decision): vendor Bitnami
# Valkey + MinIO via the canonical OCI Helm charts. NOTE the 2024 Bitnami
# license change: the Helm CHARTS themselves remain Apache 2.0, while the
# Bitnami container *images* moved to a hybrid model (Bitnami Secure premium
# tier for hardened/long-LTS variants). Corporate operators that want to
# avoid Bitnami's image stream can override values.valkey.image.* and
# values.minio.image.* to point at their own registry. See
# docs/licensing-bitnami-2024.md for the full corporate-override path
# (including a future Option B: switch to operators rather than sub-charts).
dependencies:
  - name: valkey
    version: "5.6.5"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled
  - name: minio
    version: "17.0.21"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    # Plan 14-06 / BYOK-01 — condition was `minio.enabled`; flipped to the
    # new top-level `storage.enabled` toggle so the Bitnami minio sub-chart
    # render is 1:1 with the `compose/docker-compose.storage.yml` overlay.
    condition: storage.enabled
  # Phase 17 / Plan 03 (TLS-02-prod / TLS-03) — optional cert-manager
  # sub-chart. Default OFF (`certManager.bundled: false`) for brownfield
  # safety — most enterprise clusters already run cert-manager as a
  # platform component. Greenfield operators flip `--set
  # certManager.bundled=true`.
  #
  # No `alias:` — the un-aliased name `cert-manager` maps the sub-chart's
  # values namespace to `.Values.cert-manager` (with a literal hyphen),
  # which is INTENTIONALLY DISJOINT from this chart's existing
  # `.Values.certManager.*` keys. The CONTEXT-recommended camelCase alias
  # was rejected at execution time because cert-manager 1.16.4's
  # `values.schema.json` declares `additionalProperties: false` on the
  # whole sub-chart values document, and aliasing would have caused the
  # sub-chart's schema validator to reject every one of our parent-chart
  # `certManager.bundled / issuerKind / renderIssuer / acmeEmail /
  # acmeStaging / installCRDs` keys. The Plan's `installCRDs` value
  # remains as parent-chart documentation; operators who need it as a
  # sub-chart passthrough set `--set cert-manager.installCRDs=true`.
  # Pinned at 1.16.4 (CONTEXT deferred #4 — no 1.17.x bump until next
  # phase).
  - name: cert-manager
    version: "1.16.4"
    repository: "https://charts.jetstack.io"
    condition: certManager.bundled
