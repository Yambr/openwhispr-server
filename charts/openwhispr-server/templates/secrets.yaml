{{/*
helm-values mode fallback (UNDOCUMENTED in values.yaml per peer-
approved MVP scope — present only so OSS quickstart users who don't
want to manage an external Secret can render one inline by setting:

    secrets:
      mode: helm-values
      values:
        BETTER_AUTH_SECRET: ...
        MASTER_KEK: ...
        TAVILY_API_KEY: ...
        YANDEX_SEARCH_API_KEY: ...
        YANDEX_FOLDER_ID: ...

The default `secrets.mode: external-managed` renders NO Secret here —
the operator pre-creates one whose name matches `secretName` (or the
default `<fullname>-secrets`).
*/}}
{{- if eq .Values.secrets.mode "helm-values" -}}
{{- if not .Values.secrets.values }}
{{- fail "values.secrets.values is required when secrets.mode=helm-values" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwhispr-server.secretsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-server.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret on helm uninstall so Better Auth sessions survive
    # a reinstall (BETTER_AUTH_SECRET regression would invalidate every
    # active session).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
