{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwhispr-server.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Separate ServiceAccount for the migrate pre-install/pre-upgrade Job.
# Rendered as a hook itself (weight -10) so it exists BEFORE the Job's
# pod (weight 0) is admitted. The main app ServiceAccount above is NOT
# a hook because Deployments need it to persist across the entire
# release lifecycle — if it were a hook, `hook-delete-policy` would
# remove it on the next upgrade and orphan the api/web/worker pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwhispr-server.serviceAccountName" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- end }}
