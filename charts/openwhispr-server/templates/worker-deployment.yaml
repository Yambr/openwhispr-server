{{/*
worker Deployment — BullMQ consumer (no HTTP server).

Same env wiring as api/web. Worker has no /healthz endpoint, so all
three probes use a pgrep exec check.
*/}}
{{- $fullname := include "openwhispr-server.fullname" . -}}
{{- $workerTag := default .Chart.AppVersion .Values.image.tag -}}
{{- if .Values.image.worker.tag }}{{- $workerTag = .Values.image.worker.tag -}}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "openwhispr-server.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwhispr-server.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openwhispr-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/{{ .Values.image.worker.repository }}:{{ $workerTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "openwhispr-server.secretsName" . }}
            - configMapRef:
                name: {{ include "openwhispr-server.configName" . }}
            {{- with .Values.s3.envFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.smtp.envFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.auth.envFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "values.database.appUrlSecretRef.name is required" .Values.database.appUrlSecretRef.name }}
                  key: {{ .Values.database.appUrlSecretRef.key }}
            # Quick-task 260524-u00 / Task B2 — worker loud-fails at boot
            # without DATABASE_URL_OWNER (apps/worker/src/index.ts:102 +
            # apps/worker/src/db/app-pool.ts:151-154). Chart 1.0.5 forced
            # operators to extraEnv this — peer's chart-1.0.5 values-yambr.yaml
            # carried the workaround. Wired natively from the same secretRef
            # the migrate Job already uses.
            - name: DATABASE_URL_OWNER
              valueFrom:
                secretKeyRef:
                  name: {{ required "values.database.ownerUrlSecretRef.name is required (worker needs DATABASE_URL_OWNER for BYPASSRLS pool + partman maintenance)" .Values.database.ownerUrlSecretRef.name }}
                  key: {{ .Values.database.ownerUrlSecretRef.key }}
            {{- if .Values.redis.enabled }}
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "values.redis.urlSecretRef.name is required when redis.enabled=true" .Values.redis.urlSecretRef.name }}
                  key: {{ .Values.redis.urlSecretRef.key }}
            {{- end }}
            - name: LITELLM_BASE_URL
              value: {{ required "values.litellm.baseUrl is required" .Values.litellm.baseUrl | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "values.litellm.masterKeySecretRef.name is required" .Values.litellm.masterKeySecretRef.name }}
                  key: {{ .Values.litellm.masterKeySecretRef.key }}
            # Quick-task 260524-u00 / Task B3 — worker-only LITELLM_DATABASE_URL
            # (apps/worker/src/db/litellm-pool.ts:15 — ingest-litellm-spend +
            # reconciliation-daily-check jobs query the LiteLLM database
            # directly, NOT through PgBouncer per Pitfall #9). Optional —
            # only consumed when operator runs external LiteLLM with a
            # dedicated DB; emitted only when secretRef.name is set.
            {{- if .Values.litellm.databaseUrlSecretRef.name }}
            - name: LITELLM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.databaseUrlSecretRef.name }}
                  key: {{ .Values.litellm.databaseUrlSecretRef.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Worker is a pure BullMQ consumer (no Fastify, no /healthz);
          # probes confirm the node process is alive.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f '/app/apps/worker/dist/index.cjs' >/dev/null"
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f '/app/apps/worker/dist/index.cjs' >/dev/null"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f '/app/apps/worker/dist/index.cjs' >/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
