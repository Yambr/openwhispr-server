{{/*
Traefik IngressRoute fallback for the OSS quickstart path. Renders
ONLY when `.Values.ingress.controller == "traefik"`. Operators on any
other ingress controller set `controller: none` (default) and wire
their own Gateway/IngressRoute/Ingress against the api/web Services.

Route layout — single Host(`.Values.ingress.host`) split by PathPrefix:
  - PathPrefix(/api)       -> <fullname>-api:3000  (priority 100)
  - PathPrefix(/v1/audio)  -> <fullname>-api:3000  (priority 100,
                              audio routes mount outside /api per
                              BACKEND_SPEC.md)
  - Catch-all              -> <fullname>-web:3001  (priority 1)
*/}}
{{- if eq .Values.ingress.controller "traefik" -}}
{{- if not .Values.ingress.host }}
{{- fail "values.ingress.host is required when ingress.controller=traefik" }}
{{- end }}
{{- $fullname := include "openwhispr-server.fullname" . -}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openwhispr-server.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $fullname }}-api
          port: 3000
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/v1/audio`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $fullname }}-api
          port: 3000
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      priority: 1
      services:
        - name: {{ $fullname }}-web
          port: 3001
  {{- if .Values.ingress.tls.enabled }}
  tls: {}
  {{- end }}
{{- end }}
