apiVersion: v2
name: openwhispr-server
description: |
  OpenWhispr Server — the api/web/worker control plane for the OpenWhispr
  Electron desktop client. Ships the application Deployments, Services,
  migrate Job, ConfigMap, and ServiceAccount. BYOK-first: bring your
  own Postgres, Redis/Valkey, S3, SMTP, LiteLLM, and OAuth providers via
  externally-managed Kubernetes Secrets — or install the companion
  `openwhispr-postgres` and `openwhispr-litellm` charts.
type: application
# Version 1.0.0 marks the MVP scope first public release per
# .planning/quick/20260523-3chart-split/PLAN.md. The prior
# `oci://ghcr.io/yambr/charts/openwhispr:1.0.{0,1,2}` monolith was
# yanked. NO Chart.yaml dependencies — Postgres, Valkey, LiteLLM, S3,
# SMTP, cert-manager, and ingress controllers are all operator
# prerequisites (BYOK).
version: 1.2.1
appVersion: "1.2.1"
kubeVersion: ">=1.28.0-0"
home: https://github.com/Yambr/openwhispr-server
sources:
  - https://github.com/Yambr/openwhispr-server
keywords:
  - openwhispr
  - transcription
  - speech-to-text
  - self-hosted
  - byok
maintainers:
  - name: OpenWhispr Maintainers
    url: https://github.com/Yambr/openwhispr-server
annotations:
  category: Application
  licenses: FSL-1.1-ALv2
