# Default values for openwhispr-server.
#
# MVP scope. Peer-approved shape — see
# .planning/quick/20260523-3chart-split/SUMMARY.md.
#
# - BYOK-first: every credential lives in an externally-managed
#   Kubernetes Secret. The chart only references those Secrets by name
#   via envFrom / valueFrom; it never renders the Secret material itself
#   in the default `secrets.mode: external-managed` path.
# - Single ingress fallback: `ingress.controller: traefik` for OSS users
#   without an opinion. Operators with an ingress story set
#   `ingress.controller: none` (default) and wire their own Gateway/
#   IngressRoute/Ingress against the api/web Services.
# - Single-node-pinned: replicas default to 1; no HPA, no PDB.

image:
  registry: ghcr.io/yambr
  pullPolicy: IfNotPresent
  # Chart version can diverge from image version (chart shipping
  # template-only fixes between image releases). Override at deploy
  # time if you pin a specific image tag.
  #
  # Chart 1.0.15 + image v1.0.12 — workflow + tooling release: hard
  # pre-push test-evidence gate (quick 260527-pj6). Closes the
  # "tests pass locally but the push happens before tests finish"
  # anti-pattern. Vitest custom reporter (tools/test-evidence-reporter.ts)
  # writes one .test-evidence/<sha>-<project>.json fragment per
  # workspace at end of every `vitest run`; pre-push hook
  # (tools/lint-pre-push-test-evidence.ts) reads stdin in Git
  # pre-push format, enumerates each pushed commit, asserts the
  # full 22-project manifest is covered with exit_code === 0 and
  # zero unannotated `.skip` / `.todo` sites. CI bypass via
  # `GITHUB_ACTIONS=true` / `CI=true`. SKIP-REASON annotation
  # enforced via a separate AST-aware linter; 35 legacy sites carry
  # placeholder annotations pending audit (cross-referenced in
  # `.planning/deferred-items.md`). Workspace reporter inheritance
  # locked by a pre-commit linter (defence-in-depth for
  # `mergeConfig` reporters[] replacement gotcha). BLOCKING from
  # day one — no `--warn-only`, no allowlist; `git push --no-verify`
  # is constitutionally prohibited (CLAUDE.md hard-rule 4 extended).
  # NO runtime behavior change vs v1.0.11 — same wire surface, same
  # DB schema, same admin-claim flow. Operator runbook:
  # `docs/test-evidence-gate.md`.
  #
  # Chart 1.0.14 + image v1.0.11 — Hybrid admin-claim hardening
  # (quick-task 260527-im6). Closes 4 audit findings on the
  # /api/setup/admin onboarding surface:
  #   * HIGH  Dim 5 — role flip is now gated behind verified email
  #     (afterEmailVerification hook) OR a synchronous Bearer-token
  #     branch (OPENWHISPR_SETUP_CLAIM_TOKEN, hex64).
  #   * MEDIUM Dim 8 — pre-claim CSRF window closed by an Origin
  #     allowlist preHandler (canonical INGRESS_BASE_URL +
  #     ADDITIONAL_ALLOWED_ORIGINS, strict-equality).
  #   * MEDIUM Dim 9 — Origin guard also attached to /api/setup-state.
  #   * LOW   O1   — `admin.role_changed` audit row emitted on
  #     EVERY first-admin promotion (Bearer + email branches).
  # Boot-fatal (EX_CONFIG exit 78) when setup_state.status='pending'
  # AND neither claim path is configured. Operators MUST pick one
  # mode at install time — see docs/operations.md §Admin Claim Modes.
  # New optional values.yaml knob: `setupClaim.tokenSecretRef` (see
  # below).
  #
  # Chart 1.0.13 + image v1.0.10 — workflow-only release: GitHub
  # Releases page now surfaces a Release object per image tag (v*) with
  # multi-arch pull commands for all 6 GHCR images + paired-chart xref,
  # AND enriches the chart-tag (openwhispr-server-*) Release body with
  # helm pull / install snippets + paired-image xref. NO runtime
  # behavior change vs v1.0.9 — same realtime ?language= query +
  # REALTIME_DEFAULT_LANGUAGE env fallback, same DB schema, same wire
  # surface. Tagging this revision exists solely to fire the modified
  # workflows in CI and verify the Release page output end-to-end.
  # See .planning/quick/260526-pxb-release-page-image-chart-visibility/.
  #
  # Chart 1.0.12 + image v1.0.9 — realtime `?language=` query +
  # `REALTIME_DEFAULT_LANGUAGE` env fallback (peer wd6g78xz prod
  # incident 2026-05-26 follow-up, Yambr fork). The immutable cloud
  # OpenWhispr client connects to /v1/realtime with no language hint;
  # OpenAI's GA decoder auto-detects per VAD segment and on short
  # Russian utterances frequently latches onto Maltese / Korean /
  # Japanese / Hindi, producing garbage transcripts. The server now
  # surfaces a `language` field on
  # `session.audio.input.transcription` in the relay-originated GA
  # `session.update`, resolved per-WSS-upgrade from `?language=` query
  # (preferred; requires openwhispr client ≥ v1.7.9 — peer wd6g78xz
  # ships the client patch in parallel) → `REALTIME_DEFAULT_LANGUAGE`
  # env (fallback) → omit (OpenAI auto-detect). Whitelist for v1 is
  # `'en' | 'ru'` matching the DB `users.locale` CHECK constraint;
  # widening is a future migration. Operators on a single-language
  # tenant set `REALTIME_DEFAULT_LANGUAGE=ru` in their server Secret
  # to fix the user immediately, BEFORE the client patch propagates.
  # Boot-fatal (EX_CONFIG exit 78) if the env value is not in the
  # whitelist — operators see the typo rather than silently falling
  # through. NO values.yaml schema changes from chart 1.0.11; the env
  # var rides on the operator's existing app Secret (envFrom).
  #
  # Chart 1.0.11 + image v1.0.8 — realtime translate passthrough fix
  # (peer wd6g78xz prod incident 2026-05-26). Server's
  # translateUpstreamToClient previously renamed upstream GA
  # `session.created` to Beta `transcription_session.created` (and
  # session.updated likewise, with payload flatten). The actually-shipping
  # immutable OpenWhispr / Yambr-fork desktop client speaks OpenAI
  # Realtime GA throughout (client switch table handles
  # `case "session.created"` / `case "session.updated"`; zero references
  # to `transcription_session.*`). Prior Beta-rename landed the client
  # switch on the default branch, pendingResolve never fired, 15s WSS
  # connection timeout, 0 transcription frames received in real-mic
  # tests on prod k8s. translateUpstreamToClient is now full passthrough
  # for the upstream→client leg; translateClientToUpstream unchanged
  # (the legacy transcription_session.update→session.update rewrite
  # remains as defence-in-depth for any future Beta-speaking client).
  # No chart-side env-var or values changes required for operators —
  # pure server code fix.
  #
  # Chart 1.0.10 + image v1.0.7 — LEAK 1 fix coordinated with openwhispr
  # client v1.7.8 (peer wd6g78xz, 2026-05-25). Two atomic pieces:
  #   1. Three canonical `openwhispr-*` model aliases land in
  #      compose/litellm/litellm_config.yaml:
  #        * openwhispr-default   → groq/whisper-large-v3 (STT)
  #        * openwhispr-reason    → openrouter/openai/gpt-4o-mini (chat)
  #        * openwhispr-realtime  → openai/gpt-realtime (WSS realtime)
  #   2. `/api/stt-config:defaultModel` env default flips from the
  #      upstream OpenAI alias `whisper-1` to the canonical
  #      `openwhispr-default`. Lockdown-branded desktop builds that
  #      consume defaultModel directly (openwhispr v1.7.8 Settings UI)
  #      stop leaking the upstream-provider name. The alias mapping
  #      stays in LiteLLM config out of the client's view; operators
  #      that wire a different upstream (e.g. internal Bedrock,
  #      Speaches, AssemblyAI) keep `STT_DEFAULT_MODEL=<their-alias>`
  #      and the resolver chain picks it up unchanged.
  # The legacy upstream-shaped aliases (whisper-large-v3, gpt-4o-mini,
  # realtime-default, gpt-realtime, etc.) are retained for backward
  # compatibility with desktop builds < v1.7.8. The codegen sentinel
  # (packages/litellm-client/src/litellm-aliases.generated.json) is
  # regenerated by the prebuild hook on api/worker image builds so the
  # provider-detection lookup table stays in sync. No values.yaml
  # schema changes from chart 1.0.9.
  #
  # Chart 1.0.9 + image v1.0.6 — 4 post-F8 follow-up seeds atomic release.
  #   * SEED-F8-UX: expired verify-email link returns HTML 302 redirect to
  #     /sign-in?error=link-expired for browser flows (Accept: text/html
  #     or Sec-Fetch-Site: none), replacing the raw JSON 401 envelope a
  #     real user complained about 2026-05-25 18:08 UTC. API consumers
  #     (Accept: application/json) keep the canonical envelope.
  #   * SEED-F-LOCALE: POST /api/locale now emits BOTH `i18next` and
  #     `NEXT_LOCALE` Set-Cookie headers (peer reported chart 1.0.8
  #     emitted no Set-Cookie at all). httpOnly:false so document.cookie
  #     surfaces them to the LanguageSwitcher (locale is preference, not
  #     credential). Closes the bilingual-launch promise on the web.
  #   * SEED-37: worker `import.meta.url` CJS guard verified already
  #     shipped in v1.0.4 (`_resolveHere` helper); operator workaround
  #     `LOCALES_DIR=/app/apps/worker/dist/i18n/locales` in overlay can
  #     be removed — `__dirname` is bundled by tsup correctly.
  #   * SEED-47: docs/operations.md now carries the Resend domain-
  #     verification runbook (DKIM/SPF DNS records → SMTP_FROM flip).
  #     No code change; operator-side DNS work.
  # Zero values.yaml schema changes from chart 1.0.8 for operators.
  #
  # Chart 1.0.8 + image v1.0.5 — F8 verify-email web-flow callback fix.
  # R22 (image v1.0.4) introduced /api/auth/verify-email-complete that
  # 302s to the Electron desktop auth-bridge loopback listener — correct
  # for desktop clients, broken for web users (dead loopback in browser).
  # F8 preserves the original sign-up callbackURL as ?origin= state-param
  # on the verification link; the route branches on origin to route web
  # users back to /sign-in?verified=1 (cookie already in browser jar).
  # Adds a Sec-Fetch-Site: none fallback for legacy emails shipped before
  # the fix (24h transition window per Better Auth default expiresIn).
  # Discovered live on openwhispr.yambr.com 2026-05-25 by operator gitops;
  # zero env-var / values changes required for operator — pure code fix.
  #
  # Chart 1.0.7 lineage (kept here for upgrade-path documentation):
  #   F1 api DATABASE_URL_OWNER Deployment projection (first-run /setup
  #   admin onboarding 404 fix on top of chart 1.0.6).
  # Chart 1.0.6 lineage:
  #   B1 worker probe path / B2 DATABASE_URL_OWNER worker+migrate /
  #   B3 LITELLM_DATABASE_URL / B3b OPENWHISPR_DEPLOYMENT_MODE ConfigMap +
  #   image v1.0.4 (A1 byok-guard export / A2 email k8s bypass / A3 worker
  #   CJS guard / A4 worker VALKEY_URL parser / A5 POST /api/locale).
  # Companion openwhispr-postgres chart 1.1.0 ships the rolconfig fix (B4).
  # 1.1.0 — chart + app version lines REALIGNED to a single number from here
  # on (chart version == appVersion == image tag; the prior +3 chart drift is
  # retired — health `version` now matches the chart you deployed). Ships two
  # managed-Postgres / web-SSO upstream follow-ups (peer gr0flvsr; Quick
  # 260602-x6z + 260603-j3a). (#4) fresh `migrate` now
  # succeeds under a SINGLE NOBYPASSRLS role: the 1.0.20 claim-driven RLS fix
  # (migration 0033) was a retrofit on the final policy state, so on a clean
  # DB the 0006 tenant_settings seed INSERT ran under FORCE RLS before 0033's
  # bypass arm existed -> 42501 unless owner had BYPASSRLS. The migrate runner
  # now sets app.bypass=on + app.tenant_id=<default> on the migrate pool ONLY
  # (never the app pool — RLS stays full-force for app traffic), and 0006's
  # policies are bypass-aware at creation. (#6) web SSO genericOAuth now
  # requests scopes: the provider registration carried no `scopes`, so Better
  # Auth sent an empty scope= to the IdP -> no openid -> no id_token -> web
  # sign-in could not complete. Default openid/email/profile, new OIDC_SCOPES
  # CSV override (openid always included), JIT group scope appended when
  # OIDC_TENANT_CLAIM is set — bringing the web path into parity with the
  # desktop sign-in flow. No DB-schema/wire/web change beyond the additive
  # OIDC_SCOPES env.
  # 1.0.20 — managed-Postgres / external-LiteLLM deploy compat (3 upstream
  # blockers; Quick 260602-eth/fda/j9z). (#3) SPEND_RECONCILIATION_ENABLED:
  # the worker boots without LITELLM_DATABASE_URL and never connects to
  # LiteLLM's own DB unless reconciliation is explicitly opted in. (#1)
  # audit_log migration auto-detects pg_partman — present => monthly
  # auto-rotation, absent => native audit_log_default DEFAULT partition (so
  # auth.signin works on a managed PG with no partman); AUDIT_LOG_DISABLED=1
  # kill-switch. (#2) claim-driven app.bypass RLS (migration 0033): the
  # privileged/cross-tenant path (bootstrap + worker system jobs) uses a
  # transaction-scoped app.bypass GUC instead of a BYPASSRLS role attribute,
  # so a SINGLE NOBYPASSRLS role (corporate svcdb_*) runs every path; tenant
  # isolation preserved (81-case NOBYPASSRLS property proof). DATABASE_APP_ROLE
  # / DATABASE_OWNER_ROLE let a custom-named role inherit the GRANT chain.
  # See docs/security.md §11.2. No wire/web change.
  # 1.0.19 — diarization Speaches passthrough Authorization fix (Quick
  # 260601-d1a): the /v1/audio/diarization Speaches branch (gated by
  # SPEACHES_DIARIZATION_URL) now sends Authorization: Bearer <key> on its
  # outbound POST, fixing a 401 when the diarization endpoint is fronted by a
  # corporate LiteLLM gateway (pass_through_endpoints auth:true). The key is
  # resolved with litellm-client HI-2 precedence: SPEACHES_DIARIZATION_API_KEY
  # (new optional override) -> LITELLM_VIRTUAL_KEY -> LITELLM_MASTER_KEY; no
  # key set -> no header (back-compat with the bundled open Speaches
  # container). api-image-only change; no DB/schema/wire/web change. Operators
  # already running with LITELLM_MASTER_KEY (or LITELLM_VIRTUAL_KEY) need no
  # config change — the fallback picks the existing key up automatically.
  # 1.0.18 — public /download page on the web console (Quick 260531-dlx):
  # new no-auth /download route fetches the latest desktop installer from the
  # Yambr/openwhispr GitHub releases (1h cache, graceful releases-picker
  # fallback if GitHub is unreachable), detects the visitor's OS and surfaces
  # a per-platform download chooser (mac arm64/x64, win installer/portable,
  # linux AppImage/deb/tar.gz). Also fixes two stale frontend refs: the admin
  # Config "Override docs" button now points at the GitHub blob URL (was a
  # 404 in-app /docs/* path), and the AuthShell footer version badge reads
  # NEXT_PUBLIC_APP_VERSION (was a hardcoded v1.0.4). Web-only; no DB/auth/
  # schema/wire change.
  # 1.0.17 — two operator-facing config surfaces + CI/lint hardening:
  # (a) OIDC_PROVIDER_NAME (#43) — operator-configurable label for the
  # generic-OIDC sign-in button (was a hardcoded string the desktop +
  # web clients rendered verbatim); (b) REASONING_MODEL_PARAMS (#44) —
  # per-model chat-param extras bag, litellm-style env-JSON, so reasoning
  # backends get model-specific knobs (e.g. temperature/enable_thinking)
  # without an adapter layer or request-body merge. Plus a cleanup-shape
  # no-rephrase regression guard (#42) and a robust lint-migrations squawk
  # JSON parser (#46). Additive env only — no DB/auth/schema/wire change.
  # 1.0.16 — OIDC SSO Just-In-Time provisioning (Phase 69, PR #38): users
  # are auto-provisioned with tenant + role mapped from id_token claims on
  # first SSO sign-in (web genericOAuth + desktop mint-bearer paths share
  # one resolveJitDecision). Proven 7/7 @cjm-sso against a live Keycloak 26.
  # Hardening: new-user JIT into a non-default tenant now refused as a typed
  # 403 forbidden_tenant_mismatch (was an RLS-500 leak); OIDC_TENANT_CLAIM/
  # MAPPING/GROUP_CLAIM/ROLE_MAPPING/DEFAULT_ROLE/ROLE_PRIORITY/
  # REVOCATION_MODE now wired through compose env. Additive migration 0032
  # (audit_log SSO actions). No change to existing auth/DB surfaces.
  # 1.0.15 — agent stream content-chunk-before-error fix (260528-fzu):
  # server now emits a type:content chunk carrying the error text BEFORE
  # the structured type:error chunk so the immutable desktop client (which
  # only renders content/tool_calls/tool_result) shows the error in the
  # chat bubble. Structured error chunk shape unchanged. No DB/auth/schema
  # change.
  # 1.0.14 — /api/health build-info fields (260528-370): version /
  # commit_sha / image_tag additive widening for live rollout
  # verification (peer 9zn786o0 request after v1.0.13 RED live-verify
  # confused operators about which image was serving each replica).
  # See docs/operations.md "Live version verification" section. Strictly
  # additive on the wire; the Electron client parser is unaffected.
  # NO runtime behavior change beyond the three additive fields — same
  # auth surface, same DB schema, same admin-claim flow as v1.0.13.
  # 1.0.13 — agent stream type:"error" wire contract fix (260528-0cm);
  # previously 1.0.12 emitted opaque done.upstream_error chunks that the
  # desktop client could not render. See docs/operations.md "Agent stream
  # error contract" section for the wire envelope + AgentErrorCode
  # taxonomy + log event schema.
  tag: "1.2.6"
  api:     { repository: openwhispr-api }
  web:     { repository: openwhispr-web }
  worker:  { repository: openwhispr-worker }
  # NOTE: migrate Job reuses the api image (migrate.cjs is bundled there).
  # No separate openwhispr-migrate image is published.

secrets:
  # external-managed (default): chart renders NO Secret resource. The
  # operator pre-creates a Secret whose name matches `secretName` (or
  # the default `<fullname>-secrets`) carrying BETTER_AUTH_SECRET,
  # MASTER_KEK, TAVILY_API_KEY, YANDEX_SEARCH_API_KEY,
  # YANDEX_FOLDER_ID. The api/web/worker Deployments pull those keys
  # via envFrom.
  mode: external-managed
  secretName: ""  # default <fullname>-secrets

database:
  # DATABASE_URL — runtime app role connection (rwx app schema).
  # Operator pre-creates the Secret (typically by the companion
  # openwhispr-postgres chart) and points this ref at the key holding
  # the full postgres:// URL.
  appUrlSecretRef:   { name: "", key: "app-url" }
  # DATABASE_URL_OWNER — owner-role connection consumed by the migrate
  # Job ONLY (Drizzle DDL bypasses PgBouncer transaction-mode).
  ownerUrlSecretRef: { name: "", key: "owner-url" }

redis:
  enabled: true
  # VALKEY_URL — Redis/Valkey connection URL. Gated on `redis.enabled`.
  urlSecretRef: { name: "", key: "url" }

litellm:
  # Plain env value — LITELLM_BASE_URL points at the operator's
  # LiteLLM proxy (in-cluster Service URL, BYOK external host, etc.).
  baseUrl: ""
  # LITELLM_MASTER_KEY — proxy auth credential.
  masterKeySecretRef: { name: "", key: "master-key" }
  # Quick-task 260524-u00 / Task B3 — LITELLM_DATABASE_URL (worker-only,
  # optional). Wired into the worker Deployment ONLY when
  # `databaseUrlSecretRef.name` is non-empty. Used by ingest-litellm-spend
  # and reconciliation-daily-check jobs to query the LiteLLM database
  # directly (NOT through PgBouncer — Pitfall #9). Leave name="" when the
  # operator runs the companion embedded-LiteLLM mode (single shared
  # Postgres, no separate spend DB).
  databaseUrlSecretRef: { name: "", key: "url" }

# S3 / object storage. envFrom pulls S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY, S3_SECRET_KEY (and any other S3_* keys the operator
# puts in the Secret).
s3:
  envFromSecret: ""

# SMTP. envFrom pulls SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD,
# SMTP_FROM (and any other SMTP_* keys).
smtp:
  envFromSecret: ""

# OAuth / OIDC providers. envFrom pulls OAUTH_* and OIDC_* keys.
auth:
  envFromSecret: ""

# Quick-task 260527-im6 — admin-claim mode selector. When `setupClaim.tokenSecretRef.name`
# is set, the chart projects `OPENWHISPR_SETUP_CLAIM_TOKEN` into the api Deployment
# environment from the referenced Kubernetes Secret. The server then runs in Mode A
# (env-token mode): POST /api/setup/admin requires `Authorization: Bearer <hex64>`
# matching the projected value. When unset, the chart projects no env var; the server
# runs in Mode B (verified-email mode) provided SMTP_HOST is configured via your
# `auth.envFromSecret` Secret. See docs/operations.md §Admin Claim Modes.
#
# Boot-fatal (EX_CONFIG exit 78) when setup_state.status='pending' AND neither
# OPENWHISPR_SETUP_CLAIM_TOKEN nor SMTP_HOST is configured.
setupClaim:
  tokenSecretRef: {}
  # Example (override at install):
  # tokenSecretRef:
  #   name: openwhispr-setup-claim
  #   key: token

ingress:
  controller: none  # | traefik (fallback for OSS)
  host: ""
  tls: { enabled: false }

api:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  # api-specific env appended AFTER shared .Values.extraEnv. Use when
  # api and worker need different values for the same key (e.g.
  # LOCALES_DIR — api bundle is ESM with import.meta.url, worker is CJS
  # and needs an explicit path).
  extraEnv: []
  # Override the path used by startup/readiness/liveness probes.
  # Default `/api/health` is correct for all current apps/api routes;
  # the dedicated `/api/live` route does NOT exist as of 1.0.5.
  healthCheck:
    path: "/api/health"

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  extraEnv: []

worker:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  extraEnv: []

migrate:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

observability:
  serviceMonitor: { enabled: false, namespace: "", labels: {} }

# Non-secret env shared by all three Deployments, rendered into the
# chart-owned ConfigMap.
env:
  NODE_ENV: production
  LOG_LEVEL: info
  # Quick-task 260524-u00 / Task B3b — bake into chart-owned ConfigMap.
  # OPENWHISPR_DEPLOYMENT_MODE=k8s opts out of the compose-era BYOK
  # guards baked into the api container entrypoint (apps/api/scripts/
  # check-default-secrets.ts) AND the boot-time @openwhispr/byok-guard
  # (packages/byok-guard/src/index.ts) AND the @openwhispr/email
  # production SMTP loud-fail (packages/email/src/EmailSender.ts —
  # quick-260524-u00-A2 k8s-mode bypass added there). Compose-era
  # POSTGRES_OWNER_PASSWORD / VALKEY_PASSWORD / TRAEFIK_ADMIN_PASSWORD
  # / SMTP_HOST contracts do not apply in Kubernetes deployments —
  # operators bind credentials via Kubernetes Secrets, lifecycle
  # managed by CNPG / SealedSecrets / external-secrets-operator. The
  # in-app crypto roots (MASTER_KEK + BETTER_AUTH_SECRET) remain
  # required and deny-list-enforced — those gates are preserved.
  OPENWHISPR_DEPLOYMENT_MODE: k8s

# Extra env entries — each item may be `{name, value}` or
# `{name, valueFrom}` (any Kubernetes envVar shape).
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
