# Default values for openwhispr-server.
#
# MVP scope. Peer-approved shape — see
# .planning/quick/20260523-3chart-split/SUMMARY.md.
#
# - BYOK-first: every credential lives in an externally-managed
#   Kubernetes Secret. The chart only references those Secrets by name
#   via envFrom / valueFrom; it never renders the Secret material itself
#   in the default `secrets.mode: external-managed` path.
# - Single ingress fallback: `ingress.controller: traefik` for OSS users
#   without an opinion. Operators with an ingress story set
#   `ingress.controller: none` (default) and wire their own Gateway/
#   IngressRoute/Ingress against the api/web Services.
# - Single-node-pinned: replicas default to 1; no HPA, no PDB.

image:
  registry: ghcr.io/yambr
  pullPolicy: IfNotPresent
  # Chart version can diverge from image version (chart shipping
  # template-only fixes between image releases). Override at deploy
  # time if you pin a specific image tag.
  #
  # Chart 1.0.6 + image v1.0.4 ship the quick-260524-u00-eight-fixes
  # batch atomically: chart-side (B1 worker probe path, B2 DATABASE_URL_OWNER
  # wiring, B3 LITELLM_DATABASE_URL secretRef, B3b OPENWHISPR_DEPLOYMENT_MODE
  # baked into ConfigMap) + image-side (A2 email k8s-mode bypass, A3 worker
  # CJS import.meta guard, A4 worker VALKEY_URL parser, A5 POST /api/locale).
  # Companion openwhispr-postgres chart 1.1.0 ships the rolconfig fix (B4).
  # Operators MUST have image v1.0.4 published BEFORE installing chart 1.0.6 —
  # the release pipeline pushes v1.0.4 image tags FIRST, then chart-v1.0.6.
  tag: "1.0.4"
  api:     { repository: openwhispr-api }
  web:     { repository: openwhispr-web }
  worker:  { repository: openwhispr-worker }
  # NOTE: migrate Job reuses the api image (migrate.cjs is bundled there).
  # No separate openwhispr-migrate image is published.

secrets:
  # external-managed (default): chart renders NO Secret resource. The
  # operator pre-creates a Secret whose name matches `secretName` (or
  # the default `<fullname>-secrets`) carrying BETTER_AUTH_SECRET,
  # MASTER_KEK, PYANNOTE_API_KEY, TAVILY_API_KEY, YANDEX_SEARCH_API_KEY,
  # YANDEX_FOLDER_ID. The api/web/worker Deployments pull those keys
  # via envFrom.
  mode: external-managed
  secretName: ""  # default <fullname>-secrets

database:
  # DATABASE_URL — runtime app role connection (rwx app schema).
  # Operator pre-creates the Secret (typically by the companion
  # openwhispr-postgres chart) and points this ref at the key holding
  # the full postgres:// URL.
  appUrlSecretRef:   { name: "", key: "app-url" }
  # DATABASE_URL_OWNER — owner-role connection consumed by the migrate
  # Job ONLY (Drizzle DDL bypasses PgBouncer transaction-mode).
  ownerUrlSecretRef: { name: "", key: "owner-url" }

redis:
  enabled: true
  # VALKEY_URL — Redis/Valkey connection URL. Gated on `redis.enabled`.
  urlSecretRef: { name: "", key: "url" }

litellm:
  # Plain env value — LITELLM_BASE_URL points at the operator's
  # LiteLLM proxy (in-cluster Service URL, BYOK external host, etc.).
  baseUrl: ""
  # LITELLM_MASTER_KEY — proxy auth credential.
  masterKeySecretRef: { name: "", key: "master-key" }
  # Quick-task 260524-u00 / Task B3 — LITELLM_DATABASE_URL (worker-only,
  # optional). Wired into the worker Deployment ONLY when
  # `databaseUrlSecretRef.name` is non-empty. Used by ingest-litellm-spend
  # and reconciliation-daily-check jobs to query the LiteLLM database
  # directly (NOT through PgBouncer — Pitfall #9). Leave name="" when the
  # operator runs the companion embedded-LiteLLM mode (single shared
  # Postgres, no separate spend DB).
  databaseUrlSecretRef: { name: "", key: "url" }

# S3 / object storage. envFrom pulls S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY, S3_SECRET_KEY (and any other S3_* keys the operator
# puts in the Secret).
s3:
  envFromSecret: ""

# SMTP. envFrom pulls SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD,
# SMTP_FROM (and any other SMTP_* keys).
smtp:
  envFromSecret: ""

# OAuth / OIDC providers. envFrom pulls OAUTH_* and OIDC_* keys.
auth:
  envFromSecret: ""

ingress:
  controller: none  # | traefik (fallback for OSS)
  host: ""
  tls: { enabled: false }

api:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  # api-specific env appended AFTER shared .Values.extraEnv. Use when
  # api and worker need different values for the same key (e.g.
  # LOCALES_DIR — api bundle is ESM with import.meta.url, worker is CJS
  # and needs an explicit path).
  extraEnv: []
  # Override the path used by startup/readiness/liveness probes.
  # Default `/api/health` is correct for all current apps/api routes;
  # the dedicated `/api/live` route does NOT exist as of 1.0.5.
  healthCheck:
    path: "/api/health"

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  extraEnv: []

worker:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  extraEnv: []

migrate:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

observability:
  serviceMonitor: { enabled: false, namespace: "", labels: {} }

# Non-secret env shared by all three Deployments, rendered into the
# chart-owned ConfigMap.
env:
  NODE_ENV: production
  LOG_LEVEL: info
  # Quick-task 260524-u00 / Task B3b — bake into chart-owned ConfigMap.
  # OPENWHISPR_DEPLOYMENT_MODE=k8s opts out of the compose-era BYOK
  # guards baked into the api container entrypoint (apps/api/scripts/
  # check-default-secrets.ts) AND the boot-time @openwhispr/byok-guard
  # (packages/byok-guard/src/index.ts) AND the @openwhispr/email
  # production SMTP loud-fail (packages/email/src/EmailSender.ts —
  # quick-260524-u00-A2 k8s-mode bypass added there). Compose-era
  # POSTGRES_OWNER_PASSWORD / VALKEY_PASSWORD / TRAEFIK_ADMIN_PASSWORD
  # / SMTP_HOST contracts do not apply in Kubernetes deployments —
  # operators bind credentials via Kubernetes Secrets, lifecycle
  # managed by CNPG / SealedSecrets / external-secrets-operator. The
  # in-app crypto roots (MASTER_KEK + BETTER_AUTH_SECRET) remain
  # required and deny-list-enforced — those gates are preserved.
  OPENWHISPR_DEPLOYMENT_MODE: k8s

# Extra env entries — each item may be `{name, value}` or
# `{name, valueFrom}` (any Kubernetes envVar shape).
extraEnv: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
