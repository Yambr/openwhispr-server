# Example: yambr deployment (peer-approved Secret naming).
#
# This values file is the canonical reference for the BYOK / external-
# managed Secret layout. Operators pre-create six Kubernetes Secrets
# (see `kubectl create secret generic …` snippets in README) and the
# chart wires every env binding via secretKeyRef / envFrom.

secrets:
  mode: external-managed
  secretName: openwhispr-server-secrets

database:
  appUrlSecretRef:
    name: openwhispr-database
    key: app-url
  ownerUrlSecretRef:
    name: openwhispr-database
    key: owner-url

redis:
  enabled: true
  urlSecretRef:
    name: openwhispr-redis
    key: url

litellm:
  baseUrl: http://openwhispr-litellm:4000
  masterKeySecretRef:
    name: openwhispr-litellm
    key: master-key

s3:
  envFromSecret: openwhispr-s3

smtp:
  envFromSecret: openwhispr-smtp

auth:
  envFromSecret: openwhispr-auth

# Operator brings own ingress; chart renders no Ingress/IngressRoute/
# Gateway resources.
ingress:
  controller: none

# Single-node RKE2; replicas pinned.
api:
  replicas: 1
web:
  replicas: 1
worker:
  replicas: 1

observability:
  serviceMonitor:
    enabled: false

# BYOK LiteLLM (external): SKIP_LITELLM_DB_AUTOCREATE=1 tells the migrate
# Job not to attempt CREATE DATABASE for an embedded LiteLLM instance.
# Without this flag, the migrate Job errors out with
# `permission denied to create database (SQLSTATE 42501)` because the
# CNPG-managed owner role does not have CREATEDB privilege by default.
# Operators running the companion `openwhispr-litellm` chart (embedded
# mode, single shared Postgres) leave this unset — the migrate Job
# creates the `litellm` database alongside `openwhispr` on first install.
#
# OPENWHISPR_DEPLOYMENT_MODE=k8s opts out of the compose-era BYOK guards
# baked into the api container ENTRYPOINT (apps/api/scripts/check-default-
# secrets.ts) and the boot-time byok-guard (packages/byok-guard). In k8s
# deployments Postgres / Valkey / MinIO / Traefik / Grafana / age-backup
# credentials are operator-managed via Kubernetes Secrets bound to
# platform primitives (CNPG, ServiceMonitor, HTTPRoute, snapshot-based
# backups, etc.) and the compose-era POSTGRES_OWNER_PASSWORD /
# VALKEY_PASSWORD / TRAEFIK_ADMIN_PASSWORD env contract does not apply.
# MASTER_KEK + BETTER_AUTH_SECRET deny-list enforcement is preserved
# in k8s mode — both are in-app crypto roots.
extraEnv:
  - name: SKIP_LITELLM_DB_AUTOCREATE
    value: "1"
  # OPENWHISPR_DEPLOYMENT_MODE=k8s is now baked into the chart-owned
  # ConfigMap (values.yaml `env:` block; chart 1.0.6+). Removed from
  # extraEnv to avoid the redundant double-projection. Operators on
  # chart 1.0.5 or earlier MUST keep it here until they upgrade.
