# Postgres tuning overlay for the load-test profiles (Phase 08 / Plan 05).
#
# Mounted read-only at /etc/postgresql/postgresql.conf under
# docker-compose.load-test.yml. The compose `command:` selects this file
# via `-c config_file=/etc/postgresql/postgresql.conf` so postgres boots
# with these settings ONLY when the load-test profile is active. The
# default profile keeps the upstream postgres:17.5-alpine defaults.
#
# Sized for SCALE-02 (1000 concurrent active users) with 4-instance
# PgBouncer scale-out (4 x default_pool_size=100 = 400 server-side
# connections) + worker + migrate + headroom = 500 max_connections.
#
# Memory settings tuned for a Docker Desktop host with >= 24 GB RAM
# (preflight.sh verifies this floor). On smaller hosts the operator
# should NOT run the load-test profile.
#
# Refs:
#   * 01-RESEARCH-INFRA.md §4 — pooler + connection budget analysis
#   * .planning/phases/08-load-test-tuning-slo-publication/08-RESEARCH.md
#     §Pattern 3 — 4x PgBouncer scale-out rationale

# ---- Connection budget ----
max_connections = 500
superuser_reserved_connections = 5

# ---- Memory ----
# shared_buffers ~ 25% of available RAM; load-test target is single-host
# 24 GB so 4 GB is a comfortable floor.
shared_buffers = 4GB
# effective_cache_size signals the planner about OS-level page cache.
effective_cache_size = 12GB
# Per-operation work_mem; 500 connections x 16MB worst-case = 8GB ceiling
# but most queries use far less. Drizzle's INSERT/UPDATE workload is
# memory-frugal.
work_mem = 16MB
maintenance_work_mem = 512MB

# ---- WAL / checkpoint tuning ----
# Higher max_wal_size reduces checkpoint frequency under burst write
# load (token rotation + audit_log inserts).
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ---- Planner ----
random_page_cost = 1.1      # SSD-backed
effective_io_concurrency = 200

# ---- Logging (load-test diagnostics) ----
log_min_duration_statement = 250ms
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on

# ---- Autovacuum ----
# More aggressive under sustained write load.
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
