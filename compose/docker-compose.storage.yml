# Phase 14 / Plan 14-03 — Storage overlay.
#
# Re-introduces MinIO (S3-compatible object storage) that slim-core
# stripped from base. Layer when you want a local S3 endpoint for
# attachments / future BYO-storage flows:
#
#   docker compose -f docker-compose.yml -f compose/docker-compose.storage.yml up -d
#
# Re-injects on the slim-core api:
#   - depends_on.minio: service_healthy
#   - S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET defaults so the
#     api wires through to the bundled minio out of the box. Operators that
#     point at a real S3-compatible store override these in `.env`.

services:
  api:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BUCKET: ${S3_BUCKET:-openwhispr}
    # Phase 20 / SR-20.1 + SR-20.2 — re-declare in overlay (T-20-03).
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    networks: [openwhispr_internal]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001", "--address", ":9000"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Phase 20 / SR-20.1 + SR-20.2 — memory cap + auto-restart (audit A6).
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  minio_data:
