# Traefik v3 static config — file provider only (D-31). No Docker provider.
#
# Phase 04 Plan 05 — TWO TLS entrypoints (SCALE-05 / T-04-02 mitigation):
#   :443  websecure          — short-JSON routes; Traefik 3 defaults
#                              (readTimeout 60s, writeTimeout 0, idleTimeout
#                              180s). Reverted from the prior shared
#                              long-timeout regime that exposed every JSON
#                              route on :443 to ingress-pool exhaustion
#                              under WSS load.
#   :8443 websecure-realtime — long-running WSS realtime sessions ONLY.
#                              respondingTimeouts (readTimeout 0, writeTimeout
#                              0, idleTimeout 3600s) cover the 1h ceiling
#                              demanded by BACKEND_SPEC.md L788-L791.
#
# Cert reuse (D-21 / RESEARCH §2.3): both entrypoints declare `http.tls: {}`
# so Traefik loads `tls.certificates` from dynamic.yml — a SHARED list. No
# DNS-01, no entrypoint-specific cert minting. Operator K8s topology
# (Phase 04 plan 10) maps the same logic to cert-manager.
#
# Phase 17 / Plan 03 (TLS-02 / TLS-03): ACME HTTP-01 resolver `letsencrypt`
# added below (env-driven `LETSENCRYPT_EMAIL` + `LETSENCRYPT_CA_SERVER`).
# Resolver is INERT until a router opts in via `tls.certResolver: letsencrypt`
# in `compose/traefik/dynamic.prod.yml`; the dev profile (`dynamic.yml` +
# `dynamic.dev.yml`) keeps using the mkcert-provisioned `/certs/local.crt`
# byte-for-byte unchanged.

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: ping

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          # Phase 2 Plan 04 (WIRE-20): permanent → 308. PROJECT.md hard
          # rule: HTTPS-only on every externally reachable port. Plain
          # HTTP requests are 308'd; the `web` entrypoint exists ONLY
          # for the redirect (no router targets `web` directly).
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
    # Phase 02.19 — trust X-Forwarded-For ONLY from RFC 1918 private CIDRs.
    # Closes Group F end-to-end (cascade tail from 02.18 D-DISC): the
    # contract-test runner inside `openwhispr_internal` (Docker default
    # bridge, allocates within 172.16.0.0/12) can now have its per-fixture
    # XFF preserved end-to-end so Better Auth's rate-limiter buckets per
    # synthetic test IP. Production safety: external clients on real
    # public IPs are NOT in any of these ranges, so Traefik continues to
    # overwrite their XFF with the immediate socket IP — abuse vector
    # remains closed. CIDRs strictly RFC 1918 (no CGNAT, no loopback,
    # no 0.0.0.0/0). See tests/integration/traefik-forwarded-headers.test.ts.
    forwardedHeaders:
      trustedIPs:
        - 10.0.0.0/8       # RFC 1918 Class A private
        - 172.16.0.0/12    # RFC 1918 Class B private (Docker default bridge pool)
        - 192.168.0.0/16   # RFC 1918 Class C private
    # Phase 04 Plan 05 — :443 reverted to Traefik 3 defaults. The prior
    # multi-thousand-second read/write timeouts (originally added to give
    # /v1/realtime 1h headroom) are GONE; long-running WSS now lives on
    # :8443 via the websecure-realtime entrypoint below. Short-JSON routes
    # on :443 can no longer hold ingress-pool slots for an hour
    # (T-04-02 mitigation).
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0
        idleTimeout: 180s
  # Phase 04 Plan 05 — websecure-realtime entrypoint (SCALE-05).
  # Dedicated TLS entrypoint on :8443 carrying ONLY long-running WSS
  # realtime sessions (api-realtime router in dynamic.yml binds here
  # exclusively). respondingTimeouts: readTimeout 0 + writeTimeout 0
  # remove the upper bound on individual reads/writes during a 60-min
  # dictation; idleTimeout 3600s caps the connection's overall idle
  # window at the 1h ceiling demanded by BACKEND_SPEC.md L788-L791.
  # forwardedHeaders.trustedIPs mirrors :443 so the in-cluster contract-
  # test runner's per-fixture XFF survives the Traefik hop on the
  # realtime path as well (Phase 02.19 trust-boundary inheritance).
  # http.tls: {} causes shared-cert reuse from dynamic.yml's
  # tls.certificates (D-21) — no separate ACME / no per-entrypoint cert.
  websecure-realtime:
    address: ":8443"
    http:
      tls: {}
    forwardedHeaders:
      trustedIPs:
        - 10.0.0.0/8       # RFC 1918 Class A private
        - 172.16.0.0/12    # RFC 1918 Class B private (Docker default bridge pool)
        - 192.168.0.0/16   # RFC 1918 Class C private
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 3600s
  ping:
    address: ":8081"
  traefik:
    address: ":8080"

providers:
  # Phase 19b / SR-19b.2 — file provider stanza is intentionally minimal
  # (no static-yaml filename or directory). The actual provider mode is
  # configured ENTIRELY via compose-overlay CLI flags (see
  # compose/docker-compose.ingress.yml and compose/docker-compose.acme.yml:
  # --providers.file.directory= + --providers.file.watch=). Without ANY
  # `file:` stanza here, traefik 3 fails to register the file provider
  # at all (no `Starting provider *file.Provider` log); WITH a partial
  # `file: { watch: true }` stanza, traefik fails with
  #   ERR Cannot start the provider *file.Provider error="error using
  #   file configuration provider, neither filename nor directory is
  #   defined"
  # because the partial block shadows the CLI leaf-flag merge. An empty
  # `file: {}` stanza lets the CLI flags supply all required leaves.
  file:
    directory: /etc/traefik/dynamic
    watch: true
  # Docker provider — `web` compose service declares its routers via
  # labels. File provider remains primary for api / grafana / minio /
  # mailpit / api-realtime. `exposedByDefault: false` means containers
  # MUST opt in with `traefik.enable=true`.
  docker:
    exposedByDefault: false
    # Docker Compose v2 prefixes user-defined networks with the project name
    # (set via `name: openwhispr` at the top of docker-compose.yml), so the
    # internal bridge is `openwhispr_openwhispr_internal` at the daemon level
    # even though the compose key is `openwhispr_internal`. Traefik resolves
    # backend container IPs through this network — must match exactly or
    # Traefik logs a noisy warning and defaults to the first available net.
    network: openwhispr_openwhispr_internal

# Phase 17 / Plan 03 (TLS-02-prod / TLS-03) — single ACME HTTP-01 resolver.
#
# INERT until a router opts in via `tls.certResolver: letsencrypt` (see
# `compose/traefik/dynamic.prod.yml`). The dev profile keeps using the
# mkcert-provisioned `/certs/local.crt` from `dynamic.yml` — zero changes
# to existing dev-profile routers.
#
# Activated via `compose/docker-compose.acme.yml` overlay which supplies
# `LETSENCRYPT_EMAIL` (required) and optionally flips `LETSENCRYPT_CA_SERVER`
# to the LE staging endpoint when `LETSENCRYPT_STAGING=1`.
#
# HTTP-01 challenge reuses the existing `:80 web` entrypoint. Traefik 3
# intercepts `/.well-known/acme-challenge/*` BEFORE the 308 redirect
# middleware fires, so the existing redirect-only `web` entrypoint
# remains compatible without modification.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${LETSENCRYPT_EMAIL}"
      storage: /letsencrypt/acme.json
      caServer: "${LETSENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      httpChallenge:
        entryPoint: web

log:
  level: INFO
accessLog: {}
