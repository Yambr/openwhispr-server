# Traefik v3 static config — file provider only (D-31). No Docker provider.
# respondingTimeouts at 3700s cover SCALE-05 (1h streaming sessions on
# /api/agent/stream and /v1/realtime, with buffer for client clock skew).

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: ping

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}
    transport:
      respondingTimeouts:
        readTimeout: 3700s
        writeTimeout: 3700s
        idleTimeout: 180s
  ping:
    address: ":8081"
  traefik:
    address: ":8080"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
accessLog: {}
