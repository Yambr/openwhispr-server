# Traefik v3 static config — file provider only (D-31). No Docker provider.
# respondingTimeouts at 3700s cover SCALE-05 (1h streaming sessions on
# /api/agent/stream and /v1/realtime, with buffer for client clock skew).

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: ping

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          # Phase 2 Plan 04 (WIRE-20): permanent → 308. PROJECT.md hard
          # rule: HTTPS-only on every externally reachable port. Plain
          # HTTP requests are 308'd; the `web` entrypoint exists ONLY
          # for the redirect (no router targets `web` directly).
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
    # Phase 02.19 — trust X-Forwarded-For ONLY from RFC 1918 private CIDRs.
    # Closes Group F end-to-end (cascade tail from 02.18 D-DISC): the
    # contract-test runner inside `openwhispr_internal` (Docker default
    # bridge, allocates within 172.16.0.0/12) can now have its per-fixture
    # XFF preserved end-to-end so Better Auth's rate-limiter buckets per
    # synthetic test IP. Production safety: external clients on real
    # public IPs are NOT in any of these ranges, so Traefik continues to
    # overwrite their XFF with the immediate socket IP — abuse vector
    # remains closed. CIDRs strictly RFC 1918 (no CGNAT, no loopback,
    # no 0.0.0.0/0). See tests/integration/traefik-forwarded-headers.test.ts.
    forwardedHeaders:
      trustedIPs:
        - 10.0.0.0/8       # RFC 1918 Class A private
        - 172.16.0.0/12    # RFC 1918 Class B private (Docker default bridge pool)
        - 192.168.0.0/16   # RFC 1918 Class C private
    transport:
      respondingTimeouts:
        readTimeout: 3700s
        writeTimeout: 3700s
        idleTimeout: 180s
  ping:
    address: ":8081"
  traefik:
    address: ":8080"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
accessLog: {}
