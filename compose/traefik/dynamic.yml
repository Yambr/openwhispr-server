# Traefik v3 dynamic config — file provider routes for the three .localhost
# vhosts. The api router targets the Phase 0 Fastify placeholder on port
# 3000; Phase 2 wires the real API container. Plan 02's bootstrap.sh writes
# /certs/local.crt + /certs/local.key (mkcert preferred, openssl fallback).

http:
  routers:
    # Phase 07.1 Plan 03 — restricted to PathPrefix(/api). The api service
    # only ever serves /api/* (and /v1/realtime, which has its own router
    # `api-realtime` bound to the dedicated :8443 websecure-realtime
    # entrypoint). Adding the path constraint keeps the api router from
    # capturing every Host(api.localhost) request, which would otherwise
    # shadow the new `web@docker` router (priority=1) — the api router's
    # length-based score (~21) would always win on a pure Host(...) match.
    # All known api endpoints live under /api/* (verified by enumerating
    # apps/api/src/routes/**/*.ts route declarations during Plan 03).
    api:
      rule: "Host(`api.localhost`) && PathPrefix(`/api`)"
      service: api-svc
      entryPoints: [websecure]
      tls: {}
    # Phase 53 — auth-free Fastify probes (Plan 06-04). The base `api`
    # router is constrained to /api/* so bare-root /livez, /readyz,
    # /startupz, /healthz fall outside its match. Re-expose them via
    # their own router so the Phase 6 e2e harness + external monitoring
    # can hit them via the canonical https://api.localhost ingress.
    api-probes:
      rule: "Host(`api.localhost`) && (Path(`/livez`) || Path(`/readyz`) || Path(`/startupz`) || Path(`/healthz`) || PathPrefix(`/__test`))"
      service: api-svc
      entryPoints: [websecure]
      tls: {}
    grafana:
      rule: "Host(`grafana.localhost`)"
      service: grafana-svc
      entryPoints: [websecure]
      tls: {}
    minio-console:
      rule: "Host(`minio-console.localhost`)"
      service: minio-console-svc
      entryPoints: [websecure]
      tls: {}
    # Phase 2 Plan 02 — dev-only mailpit web UI. The router stays inert
    # until the operator brings up the `dev` profile; Traefik's file
    # provider tolerates dangling backends (CONTAINER-A4 verified).
    mailpit:
      rule: "Host(`mailpit.localhost`)"
      service: mailpit-svc
      entryPoints: [websecure]
      tls: {}
    # Phase 2 Plan 06 — split-host topology routers for the cookie-host
    # conformance test (CONTRACT-01 D-20). Both target the same api
    # service; only the Host header differs. Inert in production (no
    # traffic on auth/api.example.test); active during contract-test runs
    # where the runner sends Host: auth.example.test then api.example.test
    # against the same Traefik instance.
    auth-example-test:
      rule: "Host(`auth.example.test`)"
      service: api-svc
      entryPoints: [websecure]
      tls: {}
    api-example-test:
      rule: "Host(`api.example.test`)"
      service: api-svc
      entryPoints: [websecure]
      tls: {}
    # Phase 03 / Plan 07 (LITELLM-03, D-04) — dedicated router for the
    # WSS /v1/realtime reverse-proxy. The service uses a `serversTransport`
    # whose `idleConnTimeout` is set to 3600s (per Pitfall #7).
    # Phase 04 Plan 05 (SCALE-05 / T-04-02) — bound EXCLUSIVELY to the
    # websecure-realtime entrypoint on :8443. Combined with the matching
    # entrypoint `respondingTimeouts` (readTimeout 0 / writeTimeout 0 /
    # idleTimeout 3600s set in traefik.yml), this yields the 3600s ceiling
    # demanded by BACKEND_SPEC.md L788-L791. Short-JSON routes on :443
    # (websecure) no longer share the long-timeout regime — the prior
    # multi-thousand-second values on :443 are reverted to defaults.
    api-realtime:
      rule: "Host(`api.localhost`) && PathPrefix(`/v1/realtime`)"
      service: api-realtime-svc
      entryPoints: [websecure-realtime]
      priority: 100
      tls: {}

    # Phase 08.6-04 — diarization endpoint mounts at /v1/audio/diarization
    # (NOT under /api/*), per the wire contract (BACKEND_SPEC.md +
    # docs/wire-contracts-phase-3.md). Without this router the request
    # falls through to the `web@docker` router which returns 404. Bind
    # to the standard websecure entrypoint on :443 — short-JSON traffic,
    # no long-lived-tuned transport required.
    api-audio:
      rule: "Host(`api.localhost`) && PathPrefix(`/v1/audio`)"
      service: api-svc
      entryPoints: [websecure]
      priority: 100
      tls: {}

  services:
    api-svc:
      loadBalancer:
        servers:
          - url: "http://api:3000"
    # Phase 03 / Plan 07 — long-lived-tuned upstream for WSS /v1/realtime.
    # Targets the same Fastify api container as `api-svc`; the only
    # difference is `serversTransport`, which selects the
    # `api-realtime-transport` block below with a 3600s idleConnTimeout.
    api-realtime-svc:
      loadBalancer:
        servers:
          - url: "http://api:3000"
        serversTransport: api-realtime-transport
    grafana-svc:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
    minio-console-svc:
      loadBalancer:
        servers:
          - url: "http://minio:9001"
    mailpit-svc:
      loadBalancer:
        servers:
          - url: "http://mailpit:8025"

  serversTransports:
    # Phase 03 / Plan 07 (LITELLM-03, D-04, Pitfall #7) — long-lived
    # transport for the WSS /v1/realtime reverse-proxy. `idleConnTimeout`
    # of 3600s prevents Traefik from closing the upstream Fastify
    # connection during a 60-minute realtime session. Phase 04 Plan 05:
    # the matching entrypoint-level `respondingTimeouts` now lives on
    # the dedicated `websecure-realtime` (:8443) entrypoint
    # (readTimeout 0 / writeTimeout 0 / idleTimeout 3600s in
    # compose/traefik/traefik.yml) so the desktop's long dictations
    # don't trigger spurious mid-session disconnects, AND short-JSON
    # routes on :443 are no longer dragged into the long-timeout regime.
    api-realtime-transport:
      forwardingTimeouts:
        dialTimeout: "30s"
        responseHeaderTimeout: "30s"
        idleConnTimeout: "3600s"

tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key

# Phase 04 Plan 05 — websecure-realtime binding landed (api-realtime router
# above). Static-config side: compose/traefik/traefik.yml entrypoints block
# defines websecure-realtime on :8443 with idleTimeout 3600s.
