# Phase 14 / Plan 14-03 — Pgbouncer overlay.
#
# Re-introduces the pooler that slim-core stripped from base. Layer for
# transaction-mode pooling in production-parity stacks:
#
#   docker compose -f docker-compose.yml -f compose/docker-compose.pgbouncer.yml up -d
#
# Re-injects:
#   - api.depends_on.pgbouncer: service_healthy
#   - api.environment.DATABASE_URL pointing at pgbouncer:6432 (overlay re-
#     points the app-tier read/write traffic through the pooler).
#   - migrate.depends_on.pgbouncer: service_healthy (sequencing barrier per
#     RESEARCH §A.1 — migrate STILL writes DDL direct to postgres:5432; the
#     dependency is purely a start-ordering gate so api never lap-skips
#     ahead of pgbouncer being ready).

services:
  api:
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      # `?sslmode=disable` is REQUIRED. The pgbouncer container in this
      # stack does not terminate client-side TLS (see
      # compose/pgbouncer/pgbouncer.ini — no client_tls_* keys), so the
      # `pg` driver in packages/data/src/client.ts MUST be told to skip
      # TLS. Without this suffix, every api query short-circuits with
      # `Error: The server does not support SSL connections` and routes
      # like /api/auth/sign-up/email return HTTP 500 (regression caught by
      # Web e2e CI run 26350470878). Mirrors the canonical pattern in
      # .env.full.example:56 / .env.slim.example:308.
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-openwhispr_app}:${POSTGRES_APP_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-openwhispr}?sslmode=disable
    # Phase 20 / SR-20.1 + SR-20.2 — re-declare in overlay (T-20-03).
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  migrate:
    depends_on:
      pgbouncer:
        condition: service_healthy

  pgbouncer:
    # D-02: edoburu (OSS) — Bitnami's free PgBouncer image was retired
    # in 2025 (paid Bitnami Secure Images subscription only).
    image: edoburu/pgbouncer:v1.25.1-p0
    networks: [openwhispr_internal]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_APP_USER:-openwhispr_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-openwhispr}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    volumes:
      - ./compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Phase 20 / SR-20.1 + SR-20.2 — memory cap + auto-restart (audit A5).
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
