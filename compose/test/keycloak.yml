# Phase 18 / Plan 01 / Wave 4 — Keycloak 26 fixture stub.
#
# Opt-in via `--profile sso`. The realm-import directory
# ./compose/test/keycloak/ is intentionally EMPTY in v2 — scenario
# @cjm-sso-1.6 (loud-fail on missing realm) depends on that emptiness
# in v3. Phase 19 ships realm-openwhispr-test.json + scripts/seed-keycloak-realm.sh.
#
# Usage (Phase 19 reference):
#   docker compose -f docker-compose.yml \
#                  -f compose/test/keycloak.yml \
#                  --profile sso up -d

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8089:8080"
      - "9000:9000"
    volumes:
      - ./compose/test/keycloak/:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    container_name: e2e-cjm-keycloak
    networks:
      - openwhispr_internal

# NOTE (Phase 69 / Plan 69-06): the network is NOT declared `external` here.
# This overlay is always layered on top of docker-compose.yml, which DEFINES
# `openwhispr_internal` as a normal project-scoped bridge. Declaring it external
# here made the merged config require a pre-existing bare `openwhispr_internal`
# network (which the e2e-cjm `-p e2e-cjm` project never creates — it owns
# `e2e-cjm_openwhispr_internal`), breaking the @sso stack boot. Omitting the
# top-level network block lets keycloak inherit the base definition so it joins
# the SAME project network as the api (required for in-network OIDC discovery).
