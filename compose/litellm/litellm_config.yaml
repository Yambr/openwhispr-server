# Phase 03 / Plan 01 — Bundled-default LiteLLM Proxy config.
#
# Wired-up providers in BUNDLED mode (LITELLM-02 / D-01 / D-10 / D-11 / D-12):
#   - LLMs (D-10): OpenRouter routes to qwen3.6-plus, gemini-3-flash, gpt-4o-mini.
#   - STT (D-11): Groq Whisper-large-v3 (https://api.groq.com/openai/v1).
#   - Realtime (D-12): OpenAI Realtime API direct (mode: realtime).
#
# Corporate operators OVERRIDE this entire surface by setting LITELLM_BASE_URL
# to point at their internal LiteLLM (LITELLM-05). The bundled container is
# only used when LITELLM_BASE_URL=http://litellm:4000 (the default).

model_list:
  # ---- LLMs (OpenRouter — D-10 verified live 2026-05-10) ----
  - model_name: qwen3.6-plus
    litellm_params:
      model: openrouter/qwen/qwen3.6-plus
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini-3-flash
    litellm_params:
      model: openrouter/google/gemini-3.1-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- Cleanup-class LLM (R33) ----
  # Fast model for /api/reason dictation-cleanup requests (no agentName,
  # no systemPrompt, empty/absent model). The api routes that request
  # shape here with reasoning/thinking DISABLED. Thinking-off is NOT a
  # yaml flag — it travels in the request body via
  # `extra_body.chat_template_kwargs.enable_thinking:false`
  # (see apps/api/src/lib/reason-prompt-select.ts). This entry maps the
  # alias to an endpoint ONLY. Corporate operators point `api_base` at
  # their internal Qwen3 MoE deployment (3B active params, fast); the
  # bundled default routes through OpenRouter like the other LLM aliases.
  - model_name: qwen3.6-cleanup
    litellm_params:
      model: openrouter/qwen/qwen3.6-35b-a3b
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/REASONING_CLEANUP_API_BASE

  # ---- STT (Groq Whisper — D-11) ----
  # Phase 19.2 / Plan 02 — SERVER-ERRORS Entry 11 closure cascade. LiteLLM
  # Router requires an explicit provider prefix on `model:` to register the
  # deployment (`LLM Provider NOT provided. Pass in the LLM provider you are
  # trying to call. You passed model=whisper-large-v3`). Without the prefix
  # the deployment is silently dropped at router.py:6816 and audio
  # transcriptions fail with `There are no healthy deployments for this
  # model. Received Model Group=whisper-large-v3` (HTTP 400). Adding
  # `groq/` resolves to the Groq Whisper API (`api_base` is the canonical
  # OpenAI-compat endpoint and stays for tracing/audit).
  - model_name: whisper-large-v3
    litellm_params:
      model: groq/whisper-large-v3
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY

  # ---- Realtime (OpenAI direct — D-12, verified accessible 2026-05-10) ----
  # D1 — `realtime-default` is the canonical server-injected realtime
  # alias. WSS /v1/realtime (apps/api/src/routes/realtime.ts) forces
  # `?model=realtime-default` onto the upstream URL regardless of what
  # the desktop client sends, so the realtime model is pure operator
  # config (LITELLM_REALTIME_MODEL env var, default `realtime-default`).
  # To switch the realtime backend OpenAI→Speaches, retarget THIS entry
  # — see litellm_config.local-speaches.yaml for the Speaches variant.
  - model_name: realtime-default
    litellm_params:
      model: openai/gpt-realtime
      api_key: os.environ/OPENAI_API_KEY
      mode: realtime

  # `gpt-realtime` / `gpt-realtime-mini` / `gpt-4o-realtime-preview` are
  # retained as extra aliases for backward compatibility (older desktop
  # builds that still send an explicit `?model=`). Per D-12 OpenAI
  # Realtime is the only public-cloud SaaS that speaks the OpenAI
  # Realtime WSS spec verbatim; corporate operators with Speaches/Azure
  # override via LITELLM_BASE_URL.
  - model_name: gpt-realtime
    litellm_params:
      model: openai/gpt-realtime
      api_key: os.environ/OPENAI_API_KEY
      mode: realtime

  - model_name: gpt-realtime-mini
    litellm_params:
      model: openai/gpt-realtime-mini
      api_key: os.environ/OPENAI_API_KEY
      mode: realtime

  - model_name: gpt-4o-realtime-preview  # legacy alias for backward compat
    litellm_params:
      model: openai/gpt-4o-realtime-preview
      api_key: os.environ/OPENAI_API_KEY
      mode: realtime

  # ---- Canonical `openwhispr-*` namespace (LEAK 1 fix, peer-coordinated
  # with openwhispr client v1.7.8 wd6g78xz on 2026-05-25). The desktop
  # client's provider-lockdown verifier and operator-facing UI greps for
  # the `openwhispr-*` prefix to distinguish server-canonical aliases
  # from upstream-provider names that the client must NOT display
  # (`gpt-4o-mini-transcribe` lit up in v1.7.7; root cause was the
  # absence of a server-side canonical name for transcription). These
  # entries are pure aliases — same backing providers as
  # `whisper-large-v3` / `gpt-4o-mini` / `realtime-default` above; the
  # legacy names are retained for backward compatibility with desktop
  # builds < v1.7.8. Corporate operators retarget the upstream by
  # overriding `litellm_params.model` here without renaming the alias. ----
  - model_name: openwhispr-default
    litellm_params:
      model: groq/whisper-large-v3
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY

  - model_name: openwhispr-reason
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openwhispr-realtime
    litellm_params:
      model: openai/gpt-realtime
      api_key: os.environ/OPENAI_API_KEY
      mode: realtime

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: True

litellm_settings:
  drop_params: True
  set_verbose: False
