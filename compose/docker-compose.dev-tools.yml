# Phase 14 / Plan 14-03 — Dev-tools overlay.
#
# Phase 61 / R19 — `mailpit` and the api/worker `SMTP_PORT: "1025"`
# wiring were PROMOTED to the base docker-compose.yml. The slim-core
# base now ships mailpit as a first-class service so a plain
# `docker compose up -d` (no overlays) delivers verification email
# end-to-end. This overlay no longer redefines mailpit or SMTP_PORT —
# single source of truth lives in the base compose.
#
# Fixture-idp / seed / contract-test-runner live in the contract-test
# overlay (`compose/docker-compose.contract-test.yml`).
#
#   docker compose -f docker-compose.yml -f compose/docker-compose.dev-tools.yml up -d

services:
  api:
    environment:
      # Phase 53 / Plan 53-22 — dev-tools overlay drops NODE_ENV from
      # production to development so the boot-time auth guard
      # (config/auth.ts:validateAuthBoot) admits HTTP AUTH_URL. In
      # production deployments the overlay is NOT applied → NODE_ENV
      # stays "production" → HTTP AUTH_URL REFUSES boot. That is the
      # MITM safety guarantee: development-only HTTP, production-
      # mandatory HTTPS. See config/auth.ts for the guard logic.
      NODE_ENV: development
      AUTH_URL: http://localhost:4000
      OPENWHISPR_API_URL: http://localhost:4000
      AUTH_TRUSTED_ORIGINS_EXTRA: "http://localhost:3000,http://localhost:4000,http://api:3000"
      # Phase 53 / Plan 53-36 — slim e2e sweep makes ~200+ /api/auth/*
      # calls per worker. Better Auth's per-IP anti-abuse limiter
      # (default ~3 attempts / 10s on sign-in, broader window on
      # get-session) starts returning HTTP 429 around the 70th spec.
      # The cascade lands the conversations specs (u11/u12/u13) on
      # /sign-in despite valid session rows. This overlay is dev-tools
      # only — production deploys never apply it, so the production
      # rate limit posture is unchanged.
      OPENWHISPR_DISABLE_RATE_LIMIT: "1"
      # Phase 53 / BUG-53-41 — without LITELLM_MASTER_KEY the api boot
      # path silently drops 4 routes (transcribe, reason, diarization,
      # realtime) because loadLitellmConfigFromEnv() throws and the
      # catch arm registers nothing. The dev-tools overlay seeds a
      # well-known dev value so OOB `docker compose up` boots with
      # the full route surface. Production operators set their own
      # master key in their .env; this default is dev-tools-only.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key-do-not-use-in-prod}
      # BUG-readyz-litellm-ssrf — the base docker-compose.yml api block
      # now provides OUTBOUND_ALLOWED_HOSTS + OUTBOUND_PRIVATE_HOST_ALLOWLIST
      # defaults for the bundled service names (commit %SHA% covering R25).
      # This overlay no longer needs to set them — operators overriding
      # to a corporate hostname extend the allowlist via their .env.
      # BUG-A — base compose ships OIDC_ISSUER_URL default pointing at
      # `fixture-idp` (which exists ONLY in the contract-test overlay).
      # Dev-tools doesn't run fixture-idp, so the discovery fetch hits
      # the SSRF guard → 500 on /api/auth/sign-in/social. Blank the
      # OIDC env vars so `listConfiguredOidcProviders()` returns [] and
      # the UI hides the social buttons entirely. Operators who want
      # OIDC in dev set the vars explicitly in their own .env.
      OIDC_ISSUER_URL: ""
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      # Phase 55 / Plan 55-05 — expose the `/api/_test/*` test seam in
      # dev-tools so the long-form acceptance e2e specs (setup-wizard
      # happy-path et al.) can hermetically reset stateful singletons
      # (setup_state, etc.) between runs. Production deployments NEVER
      # apply the dev-tools overlay, so the production gate stays
      # closed (base docker-compose.yml defaults the env to "false"
      # and registerRoutes() only registers the test-only plugin when
      # this env equals the literal string "true").
      OPENWHISPR_TEST_ROUTES: "true"
  worker:
    environment:
      # BUG-53-41 — worker constructs the litellm client too (BullMQ
      # ingestion). Mirror the api seed so both halves see the same
      # default in OOB dev.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key-do-not-use-in-prod}

  # BUG-53-41 — litellm itself needs the same key its clients use; the
  # base compose references ${LITELLM_MASTER_KEY} with no default, so
  # we seed it here. Production operators set their own .env value;
  # this override only fires when both .env AND host env are unset.
  litellm:
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key-do-not-use-in-prod}
