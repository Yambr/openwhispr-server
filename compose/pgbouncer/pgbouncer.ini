; PgBouncer 1.23 — transaction-mode pooling for the OpenWhispr data plane.
;
; Sized for SCALE-02 (1000 concurrent active users) per
; 01-RESEARCH-INFRA.md §4.1: single instance with default_pool_size = 100
; backend connections, max_client_conn = 2000 client headroom.
;
; max_prepared_statements = 200 enables PgBouncer 1.21+ prepared-statement
; support in transaction mode, which is what makes Drizzle (via the `pg`
; driver) work without app-side workarounds.
;
; ignore_startup_parameters MUST include extra_float_digits (Drizzle/pg
; sets it) and search_path (multi-schema apps).

[databases]
openwhispr = host=postgres port=5432 dbname=openwhispr

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 100
reserve_pool_size = 5
max_prepared_statements = 200
server_tls_sslmode = prefer
ignore_startup_parameters = extra_float_digits,search_path
