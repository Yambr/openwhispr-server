# OpenWhispr Server — slim-core base (Phase 14 / Plan 14-01).
#
# Compose Spec v2: NO `version:` key (legacy and silently ignored by Compose
# v2.x+).
#
# SLIM-CORE INVERSION (Phase 14 / Plan 14-01, SLIM-01):
#   Bare `docker compose up` (no flags, no `--profile`, no extra `-f`) MUST
#   bring up exactly 6 long-running services (api, web, worker, postgres,
#   valkey, litellm) plus the one-shot `migrate` init container, and nothing
#   else. The previous 19-service profile-gated megafile is gone. Services
#   that lived in non-default profiles (pgbouncer, minio, traefik,
#   otel-collector, loki, tempo, mimir, grafana, mailpit, fixture-idp, seed,
#   contract-test-runner) have been moved out of base and will be re-declared
#   in dedicated overlays in Wave 2 (plan 14-03):
#     compose/overlays/observability.yml   — otel-collector + loki + tempo + mimir + grafana
#     compose/overlays/edge.yml            — traefik + cert mounts
#     compose/overlays/storage.yml         — minio + pgbouncer
#     compose/overlays/dev.yml             — mailpit
#     compose/overlays/contract-test.yml   — fixture-idp + seed + contract-test-runner
#
# Network model: single internal bridge `openwhispr_internal`. api and web
# additionally publish host ports (4000:3000 and 3000:3000) so the slim path
# works without Traefik; overlays will layer Traefik on top when needed.
#
# Conformance test: tests/integration/slim-core-base.test.ts enforces the
# slim-core shape via static YAML inspection.

name: openwhispr

networks:
  openwhispr_internal:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:

services:
  postgres:
    # Phase 6 / Plan 02 — custom image with pg_partman 5.2.4 built from
    # source on top of postgres:17.5-alpine. Required by migration 0014
    # (audit_log monthly RANGE partitioning, D-A2). The `image:` tag is
    # the local name used by `docker compose pull` / scans; `build:` runs
    # locally otherwise. Multi-arch (amd64+arm64) buildable.
    build:
      context: ./compose/postgres
      dockerfile: Dockerfile
      args:
        PG_PARTMAN_VERSION: "5.2.4"
    image: openwhispr/postgres:17.5-pgpartman
    networks: [openwhispr_internal]
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: openwhispr
      # Phase 01.2 — pass through the role passwords so 00-roles.sh can
      # envsubst them into 00-roles.sql.tpl before piping to psql. The
      # Postgres entrypoint only auto-exposes POSTGRES_USER/PASSWORD/DB
      # to init scripts; everything else must be declared explicitly.
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      # Phase 03 Plan 01 — POSTGRES_OWNER_USER is read by
      # packages/data/migrations/init/01-litellm-database.sh to set the
      # OWNER of the `litellm` database. Already set above as POSTGRES_USER
      # on first init; declared explicitly so the script's quote_ident
      # interpolation is decoupled from the bootstrap-superuser env-var name.
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Plan 03 (phase 01) fills this directory with role/RLS bootstrap SQL;
      # Phase 03 Plan 01 added 01-litellm-database.sh as the fresh-install
      # path for the separate `litellm` Postgres database (LITELLM-01).
      # Existing-volume upgrade path (HIGH-1) is covered by the migrate
      # runner's ensureLitellmDatabase() helper — initdb scripts only run
      # on a freshly-initialized data volume.
      - ./packages/data/migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Phase 20 / SR-20.1 + SR-20.2 — memory cap + auto-restart.
    # 2G floor: CNPG + pg_partman_bgw + 100 connections × ~6 MB work_mem
    # + shared_buffers 128 MB. Locked by ROADMAP §SR-20.1.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1-alpine
    networks: [openwhispr_internal]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Phase 20 / SR-20.1 + SR-20.2 — memory cap + auto-restart.
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Phase 2 Plan 02 — One-shot migration runner. Runs as openwhispr_owner
  # DIRECT to postgres:5432 (NOT pgbouncer — pgbouncer is overlay-only as of
  # Phase 14; migrate always goes direct to the postgres host on the
  # internal bridge). DDL through transaction-mode pooling is the documented
  # anti-pattern; migrate.ts asserts the URL hostname does not contain
  # "pgbouncer".
  #
  # `restart: "no"` is QUOTED (Pitfall #8): unquoted `no` parses as boolean
  # false in some YAML libraries.
  #
  # The api service gates on `service_completed_successfully` so api never
  # boots until migrate exits 0 — rolling-deploy ready (DEPLOY-04).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks: [openwhispr_internal]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # Phase 01.2 — bundle is now `.cjs` (was `.js`) so Node treats it
    # as CommonJS regardless of the api package.json `type: module` that
    # ships in the same image at /app/package.json.
    command: ["node", "/app/packages/data/dist/migrate.cjs"]

  # Phase 03 / Plan 01 — Bundled LiteLLM Proxy sidecar (LITELLM-01 / D-01).
  #
  # Pinned to v1.83.14-stable (>= v1.83.7-stable carries the multipart-
  # passthrough fix natively — PROJECT.md "What NOT to Use" forbids 1.82.x).
  # Multi-arch image: ghcr.io/berriai/litellm publishes amd64 + arm64.
  #
  # Operator override: set LITELLM_BASE_URL in .env to point at a corporate
  # LiteLLM (LITELLM-05). The bundled service is part of slim-core but the
  # api service ignores it whenever LITELLM_BASE_URL points elsewhere.
  #
  # depends_on:
  #   - postgres healthy : litellm shares the pg cluster (separate `litellm`
  #     database, init script + migrate runner ensure it exists)
  #   - migrate completed : ensureLitellmDatabase() in the runner is the
  #     existing-volume safety net (HIGH-1)
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    networks: [openwhispr_internal]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Phase 03 e2e fix — LiteLLM v1.83+ requires DATABASE_URL non-empty
      # at boot (Prisma engine validates via P1012). Default to the
      # bundled `litellm` co-tenant DB created by
      # packages/data/migrations/init/01-litellm-database.sh; operators
      # who already export LITELLM_DATABASE_URL keep their override.
      # Phase 53 — Plan 51-14 made `buildPoolConfig` default-on TLS;
      # the bundled docker-compose postgres does NOT support SSL, so the
      # connection string MUST opt out via `?sslmode=disable` (canonical
      # libpq escape hatch). LiteLLM's own Python pg client respects the
      # same flag.
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL:-postgres://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/litellm?sslmode=disable}
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgres://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/litellm?sslmode=disable}
      # Provider keys — `:-` so a fresh clone with empty keys does NOT
      # block container boot. Endpoints whose backing key is missing
      # surface 503 envelopes at request time (per Plan 03/04/07
      # error-envelope contract).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Phase 03 D-07 REVISED — PYANNOTE_API_KEY is consumed by the
      # Fastify diarization route on the `api` service, NEVER forwarded
      # into the litellm container. Threat T-03-01-06 mitigation: the
      # absence of PYANNOTE_API_KEY here is intentional and verified by
      # the plan's automated check (grep PYANNOTE on the litellm env
      # block must return zero hits).
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "2"]
    volumes:
      # Phase 03 e2e fix — LITELLM_CONFIG_FILE selects the active config:
      # default = litellm_config.yaml (production); contract-test profile
      # uses litellm_config.contract.yaml (hermetic mock_response). The
      # `make contract-test` target sets LITELLM_CONFIG_FILE so the bind
      # picks the right file without needing two compose files.
      - ./compose/litellm/${LITELLM_CONFIG_FILE:-litellm_config.yaml}:/etc/litellm/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Phase 03 e2e fix — the bundled LiteLLM image (ghcr.io/berriai/litellm)
      # does NOT ship wget or curl. Use the venv'd python3 (always present
      # since LiteLLM is a Python service) with urllib to probe liveliness.
      # urllib raises non-zero on non-2xx, satisfying healthcheck contract.
      # Phase 53 — bind to 127.0.0.1 (IPv4 loopback) not `localhost`.
      # On Docker Desktop / macOS the resolver inside the container can
      # return ::1 first; LiteLLM uvicorn binds to 0.0.0.0:4000 (IPv4
      # only), so the IPv6 probe fails with `OSError: [Errno 99]
      # Cannot assign requested address` and the container never reaches
      # healthy state. The IPv4 literal sidesteps the dual-stack lottery.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Phase 33 envelope-encryption migrations (0019/0020) added ~40s to
      # litellm's first-boot prisma migrate step on top of the Phase 03
      # baseline. The original 30s start_period was insufficient and
      # caused `docker compose up --wait` to mark litellm unhealthy
      # before uvicorn finished booting, cascading to api never starting
      # in the Phase 02 self-tests. 120s gives 1.5× empirical max.
      start_period: 600s
    restart: unless-stopped
    # Phase 20 / SR-20.1 — memory cap. Mirrors chart limits.memory: 1Gi.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # Phase 2 Plan 02 — API container. Closes Phase 1 D-08 / SC#1 partial:
  # the entrypoint runs check-default-secrets.cjs BEFORE node main, so
  # `MASTER_KEK=changeme` is rejected at start time even if the operator
  # bypassed bootstrap.sh.
  #
  # Phase 14 / Plan 14-01 (SLIM-01): slim-core publishes host port
  # 4000:3000 so the slim path (no Traefik overlay) works directly against
  # http://localhost:4000. When the edge overlay is layered on, Traefik
  # routes https://api.localhost → http://api:3000 inside the network;
  # the host-port publish is harmless co-existence (different host port).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks: [openwhispr_internal]
    ports:
      - "4000:3000"
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      OPENWHISPR_API_URL: ${OPENWHISPR_API_URL:-https://api.localhost}
      AUTH_URL: ${AUTH_URL:-https://api.localhost}
      # Phase 57 / Track E (api-routes-rest:CR-01) — canonical ingress
      # origin. better-auth-handler.ts reconstructs the URL Better Auth
      # uses for CSRF / Origin / redirect-uri validation from this value;
      # the attacker-controlled Host header is NEVER trusted.
      # validateIngressBoot() exits 78 (EX_CONFIG) at boot if neither
      # INGRESS_BASE_URL nor AUTH_URL is set. Defaults to the documented
      # quickstart origin so `docker compose up` boots out of the box.
      INGRESS_BASE_URL: ${INGRESS_BASE_URL:-https://api.localhost}
      # Phase 02.17 / D-02 — OPENWHISPR_PROTOCOL accepts a comma-separated
      # list (parsed in apps/api/src/lib/scheme-allowlist.ts). The default
      # registers `mycorp-whispr` so contract tests covering the custom-
      # override scheme matrix in oauth-redirect.test.ts pass out of the
      # box. Built-ins (openwhispr, openwhispr-dev, openwhispr-staging) are
      # always allowed via BUILTIN_SCHEMES — no need to repeat here.
      # Production operators override with their own scheme list.
      OPENWHISPR_PROTOCOL: ${OPENWHISPR_PROTOCOL:-mycorp-whispr}
      # Phase 02.3 — extra trusted origins for in-cluster traffic (e.g.
      # the contract-test seed service POST-ing http://api:3000/api/auth/sign-up).
      # Comma-separated list parsed by apps/api/src/auth.ts; in addition to
      # AUTH_URL + OPENWHISPR_API_URL, NOT a replacement.
      # Phase 53 / Plan 53-06 — web origin http://localhost:3000 added
      # for slim-core (no Traefik) operator topology: Better Auth runs on
      # the api side and validates the request Origin header against
      # AUTH_TRUSTED_ORIGINS; the rewrites() in next.config.ts preserves
      # the original Origin (http://localhost:3000) when proxying to the
      # api, so without an explicit allowlist entry Better Auth would
      # reject every browser-originated sign-up/sign-in with 403
      # "Invalid origin".
      AUTH_TRUSTED_ORIGINS_EXTRA: "http://api:3000,http://localhost:3000,http://localhost:4000"
      # Phase 02.21 / Residual C — opt-in flag for the test-only routes
      # plugin (/api/_test/force-rotate, /api/_test/health-authed) needed
      # by the AUTH-04 token-rotation contract test. Default OFF — the
      # `make contract-test` target sets this to "true" via the env file
      # bootstrap so the in-cluster contract suite can mint rotations,
      # while every other docker-compose invocation (operator self-host,
      # `docker compose up`) inherits the safe default and 404s on the
      # _test paths. PRODUCTION OPERATORS MUST NEVER set this var to
      # "true" in their .env — it exposes a session-rotation shortcut
      # intended only for the contract-test stack inside openwhispr_internal.
      OPENWHISPR_TEST_ROUTES: ${OPENWHISPR_TEST_ROUTES:-false}
      # Phase 07.1 / Plan 13.2 — opt-out of Better Auth's email-enumeration
      # protection. With requireEmailVerification:true, BA 1.6.9 normally
      # returns a synthetic success response on dup sign-up to hide account
      # existence from unauthenticated callers. Setting this var to "1"
      # makes the apps/api `onExistingUserSignUp` hook throw a real
      # USER_ALREADY_EXISTS so the desktop client and the U2 Playwright
      # spec can surface the duplicate-email Alert. Production operators
      # leave this unset to retain the canonical anti-enumeration behaviour.
      OPENWHISPR_DISABLE_EMAIL_ENUMERATION_PROTECTION: ${OPENWHISPR_DISABLE_EMAIL_ENUMERATION_PROTECTION:-}
      # Phase 02.13 — OIDC env defaults. Better Auth's genericOAuth uses LAZY
      # discovery (it only fetches `${OIDC_ISSUER_URL}/.well-known/openid-configuration`
      # when an OAuth flow is actually attempted). Operators with real OIDC
      # override these via .env. The contract-test overlay layers in a
      # `fixture-idp` service and an OIDC_ISSUER_URL pointing at it.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://fixture-idp:9000}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-conformance-test-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-conformance-test-secret-do-not-use-in-prod}
      # Phase 03 / Plan 01 — bundled LiteLLM endpoint + master key. Override
      # LITELLM_BASE_URL in .env to point at a corporate LiteLLM (LITELLM-05).
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # D1 — realtime model alias the WSS /v1/realtime route forces onto
      # the upstream `?model=` query string. Default `realtime-default`
      # matches the litellm_config.yaml alias; operators retarget the
      # alias in litellm_config, not here (OpenAI→Speaches one-line swap).
      LITELLM_REALTIME_MODEL: ${LITELLM_REALTIME_MODEL:-realtime-default}
      # Phase 03 D-07 REVISED — pyannote.ai key is consumed by the Fastify
      # diarization route (apps/api/src/routes/diarization.ts in Plan 06),
      # NOT by the LiteLLM sidecar. Forwarded only to the api container.
      PYANNOTE_API_KEY: ${PYANNOTE_API_KEY:-}
      # Phase 03 e2e back-fill — MOCK_DIARIZATION=true short-circuits the
      # diarization route to a fixture response (apps/api/src/routes/diarization.ts:71).
      # Forwarded from the host env so `make e2e-hermetic` (and any other
      # caller that wants the mock-mode happy path without a real
      # PYANNOTE_API_KEY) can opt in via export. Default is empty —
      # production operators MUST NOT set this in their .env (mock mode
      # returns canned segments regardless of audio content).
      MOCK_DIARIZATION: ${MOCK_DIARIZATION:-}
      # Phase 61 / R19 — slim-core ships the bundled `mailpit` service as
      # its dev/test SMTP catch-all. `EmailSender.ts` defaults SMTP_PORT
      # to 587; mailpit listens on 1025. `.env` carries SMTP_HOST=mailpit.
      # Corporate operators override SMTP_HOST / SMTP_PORT in their .env.
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Phase 03 / CR-01 fix — Valkey URL for the diarization idempotency
      # cache. buildApp() reads VALKEY_URL and constructs the redis client;
      # if unset the /v1/audio/diarization route is intentionally NOT
      # registered (operator-actionable 404). Wire to the bundled valkey
      # service so default `docker compose up` boots with diarization on.
      VALKEY_URL: ${VALKEY_URL:-redis://:${VALKEY_PASSWORD}@valkey:6379/0}
      # Phase 14 / Plan 14-01 (SLIM-01): OTEL_EXPORTER_OTLP_ENDPOINT has
      # NO default fallback. With slim-core base (no otel-collector
      # service), an unset endpoint propagates as empty — the loud-fail
      # guard wired in plan 14-04 surfaces this as an operator-actionable
      # error instead of silently dropping spans to a nonexistent
      # otel-collector hostname. Layering the observability overlay sets
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 explicitly.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-openwhispr-api}
      # Phase 10 / Plan 10-01d — operator-overridable locale directory.
      # The image bakes `apps/api/dist/i18n/locales/{en,ru}.json` via the
      # tsup onSuccess hook (see apps/api/tsup.config.ts), and i18n/init.ts
      # honors LOCALES_DIR before falling back to the bundled path. The
      # bind mount below points LOCALES_DIR at the source-tree JSON so
      # operators can re-translate strings without rebuilding the image —
      # `docker compose restart api` is enough to pick up edits. Read-only
      # so the container cannot mutate the host tree.
      LOCALES_DIR: /app/locales
    volumes:
      # Phase 10 / Plan 10-01d — see LOCALES_DIR comment above.
      - ./apps/api/src/i18n/locales:/app/locales:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # R25 — healthcheck targets /api/ready (Cloud-plane readiness), NOT
    # /api/health (liveness). /api/ready 503s when the SSRF dispatcher
    # marker is missing, no LiteLLM client was constructed, or the LiteLLM
    # upstream is unreachable — so a container that cannot serve
    # /api/transcribe, /api/reason, /api/agent/* is marked `unhealthy` and
    # pulled from rotation instead of silently returning 500s. /api/health
    # remains the liveness/restart probe (kubelet livenessProbe semantics):
    # a transient upstream blip must not cascade-restart the container.
    # `wget --spider` exits non-zero on the 503, satisfying the contract.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Phase 20 / SR-20.1 — memory cap. Mirrors chart limits.memory: 1Gi.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # Phase 03 Plan 08 — BullMQ worker that ingests LiteLLM_SpendLogs into
  # our usage_ledger every 30s (LITELLM-07 / DATA-03 / SCALE-03).
  #
  # Runs as `openwhispr_owner` (BYPASSRLS) so it can write usage_ledger
  # rows for any tenant after resolving tenant_id per row from the users
  # table. Reads LiteLLM_SpendLogs DIRECT from postgres:5432 (NOT
  # pgbouncer — Pitfall #9, cross-DB queries break through transaction-
  # mode pooling). Watermark stored in Valkey under
  # `litellm:spend:last_start_time` — replay-safe via ON CONFLICT DO
  # NOTHING on usage_ledger.request_id (UPSERT converges with the api
  # routes' inline ledger writes from Plan 04/05).
  #
  # No published port (worker has no HTTP listener). `restart:
  # unless-stopped` recovers from process death; the BullMQ job loop is
  # the liveness signal.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    networks: [openwhispr_internal]
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      # Direct postgres connection (NOT pgbouncer). Defaults to the same
      # owner credentials used by the migrate runner; an operator can set
      # LITELLM_READ_DATABASE_URL explicitly to point at a different
      # cluster.
      LITELLM_READ_DATABASE_URL: ${LITELLM_READ_DATABASE_URL:-postgres://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/litellm?sslmode=disable}
      # DATABASE_URL_OWNER is already in .env (Phase 1).
      # Phase 14 / Plan 14-01 (SLIM-01): OTEL_EXPORTER_OTLP_ENDPOINT has
      # NO default fallback (slim-core ships without otel-collector). See
      # api service comment above; identical rationale.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WORKER:-openwhispr-worker}
      # Phase 10 / Plan 10-01d — operator-overridable locale directory for
      # the email-template renderer. apps/worker/src/i18n/template-renderer.ts
      # honors LOCALES_DIR before falling back to the bundled dist path.
      # The bind mount below points LOCALES_DIR at the source-tree files so
      # operators can re-translate subjects/bodies without rebuilding the
      # image — `docker compose restart worker` picks up edits.
      LOCALES_DIR: /app/locales
      # Phase 61 / R19 — slim-core ships the bundled `mailpit` service
      # (below) as its dev/test SMTP catch-all. `EmailSender.ts` defaults
      # SMTP_PORT to 587; mailpit listens on 1025, so the base compose
      # MUST pin 1025 or every verification-email send ECONNREFUSEs.
      # `.env` carries SMTP_HOST=mailpit. Corporate operators override
      # SMTP_HOST / SMTP_PORT in their own .env to point at a real relay.
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      # Phase 10 / Plan 10-01d — see LOCALES_DIR comment above.
      - ./apps/worker/src/i18n/locales:/app/locales:ro
    depends_on:
      litellm:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Phase 20 / SR-20.1 — memory cap.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Phase 07.1 Plan 03 — Next.js 15 web app (WEB-IMPL-03 / D-DEPLOY-1 /
  # D-DEPLOY-2 / D-ADMIN-1 / D-ADMIN-2).
  #
  # Phase 14 / Plan 14-01 (SLIM-01): slim-core publishes host port
  # 3000:3000 so the slim path (no Traefik overlay) serves the Next.js
  # app directly on http://localhost:3000. The Traefik routing labels
  # below are HARMLESS without the edge overlay loaded (no Traefik
  # container to read them); when the overlay is layered on, same-origin
  # routing through `api.localhost` activates and the host port still
  # works alongside it.
  #
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Phase 07.1 / Plan 13.3 — NEXT_PUBLIC_* envs must be baked at BUILD
      # time (Next.js statically replaces process.env.NEXT_PUBLIC_* in the
      # client bundle). Compose passes these from the host `.env` into the
      # Dockerfile's `ARG`s so the resulting image carries the operator's
      # external observability deep-links. Empty defaults preserve the
      # graceful Alert path in ObservabilityClient when grafana is unset.
      args:
        NEXT_PUBLIC_GRAFANA_BASE_URL: ${NEXT_PUBLIC_GRAFANA_BASE_URL:-}
        NEXT_PUBLIC_TEMPO_BASE_URL: ${NEXT_PUBLIC_TEMPO_BASE_URL:-}
        NEXT_PUBLIC_MIMIR_BASE_URL: ${NEXT_PUBLIC_MIMIR_BASE_URL:-}
        NEXT_PUBLIC_LOKI_BASE_URL: ${NEXT_PUBLIC_LOKI_BASE_URL:-}
        NEXT_PUBLIC_OIDC_PROVIDERS: ${NEXT_PUBLIC_OIDC_PROVIDERS:-google,github,oidc}
        # Phase 53 / Plan 53-06 — Next.js rewrites() destination for
        # the `/api/auth/*` and `/api/locale*` proxy paths. Inside this
        # compose network the api Service is reachable as `api:3000`;
        # operators on a non-docker host override `NEXT_PUBLIC_API_URL`
        # in `.env` to `http://localhost:4000` before `docker compose up`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3000}
    networks: [openwhispr_internal]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Same-origin: server-side fetches from RSC / route handlers reach
      # apps/api on the internal bridge (no Traefik hop). The browser-side
      # fetches go through Traefik via relative `/api/*` paths when the
      # edge overlay is loaded; otherwise the host-port publish on api
      # is the slim-path entry point.
      INTERNAL_API_URL: http://api:3000
      # Phase 41 / Plan 41-c (HI-2) — PLAYWRIGHT_DISABLE_SSR_PREFETCH removed.
      # The test-only env branch in RSC pages was deleted; passing this var
      # through the web container is now a no-op. Loading-state e2e specs
      # that relied on it are tracked in
      # .planning/phases/41-residual-high-sweep/41-c-DEFERRED.md.
      # /admin/observability deep-links (Phase 07.1 A2). Empty defaults hide
      # the links gracefully; operators populate per environment.
      NEXT_PUBLIC_GRAFANA_BASE_URL: ${NEXT_PUBLIC_GRAFANA_BASE_URL:-}
      NEXT_PUBLIC_TEMPO_BASE_URL: ${NEXT_PUBLIC_TEMPO_BASE_URL:-}
      NEXT_PUBLIC_MIMIR_BASE_URL: ${NEXT_PUBLIC_MIMIR_BASE_URL:-}
      NEXT_PUBLIC_LOKI_BASE_URL: ${NEXT_PUBLIC_LOKI_BASE_URL:-}
      # OIDC provider button slugs surfaced on /sign-in (U1). Server-side
      # OIDC config lives in apps/api per Phase 2 PROVIDER-03; this var
      # controls UI visibility only.
      NEXT_PUBLIC_OIDC_PROVIDERS: ${NEXT_PUBLIC_OIDC_PROVIDERS:-google,github,oidc}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Phase 20 / SR-20.1 — memory cap. Next.js 15 standalone SSR.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      # /admin/* routing — auth is in-app (users.role='admin'); no
      # Traefik basic-auth middleware. Canonical `web` router lives in
      # compose/traefik/dynamic.dev.yml (file provider). HARMLESS without
      # the edge overlay loaded.
      - "traefik.enable=true"
      - "traefik.http.routers.web-admin.rule=Host(`web.localhost`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.web-admin.priority=100"
      - "traefik.http.routers.web-admin.entrypoints=websecure"
      - "traefik.http.routers.web-admin.tls=true"
      - "traefik.http.routers.web-admin.service=web-svc"
      - "traefik.http.services.web-svc.loadbalancer.server.port=3000"

  # Phase 61 / R19 — bundled dev/test SMTP catch-all.
  #
  # The slim-core stack is the OSS-quickstart / dev-test topology
  # (no Traefik, plain http, NODE_ENV=development per Phase 59). A real
  # cloud sign-up journey sends a verification email; without an SMTP
  # sink in the base stack the worker's email job ECONNREFUSE-loops and
  # a genuine new user can never verify + sign in (R19).
  #
  # Mailpit was previously confined to compose/docker-compose.dev-tools.yml;
  # R19 promotes it to a first-class slim-core service so a plain
  # `docker compose up -d` (no overlays) delivers verification email
  # end-to-end. The api + worker reach it by compose service name
  # `mailpit` on its SMTP port 1025 (SMTP_PORT pinned on both services
  # above; SMTP_HOST=mailpit lives in .env / .env.slim.example).
  #
  # Corporate operators point SMTP_HOST / SMTP_PORT at their own relay
  # in .env; mailpit then simply runs unused (or is removed via an
  # operator compose override). No api/worker `depends_on: mailpit` —
  # per the Phase-14 decision the api boot stays decoupled from mailpit
  # and `EmailSender.ts` loud-fails at send time, not boot time.
  mailpit:
    image: axllent/mailpit:v1.29
    networks: [openwhispr_internal]
    # HTTP UI bound to host loopback so a developer (or the e2e harness
    # running outside the compose network) can read delivered messages
    # at http://127.0.0.1:8025 without depending on Traefik.
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://localhost:8025/livez || wget --quiet --tries=1 --spider http://localhost:8025/api/v1/info
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
