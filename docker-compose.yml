# OpenWhispr Server — full data plane (Phase 1 Plan 01).
#
# Compose Spec v2: NO `version:` key (legacy and silently ignored by Compose
# v2.x+). Profiles:
#   - default  : every service (engineer running `make up` on a fresh clone)
#   - obs-only : observability stack only (Loki/Tempo/Mimir/Grafana/OTel)
#   - db-only  : Postgres + PgBouncer only (CI migration testing)
#
# Network model (D-05): single internal bridge `openwhispr_internal`. Only
# Traefik publishes ports (80/443/8080) to the host. Every other service
# is reachable only inside the network.

name: openwhispr

networks:
  openwhispr_internal:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  minio_data:
  loki_data:
  tempo_data:
  mimir_data:
  grafana_data:

services:
  postgres:
    image: postgres:17.5-alpine
    profiles: [default, db-only]
    networks: [openwhispr_internal]
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: openwhispr
      # Phase 01.2 — pass through the role passwords so 00-roles.sh can
      # envsubst them into 00-roles.sql.tpl before piping to psql. The
      # Postgres entrypoint only auto-exposes POSTGRES_USER/PASSWORD/DB
      # to init scripts; everything else must be declared explicitly.
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Plan 03 fills this directory with role/RLS bootstrap SQL.
      - ./packages/data/migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # D-02 override: edoburu/pgbouncer instead of bitnami/pgbouncer. Bitnami's
  # free Docker Hub PgBouncer image was retired in 2025 (paid Bitnami Secure
  # Images subscription only). edoburu is the de-facto OSS choice with
  # >10M pulls and env-var-driven config. See 01-RESEARCH-INFRA.md §2.2.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    profiles: [default, db-only]
    networks: [openwhispr_internal]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_APP_USER}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DB_NAME: openwhispr
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    volumes:
      - ./compose/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  valkey:
    image: valkey/valkey:8.1-alpine
    profiles: [default]
    networks: [openwhispr_internal]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [default]
    networks: [openwhispr_internal]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001", "--address", ":9000"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  traefik:
    image: traefik:v3.6
    profiles: [default]
    # Phase 02.15 — Network aliases for in-cluster `api.localhost` /
    # `auth.localhost` resolution (Group G closure). Docker's embedded DNS
    # resolves these names to traefik's container IP for every service on
    # `openwhispr_internal`, so the contract-test-runner (and any future
    # in-cluster client that needs to follow an api 302 to its publicly-
    # configured `OPENWHISPR_API_URL=https://api.localhost`) reaches
    # traefik via the canonical-public hostname instead of ECONNREFUSE-ing
    # on container loopback 127.0.0.1:443. Symmetric with prod DNS:
    # operators publish api.localhost via /etc/hosts on the host; we
    # publish it via Docker DNS inside the network. SAN on the bootstrap
    # cert already covers both hostnames.
    networks:
      openwhispr_internal:
        aliases:
          - api.localhost
          - auth.localhost
    # Only Traefik publishes host ports (D-05). 80/443 are user traffic;
    # 8080 is the dev dashboard (gate behind basic-auth in prod, Phase 9).
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./compose/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./compose/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./compose/traefik/certs:/certs:ro
    command:
      - --ping=true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    profiles: [default, obs-only]
    networks: [openwhispr_internal]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./compose/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        # Phase 06.1 — distroless image cannot expose docker HEALTHCHECK;
        # `service_started` is the contract upgrade. The OTLP receiver
        # tolerates upstream-not-ready by buffering + retrying with backoff.
        condition: service_started
    # Phase 06.1 — no HEALTHCHECK: otel/opentelemetry-collector-contrib:0.151
    # is distroless (no shell, no wget, no curl — only the otelcol-contrib
    # binary). Docker HEALTHCHECK requires an in-image executable. Dependents
    # below switch to `service_started`; the collector is itself a buffering
    # tier so partial-readiness is tolerated.

  loki:
    image: grafana/loki:3.5.0
    profiles: [default, obs-only]
    networks: [openwhispr_internal]
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  tempo:
    image: grafana/tempo:2.8.0
    profiles: [default, obs-only]
    networks: [openwhispr_internal]
    # Phase 06.1 — explicit config file. The grafana/tempo image has no
    # usable default backend; without -config.file the binary aborts
    # with `unknown backend ""`.
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./compose/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      # Phase 06.1 — grafana/tempo:2.x is distroless (no /bin/sh), so
      # CMD-SHELL is unusable. Invoke busybox wget directly via CMD form.
      # `--spider` returns 0 only on HTTP 2xx, so /ready 503 (ring-join)
      # naturally fails the probe; start_period budgets cold-start time.
      test: ["CMD", "/busybox/wget", "--spider", "-q", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  mimir:
    image: grafana/mimir:2.16.0
    profiles: [default, obs-only]
    networks: [openwhispr_internal]
    # Phase 06.1 — explicit config file with target=all (single-binary)
    # and filesystem backend. Without it mimir starts with the upstream
    # default that expects S3 + memberlist with multi-replica ring,
    # never reaching `ready`.
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./compose/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data
    # Phase 06.1 — no HEALTHCHECK: grafana/mimir:2.x is a distroless image
    # (no shell, no wget, no curl — only the `mimir` binary). Docker
    # HEALTHCHECK requires an in-image executable. Dependents below switch
    # to `service_started` for mimir specifically; orchestration-level
    # liveness moves to Helm/K8s probes in Phase 9 where a sidecar
    # (or kubelet HTTP probe) issues the /ready check.

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [default, obs-only]
    networks: [openwhispr_internal]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        # Phase 06.1 — distroless mimir cannot expose docker HEALTHCHECK;
        # grafana provisions mimir as a datasource at first request, which
        # tolerates a not-yet-ready upstream and retries on each query.
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/health | grep -q '"database":"ok"'
      interval: 5s
      timeout: 3s
      retries: 12
      # Phase 06.1 — first-boot installs the grafana-pyroscope-app plugin
      # over the network (~22s on a cold cache); api/health serves
      # `database:starting` until the bootstrap finishes. start_period
      # budgets that one-time delay.
      start_period: 90s

  # Phase 2 Plan 02 — One-shot migration runner. Runs as openwhispr_owner
  # DIRECT to postgres:5432 (NOT pgbouncer). DDL through transaction-mode
  # pooling is the documented anti-pattern; migrate.ts asserts the URL
  # hostname does not contain "pgbouncer".
  #
  # `restart: "no"` is QUOTED (Pitfall #8): unquoted `no` parses as boolean
  # false in some YAML libraries.
  #
  # The api service gates on `service_completed_successfully` so api never
  # boots until migrate exits 0 — rolling-deploy ready (DEPLOY-04).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [default, db-only]
    networks: [openwhispr_internal]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    env_file: .env
    # Phase 01.2 — bundle is now `.cjs` (was `.js`) so Node treats it
    # as CommonJS regardless of the api package.json `type: module` that
    # ships in the same image at /app/package.json.
    command: ["node", "/app/packages/data/dist/migrate.cjs"]

  # Phase 2 Plan 02 — API container. Closes Phase 1 D-08 / SC#1 partial:
  # the entrypoint runs check-default-secrets.cjs BEFORE node main, so
  # `MASTER_KEK=changeme` is rejected at start time even if the operator
  # bypassed bootstrap.sh.
  #
  # No `ports:` directive — Traefik (compose/traefik/dynamic.yml) routes
  # https://api.localhost → http://api:3000. Only Traefik publishes ports
  # to the host (D-05).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [default]
    networks: [openwhispr_internal]
    env_file: .env
    environment:
      NODE_ENV: production
      OPENWHISPR_API_URL: ${OPENWHISPR_API_URL:-https://api.localhost}
      AUTH_URL: ${AUTH_URL:-https://api.localhost}
      # Phase 02.17 / D-02 — OPENWHISPR_PROTOCOL accepts a comma-separated
      # list (parsed in apps/api/src/lib/scheme-allowlist.ts). The default
      # registers `mycorp-whispr` so contract tests covering the custom-
      # override scheme matrix in oauth-redirect.test.ts pass out of the
      # box. Built-ins (openwhispr, openwhispr-dev, openwhispr-staging) are
      # always allowed via BUILTIN_SCHEMES — no need to repeat here.
      # Production operators override with their own scheme list.
      OPENWHISPR_PROTOCOL: ${OPENWHISPR_PROTOCOL:-mycorp-whispr}
      # Phase 02.3 — extra trusted origins for in-cluster traffic (e.g.
      # the contract-test seed service POST-ing http://api:3000/api/auth/sign-up).
      # Comma-separated list parsed by apps/api/src/auth.ts; in addition to
      # AUTH_URL + OPENWHISPR_API_URL, NOT a replacement.
      AUTH_TRUSTED_ORIGINS_EXTRA: "http://api:3000"
      # Phase 02.13 — OIDC env defaults pointing at the contract-test
      # `fixture-idp` service (D-01). Default-profile boot is unaffected:
      # Better Auth's genericOAuth uses LAZY discovery (it only fetches
      # `${OIDC_ISSUER_URL}/.well-known/openid-configuration` when an
      # OAuth flow is actually attempted). Operators with real OIDC
      # override these via .env. fixture-idp accepts ANY client_id /
      # client_secret (tests/fixtures/idp/server.mjs has no validation
      # in /token), so the literal values below are documentation-grade
      # only.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://fixture-idp:9000}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-conformance-test-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-conformance-test-secret-do-not-use-in-prod}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Phase 2 Plan 02 — Mailpit dev SMTP catch-all. ONLY in the `dev`
  # profile (Pitfall: never instantiate in production via plain
  # `docker compose up`). Image pinned to a minor tag (NOT `:latest`).
  #
  # Healthcheck: /livez was added in v1.20+ but is documented to
  # respond with 200 in v1.29. We use `--spider` which only checks
  # status; if /livez ever 404s, the fallback to /api/v1/info is wired
  # via `||` so the healthcheck stays green regardless (CONTAINER-A2).
  mailpit:
    image: axllent/mailpit:v1.29
    profiles: [dev]
    networks: [openwhispr_internal]
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://localhost:8025/livez || wget --quiet --tries=1 --spider http://localhost:8025/api/v1/info
      interval: 10s
      timeout: 3s
      retries: 3

  # Phase 2 Plan 06 — Fixture OIDC IdP for the CONTRACT-01 conformance
  # suite (multi-channel scheme matrix). NEVER instantiated in production
  # — gated by `profiles: [contract-test]`. The fixture serves a minimal
  # OIDC discovery doc + 302's /authorize back to the API callback with
  # state echoed; see tests/fixtures/idp/server.mjs.
  fixture-idp:
    build:
      context: ./tests/fixtures/idp
    profiles: [contract-test]
    networks: [openwhispr_internal]
    environment:
      ISSUER: http://fixture-idp:9000
      PORT: "9000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Phase 02.3 — One-shot conformance fixture seeder. Invoked via
  # `docker compose --profile contract-test run --rm seed` from the
  # contract-test Make target. Lives inside openwhispr_internal so
  # DATABASE_URL_OWNER (postgres://...@postgres:5432/...) and AUTH_URL
  # (http://api:3000) resolve via the internal DNS — host shell can't.
  # Reuses the api image (which already ships data/dist/seed-conformance.cjs
  # via the Phase 02.1 Dockerfile rewrite). `restart: "no"` because this
  # is a one-shot seed, not a long-running service.
  seed:
    image: openwhispr-api
    profiles: [contract-test]
    networks: [openwhispr_internal]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      # Disable mailpit dependency: seed-conformance signs up users via
      # Better Auth which would otherwise try to send verification mail.
      # Empty SMTP_HOST routes through the dev no-op email path.
      SMTP_HOST: ""
      # The seed posts directly to the api container on the internal
      # network (no traefik / TLS hop). better-auth's CSRF gate compares
      # the request Origin header against trustedOrigins; the api service
      # below adds `http://api:3000` to its trustedOrigins via the
      # AUTH_TRUSTED_ORIGINS_EXTRA env var so this in-cluster path is
      # accepted alongside the public https://api.localhost origin.
      AUTH_URL: "http://api:3000"
    entrypoint: ["node"]
    command: ["/app/packages/data/dist/seed-conformance.cjs"]

  # Phase 02.14 — Contract-test runner inside openwhispr_internal.
  # Closes Group E (surfaced by Phase 02.13): host-side vitest cannot
  # resolve docker-internal DNS (`fixture-idp`, `api`), so the OAuth
  # 302 hop fails with `getaddrinfo ENOTFOUND fixture-idp`. Running
  # the suite in-network gives it the same DNS view as the api itself.
  #
  # Image is built from packages/contract-tests/Dockerfile — a thin
  # linux pnpm install of just the @openwhispr/contract-tests subgraph.
  # We deliberately do NOT bind-mount host node_modules: host is
  # darwin-arm64 with pnpm-symlinked layout, container is linux; native
  # deps (rollup/esbuild/vitest bundler) would mismatch architectures.
  #
  # BACKEND_URL/AUTH_URL point at the in-cluster `api:3000` endpoint
  # (no Traefik/TLS hop) — Origin matches the AUTH_TRUSTED_ORIGINS_EXTRA
  # already declared on the api service for the Phase 02.3 seed flow.
  #
  # NODE_TLS_REJECT_UNAUTHORIZED is intentionally NOT set: the URLs are
  # http:// so Node's fetch never engages TLS. Setting it would be a
  # CLAUDE.md-prohibited workaround for a problem that does not exist.
  contract-test-runner:
    build:
      context: .
      dockerfile: packages/contract-tests/Dockerfile
    image: openwhispr-contract-test-runner
    profiles: [contract-test]
    networks: [openwhispr_internal]
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
      fixture-idp:
        condition: service_healthy
    # Phase 02.15 — runner now drives traffic through Traefik via the
    # canonical-public `https://api.localhost` URL. Docker DNS resolves
    # `api.localhost` to the traefik container (network aliases above);
    # the bootstrap-generated cert at compose/traefik/certs/local.crt
    # is mounted read-only and trusted via NODE_EXTRA_CA_CERTS. This
    # exercises the full Traefik+TLS+cert-SAN path end-to-end and lets
    # api 302 redirects to its public callback URL resolve in-cluster
    # (closes Group G ECONNREFUSED). AUTH_TRUSTED_ORIGINS_EXTRA is
    # intentionally NOT set on the runner: it's a seed-side concern
    # (the seed posts directly to api:3000 with that Origin); the
    # runner's Origin is now the public `https://api.localhost` which
    # Better Auth already accepts via AUTH_URL.
    # Phase 02.20 / D-01 — runner needs DATABASE_URL_OWNER for the
    # signInFixture(verified:false) branch (Group I closure). The owner
    # pool flips users.email_verified=true ONLY long enough to mint a
    # real BA-issued cookie for the unverified-fixture sign-in path,
    # then reverts in a try/finally. Production-safety preserved:
    # DATABASE_URL_OWNER is contract-test-runner-internal only;
    # requireEmailVerification:true continues to reject all non-test
    # callers. Same env shape as the seed service above.
    env_file: .env
    environment:
      BACKEND_URL: https://api.localhost
      AUTH_URL: https://api.localhost
      NODE_EXTRA_CA_CERTS: /certs/local.crt
    volumes:
      - ./compose/traefik/certs/local.crt:/certs/local.crt:ro
