packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/e2e'
  - 'tests/e2e/mock-realtime'
  # Phase 08 / Plan 02 — k6 load-test workspace.
  - 'tools/load-test'
  # Phase 08 / Plan 03 — Fastify mock-litellm for load-test-mock profile.
  - 'compose/mock-litellm'
  # Phase 09 / Plan 11 — first-launch SLO probe image (DEPLOY-05 helm test hook).
  - 'tools/test-probe'
allowBuilds:
  cpu-features: true
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  ssh2: true
# DEF-07.1-01 — force every transitive lru-cache to v11 so apps/api's
# `import { LRUCache } from "lru-cache"` (named export added in v10) is
# satisfied at runtime. Without this, pnpm --node-linker=hoisted in the
# api Dockerfile resolves the top-level node_modules/lru-cache to v5.1.1
# (default-export only) and the api container crashes on boot.
overrides:
  lru-cache: ^11.3.6
  # v2.5-A — force patched versions for transitive packages flagged by
  # Dependabot CVE alerts. Selectors scope the bump to the vulnerable
  # ranges only, leaving already-patched copies untouched.
  protobufjs@<7.5.8: ">=7.5.8 <8.0.0"
  protobufjs@>=8.0.0 <8.2.0: ">=8.2.0"
  esbuild@<0.25.0: ">=0.25.0 <0.26.0"
  postcss@<8.5.10: ">=8.5.10"
  qs@<6.15.2: ">=6.15.2"
  uuid@<11.1.1: ">=11.1.1 <12.0.0"
