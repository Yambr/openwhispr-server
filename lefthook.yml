# Lefthook git hooks for openwhispr-server
# Source: https://github.com/evilmartians/lefthook
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true
    english:
      run: pnpm exec tsx tools/lint-english.ts
    # Phase 15 / Plan 15-01 / STRUCT-01 — fail-fast when a new co-located
    # *.test.ts is staged under apps/<app>/src or packages/<pkg>/src.
    # The legacy allow-list at tools/lint-colocated-tests.legacy-allowlist.txt
    # exempts pre-15-02 paths; that file is deleted as the final commit of
    # 15-02 once tools/migrate-tests.ts --apply lands.
    colocated-tests:
      glob: "{apps,packages}/*/src/**/*.test.ts"
      run: pnpm lint:colocated-tests
    # Phase 16 / Plan 01 / COMMENT-03 — fail-fast when a new REMOVE-bucket
    # phase-tag comment (bare header, trailing `// D-NN`, history close-out)
    # lands in apps/ or packages/. Shares the classifier predicate with
    # tools/phase-tag-sweep.ts so allowlist drift is structurally impossible.
    phase-tag-comments:
      glob: "{apps,packages}/**/*.{ts,tsx}"
      run: pnpm lint:phase-tag-comments
    # Phase 17 / Plan 02 / TLS-05 — fail-fast when a Dockerfile gains a
    # COPY/ADD/RUN line referencing dev-CA / mkcert artefacts (`rootCA*.pem`,
    # `root-ca.{crt,key}`, `mkcert`, `compose/traefik/certs/`,
    # `*.localhost.{pem,key}`, `local.{crt,key}`). NARROW glob `**/Dockerfile`
    # avoids matching `.dockerignore` or `Dockerfile.bak`; 17-PATTERNS risk
    # callout line 226.
    dockerfile-tls:
      glob: "**/Dockerfile"
      run: pnpm lint:dockerfile-tls
    # Phase 31 / Plan 07 / LOCKER-08 — fail-fast on any locker violation.
    # The six lockers (LOCKER-01..06) fan out under `make lint:lockers` so
    # lefthook + ci.yml + nightly.yml + Makefile share one source of truth.
    # LOCKER-01/02/03 are BLOCKING from landing; LOCKER-04/05/06 are
    # WARN-only-on-land (flipped to BLOCKING in 31-08 / 37 / 36.a final
    # commits — see DISCIPLINE.md "Locker WARN→BLOCKING ledger").
    lockers:
      glob: "{apps,packages}/*/src/**/*.{ts,tsx}"
      run: make lint:lockers
    # Phase 6 / Plan 06-09 / D-W4 layer 1 — fail-fast if any BullMQ job
    # handler is not wrapped in withTenantContext / withSystemContext.
    # The scan is ~1s against 8 job files; fast enough for pre-commit.
    tenant-context:
      glob: "apps/worker/src/jobs/*.ts"
      run: pnpm exec tsx tools/lint-tenant-context.ts
    # Phase 7 / Plan 06 — fail-fast when UI-SPEC artifacts or the linter
    # itself drift. The lint scan is ~300 ms against the two SPEC files;
    # fast enough for pre-commit. Glob covers SPEC files, linter source +
    # tests + config + fixtures, and the routes directory the linter scans
    # for endpoint-exists validation.
    ui-spec:
      glob: "{.planning/phases/07-frontend-ui-spec/UI-SPEC-*.md,tools/lint-ui-spec.ts,tools/lint-ui-spec.test.ts,tools/lint-ui-spec.config.ts,tools/lint-ui-spec/fixtures/**,apps/api/src/routes/**}"
      run: pnpm lint:ui-spec
    # Phase 07.1 / Plan 13 — fail-fast when apps/web TypeScript breaks. tsc
    # over the web project takes ~3s; cheap enough for pre-commit. Biome
    # check is already covered by the global biome entry above.
    web-typecheck:
      glob: "apps/web/**/*.{ts,tsx}"
      run: pnpm --filter @openwhispr/web typecheck
    # Phase 21 / Plan 21-01 / SR-21.1 — fail-fast when any *.feature file
    # gains a forbidden tag (.skip, .only, @skip, @focus), an orphan
    # @cjm-N.M, a feature without a negative twin, or an @expected-red
    # without a @after-phase-N / @after-docker-up gate. Runs ~300 ms.
    gherkin-tags:
      glob: "{tests/e2e-cjm/features/**/*.feature,docs/customer-journeys.md}"
      run: pnpm lint:gherkin-tags
    # Phase 21 / Plan 21-02 / SR-21.2 — fail-fast on retries > 0 in any
    # playwright config, workers > 1 in the e2e-cjm config, or static
    # test.skip/test.only/test.fixme outside __tests__/.
    playwright-config:
      glob: "{**/playwright.config.ts,apps/**/*.{test,spec}.ts,tests/**/*.{test,spec}.ts}"
      run: pnpm lint:playwright-config
    # Phase 21 / Plan 21-03 / SR-21.3 — fail-fast when a CJM step file is
    # added without its sibling __tests__/<name>.steps.test.ts, or when a
    # unit test crosses an HTTP boundary without mocking it.
    steps-have-unit-tests:
      glob: "tests/e2e-cjm/steps/**/*.ts"
      run: pnpm lint:steps-have-unit-tests
pre-push:
  parallel: true
  commands:
    # Phase 07.1 / Plan 13 — run the apps/web vitest suite before pushing
    # any change that touches apps/web. Coverage takes ~3s on a hot run;
    # acceptable pre-push cost.
    web-test:
      glob: "apps/web/**"
      run: pnpm --filter @openwhispr/web test:unit
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
